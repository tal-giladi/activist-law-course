- id: m15-098
  module: 15
  lesson: "15.5"
  subject: incident-method
  difficulty: 3
  question: >-
    In a fairness review, a party's representative objects to a sentence that is accurate but unwelcome. What do you do?
  options:
    - >-
      Keep it if accurate and attributed; fix only what is unfair.
    - >-
      Delete it so that both sides are kept equally happy.
    - >-
      Replace it with the representative's preferred wording.
    - >-
      Add your own opinion next to it to balance it out.
  correct: 0
  explanation: >-
    The review fixes unfairness, not discomfort.
- id: m15-099
  module: 15
  lesson: "15.5"
  subject: evidence-gaps
  difficulty: 3
  question: >-
    Which evidence gap is least likely to become public, and how should the analysis handle it?
  options:
    - >-
      Satellite images: assume the worst for the attacker instead.
    - >-
      Casualty names: assume that all the dead were fighters.
    - >-
      The time of the strike: leave it out of the analysis.
    - >-
      The attacker's intelligence: name it and show what depends on it.
  correct: 3
  explanation: >-
    Name the gap, say who holds it and how it affects each rule.
- id: m15-100
  module: 15
  lesson: "15.5"
  subject: limited-conclusion
  difficulty: 1
  question: >-
    Which of these is a limited conclusion?
  options:
    - >-
      "This was clearly a war crime, as anyone can see."
    - >-
      "Lawfulness cannot yet be determined; it depends on X and Y."
    - >-
      "This was clearly lawful, as the army has explained."
    - >-
      "No conclusion is possible about anything in war."
  correct: 1
  explanation: >-
    It states what the evidence supports and what would decide the question.
