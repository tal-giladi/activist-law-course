# Module 15 question bank for daily practice (not imported). Format: build-spec.md, Question bank.
- id: m15-001
  module: 15
  lesson: "15.1"
  subject: ihl-application
  difficulty: 1
  question: >-
    Which body of law regulates how hostilities are conducted, whoever started the conflict?
  options:
    - >-
      Jus ad bellum: the law on the resort to force by states.
    - >-
      The domestic criminal law of the attacking state only.
    - >-
      Jus in bello: international humanitarian law.
    - >-
      The law of state responsibility for breaches of treaties.
  correct: 2
  explanation: >-
    IHL (jus in bello) governs conduct in armed conflict and applies equally to all parties; jus ad bellum governs whether force may be used at all.
- id: m15-002
  module: 15
  lesson: "15.1"
  subject: ihl-application
  difficulty: 1
  question: >-
    Under Common Article 3 of the Geneva Conventions, who is bound in a non-international armed conflict?
  options:
    - >-
      Each party to the conflict, including organised armed groups.
    - >-
      Only the state on whose territory the fighting takes place.
    - >-
      Only states that have also ratified Additional Protocol II.
    - >-
      Only parties that have formally declared war on each other.
  correct: 0
  explanation: >-
    Common Article 3 binds "each Party to the conflict" in an armed conflict not of an international character.
- id: m15-003
  module: 15
  lesson: "15.1"
  subject: treaty-vs-custom
  difficulty: 1
  question: >-
    Israel is a party to which of these instruments as a treaty?
  options:
    - >-
      Additional Protocol I of 1977, on international conflicts.
    - >-
      Additional Protocol II of 1977, on internal conflicts.
    - >-
      Hague Convention IV of 1907 and its Regulations.
    - >-
      The four Geneva Conventions of 1949.
  correct: 3
  explanation: >-
    Israel has been a party to the Geneva Conventions since 1951; it is not a party to the Additional Protocols or Hague Convention IV, which bind it only as custom.
- id: m15-004
  module: 15
  lesson: "15.1"
  subject: treaty-vs-custom
  difficulty: 2
  question: >-
    Why do careful writers cite ICRC customary Rule 14 rather than only Article 51(5)(b) of AP I when writing about an Israeli attack?
  options:
    - >-
      AP I was repealed when the ICRC published its customary study in 2005.
    - >-
      Israel is not a party to AP I, so the rule binds it only as custom.
    - >-
      Rule 14 is stricter than AP I and so always favours the petitioners.
    - >-
      Israeli courts are allowed to quote only ICRC publications on IHL.
  correct: 1
  explanation: >-
    Treaty status matters: AP I binds Israel only where it reflects custom. Rule 14 states proportionality as customary law.
- id: m15-005
  module: 15
  lesson: "15.1"
  subject: treaty-vs-custom
  difficulty: 2
  question: >-
    Israel's government says it views Hague Convention IV, to which it is not a party, as what?
  options:
    - >-
      A non-binding guideline that Israel follows only as a matter of policy.
    - >-
      Reflecting customary law, so its provisions bind Israel.
    - >-
      A treaty that applies only to wars between European states.
    - >-
      An obsolete instrument fully replaced by the Geneva Conventions.
  correct: 1
  explanation: >-
    Israel's 2015 report (n. 397) says Israel views the Convention as reflecting custom and so binding on it; the Supreme Court also treats the Regulations as custom.
- id: m15-006
  module: 15
  lesson: "15.1"
  subject: distinction
  difficulty: 1
  question: >-
    According to customary Rule 6, when do civilians lose protection from attack?
  options:
    - >-
      Whenever they live in a building that an armed group also uses.
    - >-
      Once they express public support for an armed group or its aims.
    - >-
      When they are close relatives of members of an armed group.
    - >-
      Unless and for such time as they take a direct part in hostilities.
  correct: 3
  explanation: >-
    Rule 6: civilians are protected "unless and for such time as they take a direct part in hostilities".
- id: m15-007
  module: 15
  lesson: "15.1"
  subject: distinction
  difficulty: 2
  question: >-
    A bridge carries both civilian traffic and weapons. Which test decides whether it is a military objective?
  options:
    - >-
      Rule 8: its contribution to military action and the definite advantage.
    - >-
      Whether most of the traffic crossing it is civilian on an average day.
    - >-
      Whether the bridge was originally built by the army or by civilians.
    - >-
      Whether the enemy has declared the bridge a protected cultural site.
  correct: 0
  explanation: >-
    Rule 8 looks at nature, location, purpose or use, effective contribution and definite military advantage "in the circumstances ruling at the time".
- id: m15-008
  module: 15
  lesson: "15.1"
  subject: proportionality
  difficulty: 1
  question: >-
    What two things does the proportionality rule compare?
  options:
    - >-
      The number of soldiers on each side and the weapons they use.
    - >-
      The total harm suffered by each side over the whole conflict.
    - >-
      Expected civilian harm and anticipated military advantage.
    - >-
      Civilian deaths in the area before and after the attack.
  correct: 2
  explanation: >-
    Rule 14 prohibits attacks where expected incidental harm would be excessive in relation to the concrete and direct military advantage anticipated.
- id: m15-009
  module: 15
  lesson: "15.1"
  subject: proportionality
  difficulty: 2
  question: >-
    An analyst says proportionality must be judged "over the whole war". What is the problem with this?
  options:
    - >-
      The rule applies only to the first attack launched in a conflict.
    - >-
      The rule compares only military losses and ignores civilian harm.
    - >-
      The rule applies only after an international court rules on the war.
    - >-
      The rule applies attack by attack, to expected harm and advantage.
  correct: 3
  explanation: >-
    Rule 14 speaks of "an attack" and its anticipated "concrete and direct" advantage; overall war aims are a different question.
- id: m15-010
  module: 15
  lesson: "15.1"
  subject: precautions
  difficulty: 1
  question: >-
    Which customary rule requires effective advance warning of attacks that may affect civilians?
  options:
    - >-
      Rule 1, in every attack without any exception.
    - >-
      Rule 97, but only for attacks on residential buildings.
    - >-
      Rule 20, unless circumstances do not permit.
    - >-
      Common Article 3, but only in occupied territory.
  correct: 2
  explanation: >-
    Rule 20 requires effective advance warning "unless circumstances do not permit".
- id: m15-011
  module: 15
  lesson: "15.1"
  subject: precautions
  difficulty: 2
  question: >-
    An armed group places a weapons store inside a residential block. Which customary rules does this raise for the group?
  options:
    - >-
      Rule 22 on protecting civilians, and possibly Rule 97 on human shields.
    - >-
      Rule 14 on proportionality, which binds only the defending party in war.
    - >-
      Rule 20 on warnings, which the group must give to the attacking army.
    - >-
      No rule at all, because IHL binds only states and never armed groups.
  correct: 0
  explanation: >-
    The defender must take feasible precautions to protect civilians under its control (Rule 22); using civilians to shield military objectives is prohibited (Rule 97).
- id: m15-012
  module: 15
  lesson: "15.1"
  subject: jus-ad-bellum-vs-in-bello
  difficulty: 2
  question: >-
    A statement says: "Because our war is one of self-defence, every strike we make is lawful." What is the legal error?
  options:
    - >-
      Self-defence is never a lawful reason for any state to use force.
    - >-
      It merges jus ad bellum with jus in bello; each strike must meet IHL.
    - >-
      IHL applies only to the party that started the conflict, not to others.
    - >-
      Self-defence makes proportionality apply only to enemy soldiers.
  correct: 1
  explanation: >-
    A lawful resort to force does not make each attack lawful; distinction, proportionality and precautions apply to every party.
- id: m15-013
  module: 15
  lesson: "15.1"
  subject: conflict-classification
  difficulty: 2
  question: >-
    How did Israel's government describe the classification of its conflict with armed groups in Gaza in November 2023?
  options:
    - >-
      Debated, while applying the rules of both IAC and NIAC in practice.
    - >-
      A purely internal law-enforcement operation that falls outside IHL.
    - >-
      An international armed conflict governed by AP I as a treaty.
    - >-
      An occupation governed only by the Fourth Geneva Convention.
  correct: 0
  explanation: >-
    The MFA's Key Legal Aspects paper says classification has been debated and that Israel applies the rules governing both IAC and NIAC, including distinction, precautions and proportionality.
- id: m15-014
  module: 15
  lesson: "15.1"
  subject: conflict-classification
  difficulty: 3
  question: >-
    Lawyers dispute whether a conflict is international or non-international. For an analysis of one airstrike, why might it matter less than people think?
  options:
    - >-
      Neither kind of armed conflict has any rules about airstrikes.
    - >-
      Distinction, proportionality and precautions apply in both kinds.
    - >-
      Only the international kind has any rules protecting civilians.
    - >-
      Classification affects only prisoners of war and never targeting.
  correct: 1
  explanation: >-
    The ICRC study marks these rules [IAC/NIAC]; classification matters for other issues such as status and detention.
- id: m15-015
  module: 15
  lesson: "15.1"
  subject: key-terms
  difficulty: 1
  question: >-
    What does the Hebrew term "השתתפות ישירה בלחימה" mean?
  options:
    - >-
      Military necessity in occupied territory.
    - >-
      Belligerent occupation of territory.
    - >-
      Direct participation in hostilities.
    - >-
      Incidental harm to civilian objects.
  correct: 2
  explanation: >-
    It is the concept in Rule 6 and in the Targeted Killings ruling: civilians lose protection only while taking a direct part.
- id: m15-016
  module: 15
  lesson: "15.1"
  subject: distinction
  difficulty: 3
  question: >-
    A writer says a strike on a TV station was lawful "because the station supports the enemy's propaganda". What is the strongest neutral response?
  options:
    - >-
      Media buildings are always military objectives once a war begins.
    - >-
      Media buildings can never be attacked under any circumstances at all.
    - >-
      The answer depends only on who owns the station and its licence.
    - >-
      Ask whether its use made an effective contribution to military action.
  correct: 3
  explanation: >-
    Rule 8 requires an effective contribution to military action and a definite advantage; general support or propaganda is widely disputed as a basis. State the test and the facts it needs.
- id: m15-017
  module: 15
  lesson: "15.1"
  subject: proportionality
  difficulty: 3
  question: >-
    After an attack, more civilians died than the commander expected. Under the approach Israel's government sets out, how is lawfulness judged?
  options:
    - >-
      By the final death toll, compared with the enemy's own losses.
    - >-
      Only by an international court, and never by the state itself.
    - >-
      By what a reasonable commander could anticipate at the time.
    - >-
      By whether the attack actually achieved its intended military aim.
  correct: 2
  explanation: >-
    Israel's 2015 report (para. 332) and the MFA's 2023 paper describe a forward-looking, conduct-oriented test; critics argue outcomes can still be evidence of what was expected.
- id: m15-018
  module: 15
  lesson: "15.1"
  subject: treaty-vs-custom
  difficulty: 3
  question: >-
    A petition to an Israeli court relies on a rule found in AP I. What should the petitioner add to make the argument usable?
  options:
    - >-
      Evidence or a ruling that the rule is customary.
    - >-
      A statement that Israel signed AP I, which makes it fully binding.
    - >-
      A General Assembly resolution approving AP I for all member states.
    - >-
      Nothing, because Israeli courts apply every IHL treaty directly.
  correct: 0
  explanation: >-
    Customary law is part of Israeli law (lesson 13.5); a rule in a treaty Israel did not join must be shown to be custom.
- id: m15-019
  module: 15
  lesson: "15.1"
  subject: precautions
  difficulty: 3
  question: >-
    An attacker could hit the same military objective with a smaller weapon at night, when fewer civilians are present. Which rule does this raise?
  options:
    - >-
      Rule 1: the basic distinction between civilians and combatants.
    - >-
      Rule 97: the prohibition of using civilians as human shields.
    - >-
      Rule 6: when civilians take a direct part in hostilities.
    - >-
      Rule 17: feasible precautions in choosing means and methods.
  correct: 3
  explanation: >-
    Rule 17 requires feasible precautions in the choice of means and methods to avoid or minimise incidental harm.
- id: m15-020
  module: 15
  lesson: "15.2"
  subject: occupation-test
  difficulty: 1
  question: >-
    Under Hague Regulations art. 42, when is territory considered occupied?
  options:
    - >-
      When a peace treaty later assigns it to the stronger state.
    - >-
      When it is actually under the authority of the hostile army.
    - >-
      When the UN General Assembly declares that it is occupied.
    - >-
      When the army has stayed there for more than one full year.
  correct: 1
  explanation: >-
    Art. 42 is a factual test: actual authority of the hostile army, extending only where that authority is established and can be exercised.
- id: m15-021
  module: 15
  lesson: "15.2"
  subject: occupation-test
  difficulty: 2
  question: >-
    An army controls a town's outskirts but cannot enter its centre, which the local authority still runs. Under art. 42, what follows?
  options:
    - >-
      The whole town is occupied because its outskirts are occupied.
    - >-
      Occupation extends only where its authority can be exercised.
    - >-
      Nothing is occupied until the whole town has been taken.
    - >-
      Occupation depends only on whether the army intends to stay.
  correct: 1
  explanation: >-
    Art. 42's second paragraph: occupation "extends only to the territory where such authority has been established and can be exercised".
- id: m15-022
  module: 15
  lesson: "15.2"
  subject: occupation-test
  difficulty: 2
  question: >-
    What distinguishes the functional approach to occupation from the binary approach?
  options:
    - >-
      It treats any control of a border as full occupation of the whole area.
    - >-
      It ends occupation as soon as any local authority exists in the area.
    - >-
      It looks only at the occupant's declared intentions, not at control.
    - >-
      Duties tied to functions still controlled continue after withdrawal.
  correct: 3
  explanation: >-
    Under the functional approach, obligations follow the degree of control retained; the binary approach asks only whether the territory is occupied or not.
- id: m15-023
  module: 15
  lesson: "15.2"
  subject: occupant-duties
  difficulty: 1
  question: >-
    Which Hague Regulation obliges the occupant to restore and ensure public order and safety?
  options:
    - >-
      Article 43.
    - >-
      Article 46.
    - >-
      Article 52.
    - >-
      Article 55.
  correct: 0
  explanation: >-
    Art. 43 also requires respect for the laws in force unless absolutely prevented.
- id: m15-024
  module: 15
  lesson: "15.2"
  subject: occupant-duties
  difficulty: 1
  question: >-
    Under Hague Regulations art. 46, what is the rule on private property in occupied territory?
  options:
    - >-
      It may be confiscated for the occupant's own citizens.
    - >-
      It may be confiscated if compensation is paid later.
    - >-
      It must be respected and cannot be confiscated.
    - >-
      It is protected only if registered before occupation.
  correct: 2
  explanation: >-
    Art. 46: private property must be respected; "Private property cannot be confiscated." Requisition is a separate, limited power (art. 52).
- id: m15-025
  module: 15
  lesson: "15.2"
  subject: occupant-duties
  difficulty: 2
  question: >-
    A requisition order seizes private land to build a road for a new civilian neighbourhood. Under which rule is the order most exposed?
  options:
    - >-
      Art. 55: the occupant may use private land as usufructuary.
    - >-
      Art. 43: public order justifies any civilian construction.
    - >-
      GC IV art. 59: relief schemes allow the seizure of land.
    - >-
      Art. 52: requisition only for the needs of the army.
  correct: 3
  explanation: >-
    Requisition is limited to the army's needs; the Supreme Court cancelled a requisition for a civilian settlement in Elon Moreh.
- id: m15-026
  module: 15
  lesson: "15.2"
  subject: occupant-duties
  difficulty: 2
  question: >-
    Under art. 55, what is the occupant's role regarding public buildings, forests and state land of the occupied territory?
  options:
    - >-
      Owner, free to sell the property to private buyers at will.
    - >-
      Trustee holding the property only for its own citizens.
    - >-
      Administrator and usufructuary, who must safeguard the capital.
    - >-
      None at all: public property falls outside the Regulations.
  correct: 2
  explanation: >-
    Art. 55: the occupant is "only … administrator and usufructuary" and must safeguard the capital.
- id: m15-027
  module: 15
  lesson: "15.2"
  subject: occupant-duties
  difficulty: 2
  question: >-
    The population of an occupied area is inadequately supplied. What does GC IV art. 59 require of the occupant?
  options:
    - >-
      To agree to relief schemes and facilitate them by all means.
    - >-
      To supply everything itself and refuse any outside relief.
    - >-
      Nothing, unless the Security Council orders relief first.
    - >-
      To allow relief only from states it has relations with.
  correct: 0
  explanation: >-
    Art. 59 requires the occupant to agree to and facilitate relief schemes; art. 55 adds a duty to ensure food and medical supplies to the fullest extent of its means.
- id: m15-028
  module: 15
  lesson: "15.2"
  subject: settlements-art49
  difficulty: 1
  question: >-
    What does the sixth paragraph of GC IV art. 49 say?
  options:
    - >-
      The occupant may move its own citizens into the territory after one year.
    - >-
      The occupant shall not deport or transfer parts of its own civilians into the territory.
    - >-
      Protected persons may be deported from the territory for security reasons.
    - >-
      The occupant must build housing in the territory for its own citizens.
  correct: 1
  explanation: >-
    This is the provision at the centre of the settlement debate; its interpretation is contested.
- id: m15-029
  module: 15
  lesson: "15.2"
  subject: settlements-art49
  difficulty: 2
  question: >-
    How does Israel's government read GC IV art. 49(6), according to the MFA page archived in 2016?
  options:
    - >-
      It targets forced transfers, not voluntary settlement.
    - >-
      It covers every move of any citizen into any occupied area.
    - >-
      It was never actually part of the Fourth Geneva Convention.
    - >-
      It applies only to Gaza and not to Judea and Samaria.
  correct: 0
  explanation: >-
    The MFA argued that voluntary settlement does not match the forced transfers art. 49(6) contemplated; the ICJ read it to cover measures that organise or encourage transfers.
- id: m15-030
  module: 15
  lesson: "15.2"
  subject: settlements-art49
  difficulty: 2
  question: >-
    How did the ICJ read GC IV art. 49(6) in 2004?
  options:
    - >-
      As covering only forced deportations like those of the Second World War.
    - >-
      As covering any measures to organise or encourage transfers.
    - >-
      As inapplicable where the territory had no prior lawful sovereign.
    - >-
      As applying only once a final peace treaty has been signed.
  correct: 1
  explanation: >-
    Para. 120 of the 2004 opinion; Israel's government reads the provision more narrowly. Report both.
- id: m15-031
  module: 15
  lesson: "15.2"
  subject: west-bank-positions
  difficulty: 2
  question: >-
    Which statement accurately describes the Supreme Court's position on the West Bank?
  options:
    - >-
      Sovereign Israeli territory, to which all Israeli legislation applies in full.
    - >-
      Occupied, with GC IV applied in full as a treaty incorporated by statute.
    - >-
      Held in belligerent occupation; GC IV's humanitarian parts applied by declaration.
    - >-
      Non-justiciable, so the Court applies no law there at all.
  correct: 2
  explanation: >-
    Mara'abe para. 14: held in belligerent occupation; the State declared it practises the humanitarian parts of GC IV, and the Court did not re-examine the formal question.
- id: m15-032
  module: 15
  lesson: "15.2"
  subject: west-bank-positions
  difficulty: 2
  question: >-
    What term does Israel's government use for the legal status of the West Bank, according to its 2016 MFA page?
  options:
    - >-
      Occupied Palestinian Territory, to be returned without talks.
    - >-
      Annexed territory that is part of the State of Israel.
    - >-
      Territory placed under United Nations trusteeship.
    - >-
      Territory over which there are competing claims.
  correct: 3
  explanation: >-
    The MFA wrote that the West Bank "is best regarded as territory over which there are competing claims"; others call it occupied. Attribute the term you use.
- id: m15-033
  module: 15
  lesson: "15.2"
  subject: east-jerusalem
  difficulty: 2
  question: >-
    How do Israeli law and the ICJ differ on East Jerusalem?
  options:
    - >-
      Both treat it as occupied territory under the Fourth Convention.
    - >-
      Both treat it as part of Israel since the 1980 Basic Law.
    - >-
      Israeli law treats it as part of Israel; the ICJ, as occupied.
    - >-
      Israeli law treats it as occupied; the ICJ, as Israeli territory.
  correct: 2
  explanation: >-
    Basic Law: Jerusalem s. 1 declares Jerusalem, complete and united, the capital; the ICJ (2004, 2024) treats East Jerusalem as occupied.
- id: m15-034
  module: 15
  lesson: "15.2"
  subject: gaza-status
  difficulty: 2
  question: >-
    In Al-Bassiouni (2008), from what did the Supreme Court derive Israel's main obligations toward Gaza's residents?
  options:
    - >-
      The armed conflict, control of the crossings, and Gaza's dependence.
    - >-
      The law of belligerent occupation, applied in full to the whole Strip.
    - >-
      Only Israel's interim agreements with the Palestinian Authority.
    - >-
      Only the human-rights treaties that Israel has ratified.
  correct: 0
  explanation: >-
    Para. 12 lists these three sources and finds no general duty under occupation law since 2005.
- id: m15-035
  module: 15
  lesson: "15.2"
  subject: gaza-status
  difficulty: 2
  question: >-
    What did the ICJ find in 2024 about the effect of Israel's 2005 withdrawal from Gaza?
  options:
    - >-
      It ended every obligation of Israel toward Gaza and its people.
    - >-
      It turned Gaza into Israeli sovereign territory under the law.
    - >-
      It turned Gaza into a territory administered by the UN.
    - >-
      Obligations remain, matching its degree of effective control.
  correct: 3
  explanation: >-
    Paras 93–94 of the 2024 opinion; Israel's government and Supreme Court say there is no effective control.
- id: m15-036
  module: 15
  lesson: "15.2"
  subject: gaza-status
  difficulty: 3
  question: >-
    A writer cites the ICJ's 2025 opinion to say Israel's occupation duties in Gaza are "exactly as in 2005". What is inaccurate?
  options:
    - >-
      The 2025 opinion said nothing at all about the Gaza Strip.
    - >-
      The Court found control and duties increased after 7 October 2023.
    - >-
      The 2025 opinion found that Israel had no obligations in Gaza.
    - >-
      The 2025 opinion was a judgment in a contentious case.
  correct: 1
  explanation: >-
    Paras 85–87: since 7 October 2023 Israel's effective control, and with it its obligations, "increased significantly".
- id: m15-037
  module: 15
  lesson: "15.2"
  subject: gaza-status
  difficulty: 3
  question: >-
    Sean Watts (Lieber Institute, 2025) commented on the ICJ's approach to Gaza. Which description is accurate?
  options:
    - >-
      He argued that the ICJ should have applied full occupation law everywhere.
    - >-
      He questioned the legal basis of applying duties "à la carte".
    - >-
      He argued that IHL does not apply in the Gaza Strip at all.
    - >-
      He endorsed the Court's approach without any reservation.
  correct: 1
  explanation: >-
    Watts accepted occupation of some territory as reasonable but warned the functional approach can be used selectively and that its basis is unclear.
- id: m15-038
  module: 15
  lesson: "15.2"
  subject: occupant-duties
  difficulty: 3
  question: >-
    Under GC IV art. 6, which provisions continue to apply in an occupation that lasts beyond a year after military operations end?
  options:
    - >-
      None: the whole Convention ceases one year after operations.
    - >-
      Only the articles that deal with prisoners of war.
    - >-
      Every article without exception, whether or not it governs.
    - >-
      Listed articles, such as 47, 49, 53 and 59, while it governs.
  correct: 3
  explanation: >-
    Art. 6(3) keeps a listed set of articles in force while the occupant exercises the functions of government.
- id: m15-039
  module: 15
  lesson: "15.2"
  subject: attribution
  difficulty: 1
  question: >-
    Which sentence is written neutrally?
  options:
    - >-
      "The ICJ found GC IV applicable; Israel disputes de jure application."
    - >-
      "The territories are occupied, as everyone in the world knows."
    - >-
      "The territories are disputed, so the Convention is irrelevant."
    - >-
      "Only the ICJ's view matters in international law, nobody else's."
  correct: 0
  explanation: >-
    Neutral writing attributes each contested position to whoever holds it.
- id: m15-040
  module: 15
  lesson: "15.2"
  subject: attribution
  difficulty: 2
  question: >-
    Which sentence uses each actor's terms correctly?
  options:
    - >-
      "The so-called territories, which are obviously Israeli land, …"
    - >-
