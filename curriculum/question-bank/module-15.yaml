    Facts come first; the conclusion comes last and is limited by the evidence.
- id: m15-082
  module: 15
  lesson: "15.5"
  subject: incident-method
  difficulty: 1
  question: >-
    In the facts table, what three statuses can a fact have?
  options:
    - >-
      Established, claimed by a named source, or unknown.
    - >-
      True, false, or propaganda from one of the parties.
    - >-
      Legal, illegal, or still waiting to be decided.
    - >-
      Primary, secondary, or tertiary in importance.
  correct: 0
  explanation: >-
    Recording who claims what keeps the analysis neutral.
- id: m15-083
  module: 15
  lesson: "15.5"
  subject: source-grading
  difficulty: 1
  question: >-
    What is a typical weakness of a casualty figure published by an authority run by one party?
  options:
    - >-
      It is always fabricated and must be ignored.
    - >-
      It is legally binding on every court.
    - >-
      It is always lower than the real number.
    - >-
      It may not separate civilians from fighters.
  correct: 3
  explanation: >-
    Grade every source by who produced it and how; do not dismiss or adopt it automatically.
- id: m15-084
  module: 15
  lesson: "15.5"
  subject: source-grading
  difficulty: 2
  question: >-
    A video released by the attacking army shows the strike but not the moments before. How do you grade it?
  options:
    - >-
      It proves that the target was a military objective.
    - >-
      It fixes time and place, not what the attacker knew.
    - >-
      It proves that no warning was given to the residents.
    - >-
      It has no value at all, because the army released it.
  correct: 1
  explanation: >-
    Party material can establish some facts and leave others open; record which.
- id: m15-085
  module: 15
  lesson: "15.5"
  subject: source-grading
  difficulty: 2
  question: >-
    Satellite images published two days after a strike show a destroyed building. What can they establish?
  options:
    - >-
      Exactly who was inside the building at the time of the strike.
    - >-
      The destruction and its rough timing, not who was inside.
    - >-
      Whether a warning was given and how long before the strike.
    - >-
      The attacker's intelligence picture before the strike.
  correct: 1
  explanation: >-
    Open-source material can fix time and place; intent and occupancy need other evidence.
- id: m15-086
  module: 15
  lesson: "15.5"
  subject: evidence-gaps
  difficulty: 2
  question: >-
    Which evidence would best help decide the proportionality question in an invented strike?
  options:
    - >-
      The total number of strikes in the conflict that month.
    - >-
      Public opinion polls in both countries after the strike.
    - >-
      The political affiliation of the building's owner.
    - >-
      The attacker's collateral-damage estimate at the time.
  correct: 3
  explanation: >-
    Rule 14 turns on expected harm and anticipated advantage at the time.
- id: m15-087
  module: 15
  lesson: "15.5"
  subject: evidence-gaps
  difficulty: 2
  question: >-
    Residents say there was no warning; the army says it phoned. Which evidence would help most?
  options:
    - >-
      Call records, timing, and whether residents understood.
    - >-
      The army's general policy on warnings, without any call data.
    - >-
      The political views of the residents who were interviewed.
    - >-
      The number of rockets fired from the area that day.
  correct: 0
  explanation: >-
    Whether a warning was effective (Rule 20) depends on how, when and to whom it was given.
- id: m15-088
  module: 15
  lesson: "15.5"
  subject: competing-interpretations
  difficulty: 2
  question: >-
    Israel's government and the 2015 UN Commission disagree about "roof knocking". What is the dispute about?
  options:
    - >-
      Whether IHL requires any warnings at all before attacks.
    - >-
      Whether the Commission had any jurisdiction over Israel.
    - >-
      Whether it is an effective warning: understanding and time.
    - >-
      Whether IHL applies in the Gaza Strip in the first place.
  correct: 2
  explanation: >-
    Israel's report calls it a highly effective precaution; the Commission said it cannot be considered an effective warning. Present both.
- id: m15-089
  module: 15
  lesson: "15.5"
  subject: competing-interpretations
  difficulty: 3
  question: >-
    How can a pattern of strikes on residential buildings be used in an analysis without contradicting the prospective proportionality test?
  options:
    - >-
      As proof in itself that every strike was disproportionate.
    - >-
      Not at all, because patterns are always legally irrelevant.
    - >-
      Only if the attacking state itself admits the pattern.
    - >-
      As attributed evidence of what the attacker could expect.
  correct: 3
  explanation: >-
    The UN Commission reasoned from patterns; Israel's government stresses the commander's view at the time. Both accept the test is prospective.
- id: m15-090
  module: 15
  lesson: "15.5"
  subject: limited-conclusion
  difficulty: 2
  question: >-
    What makes a limited conclusion useful rather than evasive?
  options:
    - >-
      It avoids mentioning any rule of IHL by name.
    - >-
      It repeats both parties' statements without comment.
    - >-
      It names the evidence that would decide each rule.
    - >-
      It states the analyst's political view openly.
  correct: 2
  explanation: >-
    A limited conclusion is precise about what is known, unknown and decisive.
- id: m15-091
  module: 15
  lesson: "15.5"
  subject: limited-conclusion
  difficulty: 3
  question: >-
    Your analysis concludes that an invented strike "may have complied" with IHL. A colleague wants "complied". When would that change be justified?
  options:
    - >-
      When independent evidence settles use, expected harm and warning.
    - >-
      When the attacking army issues a second, more detailed statement.
    - >-
      When most media outlets have accepted the army's account.
    - >-
      Never, because an IHL analysis may not conclude anything.
  correct: 0
  explanation: >-
    Strengthen a conclusion only as the evidence establishes the facts each rule needs.
- id: m15-092
  module: 15
  lesson: "15.5"
  subject: incident-method
  difficulty: 2
  question: >-
    In the invented Kessar incident, why does the analysis also examine the Valley Front?
  options:
    - >-
      The defender's conduct makes the attack automatically lawful.
    - >-
      Rules 22 and 97 bind the defender, whatever the attacker did.
    - >-
      Only armed groups are bound by IHL in conflicts of this kind.
    - >-
      The defender must give warnings to the attacking army.
  correct: 1
  explanation: >-
    Both parties' duties are engaged; one party's breach does not cancel the other's obligations.
- id: m15-093
  module: 15
  lesson: "15.5"
  subject: incident-method
  difficulty: 2
  question: >-
    When troops face a crowd at an aid convoy, why might the analysis consider a law-enforcement standard as well as hostilities rules?
  options:
    - >-
      Force against people not fighting may fall under that standard.
    - >-
      Law-enforcement rules replace IHL in every armed conflict.
    - >-
      Hostilities rules never apply near humanitarian convoys.
    - >-
      Crowds near convoys are always treated as combatants.
  correct: 0
  explanation: >-
    Sassòli's lecture on IHL and human rights explains when each model applies; writers disagree at the edges, so state both.
- id: m15-094
  module: 15
  lesson: "15.5"
  subject: incident-method
  difficulty: 3
  question: >-
    Your analysis concerns a real, named incident. What does the course's method require?
  options:
    - >-
      Publish a verdict as soon as one NGO report confirms it.
    - >-
      Map the debate and gaps; publish no verdict on named people.
    - >-
      Interview witnesses in the conflict area to verify the facts.
    - >-
      Treat the official statement of your own state as decisive.
  correct: 1
  explanation: >-
    Fieldwork in conflict zones is out of scope, and the course does not reach conclusions on real incidents.
- id: m15-095
  module: 15
  lesson: "15.5"
  subject: source-grading
  difficulty: 3
  question: >-
    An NGO report relies on six witnesses, four of whom support one version. How should this be recorded?
  options:
    - >-
      As established fact, because a majority of witnesses agree.
    - >-
      As worthless, because NGOs are always partisan sources.
    - >-
      As NGO-gathered witness accounts, with the split noted.
    - >-
      As the official finding of an independent inquiry.
  correct: 2
  explanation: >-
    Record the method and the split; corroboration is needed before a fact is established.
- id: m15-096
  module: 15
  lesson: "15.5"
  subject: key-terms
  difficulty: 1
  question: >-
    What is "נזק נלווה" in English?
  options:
    - >-
      Direct participation in hostilities.
    - >-
      Effective advance warning.
    - >-
      A lawful military objective.
    - >-
      Incidental (collateral) harm.
  correct: 3
  explanation: >-
    It is the harm weighed in the proportionality rule.
- id: m15-097
  module: 15
  lesson: "15.5"
  subject: attribution
  difficulty: 2
  question: >-
    Which sentence fits step 5 of the method (competing interpretations)?
  options:
    - >-
      "The truth is obviously X, whatever the other side says."
    - >-
      "Both sides lie, so the rules cannot be applied at all."
    - >-
      "Israel's 2015 report says X; the 2015 Commission says Y."
    - >-
      "The Commission is biased, so only Israel's view counts."
  correct: 2
