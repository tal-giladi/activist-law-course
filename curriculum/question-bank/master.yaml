- id: m01-045
  module: 1
  lesson: '01.4'
  subject: forum-choice
  difficulty: 2
  question: >-
    A resident is fined under a municipal by-law for an unlicensed protest stand and wants to
    contest it. Which court hears it?
  options:
    - The High Court of Justice.
    - The Local Affairs Court.
    - The Regional Labour Court.
    - The small claims court.
  correct: 1
  explanation: 'Courts Law s. 55: the Local Affairs Court hears offences under municipal ordinances and by-laws.'
- id: m01-046
  module: 1
  lesson: '01.4'
  subject: forum-choice
  difficulty: 2
  question: >-
    An individual claims ₪3,000 from a shop that refused to serve her. Which forum is designed for
    this?
  options:
    - The small claims court.
    - The District Court.
    - The High Court of Justice.
    - The Administrative Affairs Court.
  correct: 0
  explanation: >-
    Small claims courts hear individuals' money claims up to a ceiling (see current numbers), with
    simple procedure.
- id: m01-047
  module: 1
  lesson: '01.4'
  subject: forum-choice
  difficulty: 3
  question: >-
    Why does the High Court of Justice decline a petition that belongs to the Administrative Affairs
    Court?
  options:
    - It hears only criminal matters, never administrative ones.
    - It never hears petitions brought by private individuals.
    - It hears only cases in which the Knesset is a party.
    - It hears only matters not within another court's jurisdiction.
  correct: 3
  explanation: Section 15(c) gives it matters "אשר אינם בסמכותו של בית משפט או של בית דין אחר".
- id: m01-048
  module: 1
  lesson: '01.4'
  subject: courts-map
  difficulty: 2
  question: Which kind of court decides the divorce of a Muslim couple in Israel?
  options:
    - The High Court of Justice, sitting as the first instance.
    - A Sharia court, a religious court with jurisdiction set by law.
    - The Regional Labour Court, as a dispute about support.
    - The Local Affairs Court of the couple's municipality.
  correct: 1
  explanation: >-
    Religious courts hold judicial power as set by law (Basic Law: The Judiciary s. 1(b)); personal
    status matters go to them.
- id: m01-049
  module: 1
  lesson: '01.4'
  subject: appeals
  difficulty: 2
  question: >-
    You lost an administrative petition in the Administrative Affairs Court. Where does the appeal
    go?
  options:
    - To the Magistrates' Court in the same district.
    - To the High Court of Justice, as a fresh petition.
    - To the same court, before a different judge.
    - To the Supreme Court, as an administrative appeal (עע״ם).
  correct: 3
  explanation: >-
    Judgments of the District Court, including as Administrative Affairs Court, are appealed to the
    Supreme Court.
- id: m01-050
  module: 1
  lesson: '01.4'
  subject: forum-choice
  difficulty: 3
  question: >-
    An NGO considers a High Court petition while a planning appeals committee could still hear the
    same issue. What risk matters most?
  options:
    - The High Court may fine NGOs that petition too often.
    - The committee can transfer the case to the Labour Court.
    - The petition may fail for skipping the committee first.
    - Filing in both places is an offence under s. 96.
  correct: 2
  explanation: >-
    Courts expect you to use the forum the law sets and to exhaust remedies first. A special
    tribunal comes before the High Court.
- id: m01-051
  module: 1
  lesson: '01.4'
  subject: courts-map
  difficulty: 1
  question: Which court hears most criminal cases at first instance?
  options:
    - The Supreme Court.
    - The High Court of Justice.
    - The Magistrates' Court.
    - The Regional Labour Court.
  correct: 2
  explanation: >-
    Courts Law s. 51(a)(1): offences punishable by up to seven years' prison go to the Magistrates'
    Court.
- id: m01-052
  module: 1
  lesson: '01.4'
  subject: appeals
  difficulty: 2
  question: What is "רשות ערעור"?
  options:
    - Leave to appeal, needed when no appeal as of right exists.
    - An automatic right of appeal from every decision.
    - A further hearing of a case before a larger panel.
    - An order nisi that the court gives to an authority.
  correct: 0
  explanation: >-
    First-instance judgments are appealable as of right (s. 17). Other decisions, or a second
    appeal, usually need leave.
- id: m01-053
  module: 1
  lesson: '01.4'
  subject: appeals
  difficulty: 2
  question: What is a "דיון נוסף"?
  options:
    - A retrial of a criminal case after new evidence is found.
    - An appeal from the Magistrates' Court to the District Court.
    - A further hearing in the Supreme Court, before five or more justices.
    - A hearing on a bill in the Knesset Constitution Committee.
  correct: 2
  explanation: >-
    Basic Law: The Judiciary s. 18: a matter decided by three justices may get a further hearing
    before five or more.
- id: m01-054
  module: 1
  lesson: '01.4'
  subject: forum-choice
  difficulty: 3
  question: >-
    Before choosing a court for a challenge to an authority's decision, which question does the
    lesson say to ask?
  options:
    - Whether the official who signed it has served for more than a year.
    - Whether its subject is in the Administrative Courts Law's first schedule.
    - Whether the decision was reported in the national media.
    - Whether the authority has lost a petition in the past.
  correct: 1
  explanation: >-
    If the subject is listed, start in the Administrative Affairs Court; if not, and it is a state
    body, the High Court of Justice.
- id: m01-055
  module: 1
  lesson: '01.4'
  subject: courts-map
  difficulty: 1
  question: >-
    The labour courts have exclusive (ייחודית) jurisdiction over employee–employer disputes. What
    does that mean?
  options:
    - They hear them only if both sides agree to it.
    - Any court may hear them; labour courts are just faster.
    - Only the labour courts may hear those disputes.
    - They hear those disputes only on appeal.
  correct: 2
  explanation: >-
    Labour Court Law s. 24 gives regional labour courts exclusive jurisdiction; other courts cannot
    hear those claims.
- id: m01-056
  module: 1
  lesson: '01.4'
  subject: courts-map
  difficulty: 1
  question: A civil money claim is above the Magistrates' Court ceiling. Which court hears it?
  options:
    - The small claims court.
    - The Local Affairs Court.
    - The High Court of Justice.
    - The District Court.
  correct: 3
  explanation: >-
    Courts Law s. 40(1): the District Court hears civil matters not within the Magistrates' Court's
    jurisdiction.
- id: m01-057
  module: 1
  lesson: '01.5'
  subject: statute-structure
  difficulty: 1
  question: In "סעיף 63(ב)(3)", what is "(ב)"?
  options:
    - A paragraph.
    - A chapter.
    - A subsection.
    - A schedule.
  correct: 2
  explanation: Section 63, subsection (ב), paragraph (3).
- id: m01-058
  module: 1
  lesson: '01.5'
  subject: legal-hebrew
  difficulty: 1
  question: In a definition, what does "לרבות" do?
  options:
    - It cuts out an exception from the term.
    - It limits the term to the listed items only.
    - It makes the term subject to another section.
    - 'It widens the term: the list is not closed.'
  correct: 3
  explanation: '"לרבות" means including. "למעט" is the word that cuts out exceptions.'
- id: m01-059
  module: 1
  lesson: '01.5'
  subject: legal-hebrew
  difficulty: 2
  question: Section 6 opens "על אף האמור בסעיף 5". What does it mean?
  options:
    - Section 6 applies only after section 5 has been applied.
    - Section 5 overrides section 6 where the two conflict.
    - Section 6 overrides section 5 where the two conflict.
    - Both sections are void because they contradict each other.
  correct: 2
  explanation: '"על אף" (notwithstanding) means this section wins over the one it names.'
- id: m01-060
  module: 1
  lesson: '01.5'
  subject: legal-hebrew
  difficulty: 2
  question: A section says it applies "בכפוף לסעיף 12". What does that mean?
  options:
    - This section wins over section 12.
    - Section 12 has since been repealed.
    - Section 12 is only a definition section.
    - Section 12 wins where the two conflict.
  correct: 3
  explanation: '"בכפוף ל…" (subject to) means the other section prevails.'
- id: m01-061
  module: 1
  lesson: '01.5'
  subject: legal-hebrew
  difficulty: 2
  question: Three conditions in a section are joined by "או". What follows?
  options:
    - All three must be met together.
    - Only the first condition counts.
    - They apply only inside a court.
    - Meeting any one of them is enough.
  correct: 3
  explanation: >-
    "או" (or) makes alternatives; "ו" (and) makes cumulative conditions. Small words, big
    consequences.
- id: m01-062
  module: 1
  lesson: '01.5'
  subject: statute-structure
  difficulty: 1
  question: Where in a law do you usually find its definitions?
  options:
    - In the last schedule, after the signatures.
    - In the minutes of the Knesset debate on the law.
    - In an early section, often s. 1 or 2, headed הגדרות.
    - Only in the regulations made under the law.
  correct: 2
  explanation: >-
    Most laws define their terms near the start. The Interpretation Law's definitions also apply
    unless the law says otherwise.
- id: m01-063
  module: 1
  lesson: '01.5'
  subject: statute-structure
  difficulty: 2
  question: A section says the authority acts "בעניין המנוי בתוספת". Where do you look?
  options:
    - In the Basic Law that the section relates to.
    - On the website of the responsible minister.
    - In the definitions of the Interpretation Law.
    - In the schedule at the end of the law.
  correct: 3
  explanation: >-
    A תוספת (schedule) is a list at the end of the law that sections refer to, like the first
    schedule of the Administrative Courts Law.
- id: m01-064
  module: 1
  lesson: '01.5'
  subject: deadlines
  difficulty: 3
  question: >-
    An objection period is two months from publication on 15 March. Under Interpretation Law s.
    10(b), when does it end?
  options:
    - On 14 May, the day before the same date.
    - On 16 May, the day after the same date.
    - On 14 May, after exactly 60 calendar days.
    - On 15 May.
  correct: 3
  explanation: >-
    Section 10(b): a period in months ends in the last month on the day with the same number as the
    event day. Months are not counted as 30-day blocks.
- id: m01-065
  module: 1
  lesson: '01.5'
  subject: deadlines
  difficulty: 3
  question: A 14-day period ends on a Saturday. What does Interpretation Law s. 10(c) say?
  options:
    - The period ends on the Friday before the Saturday.
    - Saturdays never count, so add one day for each Saturday.
    - The period is cancelled and must be started again.
    - The Saturday does not count, so the period runs to the next day.
  correct: 3
  explanation: >-
    Rest days inside a period count, "זולת אם הם הימים האחרונים שבתקופה" — unless they are the last
    days.
- id: m01-066
  module: 1
  lesson: '01.5'
  subject: legal-hebrew
  difficulty: 2
  question: What does "דינו – מאסר שנה" at the end of a section signal?
  options:
    - A criminal penalty for breaking the section.
    - A definition of a term used in the law.
    - A deadline the authority must meet.
    - A fee payable to the court registry.
  correct: 0
  explanation: >-
    "דינו" introduces a penalty. Bar Association Law s. 96 uses the same form for the fine for
    unauthorised practice.
- id: m01-067
  module: 1
  lesson: '01.5'
  subject: statute-structure
  difficulty: 2
  question: 'On Wikisource, a section shows "תיקון: תשפ״ד". What should you do?'
  options:
    - Ignore it; amendments apply only to new cases.
    - Assume the whole section has been repealed.
    - Make sure you read the text as amended that year.
    - Cite the original text, which still binds.
  correct: 2
  explanation: >-
    The note means the section changed in that year. Read the current text and, for recent changes,
    check the Knesset database.
- id: m01-068
  module: 1
  lesson: '01.5'
  subject: citation
  difficulty: 3
  question: 'A draft letter says: "Under the law, you must grant my request." What is its main weakness?'
  options:
    - It is too polite; letters must threaten court.
    - It cites no section, so nobody can check the duty.
    - It should be written in English for officials.
    - It should quote a news article as support.
  correct: 1
  explanation: Cite the smallest unit and the full title. A claimed duty without a section is easy to dismiss.
- id: m01-069
  module: 1
  lesson: '01.5'
  subject: statute-structure
  difficulty: 2
  question: A law says "השר רשאי להתקין תקנות בכל הנוגע לביצועו". What does it tell you?
  options:
    - Regulations may exist under this law; look for them.
    - The minister must issue regulations within 30 days.
    - The law has no effect until regulations are made.
    - Regulations under it override the law itself.
  correct: 0
  explanation: >-
    A regulations power tells you where to look for the next rung of the hierarchy. "רשאי" means the
    minister may, not must.
- id: m01-070
  module: 1
  lesson: '01.5'
  subject: citation
  difficulty: 1
  question: In a full Hebrew citation of a provision, what follows the section number?
  options:
    - The page number on Wikisource.
    - The name of the responsible minister.
    - The law's full title with its year.
    - The number of the Knesset session.
  correct: 2
  explanation: 'For example: "סעיף 20(3) לחוק לשכת עורכי הדין, התשכ״א–1961".'
- id: m01-071
  module: 1
  lesson: '01.6'
  subject: case-numbers
  difficulty: 1
  question: What does the prefix "בג״ץ" in a case number mean?
  options:
    - A civil appeal to the Supreme Court.
    - A High Court of Justice petition.
    - A criminal appeal to the Supreme Court.
    - A claim in the small claims court.
  correct: 1
  explanation: 'בג״ץ stands for בית משפט גבוה לצדק: the Supreme Court hearing petitions against authorities.'
- id: m01-072
  module: 1
  lesson: '01.6'
  subject: case-numbers
  difficulty: 1
  question: What does the prefix "ע״פ" indicate?
  options:
    - A civil claim.
    - An administrative petition.
    - A further hearing.
    - A criminal appeal.
  correct: 3
  explanation: >-
    ע״פ is ערעור פלילי. A civil appeal is ע״א, an administrative petition עת״מ, a further hearing
    דנ״א or דנג״ץ.
- id: m01-073
  module: 1
  lesson: '01.6'
  subject: case-numbers
  difficulty: 2
  question: What does the number "5658/23" tell you?
  options:
    - Decided on 5 June 2023 at 8 o'clock.
    - Case number 5658, opened in 2023.
    - Volume 5658, page 23 of the official reports.
    - The 23rd hearing in case number 5658.
  correct: 1
  explanation: Supreme Court case numbers are a running number and the year the case was opened.
- id: m01-074
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 2
  question: A ruling ends "העתירה נדחית. העותרים יישאו בהוצאות המשיבים". What happened?
  options:
    - Petition granted; respondents pay the petitioners' costs.
    - Petition dismissed; petitioners pay the respondents' costs.
    - Petition postponed; costs to be decided at a later date.
    - Petition dismissed; each side bears its own costs.
  correct: 1
  explanation: נדחית means dismissed; יישאו בהוצאות means they bear the costs. Costs are a real risk of losing.
- id: m01-075
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 2
  question: Which question best identifies a ruling's holding?
  options:
    - Which paragraph is quoted most often in the media?
    - Which justice wrote the longest opinion in the case?
    - What rule did the court need to decide this case?
    - What did the losing side argue in its summary?
  correct: 2
  explanation: >-
    The holding is the rule necessary to decide the case. Famous or long passages may be remarks in
    passing.
- id: m01-076
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 1
  question: In a panel judgment, what does "אני מסכים" signal?
  options:
    - A justice joining another's opinion.
    - A justice writing a dissent.
    - The parties reaching a settlement.
    - The case being sent back down.
  correct: 0
  explanation: Short concurrences show who joined which opinion, which tells you where the majority is.
- id: m01-077
  module: 1
  lesson: '01.6'
  subject: finding-rulings
  difficulty: 2
  question: Where can you read a free English translation of a landmark Israeli Supreme Court opinion?
  options:
    - Nevo's case-law pages, which are open to all.
    - Takdin, the commercial legal database.
    - The Knesset's national legislation database.
    - Versa, the Cardozo Israeli Supreme Court Project.
  correct: 3
  explanation: >-
    Versa is free. Nevo case-law pages and Takdin are paid, and the Knesset database holds
    legislation, not rulings.
- id: m01-078
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 3
  question: >-
    Before quoting a 2019 Supreme Court holding in your petition, what check does the lesson
    recommend?
  options:
    - Check that the judges who wrote it are still serving.
    - Check that the parties agreed to the ruling's publication.
    - Search for a later further hearing or ruling that changed it.
    - Check that the holding was reported in English as well.
  correct: 2
  explanation: >-
    A holding can be reversed in a further hearing (דנג״ץ, דנ״א) or overtaken by a later ruling or
    law.
- id: m01-079
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 2
  question: What is the difference between "החלטה" and "פסק דין"?
  options:
    - A decision is interim or procedural; a judgment ends the case.
    - They are two names for exactly the same court document.
    - A decision is a ruling given only by the Supreme Court.
    - A judgment is the final ruling given only in criminal cases.
  correct: 0
  explanation: >-
    Courts give many decisions along the way (on deadlines, requests, interim orders) and one
    judgment at the end.
- id: m01-080
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 3
  question: >-
    A news headline says "Court lets protest go ahead". Your protest differs in place and size. What
    is the next step?
  options:
    - Quote the headline in your letter as the court's holding.
    - Assume all protests of any kind are now allowed.
    - Ignore it, since news reports cannot be checked.
    - Read the ruling's holding and conditions before relying on it.
  correct: 3
  explanation: >-
    Headlines drop the conditions. Only the holding, read in the ruling itself, tells you whether it
    covers your case.
- id: m01-081
  module: 1
  lesson: '01.6'
  subject: case-numbers
  difficulty: 2
  question: In a Magistrates' Court, what is "ת״א 1234-05-25"?
  options:
    - A Tel Aviv appeal from the year 2025.
    - An administrative appeal from May 2005.
    - A criminal case, number 1234 of 2025.
    - A civil claim opened in May 2025.
  correct: 3
  explanation: >-
    ת״א is תביעה אזרחית (a civil claim), not Tel Aviv. Lower courts number cases as
    number–month–year.
- id: m01-082
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 2
  question: In a 5–4 Supreme Court ruling, whose opinion states the law that binds lower courts?
  options:
    - The President's opinion, on whichever side it falls.
    - The majority's, even if a minority opinion is longer.
    - The longest opinion, since it gives the most reasons.
    - The minority's, if it cites more earlier precedents.
  correct: 1
  explanation: 'Only the majority''s holding is "הלכה" under Basic Law: The Judiciary s. 20.'
- id: m01-083
  module: 1
  lesson: '01.6'
  subject: finding-rulings
  difficulty: 1
  question: Roughly which years does the free Supreme Court search cover well?
  options:
    - From 1948 onward, completely.
    - Only rulings from 2020 onward.
    - From about 1997 onward.
    - Only rulings translated into English.
  correct: 2
  explanation: >-
    Older landmark rulings need Versa, Wikipedia summaries or a law library. Lesson 02.2 teaches the
    search.
- id: m01-084
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 3
  question: During your petition, the High Court issues a "צו על תנאי". What does it mean for you?
  options:
    - You have won the case, and the proceedings are now over.
    - The respondent must explain why your order should not be given.
    - Your petition was dismissed without any hearing at all.
    - You must pay a deposit before the hearing can take place.
  correct: 1
  explanation: >-
    An order nisi shifts the burden to the respondent to justify itself. It is a good sign, but not
    yet a win.
- id: m02-001
  module: 2
  lesson: '02.1'
  subject: official-gazette
  difficulty: 1
  question: Where is the official, binding text of a new Israeli law first published?
  options:
    - In Reshumot, the official gazette (Sefer HaHukim series).
    - On the Knesset's YouTube channel after the final vote.
    - In the Supreme Court's annual law reports.
    - On Hebrew Wikisource, which the Knesset updates directly.
  correct: 0
  explanation: >-
    Laws are published in Reshumot; Sefer HaHukim is the series for Knesset laws. Wikisource and
    other sites are copies.
- id: m02-002
  module: 2
  lesson: '02.1'
  subject: official-gazette
  difficulty: 1
  question: A citation reads 'ק״ת תשפ״ו, 508'. What kind of document is it?
  options:
    - A Knesset law in Sefer HaHukim.
    - A Supreme Court judgment in the law reports.
    - Regulations or a notice in Kovetz HaTakanot.
    - A bill published for first reading.
  correct: 2
  explanation: >-
    ק״ת stands for קובץ התקנות, the gazette series for regulations and notices such as yearly fee
    updates.
- id: m02-003
  module: 2
  lesson: '02.1'
  subject: consolidated-text
  difficulty: 1
  question: Why does the Courts Law carry '[נוסח משולב]' in its title?
  options:
    - It was translated from an English Mandate ordinance and re-issued in Hebrew.
    - It is a temporary provision with an end date.
    - It applies only together with another law.
    - It was re-enacted with all its amendments merged into one text.
  correct: 3
  explanation: >-
    A consolidated version merges the law's amendments into one text (Law and Administration
    Ordinance s. 16(ד)).
- id: m02-004
  module: 2
  lesson: '02.1'
  subject: current-text
  difficulty: 2
  question: >-
    You are checking a law on Wikisource. Which part of the page tells you most quickly how up to
    date the copy claims to be?
  options:
    - The last entry in the box of Reshumot publications at the top.
    - The date the law was first enacted, which appears in its full title.
    - The number of sections in the law.
    - The talk page where volunteers discuss edits.
  correct: 0
  explanation: >-
    The top box lists the original law and each amendment with year and page; the newest entry shows
    the latest amendment the copy includes.
- id: m02-005
  module: 2
  lesson: '02.1'
  subject: current-text
  difficulty: 2
  question: >-
    The newest amendment shown on Wikisource and on the Knesset database page is the same 2021
    amendment. What does that tell you?
  options:
    - The law cannot be amended again before 2031.
    - The Wikisource copy is very likely current, pending any brand-new amendment.
    - You must still pay for a commercial database to confirm the text is current.
    - The law has been repealed and replaced.
  correct: 1
  explanation: >-
    Matching amendment lists in both sources is the main currency check; for a key filing you may
    also open the gazette PDF.
- id: m02-006
  module: 2
  lesson: '02.1'
  subject: indirect-amendment
  difficulty: 3
  question: >-
    A deadline in the law you rely on was changed by a section buried in a budget 'arrangements'
    law. Where are you most likely to catch this?
  options:
    - In the law's own title, which changes after every amendment.
    - In the English translation on a university website.
    - In the Knesset database's full amendment list for your law.
    - In the explanatory notes of the original bill from decades ago.
  correct: 2
  explanation: >-
    Indirect amendments (תיקון עקיף) are made by other laws. The Knesset database lists them on the
    amended law's page.
- id: m02-007
  module: 2
  lesson: '02.1'
  subject: commencement
  difficulty: 2
  question: >-
    A law was published in Reshumot on 5 March and says nothing about when it starts. From when does
    it apply?
  options:
    - From 5 March, the day of publication.
    - From 1 January of the next year.
    - From 30 days after publication.
    - From the day the Knesset passed it in third reading.
  correct: 0
  explanation: >-
    Unless the law sets another date, legislation takes effect on publication in Reshumot (Law and
    Administration Ordinance s. 10(א)).
- id: m02-008
  module: 2
  lesson: '02.1'
  subject: commencement
  difficulty: 1
  question: At what time of day does a provision come into force on its commencement day?
  options:
    - At 08:00, when government offices open.
    - At noon, Israel time.
    - At midnight at the end of that day.
    - At 00:01 at the start of that day.
  correct: 3
  explanation: 'Interpretation Law s. 21: a provision takes effect at 00.01 on its commencement day.'
- id: m02-009
  module: 2
  lesson: '02.1'
  subject: temporary-provision
  difficulty: 2
  question: >-
    The section you need is marked 'הוראת שעה' with an end date that passed last month. What should
    you check?
  options:
    - Whether it was extended, and what text applies now that it ended.
    - Nothing; temporary provisions stay in force until repealed.
    - Whether the Supreme Court approved the provision.
    - Whether an English translation of the provision exists.
  correct: 0
  explanation: >-
    A temporary provision ends on its date unless extended. Check the amendment list for an
    extension and read the permanent text that now applies.
- id: m02-010
  module: 2
  lesson: '02.1'
  subject: binding-version
  difficulty: 2
  question: >-
    An old Mandate ordinance exists in an English original and a Hebrew 'נוסח חדש'. Which text
    binds?
  options:
    - The English original, because it came first.
    - The Hebrew new version.
    - Whichever text favours the citizen.
    - Both equally, so a court must reconcile them.
  correct: 1
  explanation: >-
    Interpretation Law s. 24: where a new version was set under s. 16 of the Law and Administration
    Ordinance, the new version binds.
- id: m02-011
  module: 2
  lesson: '02.1'
  subject: regulations
  difficulty: 2
  question: >-
    You need the fee in a set of regulations that are updated every year. The Wikisource page notes
    'מעודכנים לשנת 2025' and it is now late 2026. What do you do?
  options:
    - Use the amounts shown, since regulations rarely change.
    - Add 3% to each amount as an estimate of the yearly inflation update.
    - Find the newer update notice in the gazette or on Current Numbers.
    - Ask on a social-media group what the fee is now.
  correct: 2
  explanation: >-
    The note shows the copy is a year behind. The yearly update is published as a notice in Kovetz
    HaTakanot; the course's Current Numbers page tracks it.
- id: m02-012
  module: 2
  lesson: '02.1'
  subject: law-card
  difficulty: 1
  question: Which of these belongs on a law card but is most often forgotten?
  options:
    - The colour of the gazette's cover.
    - The name of the minister who proposed the bill.
    - The number of Knesset members who voted for it.
    - The Hebrew year in the law's full title.
  correct: 3
  explanation: >-
    The full title includes the Hebrew year (for example התשי״ט–1958); it identifies the law
    precisely, since titles can repeat.
- id: m02-013
  module: 2
  lesson: '02.1'
  subject: free-sources
  difficulty: 1
  question: Which of these is a free source for consolidated statute texts?
  options:
    - Nevo's statute pages under law_html.
    - Nevo's case-law pages under psika_html.
    - Takdin's full database.
    - A paid law-firm newsletter.
  correct: 0
  explanation: >-
    Nevo's statute pages are free; its case-law pages and full search are paid, as are Takdin and
    similar databases.
- id: m02-014
  module: 2
  lesson: '02.1'
  subject: current-text
  difficulty: 3
  question: >-
    Wikisource shows a newer amendment than the Knesset database page, which seems not to list it.
    What is the sensible conclusion?
  options:
    - Wikisource invented the amendment, so ignore it.
    - Open the gazette PDF the Wikisource box links to and confirm it.
    - The Knesset page is official, so the amendment does not exist.
    - Use whichever version supports your argument.
  correct: 1
  explanation: >-
    When copies disagree, the gazette decides. Wikisource links each amendment to its scanned
    gazette PDF.
- id: m02-015
  module: 2
  lesson: '02.2'
  subject: case-numbers
  difficulty: 1
  question: What does 'בג״ץ' in a case number mean?
  options:
    - An appeal from a district court in a civil case.
    - A petition to the High Court of Justice.
    - A further hearing before an expanded panel.
    - A petition to an administrative court.
  correct: 1
  explanation: >-
    בג״ץ is the Supreme Court sitting as the High Court of Justice, hearing petitions against public
    authorities.
- id: m02-016
  module: 2
  lesson: '02.2'
  subject: case-numbers
  difficulty: 2
  question: A municipal decision cites 'עת״מ 35192-09-24'. What can you tell from the number?
  options:
    - It is a Supreme Court appeal from 2009.
    - It is a High Court of Justice petition, number 35192, filed in 2024.
    - It is a district administrative petition opened in September 2024.
    - It is a criminal case from 1924.
  correct: 2
  explanation: >-
    עת״מ is an administrative petition in a district court; the Net HaMishpat format is
    serial-month-year.
- id: m02-017
  module: 2
  lesson: '02.2'
  subject: case-numbers
  difficulty: 2
  question: You see 'דנג״ץ' followed by a number. What kind of proceeding is it?
  options:
    - A further hearing of an HCJ ruling before a larger panel.
    - A petition filed by a government body.
    - An appeal to the president for a pardon.
    - A district court's review of a local authority's bylaw on appeal.
  correct: 0
  explanation: >-
    דנג״ץ is a further hearing (דיון נוסף) of a High Court of Justice ruling, under Courts Law s.
    30.
- id: m02-018
  module: 2
  lesson: '02.2'
  subject: judgment-search
  difficulty: 1
  question: >-
    From which year does the Supreme Court's free judgments search hold the court's judgments and
    decisions?
  options:
    - From 1948, the founding of the state.
    - From 1980, the Foundations of Law Act.
    - Only from 2020 onward.
    - From 1997 onward.
  correct: 3
  explanation: >-
    The site states it holds Supreme Court judgments and decisions from 1997, plus judgments printed
    in the reports from 2006.
- id: m02-019
  module: 2
  lesson: '02.2'
  subject: judgment-search
  difficulty: 2
  question: You want every HCJ ruling in which a particular NGO was a party. Which search field fits best?
  options:
    - The parties, judges and counsel field (שופטים, צדדים ובאי כח).
    - The document date field only.
    - The page-count sort option.
    - The previous-instance field (ערכאה קודמת), filled in with the NGO's name.
  correct: 0
  explanation: Searching by party name finds the cases where that NGO appeared; then filter by proceeding type.
- id: m02-020
  module: 2
  lesson: '02.2'
  subject: judgment-search
  difficulty: 2
  question: >-
    Your free-text search for an issue returns 400 results, most of them interim decisions. What is
    the most efficient next step?
  options:
    - Read all 400 from oldest to newest.
    - Filter to judgments and relevant proceedings, newest first.
    - Give up and search a paid database.
    - Open the five longest documents, since they are the most important.
  correct: 1
  explanation: >-
    Filtering to final judgments and relevant proceedings, sorted by date, cuts the list to what
    matters.
- id: m02-021
  module: 2
  lesson: '02.2'
  subject: precedent
  difficulty: 1
  question: Which courts are bound by a rule set by the Supreme Court?
  options:
    - Only the court that heard the case.
    - Only district courts.
    - Every court except the Supreme Court itself.
    - No court at all; rulings are only persuasive.
  correct: 2
  explanation: >-
    Basic Law: The Judiciary s. 20(ב): a Supreme Court rule binds every court except the Supreme
    Court.
- id: m02-022
  module: 2
  lesson: '02.2'
  subject: precedent
  difficulty: 2
  question: >-
    A district court ruled in your favour on a legal question. How should you present it to a
    different district court?
  options:
    - As binding, since all district courts are equal.
    - As binding only if the ruling is newer than five years.
    - It cannot be mentioned at all.
    - As persuasive support, not binding authority.
  correct: 3
  explanation: >-
    A lower-court ruling guides only courts below it (s. 20(א)); another district court may
    disagree.
- id: m02-023
  module: 2
  lesson: '02.2'
  subject: holding-vs-obiter
  difficulty: 3
  question: >-
    A judge remarks in passing that 'perhaps a different result would follow if the authority had
    given reasons'. The case was decided on another ground. How strong is this remark?
  options:
    - 'It is obiter: worth mentioning, but not a binding rule.'
    - It is the binding holding, because a Supreme Court judge wrote it.
    - It overrules earlier rulings on the same point.
    - It binds the authority but not the courts.
  correct: 0
  explanation: >-
    A remark that does not decide the case is obiter (אמרת אגב). It can support an argument but
    binds no one.
- id: m02-024
  module: 2
  lesson: '02.2'
  subject: good-law-check
  difficulty: 2
  question: >-
    Besides searching for a further hearing, what is the best free way to find out how later courts
    treated a ruling?
  options:
    - Email the judges who wrote it.
    - Search its case number as free text in the judgments search.
    - Look up the ruling's page count.
    - Check whether the ruling was reported in the national newspapers.
  correct: 1
  explanation: >-
    Later rulings that cite it appear in a free-text search of its number; read the newest to see
    whether they follow or narrow it.
- id: m02-025
  module: 2
  lesson: '02.2'
  subject: good-law-check
  difficulty: 3
  question: >-
    A 2012 ruling interpreted section 9 of a law. In 2020 section 9 was rewritten. What does that
    mean for the ruling?
  options:
    - Nothing; rulings stay binding regardless of later legislation.
    - It is automatically void, even if the wording barely changed.
    - Check whether the new wording changes the point it decided.
    - It becomes binding only on the Supreme Court.
  correct: 2
  explanation: >-
    A ruling interprets a text. If the text changed, compare the old and new wording before relying
    on the ruling.
- id: m02-026
  module: 2
  lesson: '02.2'
  subject: versa
  difficulty: 1
  question: What is Versa useful for?
  options:
    - Filing petitions online.
    - Paying court fees.
    - Searching District Court decisions by party name and date.
    - Reading English translations of landmark rulings.
  correct: 3
  explanation: >-
    Versa (Cardozo School of Law) translates key Supreme Court opinions; you quote the Hebrew
    original in filings.
- id: m02-027
  module: 2
  lesson: '02.2'
  subject: publication-bans
  difficulty: 2
  question: >-
    You want to post a photo you took inside a courtroom during a hearing about your protest. What
    does the Courts Law require?
  options:
    - The court's permission to photograph and publish.
    - Nothing, provided that the hearing was open to the public.
    - Only the consent of the other party.
    - Only blurring the judge's face.
  correct: 0
  explanation: >-
    Courts Law s. 70(ב)(1): no photography in a courtroom, or publication of such a photo, without
    the court's permission.
- id: m02-028
  module: 2
  lesson: '02.2'
  subject: publication-bans
  difficulty: 3
  question: >-
    A suspect in your case was questioned yesterday and has not been charged or brought before a
    judge. Can you publish their name on your campaign page?
  options:
    - Yes, because a police investigation is always a matter of public interest.
    - Not yet; s. 70(ד1) bars it for a time unless an exception applies.
    - Yes, if you add the word 'allegedly'.
    - Only after the police publish a press release.
  correct: 1
  explanation: >-
    Courts Law s. 70(ד1) bars publishing an uncharged suspect's name for 48 hours or until the first
    hearing, subject to listed exceptions.
- id: m02-029
  module: 2
  lesson: '02.3'
  subject: primary-secondary
  difficulty: 1
  question: Which of these is a primary legal source?
  options:
    - A Kol Zchut page on tenants' rights.
    - A law journal article criticising a ruling.
    - A regulation published in Kovetz HaTakanot.
    - A think-tank report on housing policy.
  correct: 2
  explanation: >-
    Laws, regulations and rulings are primary. Guides, articles and reports about them are
    secondary.
- id: m02-030
  module: 2
  lesson: '02.3'
  subject: primary-secondary
  difficulty: 1
  question: >-
    According to the Foundations of Law Act, where does a court turn first for an answer to a legal
    question?
  options:
    - Law journal articles by leading professors.
    - Kol Zchut and similar public guides.
    - Foreign courts' rulings.
    - Legislation, binding case law and analogy.
  correct: 3
  explanation: >-
    Section 1 lists legislation, binding precedent and analogy, then the principles of Jewish
    heritage. Secondary sources are not on the list.
- id: m02-031
  module: 2
  lesson: '02.3'
  subject: kol-zchut
  difficulty: 1
  question: On a Kol Zchut page, where do you usually find the laws and regulations the page is based on?
  options:
    - In the 'מקורות משפטיים ורשמיים' section near the bottom.
    - In the page's title and in its opening summary paragraph.
    - In the comments from readers.
    - In the donation box.
  correct: 0
  explanation: Kol Zchut pages end with a list of legal and official sources, linking to the primary texts.
- id: m02-032
  module: 2
  lesson: '02.3'
  subject: kol-zchut
  difficulty: 2
  question: >-
    A Kol Zchut page you rely on was last updated three years ago. What is the risk you most need to
    manage?
  options:
    - The page may be deleted before you finish reading.
    - Numbers and procedures may have changed since.
    - Older pages may not be quoted in letters.
    - The page may only exist in Hebrew.
  correct: 1
  explanation: >-
    Check the 'עודכן לאחרונה' date; verify any number, deadline or procedure against the current
    primary source.
- id: m02-033
  module: 2
  lesson: '02.3'
  subject: knesset-research
  difficulty: 1
  question: Who are Knesset Research and Information Center papers written for?
  options:
    - Members of Knesset and Knesset committees.
    - Judges deciding pending cases.
    - Lawyers preparing for the bar exam.
    - Government ministries' legal departments.
  correct: 0
  explanation: >-
    The center serves MKs and committees with research, data and comparative studies, independent of
    the ministries.
- id: m02-034
  module: 2
  lesson: '02.3'
  subject: knesset-research
  difficulty: 2
  question: >-
    A Knesset Research paper from 2019 says a certain ministry is responsible for your issue. How do
    you use this today?
  options:
    - Quote it as the legal basis in your letter.
    - Ignore it, since it is more than five years old.
    - Use it only if an MK sends it to you.
    - Check the current law to confirm who is responsible.
  correct: 3
  explanation: >-
    Research papers are dated; responsibilities can move. Use the paper to find the law, then verify
    the law as it stands.
- id: m02-035
  module: 2
  lesson: '02.3'
  subject: verification
  difficulty: 2
  question: Which statement from a secondary source must you always verify before using it in a letter?
  options:
    - A description of the history of the law.
    - A summary of a debate between scholars.
    - A deadline or fee that applies to your request.
    - A comparison with laws in other countries.
  correct: 2
  explanation: >-
    Numbers and deadlines change and carry real consequences; always check them against the primary
    source and Current Numbers.
- id: m02-036
  module: 2
  lesson: '02.3'
  subject: verification
  difficulty: 3
  question: >-
    A respected law-journal article states that a ruling 'established' a right you need. You open
    the ruling and the point is only a remark in passing. What do you do?
  options:
    - Quote the article, since the author is an expert.
    - Treat it as obiter and look for a later ruling that adopted it.
    - Drop the issue entirely.
    - Quote the remark as the holding, since the article supports you.
  correct: 1
  explanation: >-
    Secondary sources can overstate. Treat the remark as obiter and search for later rulings that
    made it a holding.
- id: m02-037
  module: 2
  lesson: '02.3'
  subject: viewpoints
  difficulty: 2
  question: >-
    Your issue involves a contested public debate. Which source mix gives you the most reliable
    picture?
  options:
    - Two opposing organisations' papers plus a Knesset Research paper.
    - Three detailed papers from the organisation whose view you support.
    - Only social-media posts by people affected.
    - Only the government's press releases.
  correct: 0
  explanation: >-
    Opposing papers reveal the counter-arguments; a Knesset Research paper adds neutral background.
    Then verify against primary sources.
- id: m02-038
  module: 2
  lesson: '02.3'
  subject: think-tanks
  difficulty: 2
  question: >-
    An NGO's position paper proposes a legal change and describes current law. How should you treat
    its description of current law?
  options:
    - As binding, since NGOs are expert in their field.
    - As irrelevant, since position papers are always wrong.
    - As accurate only if the NGO is registered as an amuta.
    - As a lead to check, since the paper argues one side.
  correct: 3
  explanation: >-
    Position papers are written to persuade. Their description of the law may be accurate, but check
    it against the primary sources.
- id: m02-039
  module: 2
  lesson: '02.3'
  subject: citation
  difficulty: 2
  question: In a letter, how may you properly use data from a Knesset Research paper?
  options:
    - As the legal basis for the authority's duty.
    - As background data, attributed to its source.
    - As a binding instruction to the ministry.
    - Only if you attach the whole paper.
  correct: 1
  explanation: >-
    Research data can support the facts, attributed to the Knesset Research and Information Center.
    The legal basis must be a law or ruling.
- id: m02-040
  module: 2
  lesson: '02.3'
  subject: source-map
  difficulty: 1
  question: What makes a source map useful months later?
  options:
    - A date on every source showing when it was checked.
    - Colour-coding by the author's political view.
    - Listing sources alphabetically by title.
    - Including only sources that support you.
  correct: 0
  explanation: Dates tell you which sources need re-checking; the course dates every check for that reason.
- id: m02-041
  module: 2
  lesson: '02.3'
  subject: ag-guidelines
  difficulty: 3
  question: >-
    A secondary source mentions an Attorney General guideline on your issue. Why is it worth finding
    and reading?
  options:
    - It binds the courts in exactly the same way as a Knesset statute.
    - It replaces the need to read the law.
    - Officials are expected to follow it, so it shapes decisions.
    - It can only be read by government lawyers.
  correct: 2
  explanation: >-
    Attorney General guidelines bind inside government. They are not statutes, but officials are
    expected to follow them.
- id: m02-042
  module: 2
  lesson: '02.4'
  subject: irac
  difficulty: 1
  question: In IRAC, what does the 'A' stand for?
  options:
    - 'Application: matching the facts to each element.'
    - 'Appeal: the next court you would go to.'
    - 'Authority: the body you are writing to.'
    - 'Argument: the emotional case for your cause.'
  correct: 0
  explanation: Issue, Rule, Application, Conclusion. The application is the longest part.
- id: m02-043
  module: 2
  lesson: '02.4'
  subject: irac
  difficulty: 2
  question: Which is the best-formed issue statement for an argument?
  options:
    - The municipality treats our neighbourhood badly.
    - Is the council's refusal to explain its decision lawful?
    - Many laws apply to this situation, including several Basic Laws.
    - We want a playground and the council should build one.
  correct: 1
  explanation: >-
    An issue is a single question the reader can answer. Complaints and wishes belong in the facts
    and conclusion.
- id: m02-044
  module: 2
  lesson: '02.4'
  subject: irac
  difficulty: 2
  question: In a letter to an official, why do Israeli practitioners usually put the facts before the law?
  options:
    - Because the law may only be quoted at the end.
    - Because officials are not allowed to read the law first.
    - Because the reader needs the facts for the law to make sense.
    - Because facts outrank law in administrative matters.
  correct: 2
  explanation: >-
    Facts first gives the reader the context; the quoted rule then lands on a situation they already
    understand.
- id: m02-045
  module: 2
  lesson: '02.4'
  subject: elements
  difficulty: 2
  question: >-
    Section 2(א) of the Decisions and Reasons Law applies when a public servant is asked in writing
    to use a legal power. Which situation does NOT meet the elements?
  options:
    - A letter to a municipal engineer asking to approve a sign.
    - An email to a ministry official asking for a licence.
    - A registered letter asking a regional council for a permit.
    - A request made aloud to the mayor at a public meeting.
  correct: 3
  explanation: >-
    The section requires a written request. A conversation, however public, does not start the 45
    days.
- id: m02-046
  module: 2
  lesson: '02.4'
  subject: elements
  difficulty: 2
  question: >-
    Your element table shows a fact for 'written request' but nothing in the 'proof' column. What is
    the best fix?
  options:
    - List the copy of the letter and the delivery confirmation.
    - Delete the element, since everyone knows a request was sent.
    - Write 'the authority knows' in the proof column.
    - Replace the fact with a stronger adjective.
  correct: 0
  explanation: >-
    Each fact needs proof the authority or court can see. A copy and a delivery receipt prove the
    written request.
- id: m02-047
  module: 2
  lesson: '02.4'
  subject: elements
  difficulty: 3
  question: >-
    Your rule has four elements. You can prove three, and the fourth is doubtful. What is the
    soundest strategy?
  options:
    - Argue the three strong elements and stay silent on the fourth.
    - 'Address the fourth openly: get proof, or add an alternative rule.'
    - Claim all four are proven to sound confident.
    - Wait until the authority raises the fourth element itself.
  correct: 1
  explanation: >-
    The authority will find the weak element. Address it directly, gather proof, or add an
    alternative argument that does not need it.
- id: m02-048
  module: 2
  lesson: '02.4'
  subject: counter-argument
  difficulty: 2
  question: What is the main purpose of an 'even if' (גם אם) paragraph?
  options:
    - To apologise in advance for possible mistakes.
    - To list unrelated complaints against the authority.
    - To show you win even if their best point is right.
    - To repeat your conclusion in stronger words.
  correct: 2
  explanation: >-
    An alternative argument shows you win even if the authority's point is accepted, closing its
    easy way out.
- id: m02-049
  module: 2
  lesson: '02.4'
  subject: counter-argument
  difficulty: 3
  question: >-
    A council will probably answer that it has no budget for your request. How do you prepare for
    this in your argument?
  options:
    - Ignore it, since budget is never relevant in administrative law.
    - Promise to raise the money yourselves.
    - Criticise the council's budget priorities at length.
    - Show the duty is mandatory, or that a cheaper step meets it.
  correct: 3
  explanation: >-
    Anticipate the likely answer: show that the law requires action, or that a lower-cost step
    satisfies the duty.
- id: m02-050
  module: 2
  lesson: '02.4'
  subject: conclusion
  difficulty: 1
  question: Which conclusion is easiest for an authority to act on?
  options:
    - Install a speed bump on HaZait Street by 1 March.
    - Please treat our residents fairly and equally.
    - We expect you to do the right thing for everyone.
    - Act according to all the laws that apply here.
  correct: 0
  explanation: >-
    A specific act with a date gives the authority something to approve, and makes a refusal or
    silence clear.
- id: m02-051
  module: 2
  lesson: '02.4'
  subject: authorities
  difficulty: 2
  question: How should you cite a ruling in your argument so a reader can check it quickly?
  options:
    - By the headline of the newspaper story that reported it.
    - By case number, parties and the relevant paragraph.
    - By the name of the judge alone.
    - By the year only.
  correct: 1
  explanation: >-
    Case number, parties and paragraph let the reader go straight to the holding in the free
    judgments search.
- id: m02-052
  module: 2
  lesson: '02.4'
  subject: decisions-and-reasons
  difficulty: 1
  question: >-
    Under s. 2א of the Decisions and Reasons Law, what must a public servant do when refusing a
    written request?
  options:
    - Offer a meeting with the minister.
    - Pay the requester's costs.
    - Give the reasons in writing.
    - Publish the refusal on its website.
  correct: 2
  explanation: Section 2א requires written reasons for a refusal; s. 3 lists narrow exceptions.
- id: m02-053
  module: 2
  lesson: '02.4'
  subject: decisions-and-reasons
  difficulty: 2
  question: >-
    Which of these is a listed exception that allows a public servant not to give reasons for a
    refusal?
  options:
    - The requester did not pay the processing fee.
    - The official is too busy.
    - The request was written in Arabic.
    - Giving reasons would harm state security.
  correct: 3
  explanation: >-
    Section 3(2) covers state security or foreign relations. Being busy, language or fees are not
    exceptions.
- id: m02-054
  module: 2
  lesson: '02.4'
  subject: decisions-and-reasons
  difficulty: 3
  question: >-
    An authority refused without reasons, citing one of the s. 3 exceptions. What does s. 4 let you
    do?
  options:
    - Appeal (ערר) to the responsible minister within 30 days.
    - Nothing; an exception ends the matter.
    - Go directly to the Supreme Court without any letter.
    - Demand compensation from the official personally.
  correct: 0
  explanation: >-
    Section 4: the official must tell you which exception applies, and you may appeal to the
    responsible minister within 30 days of the notice.
- id: m02-055
  module: 2
  lesson: '02.4'
  subject: style
  difficulty: 1
  question: Which sentence belongs in a legal argument?
  options:
    - This scandalous decision shocks every decent person.
    - The decision was made on 3 May without a hearing.
    - Everyone knows the council hates our neighbourhood.
    - This is the worst decision in the city's history.
  correct: 1
  explanation: Facts with proof persuade; adjectives and accusations invite a defensive reply.
- id: m02-056
  module: 2
  lesson: '02.5'
  subject: addressee
  difficulty: 1
  question: To whom should a formal request to use a legal power usually be addressed?
  options:
    - The official who holds the power, copying the legal adviser.
    - The authority's general information inbox.
    - The newspaper that covers the authority.
    - The most senior elected politician you can find at that authority.
  correct: 0
  explanation: >-
    Write to the post the law names; the legal adviser's copy helps the request get proper legal
    attention.
- id: m02-057
  module: 2
  lesson: '02.5'
  subject: addressee
  difficulty: 2
  question: >-
    The law gives a power to 'the district planning officer', but you only know the ministry's
    general address. What do you do first?
  options:
    - Send it to the general address, without naming any official.
    - Find the post holder's name and address, and write to them.
    - Send it to the Prime Minister's office.
    - Phone the ministry instead of writing.
  correct: 1
  explanation: A letter to the named post holder starts the deadline sooner and is harder to lose.
- id: m02-058
  module: 2
  lesson: '02.5'
  subject: letter-structure
  difficulty: 1
  question: What is the 'הנדון' line in a Hebrew formal letter?
  options:
    - The closing greeting before the signature.
    - The list of attachments.
    - The one-line subject of the letter.
    - The copy list at the bottom.
  correct: 2
  explanation: הנדון is the subject line; it should say in one line what you want.
- id: m02-059
  module: 2
  lesson: '02.5'
  subject: letter-structure
  difficulty: 1
  question: What does 'בלי לפגוע בזכויות' at the top of a letter signal?
  options:
    - That the letter is confidential.
    - That the writer is a lawyer.
    - That the letter is the final demand before going to court.
    - That the writer keeps all other rights and claims.
  correct: 3
  explanation: 'It means ''without prejudice to rights'': nothing in the letter waives other claims.'
- id: m02-060
  module: 2
  lesson: '02.5'
  subject: letter-structure
  difficulty: 2
  question: >-
    Your letter mentions 'the attached photos' but the attachments are not numbered or listed. Why
    does this matter?
  options:
    - Later, nobody can tell which photo the letter relied on.
    - Photos may not be attached to letters to authorities.
    - Unnumbered attachments make the whole letter void.
    - The authority must return unnumbered attachments.
  correct: 0
  explanation: Numbered, listed attachments (נספחים) become clear exhibits in any later complaint or petition.
- id: m02-061
  module: 2
  lesson: '02.5'
  subject: proof-of-receipt
  difficulty: 2
  question: Which is the strongest proof that a council received your letter on a specific date?
  options:
    - A note in your diary that you posted it.
    - A signed registered-mail delivery confirmation.
    - A friend who saw you post it.
    - A screenshot of the draft in your word processor.
  correct: 1
  explanation: The deadline runs from receipt; a signed delivery card shows the authority received it and when.
- id: m02-062
  module: 2
  lesson: '02.5'
  subject: proof-of-receipt
  difficulty: 2
  question: You hand-deliver a letter to a ministry office. What should you ask for?
  options:
    - A receipt for parking.
    - The clerk's personal phone number.
    - A copy stamped with the date received.
    - A meeting with the minister on the spot.
  correct: 2
  explanation: A stamped 'נתקבל' copy with the date is proof of receipt.
- id: m02-063
  module: 2
  lesson: '02.5'
  subject: deadlines
  difficulty: 2
  question: >-
    A request was received on 20 May. Using the Interpretation Law, on what date do three months
    end?
  options:
    - 19 August.
    - 18 August.
    - 21 August.
    - 20 August.
  correct: 3
  explanation: >-
    A period in months ends on the same-numbered day of the last month (s. 10(ב)), so three months
    from 20 May end on 20 August.
- id: m02-064
  module: 2
  lesson: '02.5'
  subject: deadlines
  difficulty: 3
  question: The 45th day for an answer falls on a Saturday. What does the Interpretation Law say?
  options:
    - A period ending on a rest day runs to the next day.
    - The deadline moves back to the Thursday before.
    - Saturdays never count in any period at all.
    - The authority gets an extra week to answer.
  correct: 0
  explanation: >-
    Section 10(ג): rest days count, unless they are the last days of the period; then the period
    ends on the next working day.
- id: m02-065
  module: 2
  lesson: '02.5'
  subject: deadlines
  difficulty: 2
  question: When does s. 2 of the Decisions and Reasons Law NOT give the authority 45 days?
  options:
    - When the requester is a company.
    - When another law sets a different deadline.
    - When the request is longer than two pages.
    - When the request is sent by email.
  correct: 1
  explanation: 'Section 2(ב)(2): if another law sets another deadline, that deadline applies.'
- id: m02-066
  module: 2
  lesson: '02.5'
  subject: deemed-refusal
  difficulty: 2
  question: Why does it matter that silence for three months counts as a refusal under s. 6(ב)?
  options:
    - It gives you a decision you can challenge.
    - It means the authority must pay you compensation.
    - It means your request is automatically approved.
    - It cancels your right to apply again.
  correct: 0
  explanation: >-
    A deemed refusal lets you move to the next step (complaint, appeal or petition) instead of
    waiting indefinitely.
- id: m02-067
  module: 2
  lesson: '02.5'
  subject: choosing-the-tool
  difficulty: 2
  question: >-
    You want copies of the council's internal reports about a dangerous junction. Which tool fits
    best?
  options:
    - A general letter asking the council to act.
    - An affidavit describing the junction.
    - A Freedom of Information request.
    - A small claims suit.
  correct: 2
  explanation: >-
    Information held by a public authority is requested under the Freedom of Information Law (lesson
    05.2).
- id: m02-068
  module: 2
  lesson: '02.5'
  subject: tone
  difficulty: 1
  question: What tone works best in a first letter to an authority?
  options:
    - Angry, to show how serious you are.
    - Informal and chatty, to build rapport.
    - Threatening, naming the court you will go to.
    - Polite, factual and short.
  correct: 3
  explanation: >-
    Officials respond best to letters that make it easy to say yes. Save firmer language for the
    follow-up demand.
- id: m02-069
  module: 2
  lesson: '02.5'
  subject: spot-the-mistake
  difficulty: 3
  question: >-
    Spot the main mistake: 'To the municipality. We ask you to deal with the noise. Please reply.
    Thanks, residents.' (sent by email to info@)
  options:
    - It is far too short to be taken seriously by any official.
    - No addressee, facts, law, specific request or signatory.
    - It should have been written in English.
    - It thanks the municipality, which weakens it.
  correct: 1
  explanation: >-
    The letter lacks every element that starts a deadline and makes a refusal challengeable: the
    right official, facts, law, a specific request and a named writer.
- id: m02-070
  module: 2
  lesson: '02.5'
  subject: acting-for-others
  difficulty: 3
  question: >-
    Your residents' committee wants to send a letter in the committee's name. You are a member and
    will write it, unpaid. Is this within the limits the course teaches?
  options:
    - Yes; helping your own group act in its own name is fine.
    - No; only a lawyer may write any letter for a group.
    - Yes, but only if you sign it as 'legal adviser'.
    - No; committees may not write to authorities.
  correct: 0
  explanation: >-
    Bar Association Law s. 20 targets acting for others as an occupation or for payment. A member
    writing for their own group, in its name, is fine.
- id: m02-071
  module: 2
  lesson: '02.6'
  subject: affidavit-basics
  difficulty: 1
  question: What makes a written statement an affidavit under the Evidence Ordinance?
  options:
    - It is printed on official paper.
    - It is longer than one page.
    - An authorised person gave the warning and certified it.
    - It was drafted, printed and stamped by a licensed lawyer.
  correct: 2
  explanation: >-
    Section 15: the warning to tell the truth and of the penalties, given and certified by an
    authorised person.
- id: m02-072
  module: 2
  lesson: '02.6'
  subject: certification
  difficulty: 1
  question: Which of these may certify an affidavit under s. 15(ב) of the Evidence Ordinance?
  options:
    - A police investigator.
    - A school principal.
    - A certified public accountant.
    - The head of a local authority.
  correct: 3
  explanation: >-
    Section 15(ב)(5) lists the head of a local authority, alongside judges, religious-court judges,
    lawyers and others.
- id: m02-073
  module: 2
  lesson: '02.6'
  subject: certification
  difficulty: 2
  question: Can a lawyer certify your affidavit by video call?
  options:
    - Yes, if Bar conditions such as digital ID and a recording are met.
    - No, never; you must always meet in person.
    - Yes, by any video-calling app you like, without any other conditions.
    - Only if the lawyer is also a notary.
  correct: 0
  explanation: >-
    Bar ethics decisions, made permanent in 2021, allow video certification under strict conditions
    (Kol Zchut summarises them).
- id: m02-074
  module: 2
  lesson: '02.6'
  subject: affidavit-cost
  difficulty: 2
  question: Which statement about the cost of certifying an affidavit in 2026 is accurate?
  options:
    - All lawyers must charge exactly ₪512 for every affidavit.
    - Notary fees are regulated; lawyers' fees are not, so ask.
    - Certification is always free for activists.
    - Only notaries may charge for certification.
  correct: 1
  explanation: >-
    Notary fees are regulated (about ₪200 plus VAT for the first declarant); the Bar's ₪512 is only
    a recommended minimum for drafting and certifying.
- id: m02-075
  module: 2
  lesson: '02.6'
  subject: affidavit-cost
  difficulty: 2
  question: >-
    You need an affidavit certified only for an Israeli administrative court. Why is a notary
    usually unnecessary?
  options:
    - Notaries may not certify affidavits for Israeli courts.
    - Notaries charge less than lawyers, which courts dislike.
    - Any lawyer may certify it; notaries mainly serve use abroad.
    - Courts require a judge to certify every affidavit.
  correct: 2
  explanation: >-
    A lawyer's certification is enough for Israeli courts; notarial services matter mostly for
    documents used abroad.
- id: m02-076
  module: 2
  lesson: '02.6'
  subject: affidavit-form
  difficulty: 1
  question: In civil courts, how must an affidavit be written according to reg. 178(א)?
  options:
    - In the third person, as one long paragraph.
    - In English, followed by a short Hebrew summary.
    - As questions and answers.
    - In the first person, in numbered paragraphs.
  correct: 3
  explanation: >-
    Regulation 178(א): first person, divided into paragraphs, with facts the declarant can testify
    to from personal knowledge.
- id: m02-077
  module: 2
  lesson: '02.6'
  subject: affidavit-form
  difficulty: 2
  question: What personal details does the Evidence Ordinance's Second Schedule require in an affidavit?
  options:
    - Full name, occupation and address.
    - Full name, bank account and phone number.
    - Full name and political affiliation.
    - Only an ID number.
  correct: 0
  explanation: 'Item 2 of the Second Schedule: the declarant''s full name, occupation and address.'
- id: m02-078
  module: 2
  lesson: '02.6'
  subject: affidavit-form
  difficulty: 2
  question: >-
    In an affidavit supporting a civil pleading you want to state something you believe but did not
    see. What does reg. 178(א) require?
  options:
    - Nothing extra; any belief may be stated.
    - You must state the source of your belief.
    - You must get a second declarant to confirm it.
    - You must write it in a separate document.
  correct: 1
  explanation: >-
    Beliefs are allowed in an affidavit attached to a pleading only if you state the source of the
    belief or knowledge.
- id: m02-079
  module: 2
  lesson: '02.6'
  subject: corrections
  difficulty: 2
  question: You spot a typo while sitting with the lawyer, before signing. What is the correct procedure?
  options:
    - Sign first and fix it later at home.
    - Ignore it; typos never matter.
    - Correct it before signing; the certifier initials it.
    - Start a new affidavit at a different lawyer's office.
  correct: 2
  explanation: >-
    The Second Schedule (item 4) requires corrections made before swearing to be initialled by the
    certifier in the margin.
- id: m02-080
  module: 2
  lesson: '02.6'
  subject: false-affidavit
  difficulty: 1
  question: What is the maximum penalty for knowingly making a false affidavit under the Penal Law?
  options:
    - A warning letter only.
    - A fine of ₪500.
    - One month's community service.
    - Three years' imprisonment.
  correct: 3
  explanation: Penal Law s. 239 provides three years' imprisonment for knowingly giving a false affidavit.
- id: m02-081
  module: 2
  lesson: '02.6'
  subject: cross-examination
  difficulty: 2
  question: >-
    The other side asks to cross-examine you on your affidavit, and you do not come to court. What
    may happen?
  options:
    - The court may refuse to treat it as evidence.
    - Nothing; affidavits stand on their own.
    - The court must postpone the hearing indefinitely.
    - Your affidavit automatically becomes stronger.
  correct: 0
  explanation: >-
    Evidence Ordinance s. 17(א): the court may disqualify the affidavit if the declarant does not
    appear for examination.
- id: m02-082
  module: 2
  lesson: '02.6'
  subject: spot-the-mistake
  difficulty: 3
  question: >-
    Spot the main problem in this affidavit paragraph: '5. The council acted with obvious malice and
    broke every rule of fair procedure.'
  options:
    - It should be written in the third person.
    - It states opinions and conclusions, not facts.
    - It is too short for an affidavit paragraph.
    - It names the council instead of an official.
  correct: 1
  explanation: >-
    An affidavit proves facts. Opinions and legal conclusions belong in the petition; here they
    weaken credibility and invite cross-examination.
- id: m02-083
  module: 2
  lesson: '02.6'
  subject: group-evidence
  difficulty: 3
  question: >-
    Five members of your group witnessed the same event. What is the best way to present their
    evidence?
  options:
    - One affidavit signed by all five, written by one member.
    - One affidavit by the chair summarising what others said.
    - Each witness gives a separate affidavit in their own words.
    - A joint letter from the group, without any affidavits.
  correct: 2
  explanation: >-
    Each witness's personal knowledge goes in their own affidavit; a summary of others' accounts is
    hearsay.
- id: m02-084
  module: 2
  lesson: '02.6'
  subject: acting-for-others
  difficulty: 3
  question: >-
    An elderly neighbour asks you to write her affidavit for a court case, and offers to pay. What
    do you do?
  options:
    - Write it and accept the payment, since she will be the one signing it.
    - Write it in your own name as her representative.
    - Write it for free but sign it as her witness.
    - Decline payment; explain the structure or refer her to a clinic.
  correct: 3
  explanation: >-
    Drafting legal documents for another person for payment is reserved to lawyers (Bar Association
    Law s. 20). Explaining general structure is fine.
- id: m04-001
  module: 4
  lesson: '04.1'
  subject: legality
  difficulty: 1
  question: What does the principle of administrative legality (עקרון חוקיות המינהל) say?
  options:
    - An authority may do anything that no law forbids it to do.
    - An authority may act only under a power given to it by law.
    - An authority may act freely unless a court has ruled otherwise.
    - An authority may act only after a public consultation.
  correct: 1
  explanation: >-
    For private persons, what is not forbidden is allowed. For public authorities it is the reverse:
    they need a power from law for every act.
- id: m04-002
  module: 4
  lesson: '04.1'
  subject: legality
  difficulty: 1
  question: Which of these, on its own, can be the source of a public authority's power?
  options:
    - An internal procedure published on the ministry's website.
    - A long-standing practice that nobody has challenged.
    - A section in a statute, or in regulations made under one.
    - A minister's public statement announcing a new policy.
  correct: 2
  explanation: >-
    Procedures, practices and statements may guide how a power is used, but the power itself must
    come from a statute or from secondary legislation made under it.
- id: m04-003
  module: 4
  lesson: '04.1'
  subject: express-authority
  difficulty: 1
  question: 'Under Basic Law: Human Dignity and Liberty s. 8, how may an authority limit a basic right?'
  options:
    - Only under a statute, or by express authorisation in a statute, for a proper purpose.
    - Whenever the authority's legal adviser approves the limit in writing.
    - Whenever the public interest outweighs the right in the authority's view.
    - Only after the Knesset committee responsible for the area approves the limit.
  correct: 0
  explanation: >-
    Section 8 allows limits "בחוק" or "לפי חוק כאמור מכוח הסמכה מפורשת בו", for a proper purpose and
    no more than necessary.
- id: m04-004
  module: 4
  lesson: '04.1'
  subject: residual-power
  difficulty: 2
  question: 'Who holds the residual power in Basic Law: The Government s. 32?'
  options:
    - Every public authority, including local councils.
    - Each minister, separately, in the area of their ministry.
    - The Prime Minister personally, for urgent matters.
    - The government as a body, subject to any law.
  correct: 3
  explanation: >-
    Section 32 gives the government the power to act for the state where no law assigns the matter
    to another authority, "בכפוף לכל דין". Local councils have no residual power.
- id: m04-005
  module: 4
  lesson: '04.1'
  subject: residual-power
  difficulty: 2
  question: >-
    A municipality says it may run a new "neighbourhood patrol permit" scheme because it has
    "residual powers like the government". What is wrong with this claim?
  options:
    - Nothing, because every public body shares the government's residual power.
    - Residual powers apply only in wartime, under a declared state of emergency.
    - Local authorities act only under their ordinances, other laws and by-laws.
    - Residual powers exist, but only the Interior Minister may use them for councils.
  correct: 2
  explanation: >-
    Section 32 belongs to the government. A municipality must point to a specific power in the
    Municipalities Ordinance, another law or a by-law.
- id: m04-006
  module: 4
  lesson: '04.1'
  subject: ancillary-powers
  difficulty: 2
  question: >-
    A law empowers a regulator to license food stalls. The regulator sets a procedure for how
    inspections are scheduled. Which provision supports this?
  options:
    - Interpretation Law s. 17, which includes ancillary powers reasonably needed to use a power.
    - 'Basic Law: The State Economy s. 1, which allows fees and procedures together.'
    - 'Basic Law: The Government s. 33, which lets officials create new powers.'
    - 'Basic Law: Human Dignity and Liberty s. 11, which applies to all authorities.'
  correct: 0
  explanation: >-
    Section 17(א)–(ב) of the Interpretation Law lets a power-holder set working procedures and use
    ancillary powers reasonably needed — not create new, independent powers.
- id: m04-007
  module: 4
  lesson: '04.1'
  subject: ancillary-powers
  difficulty: 3
  question: >-
    The same food-stall regulator now announces that stall owners must pay a yearly "inspection
    contribution" and argues this is an ancillary power. Is it?
  options:
    - Yes, because inspections cost money and paying for them is reasonably needed.
    - Yes, as long as the amount is published on the regulator's website in advance.
    - No, unless the regulator first holds a hearing for every stall owner.
    - No, because a compulsory payment needs a basis in a statute or under one.
  correct: 3
  explanation: >-
    Ancillary powers fill small gaps. A compulsory payment is a separate matter that needs a basis
    "בחוק או על פיו" (Basic Law: The State Economy s. 1).
- id: m04-008
  module: 4
  lesson: '04.1'
  subject: delegation
  difficulty: 1
  question: >-
    Under Basic Law: The Government s. 33(ב), which power may a minister NOT delegate to a public
    servant?
  options:
    - The power to grant individual permits under a law.
    - The power to make regulations.
    - The power to decide on individual applications.
    - The power to approve a budget line already set by law.
  correct: 1
  explanation: >-
    Section 33(ב) lets a minister delegate statutory powers to a public servant, "למעט סמכות להתקין
    תקנות".
- id: m04-009
  module: 4
  lesson: '04.1'
  subject: delegation
  difficulty: 2
  question: >-
    A permit refusal is signed by a deputy director. The law gives the power to "המנהל". What is the
    most efficient way to test whether the deputy had authority?
  options:
    - Assume no authority and file a petition, since only the director may sign.
    - Ask the deputy director to confirm orally that he is allowed to sign.
    - Ask in writing for the delegation document and the section that permits delegation.
    - Search news reports for earlier decisions the deputy director signed.
  correct: 2
  explanation: >-
    Delegation must be lawful and is usually in a written document. Asking for it in writing tests
    the point cheaply and creates a record.
- id: m04-010
  module: 4
  lesson: '04.1'
  subject: legality
  difficulty: 2
  question: >-
    Spot the mistake in this sentence from a resident's letter: "Your decision is unlawful because
    it is unwise and I disagree with it; please cancel it."
  options:
    - It should be written in English, since letters to authorities are bilingual.
    - 'It names no legal flaw: no missing power, no improper consideration, no procedural defect.'
    - It asks the authority itself for cancellation, which only a court may order after a petition.
    - It should be addressed to the court rather than to the authority.
  correct: 1
  explanation: >-
    Disagreement is not a legal ground. A strong letter names a specific flaw, starting with the
    question of authority.
- id: m04-011
  module: 4
  lesson: '04.1'
  subject: primary-arrangements
  difficulty: 3
  question: >-
    A ministry sets, by an internal guideline, a sweeping national rule on who is exempt from a
    civic duty — a deeply contested social question. Which argument fits best?
  options:
    - The guideline is valid as long as the ministry consulted the public first.
    - The guideline is a primary arrangement that the Knesset itself should make by law.
    - The guideline is valid because ministry guidelines rank above regulations in the hierarchy.
    - The guideline can only be challenged if it imposes a fee.
  correct: 1
  explanation: >-
    Courts hold that basic policy choices on contested matters ("הסדרים ראשוניים") must be made by
    the Knesset, not left to officials — as in the yeshiva-deferral line of cases after Ressler.
- id: m04-012
  module: 4
  lesson: '04.1'
  subject: legality
  difficulty: 3
  question: >-
    A council's by-law allows it to "regulate street trading". The council bans all street trading
    citywide. A trader asks which point to raise first.
  options:
    - That the ban had no hearing, because hearings come before authority questions.
    - That the ban is unreasonable, because traders' livelihoods matter.
    - That the council must answer within 45 days of the trader's complaint.
    - That a power to regulate may not cover a total ban, which also limits a right.
  correct: 3
  explanation: >-
    Whether the power covers the act comes first. A power to regulate is not automatically a power
    to ban, and a total ban limits freedom of occupation, which needs clear authority.
- id: m04-013
  module: 4
  lesson: '04.1'
  subject: key-terms
  difficulty: 1
  question: What does "חריגה מסמכות" mean?
  options:
    - Acting beyond the power the law gives (ultra vires).
    - Refusing to use a power that one lawfully holds.
    - Delegating a power to another official without approval.
    - Using a power slowly, after a deadline.
  correct: 0
  explanation: Chariga mismchut is acting outside one's legal power — the core legality flaw.
- id: m04-014
  module: 4
  lesson: '04.1'
  subject: legality
  difficulty: 2
  question: What does a court usually do with a decision made without authority?
  options:
    - Leaves it in place but orders the authority to apologise and pay costs.
    - Declares it void or cancels it, often sending the matter back to the right body.
    - Approves it anyway if the result turned out to be good for the public as a whole.
    - Refers the decision-maker to the police for a criminal investigation.
  correct: 1
  explanation: >-
    An act without power is defective at the root. Courts cancel it and often let the competent body
    decide again lawfully; they may limit remedies such as refunds.
- id: m04-015
  module: 4
  lesson: '04.1'
  subject: express-authority
  difficulty: 3
  question: >-
    A ministry asks protest organisers to sign an undertaking not to criticise named officials as a
    condition of a permit. No law mentions such undertakings. What is the strongest objection?
  options:
    - The condition is too vague for the organisers to know what is required.
    - The ministry should have asked for the undertaking after the protest.
    - The condition limits expression, which needs express authority in a statute.
    - The organisers were not given 45 days to consider the condition.
  correct: 2
  explanation: >-
    A permit condition that limits a basic right needs express statutory authority (Basic Law s. 8).
    Without it, the condition is outside the power.
- id: m04-016
  module: 4
  lesson: '04.1'
  subject: legality
  difficulty: 2
  question: Which question should come FIRST when you audit an administrative decision?
  options:
    - Was the result the best one available?
    - Did the decision-maker give enough weight to all of my arguments?
    - Was I treated the same as my neighbours?
    - Which section of law gave this body the power to decide this?
  correct: 3
  explanation: >-
    Authority comes first: without a power, nothing else matters, and it is the ground courts are
    most comfortable applying.
- id: m04-017
  module: 4
  lesson: '04.2'
  subject: considerations-purpose
  difficulty: 1
  question: According to Ressler, what decides whether a consideration is relevant?
  options:
    - The personal views of the official who holds the power.
    - The purpose of the enabling law, judged objectively.
    - The number of residents who support the consideration.
    - Whether the consideration appears in the decision letter.
  correct: 1
  explanation: >-
    Barak J.: "The test of their relevance is objective", set by the law's purpose (Ressler, para.
    64).
- id: m04-018
  module: 4
  lesson: '04.2'
  subject: considerations-purpose
  difficulty: 1
  question: Which source is usually the BEST guide to a law's purpose when its text is unclear?
  options:
    - A news article describing the debate about the law's passage.
    - The explanatory notes to the bill (דברי הסבר) on the Knesset database.
    - The official's own explanation of the law in the decision letter.
    - A social media post by the minister responsible.
  correct: 1
  explanation: >-
    After the text, structure and any purpose clause, the explanatory notes to the bill are a
    primary guide to purpose; officials' later explanations are not.
- id: m04-019
  module: 4
  lesson: '04.2'
  subject: extraneous-considerations
  difficulty: 1
  question: What is a "שיקול זר"?
  options:
    - A consideration raised by a foreign government or an international body.
    - A consideration the authority used but forgot to write down in its decision.
    - A consideration outside the purpose of the law, such as personal or political interest.
    - A consideration raised late in the process, after the applicant had already been heard.
  correct: 2
  explanation: >-
    An extraneous consideration is one the law's purpose does not make relevant — personal,
    political or other improper motives.
- id: m04-020
  module: 4
  lesson: '04.2'
  subject: extraneous-considerations
  difficulty: 2
  question: >-
    A regional council delays a building permit for a settlement's synagogue after the community's
    rabbi criticised the council head. The engineer's file shows no technical problem. Which flaw
    should the community investigate?
  options:
    - 'An extraneous consideration: retaliation for criticism.'
    - 'Lack of authority: councils cannot approve religious buildings.'
    - 'Fettering: the council follows a strict policy on synagogues.'
    - 'Mootness: the community can build elsewhere.'
  correct: 0
  explanation: >-
    Delay after criticism, with no technical reason on file, suggests retaliation — an extraneous
    consideration. The community should request reasons and the file to prove it.
- id: m04-021
  module: 4
  lesson: '04.2'
  subject: evidence-of-motive
  difficulty: 2
  question: >-
    Which piece of evidence is usually the most persuasive that an extraneous consideration was
    used?
  options:
    - An anonymous post claiming the decision was political.
    - Your own belief, stated in an affidavit, that the official dislikes you.
    - A general news report that the authority is politicised.
    - The committee minutes recording the reason discussed before the vote.
  correct: 3
  explanation: >-
    Minutes are official records of what was actually considered. They are far stronger than
    suspicion, rumours or general reporting.
- id: m04-022
  module: 4
  lesson: '04.2'
  subject: discrimination
  difficulty: 2
  question: >-
    A municipality funds after-school programmes in Jewish neighbourhoods but refuses the same
    programme in an Arab neighbourhood with similar needs, giving no reason. Which ground fits?
  options:
    - Fettering, because the municipality follows its budget too closely.
    - Dictation, because the budget was set by the finance department.
    - 'Discrimination: unequal treatment of like cases for no relevant reason.'
    - Lack of standing, because funding decisions cannot be challenged.
  correct: 2
  explanation: >-
    Equality is a consideration every authority must respect. Treating similar cases differently for
    an irrelevant reason is discrimination, an extraneous-consideration flaw.
- id: m04-023
  module: 4
  lesson: '04.2'
  subject: fettering
  difficulty: 2
  question: >-
    A ministry's policy says applications for an accessibility grant are "never accepted after 30
    June". A disabled applicant was hospitalised all of June. What is the best argument?
  options:
    - The policy itself is void, because ministries may not set dates.
    - The ministry must consider an exception, since a rigid rule fetters discretion.
    - The applicant had no standing, so the policy cannot be challenged.
    - The ministry must hold a public hearing on every grant policy.
  correct: 1
  explanation: >-
    Deadlines and policies are lawful, but the authority must stay willing to consider exceptional
    cases. A rule applied with no exceptions at all is fettering.
- id: m04-024
  module: 4
  lesson: '04.2'
  subject: dictation
  difficulty: 2
  question: >-
    A licensing officer refuses a licence and writes: "The mayor instructed me to refuse." The law
    gives the power to the licensing officer. What flaw does this reveal?
  options:
    - 'Dictation: the officer did not use his own discretion.'
    - 'Lack of authority: the mayor holds all municipal powers.'
    - 'Delay: the officer waited for the mayor''s instruction.'
    - None, since following a superior's instruction is lawful.
  correct: 0
  explanation: >-
    The holder of the power must decide. Following another person's instruction without independent
    judgment is acting under dictation.
- id: m04-025
  module: 4
  lesson: '04.2'
  subject: considerations-purpose
  difficulty: 3
  question: >-
    A law on nature reserves lets the authority close trails "for the protection of nature". It
    closes a trail to stop a planned protest walk by an environmental group. Assess the closure.
  options:
    - Lawful, because the authority holds the power to close trails for any reason.
    - Lawful, because protests are not a protected use of nature reserves.
    - Unlawful only if the group applied for a permit at least 45 days ahead.
    - Likely unlawful, because stopping a protest is not the purpose of the power.
  correct: 3
  explanation: >-
    The power exists for protecting nature. Using it to stop a protest serves a purpose the law does
    not give — an extraneous consideration, unless a real nature-protection reason applies.
- id: m04-026
  module: 4
  lesson: '04.2'
  subject: mixed-motives
  difficulty: 3
  question: >-
    A refusal cites a real parking problem and, in the minutes, the council's dislike of the
    applicant's views. The parking problem was minor and had been ignored for other applicants. How
    should your audit present this?
  options:
    - Ignore the views point, since a relevant reason exists.
    - Show the extraneous consideration was decisive, using the minutes and the comparison.
    - Argue only that parking is never a relevant consideration.
    - >-
      Argue that any mention of the applicant's views in the minutes voids the decision
      automatically.
  correct: 1
  explanation: >-
    With mixed motives, courts ask whether the extraneous consideration was decisive. The comparison
    with other applicants shows the minor relevant reason would not have produced the refusal alone.
- id: m04-027
  module: 4
  lesson: '04.2'
  subject: key-terms
  difficulty: 1
  question: What does "חזקת התקינות" mean for an activist challenging a decision?
  options:
    - The decision is presumed lawful, so the challenger must show the flaw.
    - The decision is presumed unlawful until the authority proves otherwise.
    - The authority must re-examine any decision when asked.
    - The court must hold a hearing before deciding any petition.
  correct: 0
  explanation: >-
    The presumption of regularity places the initial burden on the challenger, which is why evidence
    matters so much.
- id: m04-028
  module: 4
  lesson: '04.2'
  subject: extraneous-considerations
  difficulty: 2
  question: >-
    A ministry conditions a cultural grant on the theatre staging "at least one play supporting
    government policy". The grant law aims to support artistic quality. Classify the condition.
  options:
    - A relevant consideration, because public funds may serve government policy.
    - A procedural flaw, because the theatre had no hearing on the condition.
    - An extraneous consideration, outside the law's purpose of artistic quality.
    - A lawful policy, since every grant may carry conditions.
  correct: 2
  explanation: >-
    Conditions must serve the law's purpose. Requiring political content in a law aimed at artistic
    quality is an extraneous consideration — whichever government is in power.
- id: m04-029
  module: 4
  lesson: '04.2'
  subject: considerations-missing
  difficulty: 2
  question: >-
    A ministry closes a rural clinic to save money and never considers the travel distance for
    elderly patients, which the health law makes central. Which flaw is this?
  options:
    - Lack of authority, because only the Knesset may close clinics.
    - Dictation, because the finance ministry asked for savings.
    - Conflict of interest, because the ministry benefits from the savings.
    - Failure to consider a relevant consideration the law requires.
  correct: 3
  explanation: >-
    Ignoring a consideration the law makes central is as much a flaw as weighing an extraneous one,
    and it leads naturally into reasonableness (weight).
- id: m04-030
  module: 4
  lesson: '04.2'
  subject: evidence-of-motive
  difficulty: 3
  question: >-
    You have strong suspicion but no documents that a decision was political. You will need the
    minutes and internal emails. Which tool fits best before any court step?
  options:
    - A Freedom of Information request for the minutes and correspondence.
    - A defamation warning letter sent to the decision-maker personally.
    - A complaint to the police for breach of trust.
    - An immediate High Court petition asking the court to order discovery.
  correct: 0
  explanation: >-
    FOI (lesson 05.2) is the standard way to obtain minutes and documents. Courts expect evidence,
    and accusations without it carry legal risk.
- id: m04-031
  module: 4
  lesson: '04.2'
  subject: extraneous-considerations
  difficulty: 1
  question: >-
    Which of these is an extraneous consideration for a municipal official deciding a building
    permit?
  options:
    - Compliance with the approved plan.
    - Fire-safety requirements.
    - The applicant's vote in the last local election.
    - The building's impact on neighbours' light and access.
  correct: 2
  explanation: >-
    How the applicant voted has nothing to do with the purposes of planning law. The other three are
    standard planning considerations.
- id: m04-032
  module: 4
  lesson: '04.2'
  subject: fettering
  difficulty: 3
  question: >-
    Spot the mistake in this protest group's letter: "Your policy of limiting demonstrations near
    hospitals is unlawful because authorities may not have policies."
  options:
    - The letter should cite the 45-day deadline for answering.
    - Policies are lawful; the argument should be that the policy left no room for this case.
    - >-
      The letter should be sent to the Knesset, which approves all police policies on
      demonstrations.
    - The letter should have asked for a hearing on the policy itself.
  correct: 1
  explanation: >-
    Authorities may adopt policies to guide discretion. The flaw is a policy applied rigidly, with
    no willingness to consider exceptions.
- id: m04-033
  module: 4
  lesson: '04.3'
  subject: reasonableness
  difficulty: 1
  question: In Israeli administrative law, what is the core of the reasonableness ground?
  options:
    - Whether the decision is the one the judge would have made.
    - Whether the decision followed a written procedure.
    - Whether proper weight was given to the relevant considerations.
    - Whether the decision was popular with the public.
  correct: 2
  explanation: >-
    Reasonableness is about balance: the weight given to relevant considerations. Ressler (para. 67)
    speaks of "allowing appropriate weight to the various factors".
- id: m04-034
  module: 4
  lesson: '04.3'
  subject: reasonableness
  difficulty: 1
  question: What is "מתחם הסבירות"?
  options:
    - The range of reasonable decisions within which the court does not intervene.
    - The geographic area in which a local authority may lawfully act.
    - The period during which a decision may still be challenged in an administrative court.
    - The list of considerations written into the enabling law itself.
  correct: 0
  explanation: >-
    Several decisions can be reasonable. The court intervenes only when a decision falls outside
    that range.
- id: m04-035
  module: 4
  lesson: '04.3'
  subject: reasonableness-status
  difficulty: 1
  question: On what date did the High Court annul the 2023 reasonableness amendment?
  options:
    - 24 July 2023.
    - 12 September 2023.
    - 27 March 2025.
    - 1 January 2024.
  correct: 3
  explanation: >-
    HCJ 5658/23 was decided on 1.1.2024. 24.7.2023 is when the amendment passed; 12.9.2023 the
    hearing; 27.3.2025 the judicial selection amendment.
- id: m04-036
  module: 4
  lesson: '04.3'
  subject: reasonableness-status
  difficulty: 1
  question: By what majority did the Court annul the reasonableness amendment in HCJ 5658/23?
  options:
    - 15 to 0.
    - 8 to 7.
    - 12 to 3.
    - 10 to 1.
  correct: 1
  explanation: >-
    Eight of the fifteen justices voided the amendment. A larger majority (12 per the official
    abstract) held that Basic Laws may be reviewed in extreme cases.
- id: m04-037
  module: 4
  lesson: '04.3'
  subject: reasonableness-status
  difficulty: 2
  question: Whose decisions did the 2023 amendment (s. 15(ד1)) try to exclude from reasonableness review?
  options:
    - All public authorities, including local councils.
    - Only the Knesset and its committees.
    - The government, the Prime Minister and ministers.
    - Only the Attorney General and ministry legal advisers.
  correct: 2
  explanation: >-
    The annulled s. 15(ד1) covered "הממשלה, ראש הממשלה או שר אחר", including appointments and
    decisions not to act. It never covered local authorities or officials below ministers.
- id: m04-038
  module: 4
  lesson: '04.3'
  subject: reasonableness-status
  difficulty: 2
  question: What did the three-justice minority that read the amendment narrowly propose?
  options:
    - To keep the amendment but read it as still allowing review of arbitrary decisions.
    - To void the amendment and extend reasonableness to the Knesset.
    - To refer the whole question to a national referendum before deciding.
    - To suspend the amendment until the next Knesset could reconsider it.
  correct: 0
  explanation: >-
    Justices Willner, Stein and Canfy-Steinitz would have upheld the amendment, read so that it
    removed balancing-type review but left review of capricious decisions.
- id: m04-039
  module: 4
  lesson: '04.3'
  subject: reasonableness-status
  difficulty: 2
  question: Which description of the reasonableness debate is balanced enough for a course or a leaflet?
  options:
    - >-
      Reasonableness lets unelected judges rule the country, as everyone across politics now
      accepts.
    - >-
      Only opponents of democracy criticise the reasonableness ground, so their view need not be
      presented.
    - >-
      Amendment supporters saw too broad a scope to intervene; defenders see a check on arbitrary
      acts.
    - The debate ended in 2024, so there is no need to present positions.
  correct: 2
  explanation: >-
    Each side's position is attributed and stated fairly. The debate continues, with critics and
    defenders among judges, scholars and politicians.
- id: m04-040
  module: 4
  lesson: '04.3'
  subject: reasonableness
  difficulty: 2
  question: Which threshold do courts apply before cancelling a decision for unreasonableness?
  options:
    - Any unreasonableness, however small.
    - Unreasonableness proven beyond reasonable doubt.
    - Unreasonableness that a majority of the public perceives.
    - Extreme unreasonableness (חוסר סבירות קיצוני).
  correct: 3
  explanation: >-
    Courts intervene only where the decision is extremely unreasonable — far outside the range of
    reasonable decisions.
- id: m04-041
  module: 4
  lesson: '04.3'
  subject: reasonableness
  difficulty: 2
  question: What is the significance of the Deri-Pinhasi rulings (1993) for reasonableness?
  options:
    - They held that a Prime Minister's failure to dismiss an indicted minister can be unreasonable.
    - >-
      They abolished reasonableness review of all ministers' appointments and dismissals by the
      government.
    - They held that indicted ministers are automatically disqualified by statute.
    - They created the proportionality test for administrative decisions.
  correct: 0
  explanation: >-
    No statute required dismissal, but the Court held that refraining from using the power to
    dismiss could, in the circumstances, be unreasonable.
- id: m04-042
  module: 4
  lesson: '04.3'
  subject: proportionality
  difficulty: 1
  question: What is the correct order of the proportionality tests?
  options:
    - Least harmful means, proper purpose, rational connection, benefit against harm.
    - Proper purpose, rational connection, least harmful means, benefit against harm.
    - Rational connection, benefit against harm, proper purpose, least harmful means.
    - Benefit against harm, least harmful means, rational connection, proper purpose.
  correct: 1
  explanation: >-
    First the purpose must be proper; then the measure must advance it; then it must be the least
    harmful effective option; finally its benefit must justify its harm.
- id: m04-043
  module: 4
  lesson: '04.3'
  subject: proportionality
  difficulty: 1
  question: When does the proportionality test apply to an administrative decision?
  options:
    - Whenever a citizen disagrees with the decision.
    - Only when a decision involves spending public money.
    - When the decision limits a basic right.
    - Only when the decision was taken by a minister.
  correct: 2
  explanation: >-
    Proportionality is the test for limits on rights (Basic Law s. 8: "במידה שאינה עולה על הנדרש"),
    and courts apply it to administrative acts too.
- id: m04-044
  module: 4
  lesson: '04.3'
  subject: proportionality
  difficulty: 2
  question: >-
    A council removes all benches from a square to stop rough sleeping. Homeless-rights activists
    argue the measure is disproportionate. Which point best fits the least harmful means test?
  options:
    - Social services outreach and night patrols would address the problem with less harm.
    - Preventing rough sleeping is never a proper purpose for a council.
    - Removing benches has no rational connection to where homeless people choose to sleep.
    - The council did not answer the activists within 45 days.
  correct: 0
  explanation: >-
    The least harmful means test asks whether another measure achieves the purpose about as well
    with less harm to all users, including the elderly and disabled who need benches.
- id: m04-045
  module: 4
  lesson: '04.3'
  subject: proportionality
  difficulty: 3
  question: >-
    A ministry bans a political group's rally citing a specific, credible threat of violence, after
    considering and rejecting a smaller venue and extra police. Which proportionality stage is now
    the realistic battleground?
  options:
    - Proper purpose, because public safety is never a proper purpose for a ban.
    - Rational connection, because bans never reduce violence.
    - Least harmful means, because the ministry did not consider alternatives at all.
    - 'Proportionality in the narrow sense: whether the safety benefit justifies a total ban.'
  correct: 3
  explanation: >-
    Safety is proper, a ban is connected to it, and alternatives were weighed. The remaining
    question is whether the benefit is worth the harm to expression.
- id: m04-046
  module: 4
  lesson: '04.3'
  subject: proportionality
  difficulty: 2
  question: What is the main point of Beit Sourik (HCJ 2056/04) for this module?
  options:
    - Courts may not review military commanders' decisions at all, even where rights are harmed.
    - >-
      Proportionality applies to administrative acts; a less harmful available route can decide the
      case.
    - >-
      The reasonableness ground was abolished for all security decisions taken by the army in the
      field.
    - Public petitioners have no standing in security matters.
  correct: 1
  explanation: >-
    The Court accepted the security purpose but annulled parts of the route because an alternative
    caused less harm — proportionality applied to a commander's decision.
- id: m04-047
  module: 4
  lesson: '04.3'
  subject: choosing-grounds
  difficulty: 3
  question: >-
    A minister refused to renew a grant to an NGO. You find no authority problem, but the minister
    gave no reasons, ignored the grant committee's recommendation and held no hearing. Which ground
    should lead your letter?
  options:
    - Extreme unreasonableness, because the decision feels unfair.
    - Proportionality, because every grant refusal limits a basic right.
    - Procedure and reasons, supported by the ignored recommendation.
    - Lack of standing of the minister to refuse grants.
  correct: 2
  explanation: >-
    Concrete procedural flaws are stronger than a general reasonableness claim. The ignored
    recommendation then supports a weight-based reasonableness argument.
- id: m04-048
  module: 4
  lesson: '04.3'
  subject: choosing-grounds
  difficulty: 3
  question: >-
    You disagree with a lawful government policy on fuel taxes that was adopted with full procedure
    and relevant considerations. What is the most realistic route?
  options:
    - 'Political action: Knesset committees, MKs, public campaigns.'
    - A petition for extreme unreasonableness, since you disagree.
    - A petition for disproportionality, since all taxes limit property.
    - A petition for lack of standing of the finance minister.
  correct: 0
  explanation: >-
    Courts do not replace lawful policy choices. Disagreement with a lawful policy belongs to the
    political process (Module 12).
- id: m04-049
  module: 4
  lesson: '04.3'
  subject: reasonableness
  difficulty: 2
  question: 'Spot the weakness in this sentence from a petition draft: "The decision is unreasonable."'
  options:
    - It should say "illegal" instead, since reasonableness no longer exists.
    - It does not say which consideration got no or wrong weight, and why.
    - It should be in English, since reasonableness is an English doctrine.
    - It should be at the end of the petition, not the start.
  correct: 1
  explanation: >-
    A label persuades nobody. A strong argument names the consideration, the weight it received and
    why the result falls outside the range.
- id: m04-050
  module: 4
  lesson: '04.3'
  subject: reasonableness-status
  difficulty: 3
  question: >-
    A group wants to cite reasonableness against a 2026 ministerial decision. A member says "check
    first whether the Knesset has re-legislated it." Where should they look, and why?
  options:
    - Nowhere; once the Court has ruled, the Knesset can never legislate on the topic again.
    - Only in the 2024 judgment, because later developments cannot change it.
    - Only on social media and in the news, where legislative changes usually appear first.
    - The current Basic Law text and legislative trackers, because a new Knesset could act again.
  correct: 3
  explanation: >-
    The status can change. Check the current text (Wikisource, the Knesset database) and up-to-date
    trackers, and attribute any advocacy source.
- id: m04-051
  module: 4
  lesson: '04.3'
  subject: key-terms
  difficulty: 1
  question: What does "מידתיות במובן הצר" ask?
  options:
    - Whether the measure is legal under the enabling law.
    - Whether the measure advances the purpose at all.
    - Whether the benefit of the measure justifies the harm it causes.
    - Whether the measure was adopted within the deadline set by law.
  correct: 2
  explanation: The last stage compares benefit and harm, even when no gentler measure exists.
- id: m04-052
  module: 4
  lesson: '04.3'
  subject: reasonableness
  difficulty: 3
  question: >-
    In Ressler, Barak J. upheld the yeshiva deferrals but warned "Quantity makes a qualitative
    difference". What does that mean for reasonableness?
  options:
    - A lawful policy can become unreasonable when its scale grows far beyond its original balance.
    - Larger numbers of petitioners make a petition more likely to succeed.
    - >-
      Decisions affecting very many people are not justiciable, because they are political by
      nature.
    - Policies must be re-legislated every year by the Knesset.
  correct: 0
  explanation: >-
    The weight of considerations changes with scale. A deferral policy reasonable for a few could
    cross the line as numbers grow (Ressler, para. 69).
- id: m04-053
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 1
  question: Where does the general right to be heard (זכות הטיעון) in Israeli administrative law come from?
  options:
    - From the rules of natural justice applied by the courts.
    - From a specific section of the Decisions and Reasons Law.
    - From the Freedom of Information Law.
    - 'From Basic Law: The Government s. 32.'
  correct: 0
  explanation: >-
    There is no general statute; the courts apply natural justice ("שמע את הצד השני") to every
    administrative body. Some specific laws add their own hearing rules.
- id: m04-054
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 1
  question: Which of these is NOT one of the elements of a proper hearing?
  options:
    - Notice that a decision is being considered.
    - Access to the material the authority relies on.
    - A real chance to respond, with an open mind.
    - The right to choose which official will decide.
  correct: 3
  explanation: >-
    A hearing includes notice, the material, time, a chance to respond and an open mind — not a
    choice of decision-maker.
- id: m04-055
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 2
  question: >-
    A municipality adopts a new city-wide rule on outdoor seating hours. A café owner says he was
    owed a personal hearing before the rule. Is he right?
  options:
    - Yes, every person affected by any decision has a right to a personal hearing.
    - No; general rules usually need no individual hearing, though some laws require consultation.
    - Yes, but only if he submitted a written request for a personal hearing within 45 days.
    - No, because municipalities are not bound by natural justice.
  correct: 1
  explanation: >-
    Individual hearings attach to decisions about specific persons. General rules may require public
    consultation where a law says so, not individual hearings.
- id: m04-056
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 2
  question: >-
    A building is about to collapse and the municipality evacuates it immediately, without a
    hearing. Is the lack of a prior hearing unlawful?
  options:
    - Yes, hearings are always required before any decision about specific people.
    - Yes, unless a court approved the evacuation in advance.
    - No, in a real emergency it may act first, but it must hear the residents afterwards.
    - No, emergencies remove the duty to hear entirely, even after the danger passes.
  correct: 2
  explanation: >-
    Real urgency can justify acting before a hearing, but the authority must then hear the affected
    people and remain willing to change its decision.
- id: m04-057
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 3
  question: >-
    A council invites you to a "hearing" on cancelling your group's permit, but refuses to show you
    the complaints, saying only that "there were many". What is your best response?
  options:
    - Ask in writing for the complaints, redacted if needed, so that you can respond to them.
    - Refuse to attend, because an incomplete hearing is no hearing.
    - Attend the hearing and argue only that your group is popular in the whole neighbourhood.
    - Ask the council to postpone the hearing for at least six months.
  correct: 0
  explanation: >-
    A hearing without the material is not a real chance to respond. Ask for it in writing (redaction
    can protect complainants) and attend, putting your objection on record.
- id: m04-058
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 3
  question: >-
    At a hearing, the committee chair reads a decision that was printed before you finished
    speaking. Which hearing element is most clearly missing?
  options:
    - Notice of the planned decision, given in writing a reasonable time in advance.
    - Access to the material that the committee relied on.
    - Reasonable time to prepare a response before the meeting.
    - 'An open mind: the decision was ready before you were heard.'
  correct: 3
  explanation: >-
    A decision prepared in advance suggests a closed mind (דעה נעולה). A hearing must be able to
    change the outcome.
- id: m04-059
  module: 4
  lesson: '04.4'
  subject: reasons
  difficulty: 1
  question: Under Decisions and Reasons Law s. 2א, when must an official give written reasons?
  options:
    - When refusing a written request to use a power.
    - Only when a court orders the official to explain.
    - Only when approving a request, so others can rely on it.
    - Only for decisions that cost the applicant money.
  correct: 0
  explanation: >-
    Section 2א: an official who refused a request under s. 2(א) must inform the applicant in writing
    of the reasons for refusal.
- id: m04-060
  module: 4
  lesson: '04.4'
  subject: reasons
  difficulty: 2
  question: Which of these is a lawful exception to the duty to give reasons under s. 3?
  options:
    - The official thinks the reasons would embarrass the minister.
    - The request was to appoint the applicant to a particular post.
    - The official is too busy to write reasons.
    - The applicant is a member of an opposition party.
  correct: 1
  explanation: >-
    Section 3 lists exceptions including requests to be appointed to a post, and security or foreign
    relations. Embarrassment, workload and politics are not among them.
- id: m04-061
  module: 4
  lesson: '04.4'
  subject: reasons
  difficulty: 2
  question: >-
    An official refuses your request and writes that reasons are withheld "under section 3", without
    saying which paragraph. What may you do?
  options:
    - Nothing, since s. 3 gives the official complete discretion.
    - Ask a court for damages for the missing reasons.
    - Insist on the specific ground (s. 4), and appeal (ערר) to the minister within the time set.
    - File a criminal complaint against the official for breach of the Decisions and Reasons Law.
  correct: 2
  explanation: >-
    Section 4 requires the official to state which s. 3 ground applies and gives a right of appeal
    to the minister within a set period (see current numbers).
- id: m04-062
  module: 4
  lesson: '04.4'
  subject: reasons
  difficulty: 2
  question: 'Spot the problem with this reply: "Your request is refused following a professional review."'
  options:
    - 'It is a label, not reasons: it does not say what the review found or why it led to refusal.'
    - It should have been signed by the minister personally, not by an official of the ministry.
    - It was sent too quickly, before the 45 days for answering had passed, so it is premature.
    - It should have been sent by registered mail only.
  correct: 0
  explanation: >-
    Reasons must let you understand the decision and respond to it. A reference to "a review"
    without its content does not meet the duty.
- id: m04-063
  module: 4
  lesson: '04.4'
  subject: reasons
  difficulty: 3
  question: >-
    Under s. 5 of the Decisions and Reasons Law, what must an official tell you if the decision is
    subject to appeal under some enactment?
  options:
    - Nothing, because applicants must find their own appeal routes.
    - Only the name and address of the appeals committee.
    - The right of appeal, how to file it and the deadlines set by law.
    - The likely result of the appeal, based on past cases.
  correct: 2
  explanation: >-
    Section 5 requires written notice of the right of appeal, how to file it and its deadlines. If
    it is missing, s. 6(א) shifts the burden of proving legality to the authority.
- id: m04-064
  module: 4
  lesson: '04.4'
  subject: conflict-of-interest
  difficulty: 1
  question: What is the test for a conflict of interest of a public servant, as stated by Barak J.?
  options:
    - Proof that the official was actually influenced by the interest.
    - A real possibility of a conflict of interest.
    - A criminal conviction for breach of trust.
    - A complaint by at least two members of the public.
  correct: 1
  explanation: >-
    "אסור לו לעובד הציבור להימצא במצב בו קיימת אפשרות ממשית של ניגוד עניינים". Actual influence need
    not be proved.
- id: m04-065
  module: 4
  lesson: '04.4'
  subject: conflict-of-interest
  difficulty: 1
  question: What is an institutional conflict of interest?
  options:
    - A conflict between an official's public role and a relative's business.
    - A dispute between two ministries over a budget.
    - A clash between two public roles the same person holds.
    - Any disagreement inside a committee.
  correct: 2
  explanation: >-
    An institutional conflict pits two public interests one person is entrusted with against each
    other, such as promoting and supervising the same project.
- id: m04-066
  module: 4
  lesson: '04.4'
  subject: conflict-of-interest
  difficulty: 2
  question: >-
    A district planning committee member is a paid consultant to the developer of a plan under
    discussion. He declares this and leaves the room before the vote. Was s. 47 complied with?
  options:
    - Yes, because he declared the interest and did not attend or vote on the matter.
    - No, because consultants may never sit on planning committees.
    - No, because he should have voted against the plan to show neutrality.
    - Yes, but only if the developer agreed to his recusal in writing.
  correct: 0
  explanation: >-
    Section 47(א) requires notifying the chair and not attending the discussion or the vote. Check
    that the minutes record both.
- id: m04-067
  module: 4
  lesson: '04.4'
  subject: conflict-of-interest
  difficulty: 2
  question: Which relative is NOT listed in the definition of "קרוב" in Municipalities Ordinance s. 122א?
  options:
    - A spouse.
    - A parent.
    - A brother or sister.
    - A cousin.
  correct: 3
  explanation: >-
    Section 122א defines a relative as a spouse, parent, son or daughter, brother or sister. Cousins
    are not listed, though a general conflict may still arise.
- id: m04-068
  module: 4
  lesson: '04.4'
  subject: conflict-of-interest
  difficulty: 3
  question: >-
    A minister is to decide on extending the term of an official whose agency is investigating the
    minister's close aides. Which flaw would a court most likely examine?
  options:
    - Lack of authority, because ministers never decide on agency heads.
    - A personal conflict of interest affecting the minister's discretion.
    - Mootness, because the official could resign at any time.
    - Lack of standing of the official to be heard.
  correct: 1
  explanation: >-
    An investigation touching the decision-maker's circle creates a real possibility of conflict.
    That was one ground in the May 2025 Shin Bet ruling.
- id: m04-069
  module: 4
  lesson: '04.4'
  subject: conflict-of-interest
  difficulty: 3
  question: >-
    You find that a council member's company won a municipal contract. Before going public, what
    should you check?
  options:
    - Whether the company has a website and offices, since that proves it is a real business.
    - >-
      Whether the member voted in the last council elections, which shows whether he is still active
      on the council.
    - >-
      Whether one of the s. 122א exceptions applied, such as an approved permit published in
      Reshumot.
    - Whether the contract was signed in Hebrew and stamped by the council's legal adviser.
  correct: 2
  explanation: >-
    Section 122א(ב) allows some contracts, for example with a two-thirds council majority and
    ministerial approval published in Reshumot. Check before alleging a breach.
- id: m04-070
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 2
  question: >-
    In the May 2025 ruling on the Shin Bet head's dismissal, which procedural point did the majority
    make about the hearing?
  options:
    - He was given less than a day and no concrete claims to answer.
    - He was given a full hearing but chose not to attend.
    - Hearings are not required for dismissing agency heads.
    - The hearing should have been held by the Knesset.
  correct: 0
  explanation: >-
    According to the Times of Israel report, the majority found he was not given concrete claims and
    had less than a day to prepare. The government disputed the ruling.
- id: m04-071
  module: 4
  lesson: '04.4'
  subject: key-terms
  difficulty: 1
  question: What is a "הסדר למניעת ניגוד עניינים"?
  options:
    - >-
      A court order cancelling a decision that was tainted by a conflict of interest of the
      decision-maker.
    - >-
      An arrangement, set by a legal adviser, limiting an official's role where a conflict may
      arise.
    - A contract between a municipality and a supplier.
    - A fine imposed on officials who fail to declare their personal interests on time.
  correct: 1
  explanation: >-
    Conflict-of-interest arrangements define which matters an official may not handle, under the
    Attorney General's guidelines.
- id: m04-072
  module: 4
  lesson: '04.5'
  subject: standing
  difficulty: 1
  question: What is a "public petitioner" (עותר ציבורי)?
  options:
    - A petitioner without a personal interest, acting on a matter of public importance.
    - Any petitioner who is a public servant, acting in an official capacity.
    - A petitioner who files without paying a fee because of a public-interest exemption.
    - A petitioner represented by the Attorney General.
  correct: 0
  explanation: >-
    Since Ressler, public petitioners may be heard on matters of public importance, serious flaws in
    administration or the rule of law.
- id: m04-073
  module: 4
  lesson: '04.5'
  subject: standing
  difficulty: 2
  question: >-
    A tenant's eviction notice from a public housing company seems unlawful, but she does not want
    to sue. A housing-rights NGO wants to petition alone. What is the best course?
  options:
    - The NGO petitions alone; public petitioners can always replace the affected person.
    - The NGO pays her to sign the petition so standing is secured.
    - The NGO files in her name without asking, as a public service.
    - Respect her choice; a public petition in her place will probably fail on standing.
  correct: 3
  explanation: >-
    Courts generally reject a public petitioner where the directly affected person chose not to act.
    Acting for her without consent, or paying her, raises further problems.
- id: m04-074
  module: 4
  lesson: '04.5'
  subject: justiciability
  difficulty: 1
  question: What is the difference between normative and institutional justiciability?
  options:
    - 'Normative: whether the petition was filed in time; institutional: whether fees were paid.'
    - >-
      Normative: whether legal standards exist to decide; institutional: whether a court should
      decide.
    - 'Normative: whether the petitioner is affected; institutional: whether a group is involved.'
    - There is no difference; the terms are used interchangeably.
  correct: 1
  explanation: >-
    Ressler distinguished the two: almost everything has a legal standard, but some matters may
    still be better left to other branches.
- id: m04-075
  module: 4
  lesson: '04.5'
  subject: justiciability
  difficulty: 2
  question: >-
    A petition asks the court to order the government to open peace negotiations with a neighbouring
    state. Which threshold problem is most likely?
  options:
    - Lack of standing, because peace concerns every citizen equally and no one specially.
    - Delay, because the conflict began decades ago and nobody petitioned earlier.
    - 'Institutional non-justiciability: a core foreign-policy choice for political bodies.'
    - Failure to pay the court fee in advance.
  correct: 2
  explanation: >-
    Courts decline matters at the heart of foreign and security policy where no legal duty is at
    stake. A petition framed around a legal duty fares better.
- id: m04-076
  module: 4
  lesson: '04.5'
  subject: exhaustion
  difficulty: 1
  question: What does "פנייה מוקדמת" mean in practice?
  options:
    - Writing to the authority asking for what you want before going to court.
    - Filing a petition early, before the authority has made its final decision.
    - Paying the court fee before filing.
    - Asking the court for an early hearing date because of urgency.
  correct: 0
  explanation: >-
    A prior written request gives the authority the chance to fix the problem; the petition must
    attach it or explain its absence (reg. 5(ב)(6)).
- id: m04-077
  module: 4
  lesson: '04.5'
  subject: alternative-remedy
  difficulty: 2
  question: Why does the High Court of Justice usually dismiss a petition where a statutory appeal exists?
  options:
    - Because statutory appeals are always cheaper.
    - >-
      Because Basic Law: The Judiciary s. 15(ג) limits it to matters no other court or tribunal can
      hear.
    - >-
      Because the Administrative Courts Law forbids petitions to the High Court on all planning and
      licensing matters.
    - Because the High Court hears only criminal appeals.
  correct: 1
  explanation: >-
    The High Court acts where relief is needed for justice and no other court or tribunal has
    jurisdiction. An available alternative remedy usually leads to dismissal.
- id: m04-078
  module: 4
  lesson: '04.5'
  subject: delay
  difficulty: 2
  question: >-
    Besides the deadline itself, which factor most affects whether a court dismisses a petition for
    delay (שיהוי)?
  options:
    - Whether the petitioner has filed petitions before.
    - Whether the petition is longer than twenty pages, which courts treat as an abuse of process.
    - Whether the petitioner is represented by a lawyer.
    - Whether the authority or third parties relied on the decision in the meantime.
  correct: 3
  explanation: >-
    Courts weigh the length of and reason for the delay, reliance by others, and the seriousness of
    the alleged illegality. Reg. 4 allows dismissal even within the deadline.
- id: m04-079
  module: 4
  lesson: '04.5'
  subject: forum
  difficulty: 2
  question: >-
    How do you decide whether an administrative petition goes to the Administrative Affairs Court or
    to the High Court of Justice?
  options:
    - Check whether the matter is listed in the First Schedule to the Administrative Courts Law.
    - Choose the High Court for important cases and the district court for minor or local ones.
    - Choose whichever court is closer to your home.
    - >-
      Ask the authority which court it prefers, since the respondent chooses the forum in
      administrative cases.
  correct: 0
  explanation: >-
    The Administrative Affairs Court hears petitions on matters in the First Schedule (s. 5); other
    administrative matters go to the High Court. Check the item before filing.
- id: m04-080
  module: 4
  lesson: '04.5'
  subject: forum
  difficulty: 1
  question: Which grounds does the Administrative Affairs Court apply to an administrative petition?
  options:
    - Only the grounds listed in the First Schedule item.
    - The grounds, powers and remedies the High Court uses as HCJ.
    - Only grounds of lack of authority, not reasonableness.
    - The grounds in the Civil Procedure Regulations.
  correct: 1
  explanation: >-
    Section 8 of the Administrative Courts Law applies the High Court's grounds, powers and
    remedies, with the necessary changes.
- id: m04-081
  module: 4
  lesson: '04.5'
  subject: exhaustion
  difficulty: 3
  question: >-
    Spot the mistake: a resident writes to a ministry on Monday asking it to cancel a decision and
    files a petition on Wednesday, saying "I exhausted remedies".
  options:
    - The letter should have been sent to the court instead of the ministry.
    - Exhaustion requires a meeting in person with the minister, not a letter to the ministry.
    - The ministry was not given reasonable time to answer, so remedies were not exhausted.
    - Exhaustion is only needed for High Court petitions.
  correct: 2
  explanation: >-
    Exhaustion means giving the authority a real chance to respond. Two days is rarely enough unless
    the matter is genuinely urgent, which the petition must explain.
- id: m04-082
  module: 4
  lesson: '04.5'
  subject: standing
  difficulty: 3
  question: >-
    A right-wing NGO petitions against a ministry's failure to enforce demolition orders on illegal
    buildings, and a left-wing NGO petitions against non-enforcement of environmental orders. How do
    courts approach their standing?
  options:
    - 'The same way: enforcement of the law is a rule-of-law matter for public petitioners.'
    - 'Differently: courts favour environmental petitioners over planning ones.'
    - Neither has standing, because only residents may petition on enforcement.
    - Only the NGO whose views match the government's has standing.
  correct: 0
  explanation: >-
    Standing doctrine is neutral. Both raise rule-of-law enforcement issues, the classic ground for
    public-petitioner standing.
- id: m04-083
  module: 4
  lesson: '04.5'
  subject: delay
  difficulty: 1
  question: From when does the petition clock in reg. 3(ב) run?
  options:
    - From the day the petitioner decides to sue.
    - From the earliest of publication, notice to the petitioner, or the petitioner's knowledge.
    - From the day the authority's legal adviser replies to the petitioner's prior written request.
    - From the first day of the following month.
  correct: 1
  explanation: >-
    The regulation counts from the earliest of the three dates. Check the deadline in current
    numbers.
- id: m04-084
  module: 4
  lesson: '04.5'
  subject: mootness
  difficulty: 2
  question: Why did the dissenting justice in the May 2025 Shin Bet ruling say the court should not rule?
  options:
    - Because the petitioners lacked standing as public petitioners.
    - Because the dismissal was not justiciable as a security matter.
    - Because the petition was filed late.
    - Because the head had resigned, making the petitions moot.
  correct: 3
  explanation: >-
    Deputy President Sohlberg argued the question had become theoretical; the majority ruled anyway
    because of its public importance.
- id: m04-085
  module: 4
  lesson: '04.5'
  subject: key-terms
  difficulty: 1
  question: What does "סילוק על הסף" mean?
  options:
    - Dismissal without examining the merits, for a threshold reason.
    - Removing a judge from the panel.
    - Ending a court hearing early because the time set for it ran out.
    - Sending a case back to the authority for a new decision.
  correct: 0
  explanation: Threshold flaws — standing, exhaustion, delay, alternative remedy — lead to dismissal in limine.
- id: m05-001
  module: 5
  lesson: '05.1'
  subject: tool-choice
  difficulty: 1
  question: Which tool is designed to get you documents and data that a public authority holds?
  options:
    - A complaint to the Public Complaints Commissioner.
    - A pre-petition letter to the legal adviser.
    - A Freedom of Information request.
    - A public inquiry to the State Comptroller.
  correct: 2
  explanation: >-
    The FOI Law gives every citizen or resident a right to information held by a public authority
    (s. 1). The other tools aim at decisions or investigations.
- id: m05-002
  module: 5
  lesson: '05.1'
  subject: tool-choice
  difficulty: 1
  question: What is usually the very first step before any complaint or petition against an authority?
  options:
    - A written request to the official who holds the power.
    - A post on social media tagging the authority.
    - A phone call to the authority's call centre.
    - A complaint to the State Comptroller's audit.
  correct: 0
  explanation: >-
    A written request starts the 45-day duty to decide (Decisions and Reasons Law s. 2) and is the
    first exhibit of every later step.
- id: m05-003
  module: 5
  lesson: '05.1'
  subject: forum
  difficulty: 1
  question: Which list decides whether a petition goes to the Administrative Court?
  options:
    - The schedule to the Court Fees Regulations.
    - The list of audited bodies in the State Comptroller Law.
    - The definitions section of the FOI Law.
    - The First Schedule of the Administrative Courts Law.
  correct: 3
  explanation: >-
    Section 5(1) of the Administrative Courts Law gives the court jurisdiction over matters listed
    in the First Schedule.
- id: m05-004
  module: 5
  lesson: '05.1'
  subject: forum
  difficulty: 2
  question: >-
    A local planning committee granted a permit you oppose. No minister was involved. Where would a
    petition go?
  options:
    - The High Court of Justice in Jerusalem, as for all permits.
    - The District Court as an Administrative Court.
    - The Magistrates' Court of the town where the land is.
    - The National Planning Council's appeals board only.
  correct: 1
  explanation: >-
    Planning and building matters are First Schedule item 10, with exclusions only for national and
    district outline plans and ministers' decisions.
- id: m05-005
  module: 5
  lesson: '05.1'
  subject: forum
  difficulty: 2
  question: >-
    Your petition concerns a decision of the Government as a whole about national education budgets.
    The education item of the First Schedule excludes government decisions. Where does it go?
  options:
    - To the Administrative Court of your district.
    - To the Administrative Court in Jerusalem.
    - To the High Court of Justice.
    - To the Knesset Education Committee.
  correct: 2
  explanation: >-
    Item 3 (education) excludes decisions of the Government and of a minister; matters outside the
    Schedule go to the HCJ (Basic Law: The Judiciary s. 15(ג)).
- id: m05-006
  module: 5
  lesson: '05.1'
  subject: tool-choice
  difficulty: 2
  question: >-
    A neighbourhood group wants a municipality to install speed bumps. It has not written to anyone
    yet. Which order of steps is sound?
  options:
    - A petition first, then a written request during the hearing.
    - Written request, pre-petition letter if refused, then a petition.
    - An ombudsman complaint first, then a written request later.
    - An FOI request first, then a petition with no letter at all.
  correct: 1
  explanation: >-
    Courts expect the authority to be asked first and given a chance to answer; the pre-petition
    letter then exhausts remedies before any petition.
- id: m05-007
  module: 5
  lesson: '05.1'
  subject: deadlines
  difficulty: 2
  question: Which statement about deadlines in a tool plan is correct?
  options:
    - The latest deadline governs, so you can wait for all answers.
    - Complaints pause court deadlines until they are decided.
    - Court deadlines start only after a complaint is closed.
    - The earliest court deadline governs; complaints run in parallel.
  correct: 3
  explanation: >-
    State Comptroller Law s. 45(א)(2) says a complaint does not extend any statutory deadline, so
    the earliest court deadline controls the plan.
- id: m05-008
  module: 5
  lesson: '05.1'
  subject: tool-choice
  difficulty: 2
  question: >-
    A parent's child was refused a statutory school service by the municipality. Time is short and
    the parent wants a binding order. Which tool gives a binding order?
  options:
    - A petition, after a short pre-petition letter.
    - A complaint to the Public Complaints Commissioner.
    - Information sent to the State Comptroller's audit.
    - A Freedom of Information request for the file.
  correct: 0
  explanation: >-
    Only a court gives binding orders. The Commissioner's findings give no new legal right and
    cannot be enforced in court (s. 45).
- id: m05-009
  module: 5
  lesson: '05.1'
  subject: forum
  difficulty: 3
  question: >-
    An activist group wants the court to order a minister to sign regulations on hospital waiting
    times. Health matters partly appear in the First Schedule. Where should it petition?
  options:
    - The HCJ, because the main remedy concerns making regulations.
    - The Administrative Court, because health is in the Schedule.
    - The Magistrates' Court, because it concerns individual patients.
    - The Labour Court, because hospitals employ the staff.
  correct: 0
  explanation: >-
    Section 5(1) excludes from the Administrative Court any petition whose main remedy concerns
    making, cancelling or declaring void regulations.
- id: m05-010
  module: 5
  lesson: '05.1'
  subject: tool-choice
  difficulty: 3
  question: >-
    An activist plans: FOI request now, wait for the answer, then a letter asking the authority to
    change its decision. The decision was published 20 days ago. What is wrong with the plan?
  options:
    - FOI requests may not be filed once a decision is published.
    - A letter must always be sent before any FOI request is made.
    - Nothing; the petition deadline starts only after the FOI answer.
    - Doing the steps in sequence risks the 45-day petition deadline.
  correct: 3
  explanation: >-
    The petition deadline runs from the decision (reg. 3(ב)). Send the pre-petition letter now and
    the FOI request in parallel.
- id: m05-011
  module: 5
  lesson: '05.1'
  subject: forum
  difficulty: 3
  question: >-
    A petition concerns a Civil Administration planning decision about a specific building permit in
    Judea and Samaria. Which court is likely competent?
  options:
    - The District Court nearest to the building.
    - The Administrative Court in Jerusalem, under the Fourth Schedule.
    - The High Court of Justice, which hears every matter there.
    - A military appeals committee only, with no court review.
  correct: 1
  explanation: >-
    Section 5א and the Fourth Schedule give the Jerusalem Administrative Court certain area matters,
    including some planning decisions; read the item's exclusions.
- id: m05-012
  module: 5
  lesson: '05.1'
  subject: tool-choice
  difficulty: 1
  question: Which tool investigates a wrong that an authority did to you personally, for free?
  options:
    - An administrative petition with a court-fee exemption.
    - An FOI request together with a fee-exemption claim.
    - A complaint to the Public Complaints Commissioner.
    - A request to appear before a Knesset committee.
  correct: 2
  explanation: >-
    The Commissioner investigates acts of audited bodies that directly harmed the complainant (State
    Comptroller Law ss. 36–37), at no cost.
- id: m05-013
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 1
  question: Must you give a reason for an FOI request?
  options:
    - Yes; requests without a reason are refused.
    - Only when you ask a government ministry.
    - Only when you claim a fee exemption.
    - No; the law says you need not state a reason.
  correct: 3
  explanation: 'FOI Law s. 7(א): the requester is not obliged to state the reason for the request.'
- id: m05-014
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 1
  question: To whom is an FOI request addressed?
  options:
    - The authority's FOI officer, or someone the officer authorised.
    - The minister or the mayor personally, by name and post.
    - The authority's spokesperson, who handles all public queries.
    - The Attorney General, who supervises every authority.
  correct: 0
  explanation: >-
    Section 7(א) sends the request to the officer (ממונה) appointed under s. 3, or to someone the
    officer authorised.
- id: m05-015
  module: 5
  lesson: '05.2'
  subject: foi-deadlines
  difficulty: 1
  question: How long does an authority have to decide on an FOI request, before any extension?
  options:
    - 45 days.
    - 30 days.
    - 14 days.
    - 60 days.
  correct: 1
  explanation: >-
    FOI Law s. 7(ב): without delay and no later than 30 days from receipt; a reasoned extension adds
    30 days.
- id: m05-016
  module: 5
  lesson: '05.2'
  subject: foi-fees
  difficulty: 1
  question: Which fee do you always pay when filing an FOI request, unless exempt?
  options:
    - The production fee for every page.
    - The handling fee for the first three hours.
    - The request fee.
    - A court fee for registering the request.
  correct: 2
  explanation: >-
    Reg. 1 sets the request fee; handling is charged only from the fourth hour (reg. 2) and
    production per page (reg. 3).
- id: m05-017
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 2
  question: >-
    A non-resident tourist asks the Ministry of Tourism for its marketing budget data. What is the
    legal position?
  options:
    - Non-residents may ask only about their own rights in Israel.
    - Anyone in the world may ask for any information at all.
    - Tourists may ask, but must pay double the usual fees.
    - Only Israeli citizens, not residents, may ever ask.
  correct: 0
  explanation: >-
    Section 1 gives the right to citizens and residents; s. 12 extends it to others only for
    information about their own rights in Israel.
- id: m05-018
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 2
  question: >-
    Spot the mistake in this request: 'Please send me all information you hold about the beach, in
    any form.'
  options:
    - It does not explain why the requester wants the information.
    - It should be addressed to the mayor, not to the FOI officer.
    - It must list the s. 9 exemptions the requester is willing to accept.
    - It names no record type, period or dates, so it invites refusal.
  correct: 3
  explanation: >-
    A vague request can be refused for needing unreasonable resources (s. 8(1)). Name record types,
    a date range and a format.
- id: m05-019
  module: 5
  lesson: '05.2'
  subject: foi-fees
  difficulty: 2
  question: >-
    The FOI officer expects handling and production fees above the cap you committed to. What must
    happen?
  options:
    - The officer simply charges the extra amount after release.
    - The request is refused automatically as too expensive.
    - The officer gives you the estimate and waits for your agreement.
    - You pay a fixed penalty set for unusually large requests.
  correct: 2
  explanation: >-
    Reg. 4(ב)–(ג): the officer informs you of the estimate, may ask for a deposit, and does not
    continue until you agree.
- id: m05-020
  module: 5
  lesson: '05.2'
  subject: foi-fees
  difficulty: 2
  question: A student needs data for a university thesis. Which fee exemption applies?
  options:
    - None; only amutot and benefit recipients are ever exempt.
    - 'Academic research: request fee and four more handling hours.'
    - A full exemption from every fee, with no limit on hours.
    - A 50% discount on the request fee, and nothing more.
  correct: 1
  explanation: >-
    Reg. 6(ב) exempts information needed for academic research from the request fee and handling for
    four hours beyond the free three.
- id: m05-021
  module: 5
  lesson: '05.2'
  subject: foi-fees
  difficulty: 1
  question: 'Information about yourself and your rights: what is the fee position?'
  options:
    - The full request fee, plus double the handling fee.
    - Only the production fee is waived, nothing else.
    - Exempt from the request fee and four more handling hours.
    - No exemption; personal requests are treated like any other.
  correct: 2
  explanation: >-
    Reg. 6(א) exempts information a person asks about themselves and their rights; FOI Law s. 18(ד)
    also bars a request fee for it.
- id: m05-022
  module: 5
  lesson: '05.2'
  subject: foi-exemptions
  difficulty: 2
  question: >-
    An authority may refuse information that is already published and available to the public. What
    must it tell you?
  options:
    - Where you can buy, receive or read the published information.
    - Nothing more; published information is simply refused.
    - The name of the official who originally published it.
    - The fee it charged the first person who asked for it.
  correct: 0
  explanation: >-
    Section 8(4) allows refusal of published information, but the authority must say where it can be
    obtained or read.
- id: m05-023
  module: 5
  lesson: '05.2'
  subject: foi-exemptions
  difficulty: 2
  question: What is the difference between s. 9(א) and s. 9(ב) of the FOI Law?
  options:
    - 9(א) applies to ministries; 9(ב) applies to local authorities.
    - 9(א) covers old information; 9(ב) covers recent information.
    - 9(א) is for individual requesters; 9(ב) is for amutot.
    - 9(א) is information it must not give; 9(ב), information it may withhold.
  correct: 3
  explanation: >-
    Section 9(א) says the authority 'will not' give certain information; s. 9(ב) says it is 'not
    obliged' to, which leaves discretion.
- id: m05-024
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 2
  question: >-
    Why add a sentence about your interest and the public interest, though you need not give
    reasons?
  options:
    - Without it, the request fee is automatically doubled.
    - The authority must weigh them before refusing (s. 10).
    - The officer cannot open a file for a request without it.
    - It turns the request into an ombudsman complaint as well.
  correct: 1
  explanation: >-
    Section 10 requires the authority to consider the requester's interest, if stated, and the
    public interest in health, safety and the environment.
- id: m05-025
  module: 5
  lesson: '05.2'
  subject: foi-deadlines
  difficulty: 3
  question: >-
    You emailed a request on 1 May; the officer confirms receipt on 3 May; you pay on 6 May. When is
    day 30?
  options:
    - 5 June, counting from 6 May.
    - 31 May, counting from 1 May.
    - 2 June, counting from 3 May.
    - 1 June, counting from the end of April.
  correct: 0
  explanation: >-
    Reg. 9(א): the periods run from receipt or payment, whichever is later — 6 May. Not counting
    that day, day 30 is 5 June.
- id: m05-026
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 3
  question: >-
    You want the spreadsheet a ministry uses to track grant applications. It offers a printed
    summary report instead. What can you insist on?
  options:
    - A new analysis of the data prepared especially for you.
    - A summary of the data signed by the director general.
    - Nothing; the authority chooses any format it likes freely.
    - The data produced with the ministry's usual tools, such as an export.
  correct: 3
  explanation: >-
    Section 7(ה): records are given as held, without processing for you, but computer data is
    produced by the means the authority normally uses.
- id: m05-027
  module: 5
  lesson: '05.2'
  subject: foi-fees
  difficulty: 3
  question: >-
    A ministry missed the FOI deadline without extending it and then billed production fees for 400
    pages. What is your answer?
  options:
    - Pay for the pages, but refuse to pay the request fee itself.
    - It may charge no handling or production fees after missing it.
    - Pay in full, because producing 400 pages is a real cost.
    - Ask the Administrative Court to reduce the fee by half.
  correct: 1
  explanation: >-
    Reg. 6א: an authority that did not handle the request within the statutory times may not collect
    handling and production fees.
- id: m05-028
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 2
  question: Which bodies are completely outside the FOI Law?
  options:
    - All government companies, whatever their activity.
    - All local authorities and their municipal companies.
    - Bodies listed in s. 14, such as the security services.
    - Every university that receives state funding.
  correct: 2
  explanation: >-
    Section 14 excludes the bodies it lists (for example the ISA and Mossad); government companies,
    local authorities and funded universities are generally covered.
- id: m05-029
  module: 5
  lesson: '05.3'
  subject: foi-follow-up
  difficulty: 1
  question: On day 31 you have no answer and no extension notice. What do you send first?
  options:
    - A reminder citing s. 7(ב) with a short final date.
    - A petition to the High Court of Justice against the minister.
    - A new request for the same information, with a new fee.
    - A fee appeal to the Magistrates' Court of the district.
  correct: 0
  explanation: >-
    A firm reminder citing the missed deadline (and reg. 6א on fees) often resolves the matter,
    while you keep the petition deadline in view.
- id: m05-030
  module: 5
  lesson: '05.3'
  subject: foi-follow-up
  difficulty: 1
  question: Which bodies does the Government FOI Unit supervise?
  options:
    - All public authorities, including municipalities.
    - Government ministries and their auxiliary units.
    - Only the Knesset and the courts.
    - Private companies holding public data.
  correct: 1
  explanation: >-
    The Unit's procedure and the Movement for FOI guide describe complaints about ministries and
    auxiliary units; it has no supervisory role over local authorities.
- id: m05-031
  module: 5
  lesson: '05.3'
  subject: foi-petition
  difficulty: 1
  question: Which court hears a petition against an FOI refusal, when no privilege certificate was issued?
  options:
    - The High Court of Justice.
    - The Magistrates' Court.
    - The Supreme Court as a court of appeal.
    - The Administrative Court.
  correct: 3
  explanation: FOI Law s. 17(א) and First Schedule item 2 send FOI petitions to the Administrative Court.
- id: m05-032
  module: 5
  lesson: '05.3'
  subject: foi-follow-up
  difficulty: 2
  question: 'An extension notice says only: ''We need more time.'' Is it a lawful extension?'
  options:
    - Yes; any written notice extends by 30 days.
    - Yes, if it was sent by the director general.
    - No; an extension must be written and reasoned.
    - No; extensions are never allowed under the FOI Law.
  correct: 2
  explanation: >-
    Section 7(ב) allows a 30-day extension only if the requester is notified in writing with the
    reasons for the need.
- id: m05-033
  module: 5
  lesson: '05.3'
  subject: foi-follow-up
  difficulty: 2
  question: >-
    A ministry gives a reasoned 30-day extension, then on day 60 a further reasoned extension signed
    by the director general because of volume. What is the maximum further extension?
  options:
    - Up to 30 more days.
    - Up to 90 more days.
    - No further extension is allowed.
    - Up to 60 more days.
  correct: 3
  explanation: >-
    Section 7(ג) allows the head of the authority a further reasoned extension for volume or
    complexity, not exceeding 60 days.
- id: m05-034
  module: 5
  lesson: '05.3'
  subject: foi-petition
  difficulty: 2
  question: >-
    The authority wants to release information about a company, which objects. How long does the
    company have to object, and do those days count?
  options:
    - 7 days, which are counted in the 30-day period.
    - 45 days, which are counted in the petition deadline.
    - 21 days, which do not count toward the FOI deadlines.
    - 30 days, which also extend the request-fee period.
  correct: 2
  explanation: >-
    Section 13(א): a third party may object within 21 days; those days are not counted in the s. 7
    periods.
- id: m05-035
  module: 5
  lesson: '05.3'
  subject: foi-petition
  difficulty: 2
  question: Before ordering disclosure that may harm a third party, what must the court do?
  options:
    - Ask the FOI Unit for its opinion.
    - Give the third party a chance to be heard.
    - Wait for the ombudsman's findings.
    - Obtain the minister's written consent.
  correct: 1
  explanation: >-
    FOI Law s. 17(ג): the court will not order disclosure that may harm a third party before giving
    it an opportunity to argue.
- id: m05-036
  module: 5
  lesson: '05.3'
  subject: foi-petition
  difficulty: 3
  question: >-
    A refusal cites internal deliberations (s. 9(ב)(4)) for a report the decision relied on, and the
    decision was made a year ago. Which argument is strongest?
  options:
    - The decision is final, so the report is no longer deliberation; s. 17(ד).
    - The authority must release every internal document on request.
    - Internal documents are always secret, so the request should be dropped.
    - Ask the ombudsman to declare the report a public document.
  correct: 0
  explanation: >-
    Section 9(ב)(4) is discretionary. The court may order disclosure where the public interest
    prevails (s. 17(ד)), and finished decisions weaken the deliberation ground.
- id: m05-037
  module: 5
  lesson: '05.3'
  subject: foi-petition
  difficulty: 3
  question: >-
    An activist complains to the FOI Unit after a written refusal received on 1 March, and waits. On
    20 April the Unit says it cannot help. When was the petition deadline?
  options:
    - 15 April, 45 days from the refusal.
    - 4 June, 45 days from the Unit's answer.
    - 1 March next year, one year later.
    - There is none while a complaint is open.
  correct: 0
  explanation: >-
    The 45 days run from notice of the refusal (reg. 3(ב)); the complaint did not pause them. Now
    only an extension request (reg. 3(ג)) can help.
- id: m05-038
  module: 5
  lesson: '05.3'
  subject: foi-follow-up
  difficulty: 2
  question: >-
    Spot the mistake: a reminder to a municipality's FOI officer says, 'If you do not answer, I will
    complain to the Government FOI Unit.'
  options:
    - Reminders may not mention next steps.
    - A reminder must be sent by registered mail only.
    - The FOI Unit does not supervise municipalities.
    - The reminder should be addressed to the Prime Minister.
  correct: 2
  explanation: >-
    The Government FOI Unit handles ministries and their units. For a municipality the realistic
    next steps are the mayor, the Commissioner or a petition.
- id: m05-039
  module: 5
  lesson: '05.3'
  subject: foi-petition
  difficulty: 2
  question: >-
    A refusal partly withholds a document but does not say whether redacted release was considered.
    Which section supports your challenge?
  options:
    - Section 14, which lists the bodies excluded from the law.
    - Section 11, which requires partial release where possible.
    - Section 5, which deals with the authority's annual report.
    - Section 18, which deals with the fee regulations.
  correct: 1
  explanation: >-
    Section 11 requires the authority to release information with omissions, changes or conditions
    where that is possible without unreasonable resources.
- id: m05-040
  module: 5
  lesson: '05.3'
  subject: foi-follow-up
  difficulty: 3
  question: >-
    A ministry has been silent for 50 days with no extension. You want to protect a petition. Which
    approach is cautious?
  options:
    - Wait until the ministry answers, then count 45 days.
    - Wait three months, since silence then becomes a refusal.
    - File an ombudsman complaint and count from its result.
    - Treat day 30 as the refusal and petition within 45 days of it.
  correct: 3
  explanation: >-
    With silence there is no written decision. Counting from the end of the answer period avoids a
    delay argument (regs 3–4).
- id: m05-041
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 1
  question: Who may file a complaint with the Public Complaints Commissioner?
  options:
    - Only Israeli citizens over 18.
    - Any person.
    - Only people represented by a lawyer.
    - Only residents of the authority complained about.
  correct: 1
  explanation: 'State Comptroller Law s. 33: every person may submit a complaint.'
- id: m05-042
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 1
  question: How much does a complaint to the Commissioner cost?
  options:
    - Nothing; it is free.
    - The same as an FOI request fee.
    - A fee set by the Court Fees Regulations.
    - A deposit returned if the complaint is justified.
  correct: 0
  explanation: Filing with the Commissioner is free and needs no lawyer.
- id: m05-043
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 1
  question: Within how long should a complaint normally be filed?
  options:
    - Within 45 days of the act complained about.
    - Within 30 days of the authority's written answer.
    - Within seven years of the act, like most claims.
    - Within one year of the act or of learning of it.
  correct: 3
  explanation: >-
    Section 39(2): a complaint filed after a year from the act, or from when the complainant learned
    of it, is investigated only for a special reason.
- id: m05-044
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 2
  question: Your phone company overcharged you. Can the Commissioner investigate?
  options:
    - Yes; any company serving the public is covered.
    - Yes, if the overcharge exceeds the small-claims ceiling.
    - No; a private company is not a body under s. 36.
    - Only after the Communications Ministry refuses to act.
  correct: 2
  explanation: >-
    Section 36 covers audited bodies listed in s. 9(1)–(6) and certain others. Private companies go
    to their regulator or to court.
- id: m05-045
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 2
  question: Which complaint is excluded from investigation under s. 38?
  options:
    - A complaint about a municipal clerk's delay.
    - A complaint about a ministry's failure to answer.
    - A complaint about a government company's billing.
    - A complaint about a judicial decision in your case.
  correct: 3
  explanation: >-
    Section 38(4) excludes complaints about judicial or quasi-judicial acts; the others concern
    audited bodies.
- id: m05-046
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 2
  question: >-
    Your elderly neighbour was harmed by a National Insurance delay and asks you to complain for
    her. What do you need?
  options:
    - A power of attorney signed in front of a notary.
    - Her consent, to the Commissioner's satisfaction.
    - A court order appointing you as her guardian.
    - Nothing; anyone may complain about anyone's harm.
  correct: 1
  explanation: >-
    Section 37(1) allows a complaint about harm to another person if the complainant obtained that
    person's consent to the Commissioner's satisfaction.
- id: m05-047
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 2
  question: What can the Commissioner do when it finds a complaint justified?
  options:
    - Point to the defect and how and when to fix it; the body reports back.
    - Order the body to pay compensation that is enforceable in court.
    - Cancel the body's decision with immediate legal effect.
    - Refer the complainant to the HCJ with an automatic fee waiver.
  correct: 0
  explanation: >-
    Section 43(א)–(ב): the Commissioner may point to the need to correct the defect and the way and
    time; the body reports the steps taken.
- id: m05-048
  module: 5
  lesson: '05.4'
  subject: comptroller
  difficulty: 2
  question: >-
    What should you expect after sending general information about a systemic failure to the State
    Comptroller?
  options:
    - A full written ruling on your information within 45 days.
    - A hearing at which you present the evidence in person.
    - An acknowledgement, but no right to updates on its use.
    - A binding order to the audited body to fix the failure.
  correct: 2
  explanation: >-
    The Comptroller's public-inquiries procedure gives an acknowledgement within about two weeks;
    the sender has no standing or right to updates.
- id: m05-049
  module: 5
  lesson: '05.4'
  subject: comptroller
  difficulty: 2
  question: Will the body you report to the State Comptroller learn who you are?
  options:
    - Yes; the body receives the full inquiry with your name on it.
    - Only if you are yourself an employee of a public body.
    - As a rule no; the sender's details are kept confidential.
    - Only once the Comptroller publishes a report on the subject.
  correct: 2
  explanation: >-
    The procedure instructs audit staff not to reveal the sender's identifying details when
    approaching the audited body.
- id: m05-050
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 3
  question: >-
    A council refused your business licence. The law gives you an appeal (ערר) to an appeals board,
    which you did not use. You complain to the Commissioner. What is likely?
  options:
    - Automatic investigation, since the council is an audited body.
    - Investigation only if the Commissioner finds a special reason.
    - Automatic referral of the complaint to the appeals board.
    - Rejection, because licensing decisions are judicial acts.
  correct: 1
  explanation: >-
    Section 39(1): a complaint about a decision open to objection, appeal-board or appeal is
    investigated only for a special reason.
- id: m05-051
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 3
  question: >-
    A complaint is still under investigation when the petition deadline approaches. The
    Commissioner's office says 'wait for us'. What do you do?
  options:
    - File the petition on time and inform the Commissioner.
    - Wait, since the office asked you to.
    - Ask the Commissioner to extend the court deadline.
    - Withdraw the complaint and restart it after the case.
  correct: 0
  explanation: >-
    Section 45(א)(2): a complaint does not extend a statutory deadline. Note that once the matter is
    pending in court the Commissioner may stop (ss. 38(5), 42).
- id: m05-052
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 2
  question: Which of these is NOT required for a complaint under s. 34?
  options:
    - The complainant's name.
    - The complainant's address.
    - The complainant's signature.
    - A lawyer's signature.
  correct: 3
  explanation: >-
    Section 34 requires the complaint to be signed by the complainant and to state their name and
    address. No lawyer is needed.
- id: m05-053
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 1
  question: What is the main legal purpose of a pre-petition letter?
  options:
    - To start the 45-day deadline for filing a petition.
    - To exempt the petitioner from paying the court fee.
    - To show the court you exhausted remedies first.
    - To notify the court registry that a petition is coming.
  correct: 2
  explanation: >-
    Courts expect a prior written demand; the regulations require it to be attached to an
    administrative petition (reg. 5(ב)(6)).
- id: m05-054
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 1
  question: To whom should the pre-petition letter be sent?
  options:
    - The court registry, with a copy to the authority.
    - The decision-maker, copied to the legal adviser.
    - The Attorney General only, as head of the legal system.
    - The authority's spokesperson, who answers the public.
  correct: 1
  explanation: >-
    The decision-maker can change the decision; the legal adviser assesses the risk of a petition
    and often drives the answer.
- id: m05-055
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 2
  question: 'Spot the mistake in this remedy paragraph: ''I demand that you act fairly and lawfully.'''
  options:
    - It is too specific for the authority to be able to answer.
    - It should be written in English for the legal department.
    - It should cite the court fee schedule for the petition.
    - It names no decision and no specific act to be done.
  correct: 3
  explanation: >-
    A remedy should mirror the court order you would ask for: cancel decision X of date Y, or do act
    Z by a date.
- id: m05-056
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 2
  question: Does a request to reconsider a decision restart the 45-day petition deadline?
  options:
    - Assume not; count from the original decision.
    - Yes, always from the date of the new answer.
    - Yes, but only for HCJ petitions.
    - No deadline applies once you have written.
  correct: 0
  explanation: >-
    A repeated request does not reliably create a new decision. Plan the letter inside the 45 days
    from the original decision.
- id: m05-057
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 2
  question: Why should a pre-petition letter avoid insults and threats?
  options:
    - Insults make the letter legally void.
    - The judge will read it as an exhibit.
    - The authority may charge a fee for rude letters.
    - Threats automatically extend the deadline.
  correct: 1
  explanation: >-
    The letter is attached to the petition; a calm, factual letter supports you, while an abusive
    one undermines you before the court.
- id: m05-058
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 2
  question: What should the letter ask for besides the remedy, if you lack the authority's reasons?
  options:
    - A meeting with the minister.
    - A waiver of the court fee.
    - The documents the decision relied on.
    - A copy of the petition the authority expects.
  correct: 2
  explanation: >-
    Asking for the documents (and filing an FOI request in parallel) lets you see the real reasons
    before you draft the petition.
- id: m05-059
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 3
  question: >-
    A decision was given on 1 September. You send a letter on 5 September giving 10 days. The
    authority answers on 14 September with a new reason. What now?
  options:
    - Answer both reasons in a petition filed before 16 October.
    - Start a new 45-day period from the answer of 14 September.
    - Send a second letter giving the authority 30 more days.
    - Complain to the ombudsman and wait for its findings first.
  correct: 0
  explanation: >-
    The deadline from 1 September is 16 October. A new reason does not reset it; the petition
    answers both reasons.
- id: m05-060
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 3
  question: A demolition is scheduled for tomorrow morning. Can you petition without a pre-petition letter?
  options:
    - No; a letter giving at least 7 days is always required.
    - Yes, and the petition need not mention the missing letter.
    - No; urgent cases must go to the ombudsman instead.
    - Yes, explaining the urgency; still email the authority today.
  correct: 3
  explanation: >-
    Reg. 5(ב)(6) allows a petition without a prior approach if you give the reasons; an email the
    same day shows good faith.
- id: m05-061
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 2
  question: Which defect statement belongs in a pre-petition letter?
  options:
    - The official who decided is often rude to the public.
    - The decision is unpopular with residents on social media.
    - The decision relied on a consideration foreign to the law.
    - The municipality's budget is generally wasteful and opaque.
  correct: 2
  explanation: >-
    Each defect should be a legal one — authority, extraneous considerations, reasonableness,
    hearing, reasons, discrimination — with its rule.
- id: m05-062
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 1
  question: What does 'בלי לפגוע בזכויות' at the top of the letter signal?
  options:
    - You waive your right to petition.
    - You keep all your other claims and rights.
    - The letter is confidential and cannot be used.
    - The authority need not answer in writing.
  correct: 1
  explanation: >-
    'Without prejudice to rights' tells the reader that the letter does not give up any claim you
    may have.
- id: m05-063
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 3
  question: >-
    A group wants to petition the HCJ against a national decision taken 6 months ago, about which
    they learned the same week. They never wrote. What is the biggest risk?
  options:
    - Dismissal for delay and for not exhausting remedies.
    - Dismissal because only lawyers write to ministers.
    - Transfer to the Magistrates' Court.
    - An automatic fee doubling for late petitions.
  correct: 0
  explanation: >-
    The HCJ applies the delay doctrine and requires a prior demand. Six silent months answer
    neither.
- id: m05-064
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 2
  question: Which response date is most defensible when the decision was 5 days ago and nothing is urgent?
  options:
    - About 45 days.
    - Within 24 hours.
    - Three months, as in the Decisions and Reasons Law.
    - About 10–14 days.
  correct: 3
  explanation: >-
    Ten to fourteen days is fair to the authority and still leaves time to file inside the 45-day
    petition deadline.
- id: m05-065
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 1
  question: Within how many days of the decision must an administrative petition normally be filed?
  options:
    - 30 days.
    - 45 days.
    - 60 days.
    - 90 days.
  correct: 1
  explanation: >-
    Administrative Courts (Procedure) Regulations, reg. 3(ב): without delay and no later than 45
    days, unless another law sets a deadline.
- id: m05-066
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 1
  question: Which court district hears an administrative petition?
  options:
    - Where the decision was made, or where the land lies.
    - The district where the petitioner lives or works.
    - Always the Jerusalem District Court, for every authority.
    - The district where the authority's lawyer has an office.
  correct: 0
  explanation: 'Reg. 2(א): the court in whose area the decision was given; for land, where the land lies.'
- id: m05-067
  module: 5
  lesson: '05.6'
  subject: petition-affidavit
  difficulty: 1
  question: What must support the facts in an administrative petition?
  options:
    - A letter from a lawyer.
    - A police report.
    - A signed statement from the authority.
    - An affidavit in Form 2.
  correct: 3
  explanation: 'Reg. 5(ג): the facts are verified by an attached affidavit in Form 2.'
- id: m05-068
  module: 5
  lesson: '05.6'
  subject: service
  difficulty: 1
  question: Who serves the petition on the respondents?
  options:
    - The court registry, after the judge reads it.
    - The police, at the court's request.
    - The petitioner, within three days of filing.
    - The respondents collect it from Net HaMishpat.
  correct: 2
  explanation: >-
    Reg. 35(א): a pleading filed in court is served directly on the other parties no later than
    three days after filing.
- id: m05-069
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 2
  question: >-
    Spot the mistake: an administrative petition's jurisdiction paragraph says only 'This court has
    jurisdiction.'
  options:
    - It must cite the empowering law and the First Schedule item.
    - It must also cite the petitioner's identity number there.
    - It should be placed at the end, after the remedies.
    - Jurisdiction is never stated in a self-represented petition.
  correct: 0
  explanation: >-
    Reg. 5(ב)(3א) requires the source of subject-matter and local jurisdiction, including the
    empowering enactment and the First Schedule item.
- id: m05-070
  module: 5
  lesson: '05.6'
  subject: petition-affidavit
  difficulty: 2
  question: >-
    In your petition affidavit you state that the mayor met the developer, which you heard from a
    council member. How should it appear?
  options:
    - As personal knowledge, since you trust the source.
    - Not at all; hearsay can never appear in affidavits.
    - In the petition text only, not in the affidavit.
    - As a belief, naming the council member as the source.
  correct: 3
  explanation: >-
    Reg. 5(ג) requires separating personal knowledge from belief and stating the source of each
    belief.
- id: m05-071
  module: 5
  lesson: '05.6'
  subject: court-fees
  difficulty: 2
  question: Which document proves inability to pay at first sight in a fee-exemption request?
  options:
    - A letter from your employer praising your work.
    - A bank statement showing one month's balance.
    - A court fee exemption granted in the last two years.
    - A pre-petition letter sent to the authority.
  correct: 2
  explanation: >-
    Reg. 14(ד) lists prima facie proof: a court exemption within two years, a limited-means debtor
    order, bankruptcy or insolvency proceedings.
- id: m05-072
  module: 5
  lesson: '05.6'
  subject: court-fees
  difficulty: 2
  question: Does filing a fee-exemption request cost a fee?
  options:
    - Yes, half of the petition fee.
    - No; such requests are fee-free.
    - Yes, the full petition fee, refunded later.
    - Only if the request is rejected.
  correct: 1
  explanation: Reg. 20(4) of the Court Fees Regulations exempts requests for a fee exemption from fees.
- id: m05-073
  module: 5
  lesson: '05.6'
  subject: court-fees
  difficulty: 3
  question: Besides inability to pay, what else does the court consider in a fee-exemption request?
  options:
    - Whether the petitioner has a lawyer.
    - Whether the authority agrees to the exemption.
    - Whether the petition is shorter than ten pages.
    - Whether the proceeding shows a cause of action.
  correct: 3
  explanation: >-
    Reg. 14(ג): the court may exempt if the applicant cannot pay and the proceeding appears to
    disclose a cause of action.
- id: m05-074
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 2
  question: >-
    After a preliminary look, what may the judge do with a petition that shows no cause for
    intervention on its face?
  options:
    - Dismiss it at the threshold, possibly with costs.
    - Send it to the ombudsman for an investigation.
    - Order the authority to pay the petitioner's fee.
    - Convert it into a small claim in the same court.
  correct: 0
  explanation: >-
    Reg. 7(א)(2) allows dismissal on the face of the petition, and reg. 41(ב) allows costs in favour
    of the State Treasury.
- id: m05-075
  module: 5
  lesson: '05.6'
  subject: interim-orders
  difficulty: 2
  question: How do you ask the Administrative Court to stop a decision until judgment?
  options:
    - A sentence asking for it in the petition's introduction.
    - A separate request with an affidavit, served the same day.
    - An email to the authority's legal adviser asking it to wait.
    - A phone call to the court registry asking for a freeze.
  correct: 1
  explanation: >-
    Reg. 9(א) requires a separate request supported by an affidavit; reg. 35(ב) requires same-day
    service.
- id: m05-076
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 2
  question: >-
    If the court orders a full answer, how long does the respondent have unless the court sets
    another time?
  options:
    - 30 days.
    - 15 days.
    - 60 days.
    - 7 days.
  correct: 2
  explanation: >-
    Reg. 10(א): a response (כתב תשובה) is filed within 60 days unless the court sets a different
    time.
- id: m05-077
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 3
  question: Your petition wins a partial remedy and you want to appeal. What is the deadline and the court?
  options:
    - 30 days, to the District Court president.
    - 45 days, to the High Court of Justice.
    - 60 days, to the Supreme Court.
    - 90 days, to a panel of the same court.
  correct: 2
  explanation: >-
    Reg. 33(א): an appeal as of right against a judgment of the Administrative Court is filed within
    60 days, to the Supreme Court.
- id: m05-078
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 3
  question: >-
    A month after you filed, the authority gives you everything you asked for and you withdraw. What
    can you ask about the fee?
  options:
    - Nothing; court fees are never refunded once paid.
    - A full refund plus interest at double the usual rate.
    - A transfer of the fee to any future petition you file.
    - A refund of most of it, minus a fixed deduction.
  correct: 3
  explanation: >-
    Regs 15 and 6(ב) provide a refund on early termination, minus the sum in item 33 of the
    schedule; check the conditions with the registry.
- id: m05-079
  module: 5
  lesson: '05.6'
  subject: service
  difficulty: 3
  question: >-
    You uploaded the petition on Sunday but serve the respondents only on Thursday of the next week.
    What is the problem?
  options:
    - Service was late; the rule is three days after filing.
    - None, since service of a petition has no deadline.
    - The petition is granted because the respondents delayed.
    - Service is the court's job, so your service is invalid.
  correct: 0
  explanation: >-
    Reg. 35(א) sets three days; reg. 7(ב) keeps the petition from the judge until proof of service
    is filed.
- id: m05-080
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 2
  question: Which matter must a petition disclose under reg. 5(ב)(9)?
  options:
    - The petitioner's income during the last six months.
    - Any other proceeding on the same facts, even if finished.
    - The names of the judges the petitioner would prefer.
    - The petitioner's political or organisational affiliation.
  correct: 1
  explanation: >-
    Reg. 5(ב)(9) requires disclosure of any other court or tribunal proceeding on the same facts or
    decision, including one that ended.
- id: m05-081
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 1
  question: How does an unrepresented petitioner file an administrative petition online?
  options:
    - By email straight to the office of the duty judge.
    - Through the FOI Unit's online complaint form.
    - Through Net HaMishpat, with National Digital Identity.
    - Through the State Comptroller's online complaint form.
  correct: 2
  explanation: >-
    The judiciary's guide for unrepresented parties describes filing in Net HaMishpat with National
    Digital Identity.
- id: m05-082
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 1
  question: What does an HCJ petition ask for first?
  options:
    - An order nisi (צו על תנאי).
    - A final order without a hearing.
    - A declaration of the petitioner's rights.
    - Damages from the respondent.
  correct: 0
  explanation: >-
    Reg. 1: a request for an order nisi is filed as a petition; if granted, the respondent must show
    cause why it should not become absolute.
- id: m05-083
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 1
  question: What address must an HCJ petitioner give?
  options:
    - Any email address, anywhere.
    - An address for service inside Israel.
    - The address of a lawyer.
    - The address of the Supreme Court registry.
  correct: 1
  explanation: >-
    Reg. 3: the petitioner states an address for service within the State; delivery there is valid
    service.
- id: m05-084
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 1
  question: How must an HCJ petition be laid out under reg. 2?
  options:
    - Double-sided, with margins of at least 2 cm.
    - In a bound booklet with only a table of contents.
    - Handwritten in full, to show it is the petitioner's own.
    - On one side of the page, with 5 cm margins or more.
  correct: 3
  explanation: >-
    Reg. 2: the petition follows Form 1 and is written on one side of the page with margins of at
    least five centimetres.
- id: m05-085
  module: 5
  lesson: '05.7'
  subject: hcj-threshold
  difficulty: 2
  question: Which petitioner is most likely to be called a public petitioner?
  options:
    - One whose own building permit was refused by the council.
    - A company suing the State for profits it says it lost.
    - A lawyer acting for a paying client in a public matter.
    - One raising an important public matter without personal harm.
  correct: 3
  explanation: >-
    Public-petitioner standing covers people who raise important public matters without a personal
    interest; lesson 04.5 covers its limits.
- id: m05-086
  module: 5
  lesson: '05.7'
  subject: hcj-threshold
  difficulty: 2
  question: Why does an HCJ petition need a section explaining why the HCJ is the right forum?
  options:
    - The HCJ hears only cases involving ministers.
    - The HCJ hears only what no other court or tribunal can hear.
    - The Knesset must approve each HCJ petition.
    - Every petition must first be refused by a District Court.
  correct: 1
  explanation: >-
    Basic Law: The Judiciary s. 15(ג) limits the HCJ to matters not within another court's or
    tribunal's jurisdiction.
- id: m05-087
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 2
  question: After filing an HCJ petition, when must you serve later filings on the other parties?
  options:
    - The same day you file them.
    - Within 45 days.
    - Only when the court orders it.
    - After the first hearing.
  correct: 0
  explanation: >-
    Reg. 8א: after the petition is filed, a party filing a pleading serves a copy with its
    attachments on every other party the same day.
- id: m05-088
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 2
  question: The HCJ issues an order nisi. What must the respondent file to oppose it?
  options:
    - Nothing; the order becomes absolute automatically.
    - A new petition of its own against the petitioner.
    - An answering affidavit in Form 3, within the time set.
    - A fee-exemption request to the Supreme Court registry.
  correct: 2
  explanation: >-
    Reg. 9(א): a respondent who opposes making the order absolute files an answering affidavit (Form
    3), within eight days or as the court directs.
- id: m05-089
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 2
  question: >-
    The State files an update notice that it changed the decision you challenged. What usually
    happens?
  options:
    - The petition continues to a full judgment regardless of the change.
    - The petition may be deleted as redundant, often with costs for you.
    - You must pay the State's costs because it changed its decision.
    - The case moves to the Administrative Court for a fresh hearing.
  correct: 1
  explanation: >-
    When the remedy is given, petitions are typically deleted as redundant (התייתרות); the court may
    award costs to the petitioner.
- id: m05-090
  module: 5
  lesson: '05.7'
  subject: hcj-threshold
  difficulty: 3
  question: >-
    A petitioner challenges a 2-year-old government decision on which many people already relied,
    explaining nothing about the gap. Which threshold ground is most likely to defeat it?
  options:
    - Delay (שיהוי).
    - Lack of a fee exemption.
    - The petition being in Hebrew.
    - The State Comptroller's prior report.
  correct: 0
  explanation: >-
    The delay doctrine looks at how long the petitioner waited, harm to reliance, and the rule of
    law; an unexplained two-year gap is a classic case.
- id: m05-091
  module: 5
  lesson: '05.7'
  subject: hcj-threshold
  difficulty: 3
  question: >-
    A petitioner asks the HCJ to cancel an FOI refusal by a ministry, without any privilege
    certificate. What will the court likely say?
  options:
    - 'Correct forum: ministries are always HCJ matters.'
    - 'Wrong forum: FOI goes to the Magistrates'' Court.'
    - Correct forum, if the petitioner is a public petitioner.
    - 'Wrong forum: FOI petitions go to the Administrative Court.'
  correct: 3
  explanation: >-
    FOI Law s. 17(א) and First Schedule item 2 send FOI petitions to the Administrative Court; only
    a privilege certificate moves them to the Supreme Court.
- id: m05-092
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 3
  question: You plan to file an HCJ petition yourself next Thursday. What should you have done by Monday?
  options:
    - Asked the Attorney General to accept the petition first.
    - Booked a hearing date for the petition with the registry.
    - Confirmed the filing route and fee payment by phone.
    - Sent the draft petition to the ombudsman for a review.
  correct: 2
  explanation: >-
    The online route for unrepresented HCJ petitioners was not confirmed officially; calling ahead
    avoids losing the filing day.
- id: m05-093
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 2
  question: Which document must be attached to, or written at the end of, every HCJ petition?
  options:
    - A letter of support from an NGO.
    - The State's answer to the petition.
    - The petitioner's affidavit in Form 2.
    - A lawyer's opinion on the merits.
  correct: 2
  explanation: 'Reg. 4: every petition is supported by an affidavit in Form 2, attached or recorded at its end.'
- id: m05-094
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 2
  question: When must skeleton arguments be filed in the HCJ, unless the court says otherwise?
  options:
    - At least three days before the hearing.
    - On the morning of the hearing itself.
    - Together with the original petition.
    - Within 60 days after the hearing ends.
  correct: 0
  explanation: >-
    Reg. 16(א): each party files skeleton arguments and serves them at least three days before the
    hearing date.
- id: m05-095
  module: 5
  lesson: '05.7'
  subject: hcj-threshold
  difficulty: 1
  question: Which of these is a threshold ground, decided before the merits of an HCJ petition?
  options:
    - The reasonableness of the decision.
    - The proportionality of the measure.
    - The weight of the evidence.
    - Failure to exhaust remedies.
  correct: 3
  explanation: >-
    Threshold grounds include exhaustion, delay, standing, alternative remedy and justiciability;
    reasonableness and proportionality are merits questions.
