- id: m01-045
  module: 1
  lesson: '01.4'
  subject: forum-choice
  difficulty: 2
  question: >-
    A resident is fined under a municipal by-law for an unlicensed protest stand and wants to
    contest it. Which court hears it?
  options:
    - The High Court of Justice.
    - The Local Affairs Court.
    - The Regional Labour Court.
    - The small claims court.
  correct: 1
  explanation: 'Courts Law s. 55: the Local Affairs Court hears offences under municipal ordinances and by-laws.'
- id: m01-046
  module: 1
  lesson: '01.4'
  subject: forum-choice
  difficulty: 2
  question: >-
    An individual claims ₪3,000 from a shop that refused to serve her. Which forum is designed for
    this?
  options:
    - The small claims court.
    - The District Court.
    - The High Court of Justice.
    - The Administrative Affairs Court.
  correct: 0
  explanation: >-
    Small claims courts hear individuals' money claims up to a ceiling (see current numbers), with
    simple procedure.
- id: m01-047
  module: 1
  lesson: '01.4'
  subject: forum-choice
  difficulty: 3
  question: >-
    Why does the High Court of Justice decline a petition that belongs to the Administrative Affairs
    Court?
  options:
    - It hears only criminal matters, never administrative ones.
    - It never hears petitions brought by private individuals.
    - It hears only cases in which the Knesset is a party.
    - It hears only matters not within another court's jurisdiction.
  correct: 3
  explanation: Section 15(c) gives it matters "אשר אינם בסמכותו של בית משפט או של בית דין אחר".
- id: m01-048
  module: 1
  lesson: '01.4'
  subject: courts-map
  difficulty: 2
  question: Which kind of court decides the divorce of a Muslim couple in Israel?
  options:
    - The High Court of Justice, sitting as the first instance.
    - A Sharia court, a religious court with jurisdiction set by law.
    - The Regional Labour Court, as a dispute about support.
    - The Local Affairs Court of the couple's municipality.
  correct: 1
  explanation: >-
    Religious courts hold judicial power as set by law (Basic Law: The Judiciary s. 1(b)); personal
    status matters go to them.
- id: m01-049
  module: 1
  lesson: '01.4'
  subject: appeals
  difficulty: 2
  question: >-
    You lost an administrative petition in the Administrative Affairs Court. Where does the appeal
    go?
  options:
    - To the Magistrates' Court in the same district.
    - To the High Court of Justice, as a fresh petition.
    - To the same court, before a different judge.
    - To the Supreme Court, as an administrative appeal (עע״ם).
  correct: 3
  explanation: >-
    Judgments of the District Court, including as Administrative Affairs Court, are appealed to the
    Supreme Court.
- id: m01-050
  module: 1
  lesson: '01.4'
  subject: forum-choice
  difficulty: 3
  question: >-
    An NGO considers a High Court petition while a planning appeals committee could still hear the
    same issue. What risk matters most?
  options:
    - The High Court may fine NGOs that petition too often.
    - The committee can transfer the case to the Labour Court.
    - The petition may fail for skipping the committee first.
    - Filing in both places is an offence under s. 96.
  correct: 2
  explanation: >-
    Courts expect you to use the forum the law sets and to exhaust remedies first. A special
    tribunal comes before the High Court.
- id: m01-051
  module: 1
  lesson: '01.4'
  subject: courts-map
  difficulty: 1
  question: Which court hears most criminal cases at first instance?
  options:
    - The Supreme Court.
    - The High Court of Justice.
    - The Magistrates' Court.
    - The Regional Labour Court.
  correct: 2
  explanation: >-
    Courts Law s. 51(a)(1): offences punishable by up to seven years' prison go to the Magistrates'
    Court.
- id: m01-052
  module: 1
  lesson: '01.4'
  subject: appeals
  difficulty: 2
  question: What is "רשות ערעור"?
  options:
    - Leave to appeal, needed when no appeal as of right exists.
    - An automatic right of appeal from every decision.
    - A further hearing of a case before a larger panel.
    - An order nisi that the court gives to an authority.
  correct: 0
  explanation: >-
    First-instance judgments are appealable as of right (s. 17). Other decisions, or a second
    appeal, usually need leave.
- id: m01-053
  module: 1
  lesson: '01.4'
  subject: appeals
  difficulty: 2
  question: What is a "דיון נוסף"?
  options:
    - A retrial of a criminal case after new evidence is found.
    - An appeal from the Magistrates' Court to the District Court.
    - A further hearing in the Supreme Court, before five or more justices.
    - A hearing on a bill in the Knesset Constitution Committee.
  correct: 2
  explanation: >-
    Basic Law: The Judiciary s. 18: a matter decided by three justices may get a further hearing
    before five or more.
- id: m01-054
  module: 1
  lesson: '01.4'
  subject: forum-choice
  difficulty: 3
  question: >-
    Before choosing a court for a challenge to an authority's decision, which question does the
    lesson say to ask?
  options:
    - Whether the official who signed it has served for more than a year.
    - Whether its subject is in the Administrative Courts Law's first schedule.
    - Whether the decision was reported in the national media.
    - Whether the authority has lost a petition in the past.
  correct: 1
  explanation: >-
    If the subject is listed, start in the Administrative Affairs Court; if not, and it is a state
    body, the High Court of Justice.
- id: m01-055
  module: 1
  lesson: '01.4'
  subject: courts-map
  difficulty: 1
  question: >-
    The labour courts have exclusive (ייחודית) jurisdiction over employee–employer disputes. What
    does that mean?
  options:
    - They hear them only if both sides agree to it.
    - Any court may hear them; labour courts are just faster.
    - Only the labour courts may hear those disputes.
    - They hear those disputes only on appeal.
  correct: 2
  explanation: >-
    Labour Court Law s. 24 gives regional labour courts exclusive jurisdiction; other courts cannot
    hear those claims.
- id: m01-056
  module: 1
  lesson: '01.4'
  subject: courts-map
  difficulty: 1
  question: A civil money claim is above the Magistrates' Court ceiling. Which court hears it?
  options:
    - The small claims court.
    - The Local Affairs Court.
    - The High Court of Justice.
    - The District Court.
  correct: 3
  explanation: >-
    Courts Law s. 40(1): the District Court hears civil matters not within the Magistrates' Court's
    jurisdiction.
- id: m01-057
  module: 1
  lesson: '01.5'
  subject: statute-structure
  difficulty: 1
  question: In "סעיף 63(ב)(3)", what is "(ב)"?
  options:
    - A paragraph.
    - A chapter.
    - A subsection.
    - A schedule.
  correct: 2
  explanation: Section 63, subsection (ב), paragraph (3).
- id: m01-058
  module: 1
  lesson: '01.5'
  subject: legal-hebrew
  difficulty: 1
  question: In a definition, what does "לרבות" do?
  options:
    - It cuts out an exception from the term.
    - It limits the term to the listed items only.
    - It makes the term subject to another section.
    - 'It widens the term: the list is not closed.'
  correct: 3
  explanation: '"לרבות" means including. "למעט" is the word that cuts out exceptions.'
- id: m01-059
  module: 1
  lesson: '01.5'
  subject: legal-hebrew
  difficulty: 2
  question: Section 6 opens "על אף האמור בסעיף 5". What does it mean?
  options:
    - Section 6 applies only after section 5 has been applied.
    - Section 5 overrides section 6 where the two conflict.
    - Section 6 overrides section 5 where the two conflict.
    - Both sections are void because they contradict each other.
  correct: 2
  explanation: '"על אף" (notwithstanding) means this section wins over the one it names.'
- id: m01-060
  module: 1
  lesson: '01.5'
  subject: legal-hebrew
  difficulty: 2
  question: A section says it applies "בכפוף לסעיף 12". What does that mean?
  options:
    - This section wins over section 12.
    - Section 12 has since been repealed.
    - Section 12 is only a definition section.
    - Section 12 wins where the two conflict.
  correct: 3
  explanation: '"בכפוף ל…" (subject to) means the other section prevails.'
- id: m01-061
  module: 1
  lesson: '01.5'
  subject: legal-hebrew
  difficulty: 2
  question: Three conditions in a section are joined by "או". What follows?
  options:
    - All three must be met together.
    - Only the first condition counts.
    - They apply only inside a court.
    - Meeting any one of them is enough.
  correct: 3
  explanation: >-
    "או" (or) makes alternatives; "ו" (and) makes cumulative conditions. Small words, big
    consequences.
- id: m01-062
  module: 1
  lesson: '01.5'
  subject: statute-structure
  difficulty: 1
  question: Where in a law do you usually find its definitions?
  options:
    - In the last schedule, after the signatures.
    - In the minutes of the Knesset debate on the law.
    - In an early section, often s. 1 or 2, headed הגדרות.
    - Only in the regulations made under the law.
  correct: 2
  explanation: >-
    Most laws define their terms near the start. The Interpretation Law's definitions also apply
    unless the law says otherwise.
- id: m01-063
  module: 1
  lesson: '01.5'
  subject: statute-structure
  difficulty: 2
  question: A section says the authority acts "בעניין המנוי בתוספת". Where do you look?
  options:
    - In the Basic Law that the section relates to.
    - On the website of the responsible minister.
    - In the definitions of the Interpretation Law.
    - In the schedule at the end of the law.
  correct: 3
  explanation: >-
    A תוספת (schedule) is a list at the end of the law that sections refer to, like the first
    schedule of the Administrative Courts Law.
- id: m01-064
  module: 1
  lesson: '01.5'
  subject: deadlines
  difficulty: 3
  question: >-
    An objection period is two months from publication on 15 March. Under Interpretation Law s.
    10(b), when does it end?
  options:
    - On 14 May, the day before the same date.
    - On 16 May, the day after the same date.
    - On 14 May, after exactly 60 calendar days.
    - On 15 May.
  correct: 3
  explanation: >-
    Section 10(b): a period in months ends in the last month on the day with the same number as the
    event day. Months are not counted as 30-day blocks.
- id: m01-065
  module: 1
  lesson: '01.5'
  subject: deadlines
  difficulty: 3
  question: A 14-day period ends on a Saturday. What does Interpretation Law s. 10(c) say?
  options:
    - The period ends on the Friday before the Saturday.
    - Saturdays never count, so add one day for each Saturday.
    - The period is cancelled and must be started again.
    - The Saturday does not count, so the period runs to the next day.
  correct: 3
  explanation: >-
    Rest days inside a period count, "זולת אם הם הימים האחרונים שבתקופה" — unless they are the last
    days.
- id: m01-066
  module: 1
  lesson: '01.5'
  subject: legal-hebrew
  difficulty: 2
  question: What does "דינו – מאסר שנה" at the end of a section signal?
  options:
    - A criminal penalty for breaking the section.
    - A definition of a term used in the law.
    - A deadline the authority must meet.
    - A fee payable to the court registry.
  correct: 0
  explanation: >-
    "דינו" introduces a penalty. Bar Association Law s. 96 uses the same form for the fine for
    unauthorised practice.
- id: m01-067
  module: 1
  lesson: '01.5'
  subject: statute-structure
  difficulty: 2
  question: 'On Wikisource, a section shows "תיקון: תשפ״ד". What should you do?'
  options:
    - Ignore it; amendments apply only to new cases.
    - Assume the whole section has been repealed.
    - Make sure you read the text as amended that year.
    - Cite the original text, which still binds.
  correct: 2
  explanation: >-
    The note means the section changed in that year. Read the current text and, for recent changes,
    check the Knesset database.
- id: m01-068
  module: 1
  lesson: '01.5'
  subject: citation
  difficulty: 3
  question: 'A draft letter says: "Under the law, you must grant my request." What is its main weakness?'
  options:
    - It is too polite; letters must threaten court.
    - It cites no section, so nobody can check the duty.
    - It should be written in English for officials.
    - It should quote a news article as support.
  correct: 1
  explanation: Cite the smallest unit and the full title. A claimed duty without a section is easy to dismiss.
- id: m01-069
  module: 1
  lesson: '01.5'
  subject: statute-structure
  difficulty: 2
  question: A law says "השר רשאי להתקין תקנות בכל הנוגע לביצועו". What does it tell you?
  options:
    - Regulations may exist under this law; look for them.
    - The minister must issue regulations within 30 days.
    - The law has no effect until regulations are made.
    - Regulations under it override the law itself.
  correct: 0
  explanation: >-
    A regulations power tells you where to look for the next rung of the hierarchy. "רשאי" means the
    minister may, not must.
- id: m01-070
  module: 1
  lesson: '01.5'
  subject: citation
  difficulty: 1
  question: In a full Hebrew citation of a provision, what follows the section number?
  options:
    - The page number on Wikisource.
    - The name of the responsible minister.
    - The law's full title with its year.
    - The number of the Knesset session.
  correct: 2
  explanation: 'For example: "סעיף 20(3) לחוק לשכת עורכי הדין, התשכ״א–1961".'
- id: m01-071
  module: 1
  lesson: '01.6'
  subject: case-numbers
  difficulty: 1
  question: What does the prefix "בג״ץ" in a case number mean?
  options:
    - A civil appeal to the Supreme Court.
    - A High Court of Justice petition.
    - A criminal appeal to the Supreme Court.
    - A claim in the small claims court.
  correct: 1
  explanation: 'בג״ץ stands for בית משפט גבוה לצדק: the Supreme Court hearing petitions against authorities.'
- id: m01-072
  module: 1
  lesson: '01.6'
  subject: case-numbers
  difficulty: 1
  question: What does the prefix "ע״פ" indicate?
  options:
    - A civil claim.
    - An administrative petition.
    - A further hearing.
    - A criminal appeal.
  correct: 3
  explanation: >-
    ע״פ is ערעור פלילי. A civil appeal is ע״א, an administrative petition עת״מ, a further hearing
    דנ״א or דנג״ץ.
- id: m01-073
  module: 1
  lesson: '01.6'
  subject: case-numbers
  difficulty: 2
  question: What does the number "5658/23" tell you?
  options:
    - Decided on 5 June 2023 at 8 o'clock.
    - Case number 5658, opened in 2023.
    - Volume 5658, page 23 of the official reports.
    - The 23rd hearing in case number 5658.
  correct: 1
  explanation: Supreme Court case numbers are a running number and the year the case was opened.
- id: m01-074
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 2
  question: A ruling ends "העתירה נדחית. העותרים יישאו בהוצאות המשיבים". What happened?
  options:
    - Petition granted; respondents pay the petitioners' costs.
    - Petition dismissed; petitioners pay the respondents' costs.
    - Petition postponed; costs to be decided at a later date.
    - Petition dismissed; each side bears its own costs.
  correct: 1
  explanation: נדחית means dismissed; יישאו בהוצאות means they bear the costs. Costs are a real risk of losing.
- id: m01-075
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 2
  question: Which question best identifies a ruling's holding?
  options:
    - Which paragraph is quoted most often in the media?
    - Which justice wrote the longest opinion in the case?
    - What rule did the court need to decide this case?
    - What did the losing side argue in its summary?
  correct: 2
  explanation: >-
    The holding is the rule necessary to decide the case. Famous or long passages may be remarks in
    passing.
- id: m01-076
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 1
  question: In a panel judgment, what does "אני מסכים" signal?
  options:
    - A justice joining another's opinion.
    - A justice writing a dissent.
    - The parties reaching a settlement.
    - The case being sent back down.
  correct: 0
  explanation: Short concurrences show who joined which opinion, which tells you where the majority is.
- id: m01-077
  module: 1
  lesson: '01.6'
  subject: finding-rulings
  difficulty: 2
  question: Where can you read a free English translation of a landmark Israeli Supreme Court opinion?
  options:
    - Nevo's case-law pages, which are open to all.
    - Takdin, the commercial legal database.
    - The Knesset's national legislation database.
    - Versa, the Cardozo Israeli Supreme Court Project.
  correct: 3
  explanation: >-
    Versa is free. Nevo case-law pages and Takdin are paid, and the Knesset database holds
    legislation, not rulings.
- id: m01-078
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 3
  question: >-
    Before quoting a 2019 Supreme Court holding in your petition, what check does the lesson
    recommend?
  options:
    - Check that the judges who wrote it are still serving.
    - Check that the parties agreed to the ruling's publication.
    - Search for a later further hearing or ruling that changed it.
    - Check that the holding was reported in English as well.
  correct: 2
  explanation: >-
    A holding can be reversed in a further hearing (דנג״ץ, דנ״א) or overtaken by a later ruling or
    law.
- id: m01-079
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 2
  question: What is the difference between "החלטה" and "פסק דין"?
  options:
    - A decision is interim or procedural; a judgment ends the case.
    - They are two names for exactly the same court document.
    - A decision is a ruling given only by the Supreme Court.
    - A judgment is the final ruling given only in criminal cases.
  correct: 0
  explanation: >-
    Courts give many decisions along the way (on deadlines, requests, interim orders) and one
    judgment at the end.
- id: m01-080
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 3
  question: >-
    A news headline says "Court lets protest go ahead". Your protest differs in place and size. What
    is the next step?
  options:
    - Quote the headline in your letter as the court's holding.
    - Assume all protests of any kind are now allowed.
    - Ignore it, since news reports cannot be checked.
    - Read the ruling's holding and conditions before relying on it.
  correct: 3
  explanation: >-
    Headlines drop the conditions. Only the holding, read in the ruling itself, tells you whether it
    covers your case.
- id: m01-081
  module: 1
  lesson: '01.6'
  subject: case-numbers
  difficulty: 2
  question: In a Magistrates' Court, what is "ת״א 1234-05-25"?
  options:
    - A Tel Aviv appeal from the year 2025.
    - An administrative appeal from May 2005.
    - A criminal case, number 1234 of 2025.
    - A civil claim opened in May 2025.
  correct: 3
  explanation: >-
    ת״א is תביעה אזרחית (a civil claim), not Tel Aviv. Lower courts number cases as
    number–month–year.
- id: m01-082
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 2
  question: In a 5–4 Supreme Court ruling, whose opinion states the law that binds lower courts?
  options:
    - The President's opinion, on whichever side it falls.
    - The majority's, even if a minority opinion is longer.
    - The longest opinion, since it gives the most reasons.
    - The minority's, if it cites more earlier precedents.
  correct: 1
  explanation: 'Only the majority''s holding is "הלכה" under Basic Law: The Judiciary s. 20.'
- id: m01-083
  module: 1
  lesson: '01.6'
  subject: finding-rulings
  difficulty: 1
  question: Roughly which years does the free Supreme Court search cover well?
  options:
    - From 1948 onward, completely.
    - Only rulings from 2020 onward.
    - From about 1997 onward.
    - Only rulings translated into English.
  correct: 2
  explanation: >-
    Older landmark rulings need Versa, Wikipedia summaries or a law library. Lesson 02.2 teaches the
    search.
- id: m01-084
  module: 1
  lesson: '01.6'
  subject: holdings-and-opinions
  difficulty: 3
  question: During your petition, the High Court issues a "צו על תנאי". What does it mean for you?
  options:
    - You have won the case, and the proceedings are now over.
    - The respondent must explain why your order should not be given.
    - Your petition was dismissed without any hearing at all.
    - You must pay a deposit before the hearing can take place.
  correct: 1
  explanation: >-
    An order nisi shifts the burden to the respondent to justify itself. It is a good sign, but not
    yet a win.
- id: m02-001
  module: 2
  lesson: '02.1'
  subject: official-gazette
  difficulty: 1
  question: Where is the official, binding text of a new Israeli law first published?
  options:
    - In Reshumot, the official gazette (Sefer HaHukim series).
    - On the Knesset's YouTube channel after the final vote.
    - In the Supreme Court's annual law reports.
    - On Hebrew Wikisource, which the Knesset updates directly.
  correct: 0
  explanation: >-
    Laws are published in Reshumot; Sefer HaHukim is the series for Knesset laws. Wikisource and
    other sites are copies.
- id: m02-002
  module: 2
  lesson: '02.1'
  subject: official-gazette
  difficulty: 1
  question: A citation reads 'ק״ת תשפ״ו, 508'. What kind of document is it?
  options:
    - A Knesset law in Sefer HaHukim.
    - A Supreme Court judgment in the law reports.
    - Regulations or a notice in Kovetz HaTakanot.
    - A bill published for first reading.
  correct: 2
  explanation: >-
    ק״ת stands for קובץ התקנות, the gazette series for regulations and notices such as yearly fee
    updates.
- id: m02-003
  module: 2
  lesson: '02.1'
  subject: consolidated-text
  difficulty: 1
  question: Why does the Courts Law carry '[נוסח משולב]' in its title?
  options:
    - It was translated from an English Mandate ordinance and re-issued in Hebrew.
    - It is a temporary provision with an end date.
    - It applies only together with another law.
    - It was re-enacted with all its amendments merged into one text.
  correct: 3
  explanation: >-
    A consolidated version merges the law's amendments into one text (Law and Administration
    Ordinance s. 16(ד)).
- id: m02-004
  module: 2
  lesson: '02.1'
  subject: current-text
  difficulty: 2
  question: >-
    You are checking a law on Wikisource. Which part of the page tells you most quickly how up to
    date the copy claims to be?
  options:
    - The last entry in the box of Reshumot publications at the top.
    - The date the law was first enacted, which appears in its full title.
    - The number of sections in the law.
    - The talk page where volunteers discuss edits.
  correct: 0
  explanation: >-
    The top box lists the original law and each amendment with year and page; the newest entry shows
    the latest amendment the copy includes.
- id: m02-005
  module: 2
  lesson: '02.1'
  subject: current-text
  difficulty: 2
  question: >-
    The newest amendment shown on Wikisource and on the Knesset database page is the same 2021
    amendment. What does that tell you?
  options:
    - The law cannot be amended again before 2031.
    - The Wikisource copy is very likely current, pending any brand-new amendment.
    - You must still pay for a commercial database to confirm the text is current.
    - The law has been repealed and replaced.
  correct: 1
  explanation: >-
    Matching amendment lists in both sources is the main currency check; for a key filing you may
    also open the gazette PDF.
- id: m02-006
  module: 2
  lesson: '02.1'
  subject: indirect-amendment
  difficulty: 3
  question: >-
    A deadline in the law you rely on was changed by a section buried in a budget 'arrangements'
    law. Where are you most likely to catch this?
  options:
    - In the law's own title, which changes after every amendment.
    - In the English translation on a university website.
    - In the Knesset database's full amendment list for your law.
    - In the explanatory notes of the original bill from decades ago.
  correct: 2
  explanation: >-
    Indirect amendments (תיקון עקיף) are made by other laws. The Knesset database lists them on the
    amended law's page.
- id: m02-007
  module: 2
  lesson: '02.1'
  subject: commencement
  difficulty: 2
  question: >-
    A law was published in Reshumot on 5 March and says nothing about when it starts. From when does
    it apply?
  options:
    - From 5 March, the day of publication.
    - From 1 January of the next year.
    - From 30 days after publication.
    - From the day the Knesset passed it in third reading.
  correct: 0
  explanation: >-
    Unless the law sets another date, legislation takes effect on publication in Reshumot (Law and
    Administration Ordinance s. 10(א)).
- id: m02-008
  module: 2
  lesson: '02.1'
  subject: commencement
  difficulty: 1
  question: At what time of day does a provision come into force on its commencement day?
  options:
    - At 08:00, when government offices open.
    - At noon, Israel time.
    - At midnight at the end of that day.
    - At 00:01 at the start of that day.
  correct: 3
  explanation: 'Interpretation Law s. 21: a provision takes effect at 00.01 on its commencement day.'
- id: m02-009
  module: 2
  lesson: '02.1'
  subject: temporary-provision
  difficulty: 2
  question: >-
    The section you need is marked 'הוראת שעה' with an end date that passed last month. What should
    you check?
  options:
    - Whether it was extended, and what text applies now that it ended.
    - Nothing; temporary provisions stay in force until repealed.
    - Whether the Supreme Court approved the provision.
    - Whether an English translation of the provision exists.
  correct: 0
  explanation: >-
    A temporary provision ends on its date unless extended. Check the amendment list for an
    extension and read the permanent text that now applies.
- id: m02-010
  module: 2
  lesson: '02.1'
  subject: binding-version
  difficulty: 2
  question: >-
    An old Mandate ordinance exists in an English original and a Hebrew 'נוסח חדש'. Which text
    binds?
  options:
    - The English original, because it came first.
    - The Hebrew new version.
    - Whichever text favours the citizen.
    - Both equally, so a court must reconcile them.
  correct: 1
  explanation: >-
    Interpretation Law s. 24: where a new version was set under s. 16 of the Law and Administration
    Ordinance, the new version binds.
- id: m02-011
  module: 2
  lesson: '02.1'
  subject: regulations
  difficulty: 2
  question: >-
    You need the fee in a set of regulations that are updated every year. The Wikisource page notes
    'מעודכנים לשנת 2025' and it is now late 2026. What do you do?
  options:
    - Use the amounts shown, since regulations rarely change.
    - Add 3% to each amount as an estimate of the yearly inflation update.
    - Find the newer update notice in the gazette or on Current Numbers.
    - Ask on a social-media group what the fee is now.
  correct: 2
  explanation: >-
    The note shows the copy is a year behind. The yearly update is published as a notice in Kovetz
    HaTakanot; the course's Current Numbers page tracks it.
- id: m02-012
  module: 2
  lesson: '02.1'
  subject: law-card
  difficulty: 1
  question: Which of these belongs on a law card but is most often forgotten?
  options:
    - The colour of the gazette's cover.
    - The name of the minister who proposed the bill.
    - The number of Knesset members who voted for it.
    - The Hebrew year in the law's full title.
  correct: 3
  explanation: >-
    The full title includes the Hebrew year (for example התשי״ט–1958); it identifies the law
    precisely, since titles can repeat.
- id: m02-013
  module: 2
  lesson: '02.1'
  subject: free-sources
  difficulty: 1
  question: Which of these is a free source for consolidated statute texts?
  options:
    - Nevo's statute pages under law_html.
    - Nevo's case-law pages under psika_html.
    - Takdin's full database.
    - A paid law-firm newsletter.
  correct: 0
  explanation: >-
    Nevo's statute pages are free; its case-law pages and full search are paid, as are Takdin and
    similar databases.
- id: m02-014
  module: 2
  lesson: '02.1'
  subject: current-text
  difficulty: 3
  question: >-
    Wikisource shows a newer amendment than the Knesset database page, which seems not to list it.
    What is the sensible conclusion?
  options:
    - Wikisource invented the amendment, so ignore it.
    - Open the gazette PDF the Wikisource box links to and confirm it.
    - The Knesset page is official, so the amendment does not exist.
    - Use whichever version supports your argument.
  correct: 1
  explanation: >-
    When copies disagree, the gazette decides. Wikisource links each amendment to its scanned
    gazette PDF.
- id: m02-015
  module: 2
  lesson: '02.2'
  subject: case-numbers
  difficulty: 1
  question: What does 'בג״ץ' in a case number mean?
  options:
    - An appeal from a district court in a civil case.
    - A petition to the High Court of Justice.
    - A further hearing before an expanded panel.
    - A petition to an administrative court.
  correct: 1
  explanation: >-
    בג״ץ is the Supreme Court sitting as the High Court of Justice, hearing petitions against public
    authorities.
- id: m02-016
  module: 2
  lesson: '02.2'
  subject: case-numbers
  difficulty: 2
  question: A municipal decision cites 'עת״מ 35192-09-24'. What can you tell from the number?
  options:
    - It is a Supreme Court appeal from 2009.
    - It is a High Court of Justice petition, number 35192, filed in 2024.
    - It is a district administrative petition opened in September 2024.
    - It is a criminal case from 1924.
  correct: 2
  explanation: >-
    עת״מ is an administrative petition in a district court; the Net HaMishpat format is
    serial-month-year.
- id: m02-017
  module: 2
  lesson: '02.2'
  subject: case-numbers
  difficulty: 2
  question: You see 'דנג״ץ' followed by a number. What kind of proceeding is it?
  options:
    - A further hearing of an HCJ ruling before a larger panel.
    - A petition filed by a government body.
    - An appeal to the president for a pardon.
    - A district court's review of a local authority's bylaw on appeal.
  correct: 0
  explanation: >-
    דנג״ץ is a further hearing (דיון נוסף) of a High Court of Justice ruling, under Courts Law s.
    30.
- id: m02-018
  module: 2
  lesson: '02.2'
  subject: judgment-search
  difficulty: 1
  question: >-
    From which year does the Supreme Court's free judgments search hold the court's judgments and
    decisions?
  options:
    - From 1948, the founding of the state.
    - From 1980, the Foundations of Law Act.
    - Only from 2020 onward.
    - From 1997 onward.
  correct: 3
  explanation: >-
    The site states it holds Supreme Court judgments and decisions from 1997, plus judgments printed
    in the reports from 2006.
- id: m02-019
  module: 2
  lesson: '02.2'
  subject: judgment-search
  difficulty: 2
  question: You want every HCJ ruling in which a particular NGO was a party. Which search field fits best?
  options:
    - The parties, judges and counsel field (שופטים, צדדים ובאי כח).
    - The document date field only.
    - The page-count sort option.
    - The previous-instance field (ערכאה קודמת), filled in with the NGO's name.
  correct: 0
  explanation: Searching by party name finds the cases where that NGO appeared; then filter by proceeding type.
- id: m02-020
  module: 2
  lesson: '02.2'
  subject: judgment-search
  difficulty: 2
  question: >-
    Your free-text search for an issue returns 400 results, most of them interim decisions. What is
    the most efficient next step?
  options:
    - Read all 400 from oldest to newest.
    - Filter to judgments and relevant proceedings, newest first.
    - Give up and search a paid database.
    - Open the five longest documents, since they are the most important.
  correct: 1
  explanation: >-
    Filtering to final judgments and relevant proceedings, sorted by date, cuts the list to what
    matters.
- id: m02-021
  module: 2
  lesson: '02.2'
  subject: precedent
  difficulty: 1
  question: Which courts are bound by a rule set by the Supreme Court?
  options:
    - Only the court that heard the case.
    - Only district courts.
    - Every court except the Supreme Court itself.
    - No court at all; rulings are only persuasive.
  correct: 2
  explanation: >-
    Basic Law: The Judiciary s. 20(ב): a Supreme Court rule binds every court except the Supreme
    Court.
- id: m02-022
  module: 2
  lesson: '02.2'
  subject: precedent
  difficulty: 2
  question: >-
    A district court ruled in your favour on a legal question. How should you present it to a
    different district court?
  options:
    - As binding, since all district courts are equal.
    - As binding only if the ruling is newer than five years.
    - It cannot be mentioned at all.
    - As persuasive support, not binding authority.
  correct: 3
  explanation: >-
    A lower-court ruling guides only courts below it (s. 20(א)); another district court may
    disagree.
- id: m02-023
  module: 2
  lesson: '02.2'
  subject: holding-vs-obiter
  difficulty: 3
  question: >-
    A judge remarks in passing that 'perhaps a different result would follow if the authority had
    given reasons'. The case was decided on another ground. How strong is this remark?
  options:
    - 'It is obiter: worth mentioning, but not a binding rule.'
    - It is the binding holding, because a Supreme Court judge wrote it.
    - It overrules earlier rulings on the same point.
    - It binds the authority but not the courts.
  correct: 0
  explanation: >-
    A remark that does not decide the case is obiter (אמרת אגב). It can support an argument but
    binds no one.
- id: m02-024
  module: 2
  lesson: '02.2'
  subject: good-law-check
  difficulty: 2
  question: >-
    Besides searching for a further hearing, what is the best free way to find out how later courts
    treated a ruling?
  options:
    - Email the judges who wrote it.
    - Search its case number as free text in the judgments search.
    - Look up the ruling's page count.
    - Check whether the ruling was reported in the national newspapers.
  correct: 1
  explanation: >-
    Later rulings that cite it appear in a free-text search of its number; read the newest to see
    whether they follow or narrow it.
- id: m02-025
  module: 2
  lesson: '02.2'
  subject: good-law-check
  difficulty: 3
  question: >-
    A 2012 ruling interpreted section 9 of a law. In 2020 section 9 was rewritten. What does that
    mean for the ruling?
  options:
    - Nothing; rulings stay binding regardless of later legislation.
    - It is automatically void, even if the wording barely changed.
    - Check whether the new wording changes the point it decided.
    - It becomes binding only on the Supreme Court.
  correct: 2
  explanation: >-
    A ruling interprets a text. If the text changed, compare the old and new wording before relying
    on the ruling.
- id: m02-026
  module: 2
  lesson: '02.2'
  subject: versa
  difficulty: 1
  question: What is Versa useful for?
  options:
    - Filing petitions online.
    - Paying court fees.
    - Searching District Court decisions by party name and date.
    - Reading English translations of landmark rulings.
  correct: 3
  explanation: >-
    Versa (Cardozo School of Law) translates key Supreme Court opinions; you quote the Hebrew
    original in filings.
- id: m02-027
  module: 2
  lesson: '02.2'
  subject: publication-bans
  difficulty: 2
  question: >-
    You want to post a photo you took inside a courtroom during a hearing about your protest. What
    does the Courts Law require?
  options:
    - The court's permission to photograph and publish.
    - Nothing, provided that the hearing was open to the public.
    - Only the consent of the other party.
    - Only blurring the judge's face.
  correct: 0
  explanation: >-
    Courts Law s. 70(ב)(1): no photography in a courtroom, or publication of such a photo, without
    the court's permission.
- id: m02-028
  module: 2
  lesson: '02.2'
  subject: publication-bans
  difficulty: 3
  question: >-
    A suspect in your case was questioned yesterday and has not been charged or brought before a
    judge. Can you publish their name on your campaign page?
  options:
    - Yes, because a police investigation is always a matter of public interest.
    - Not yet; s. 70(ד1) bars it for a time unless an exception applies.
    - Yes, if you add the word 'allegedly'.
    - Only after the police publish a press release.
  correct: 1
  explanation: >-
    Courts Law s. 70(ד1) bars publishing an uncharged suspect's name for 48 hours or until the first
    hearing, subject to listed exceptions.
- id: m02-029
  module: 2
  lesson: '02.3'
  subject: primary-secondary
  difficulty: 1
  question: Which of these is a primary legal source?
  options:
    - A Kol Zchut page on tenants' rights.
    - A law journal article criticising a ruling.
    - A regulation published in Kovetz HaTakanot.
    - A think-tank report on housing policy.
  correct: 2
  explanation: >-
    Laws, regulations and rulings are primary. Guides, articles and reports about them are
    secondary.
- id: m02-030
  module: 2
  lesson: '02.3'
  subject: primary-secondary
  difficulty: 1
  question: >-
    According to the Foundations of Law Act, where does a court turn first for an answer to a legal
    question?
  options:
    - Law journal articles by leading professors.
    - Kol Zchut and similar public guides.
    - Foreign courts' rulings.
    - Legislation, binding case law and analogy.
  correct: 3
  explanation: >-
    Section 1 lists legislation, binding precedent and analogy, then the principles of Jewish
    heritage. Secondary sources are not on the list.
- id: m02-031
  module: 2
  lesson: '02.3'
  subject: kol-zchut
  difficulty: 1
  question: On a Kol Zchut page, where do you usually find the laws and regulations the page is based on?
  options:
    - In the 'מקורות משפטיים ורשמיים' section near the bottom.
    - In the page's title and in its opening summary paragraph.
    - In the comments from readers.
    - In the donation box.
  correct: 0
  explanation: Kol Zchut pages end with a list of legal and official sources, linking to the primary texts.
- id: m02-032
  module: 2
  lesson: '02.3'
  subject: kol-zchut
  difficulty: 2
  question: >-
    A Kol Zchut page you rely on was last updated three years ago. What is the risk you most need to
    manage?
  options:
    - The page may be deleted before you finish reading.
    - Numbers and procedures may have changed since.
    - Older pages may not be quoted in letters.
    - The page may only exist in Hebrew.
  correct: 1
  explanation: >-
    Check the 'עודכן לאחרונה' date; verify any number, deadline or procedure against the current
    primary source.
- id: m02-033
  module: 2
  lesson: '02.3'
  subject: knesset-research
  difficulty: 1
  question: Who are Knesset Research and Information Center papers written for?
  options:
    - Members of Knesset and Knesset committees.
    - Judges deciding pending cases.
    - Lawyers preparing for the bar exam.
    - Government ministries' legal departments.
  correct: 0
  explanation: >-
    The center serves MKs and committees with research, data and comparative studies, independent of
    the ministries.
- id: m02-034
  module: 2
  lesson: '02.3'
  subject: knesset-research
  difficulty: 2
  question: >-
    A Knesset Research paper from 2019 says a certain ministry is responsible for your issue. How do
    you use this today?
  options:
    - Quote it as the legal basis in your letter.
    - Ignore it, since it is more than five years old.
    - Use it only if an MK sends it to you.
    - Check the current law to confirm who is responsible.
  correct: 3
  explanation: >-
    Research papers are dated; responsibilities can move. Use the paper to find the law, then verify
    the law as it stands.
- id: m02-035
  module: 2
  lesson: '02.3'
  subject: verification
  difficulty: 2
  question: Which statement from a secondary source must you always verify before using it in a letter?
  options:
    - A description of the history of the law.
    - A summary of a debate between scholars.
    - A deadline or fee that applies to your request.
    - A comparison with laws in other countries.
  correct: 2
  explanation: >-
    Numbers and deadlines change and carry real consequences; always check them against the primary
    source and Current Numbers.
- id: m02-036
  module: 2
  lesson: '02.3'
  subject: verification
  difficulty: 3
  question: >-
    A respected law-journal article states that a ruling 'established' a right you need. You open
    the ruling and the point is only a remark in passing. What do you do?
  options:
    - Quote the article, since the author is an expert.
    - Treat it as obiter and look for a later ruling that adopted it.
    - Drop the issue entirely.
    - Quote the remark as the holding, since the article supports you.
  correct: 1
  explanation: >-
    Secondary sources can overstate. Treat the remark as obiter and search for later rulings that
    made it a holding.
- id: m02-037
  module: 2
  lesson: '02.3'
  subject: viewpoints
  difficulty: 2
  question: >-
    Your issue involves a contested public debate. Which source mix gives you the most reliable
    picture?
  options:
    - Two opposing organisations' papers plus a Knesset Research paper.
    - Three detailed papers from the organisation whose view you support.
    - Only social-media posts by people affected.
    - Only the government's press releases.
  correct: 0
  explanation: >-
    Opposing papers reveal the counter-arguments; a Knesset Research paper adds neutral background.
    Then verify against primary sources.
- id: m02-038
  module: 2
  lesson: '02.3'
  subject: think-tanks
  difficulty: 2
  question: >-
    An NGO's position paper proposes a legal change and describes current law. How should you treat
    its description of current law?
  options:
    - As binding, since NGOs are expert in their field.
    - As irrelevant, since position papers are always wrong.
    - As accurate only if the NGO is registered as an amuta.
    - As a lead to check, since the paper argues one side.
  correct: 3
  explanation: >-
    Position papers are written to persuade. Their description of the law may be accurate, but check
    it against the primary sources.
- id: m02-039
  module: 2
  lesson: '02.3'
  subject: citation
  difficulty: 2
  question: In a letter, how may you properly use data from a Knesset Research paper?
  options:
    - As the legal basis for the authority's duty.
    - As background data, attributed to its source.
    - As a binding instruction to the ministry.
    - Only if you attach the whole paper.
  correct: 1
  explanation: >-
    Research data can support the facts, attributed to the Knesset Research and Information Center.
    The legal basis must be a law or ruling.
- id: m02-040
  module: 2
  lesson: '02.3'
  subject: source-map
  difficulty: 1
  question: What makes a source map useful months later?
  options:
    - A date on every source showing when it was checked.
    - Colour-coding by the author's political view.
    - Listing sources alphabetically by title.
    - Including only sources that support you.
  correct: 0
  explanation: Dates tell you which sources need re-checking; the course dates every check for that reason.
- id: m02-041
  module: 2
  lesson: '02.3'
  subject: ag-guidelines
  difficulty: 3
  question: >-
    A secondary source mentions an Attorney General guideline on your issue. Why is it worth finding
    and reading?
  options:
    - It binds the courts in exactly the same way as a Knesset statute.
    - It replaces the need to read the law.
    - Officials are expected to follow it, so it shapes decisions.
    - It can only be read by government lawyers.
  correct: 2
  explanation: >-
    Attorney General guidelines bind inside government. They are not statutes, but officials are
    expected to follow them.
- id: m02-042
  module: 2
  lesson: '02.4'
  subject: irac
  difficulty: 1
  question: In IRAC, what does the 'A' stand for?
  options:
    - 'Application: matching the facts to each element.'
    - 'Appeal: the next court you would go to.'
    - 'Authority: the body you are writing to.'
    - 'Argument: the emotional case for your cause.'
  correct: 0
  explanation: Issue, Rule, Application, Conclusion. The application is the longest part.
- id: m02-043
  module: 2
  lesson: '02.4'
  subject: irac
  difficulty: 2
  question: Which is the best-formed issue statement for an argument?
  options:
    - The municipality treats our neighbourhood badly.
    - Is the council's refusal to explain its decision lawful?
    - Many laws apply to this situation, including several Basic Laws.
    - We want a playground and the council should build one.
  correct: 1
  explanation: >-
    An issue is a single question the reader can answer. Complaints and wishes belong in the facts
    and conclusion.
- id: m02-044
  module: 2
  lesson: '02.4'
  subject: irac
  difficulty: 2
  question: In a letter to an official, why do Israeli practitioners usually put the facts before the law?
  options:
    - Because the law may only be quoted at the end.
    - Because officials are not allowed to read the law first.
    - Because the reader needs the facts for the law to make sense.
    - Because facts outrank law in administrative matters.
  correct: 2
  explanation: >-
    Facts first gives the reader the context; the quoted rule then lands on a situation they already
    understand.
- id: m02-045
  module: 2
  lesson: '02.4'
  subject: elements
  difficulty: 2
  question: >-
    Section 2(א) of the Decisions and Reasons Law applies when a public servant is asked in writing
    to use a legal power. Which situation does NOT meet the elements?
  options:
    - A letter to a municipal engineer asking to approve a sign.
    - An email to a ministry official asking for a licence.
    - A registered letter asking a regional council for a permit.
    - A request made aloud to the mayor at a public meeting.
  correct: 3
  explanation: >-
    The section requires a written request. A conversation, however public, does not start the 45
    days.
- id: m02-046
  module: 2
  lesson: '02.4'
  subject: elements
  difficulty: 2
  question: >-
    Your element table shows a fact for 'written request' but nothing in the 'proof' column. What is
    the best fix?
  options:
    - List the copy of the letter and the delivery confirmation.
    - Delete the element, since everyone knows a request was sent.
    - Write 'the authority knows' in the proof column.
    - Replace the fact with a stronger adjective.
  correct: 0
  explanation: >-
    Each fact needs proof the authority or court can see. A copy and a delivery receipt prove the
    written request.
- id: m02-047
  module: 2
  lesson: '02.4'
  subject: elements
  difficulty: 3
  question: >-
    Your rule has four elements. You can prove three, and the fourth is doubtful. What is the
    soundest strategy?
  options:
    - Argue the three strong elements and stay silent on the fourth.
    - 'Address the fourth openly: get proof, or add an alternative rule.'
    - Claim all four are proven to sound confident.
    - Wait until the authority raises the fourth element itself.
  correct: 1
  explanation: >-
    The authority will find the weak element. Address it directly, gather proof, or add an
    alternative argument that does not need it.
- id: m02-048
  module: 2
  lesson: '02.4'
  subject: counter-argument
  difficulty: 2
  question: What is the main purpose of an 'even if' (גם אם) paragraph?
  options:
    - To apologise in advance for possible mistakes.
    - To list unrelated complaints against the authority.
    - To show you win even if their best point is right.
    - To repeat your conclusion in stronger words.
  correct: 2
  explanation: >-
    An alternative argument shows you win even if the authority's point is accepted, closing its
    easy way out.
- id: m02-049
  module: 2
  lesson: '02.4'
  subject: counter-argument
  difficulty: 3
  question: >-
    A council will probably answer that it has no budget for your request. How do you prepare for
    this in your argument?
  options:
    - Ignore it, since budget is never relevant in administrative law.
    - Promise to raise the money yourselves.
    - Criticise the council's budget priorities at length.
    - Show the duty is mandatory, or that a cheaper step meets it.
  correct: 3
  explanation: >-
    Anticipate the likely answer: show that the law requires action, or that a lower-cost step
    satisfies the duty.
- id: m02-050
  module: 2
  lesson: '02.4'
  subject: conclusion
  difficulty: 1
  question: Which conclusion is easiest for an authority to act on?
  options:
    - Install a speed bump on HaZait Street by 1 March.
    - Please treat our residents fairly and equally.
    - We expect you to do the right thing for everyone.
    - Act according to all the laws that apply here.
  correct: 0
  explanation: >-
    A specific act with a date gives the authority something to approve, and makes a refusal or
    silence clear.
- id: m02-051
  module: 2
  lesson: '02.4'
  subject: authorities
  difficulty: 2
  question: How should you cite a ruling in your argument so a reader can check it quickly?
  options:
    - By the headline of the newspaper story that reported it.
    - By case number, parties and the relevant paragraph.
    - By the name of the judge alone.
    - By the year only.
  correct: 1
  explanation: >-
    Case number, parties and paragraph let the reader go straight to the holding in the free
    judgments search.
- id: m02-052
  module: 2
  lesson: '02.4'
  subject: decisions-and-reasons
  difficulty: 1
  question: >-
    Under s. 2א of the Decisions and Reasons Law, what must a public servant do when refusing a
    written request?
  options:
    - Offer a meeting with the minister.
    - Pay the requester's costs.
    - Give the reasons in writing.
    - Publish the refusal on its website.
  correct: 2
  explanation: Section 2א requires written reasons for a refusal; s. 3 lists narrow exceptions.
- id: m02-053
  module: 2
  lesson: '02.4'
  subject: decisions-and-reasons
  difficulty: 2
  question: >-
    Which of these is a listed exception that allows a public servant not to give reasons for a
    refusal?
  options:
    - The requester did not pay the processing fee.
    - The official is too busy.
    - The request was written in Arabic.
    - Giving reasons would harm state security.
  correct: 3
  explanation: >-
    Section 3(2) covers state security or foreign relations. Being busy, language or fees are not
    exceptions.
- id: m02-054
  module: 2
  lesson: '02.4'
  subject: decisions-and-reasons
  difficulty: 3
  question: >-
    An authority refused without reasons, citing one of the s. 3 exceptions. What does s. 4 let you
    do?
  options:
    - Appeal (ערר) to the responsible minister within 30 days.
    - Nothing; an exception ends the matter.
    - Go directly to the Supreme Court without any letter.
    - Demand compensation from the official personally.
  correct: 0
  explanation: >-
    Section 4: the official must tell you which exception applies, and you may appeal to the
    responsible minister within 30 days of the notice.
- id: m02-055
  module: 2
  lesson: '02.4'
  subject: style
  difficulty: 1
  question: Which sentence belongs in a legal argument?
  options:
    - This scandalous decision shocks every decent person.
    - The decision was made on 3 May without a hearing.
    - Everyone knows the council hates our neighbourhood.
    - This is the worst decision in the city's history.
  correct: 1
  explanation: Facts with proof persuade; adjectives and accusations invite a defensive reply.
- id: m02-056
  module: 2
  lesson: '02.5'
  subject: addressee
  difficulty: 1
  question: To whom should a formal request to use a legal power usually be addressed?
  options:
    - The official who holds the power, copying the legal adviser.
    - The authority's general information inbox.
    - The newspaper that covers the authority.
    - The most senior elected politician you can find at that authority.
  correct: 0
  explanation: >-
    Write to the post the law names; the legal adviser's copy helps the request get proper legal
    attention.
- id: m02-057
  module: 2
  lesson: '02.5'
  subject: addressee
  difficulty: 2
  question: >-
    The law gives a power to 'the district planning officer', but you only know the ministry's
    general address. What do you do first?
  options:
    - Send it to the general address, without naming any official.
    - Find the post holder's name and address, and write to them.
    - Send it to the Prime Minister's office.
    - Phone the ministry instead of writing.
  correct: 1
  explanation: A letter to the named post holder starts the deadline sooner and is harder to lose.
- id: m02-058
  module: 2
  lesson: '02.5'
  subject: letter-structure
  difficulty: 1
  question: What is the 'הנדון' line in a Hebrew formal letter?
  options:
    - The closing greeting before the signature.
    - The list of attachments.
    - The one-line subject of the letter.
    - The copy list at the bottom.
  correct: 2
  explanation: הנדון is the subject line; it should say in one line what you want.
- id: m02-059
  module: 2
  lesson: '02.5'
  subject: letter-structure
  difficulty: 1
  question: What does 'בלי לפגוע בזכויות' at the top of a letter signal?
  options:
    - That the letter is confidential.
    - That the writer is a lawyer.
    - That the letter is the final demand before going to court.
    - That the writer keeps all other rights and claims.
  correct: 3
  explanation: 'It means ''without prejudice to rights'': nothing in the letter waives other claims.'
- id: m02-060
  module: 2
  lesson: '02.5'
  subject: letter-structure
  difficulty: 2
  question: >-
    Your letter mentions 'the attached photos' but the attachments are not numbered or listed. Why
    does this matter?
  options:
    - Later, nobody can tell which photo the letter relied on.
    - Photos may not be attached to letters to authorities.
    - Unnumbered attachments make the whole letter void.
    - The authority must return unnumbered attachments.
  correct: 0
  explanation: Numbered, listed attachments (נספחים) become clear exhibits in any later complaint or petition.
- id: m02-061
  module: 2
  lesson: '02.5'
  subject: proof-of-receipt
  difficulty: 2
  question: Which is the strongest proof that a council received your letter on a specific date?
  options:
    - A note in your diary that you posted it.
    - A signed registered-mail delivery confirmation.
    - A friend who saw you post it.
    - A screenshot of the draft in your word processor.
  correct: 1
  explanation: The deadline runs from receipt; a signed delivery card shows the authority received it and when.
- id: m02-062
  module: 2
  lesson: '02.5'
  subject: proof-of-receipt
  difficulty: 2
  question: You hand-deliver a letter to a ministry office. What should you ask for?
  options:
    - A receipt for parking.
    - The clerk's personal phone number.
    - A copy stamped with the date received.
    - A meeting with the minister on the spot.
  correct: 2
  explanation: A stamped 'נתקבל' copy with the date is proof of receipt.
- id: m02-063
  module: 2
  lesson: '02.5'
  subject: deadlines
  difficulty: 2
  question: >-
    A request was received on 20 May. Using the Interpretation Law, on what date do three months
    end?
  options:
    - 19 August.
    - 18 August.
    - 21 August.
    - 20 August.
  correct: 3
  explanation: >-
    A period in months ends on the same-numbered day of the last month (s. 10(ב)), so three months
    from 20 May end on 20 August.
- id: m02-064
  module: 2
  lesson: '02.5'
  subject: deadlines
  difficulty: 3
  question: The 45th day for an answer falls on a Saturday. What does the Interpretation Law say?
  options:
    - A period ending on a rest day runs to the next day.
    - The deadline moves back to the Thursday before.
    - Saturdays never count in any period at all.
    - The authority gets an extra week to answer.
  correct: 0
  explanation: >-
    Section 10(ג): rest days count, unless they are the last days of the period; then the period
    ends on the next working day.
- id: m02-065
  module: 2
  lesson: '02.5'
  subject: deadlines
  difficulty: 2
  question: When does s. 2 of the Decisions and Reasons Law NOT give the authority 45 days?
  options:
    - When the requester is a company.
    - When another law sets a different deadline.
    - When the request is longer than two pages.
    - When the request is sent by email.
  correct: 1
  explanation: 'Section 2(ב)(2): if another law sets another deadline, that deadline applies.'
- id: m02-066
  module: 2
  lesson: '02.5'
  subject: deemed-refusal
  difficulty: 2
  question: Why does it matter that silence for three months counts as a refusal under s. 6(ב)?
  options:
    - It gives you a decision you can challenge.
    - It means the authority must pay you compensation.
    - It means your request is automatically approved.
    - It cancels your right to apply again.
  correct: 0
  explanation: >-
    A deemed refusal lets you move to the next step (complaint, appeal or petition) instead of
    waiting indefinitely.
- id: m02-067
  module: 2
  lesson: '02.5'
  subject: choosing-the-tool
  difficulty: 2
  question: >-
    You want copies of the council's internal reports about a dangerous junction. Which tool fits
    best?
  options:
    - A general letter asking the council to act.
    - An affidavit describing the junction.
    - A Freedom of Information request.
    - A small claims suit.
  correct: 2
  explanation: >-
    Information held by a public authority is requested under the Freedom of Information Law (lesson
    05.2).
- id: m02-068
  module: 2
  lesson: '02.5'
  subject: tone
  difficulty: 1
  question: What tone works best in a first letter to an authority?
  options:
    - Angry, to show how serious you are.
    - Informal and chatty, to build rapport.
    - Threatening, naming the court you will go to.
    - Polite, factual and short.
  correct: 3
  explanation: >-
    Officials respond best to letters that make it easy to say yes. Save firmer language for the
    follow-up demand.
- id: m02-069
  module: 2
  lesson: '02.5'
  subject: spot-the-mistake
  difficulty: 3
  question: >-
    Spot the main mistake: 'To the municipality. We ask you to deal with the noise. Please reply.
    Thanks, residents.' (sent by email to info@)
  options:
    - It is far too short to be taken seriously by any official.
    - No addressee, facts, law, specific request or signatory.
    - It should have been written in English.
    - It thanks the municipality, which weakens it.
  correct: 1
  explanation: >-
    The letter lacks every element that starts a deadline and makes a refusal challengeable: the
    right official, facts, law, a specific request and a named writer.
- id: m02-070
  module: 2
  lesson: '02.5'
  subject: acting-for-others
  difficulty: 3
  question: >-
    Your residents' committee wants to send a letter in the committee's name. You are a member and
    will write it, unpaid. Is this within the limits the course teaches?
  options:
    - Yes; helping your own group act in its own name is fine.
    - No; only a lawyer may write any letter for a group.
    - Yes, but only if you sign it as 'legal adviser'.
    - No; committees may not write to authorities.
  correct: 0
  explanation: >-
    Bar Association Law s. 20 targets acting for others as an occupation or for payment. A member
    writing for their own group, in its name, is fine.
- id: m02-071
  module: 2
  lesson: '02.6'
  subject: affidavit-basics
  difficulty: 1
  question: What makes a written statement an affidavit under the Evidence Ordinance?
  options:
    - It is printed on official paper.
    - It is longer than one page.
    - An authorised person gave the warning and certified it.
    - It was drafted, printed and stamped by a licensed lawyer.
  correct: 2
  explanation: >-
    Section 15: the warning to tell the truth and of the penalties, given and certified by an
    authorised person.
- id: m02-072
  module: 2
  lesson: '02.6'
  subject: certification
  difficulty: 1
  question: Which of these may certify an affidavit under s. 15(ב) of the Evidence Ordinance?
  options:
    - A police investigator.
    - A school principal.
    - A certified public accountant.
    - The head of a local authority.
  correct: 3
  explanation: >-
    Section 15(ב)(5) lists the head of a local authority, alongside judges, religious-court judges,
    lawyers and others.
- id: m02-073
  module: 2
  lesson: '02.6'
  subject: certification
  difficulty: 2
  question: Can a lawyer certify your affidavit by video call?
  options:
    - Yes, if Bar conditions such as digital ID and a recording are met.
    - No, never; you must always meet in person.
    - Yes, by any video-calling app you like, without any other conditions.
    - Only if the lawyer is also a notary.
  correct: 0
  explanation: >-
    Bar ethics decisions, made permanent in 2021, allow video certification under strict conditions
    (Kol Zchut summarises them).
- id: m02-074
  module: 2
  lesson: '02.6'
  subject: affidavit-cost
  difficulty: 2
  question: Which statement about the cost of certifying an affidavit in 2026 is accurate?
  options:
    - All lawyers must charge exactly ₪512 for every affidavit.
    - Notary fees are regulated; lawyers' fees are not, so ask.
    - Certification is always free for activists.
    - Only notaries may charge for certification.
  correct: 1
  explanation: >-
    Notary fees are regulated (about ₪200 plus VAT for the first declarant); the Bar's ₪512 is only
    a recommended minimum for drafting and certifying.
- id: m02-075
  module: 2
  lesson: '02.6'
  subject: affidavit-cost
  difficulty: 2
  question: >-
    You need an affidavit certified only for an Israeli administrative court. Why is a notary
    usually unnecessary?
  options:
    - Notaries may not certify affidavits for Israeli courts.
    - Notaries charge less than lawyers, which courts dislike.
    - Any lawyer may certify it; notaries mainly serve use abroad.
    - Courts require a judge to certify every affidavit.
  correct: 2
  explanation: >-
    A lawyer's certification is enough for Israeli courts; notarial services matter mostly for
    documents used abroad.
- id: m02-076
  module: 2
  lesson: '02.6'
  subject: affidavit-form
  difficulty: 1
  question: In civil courts, how must an affidavit be written according to reg. 178(א)?
  options:
    - In the third person, as one long paragraph.
    - In English, followed by a short Hebrew summary.
    - As questions and answers.
    - In the first person, in numbered paragraphs.
  correct: 3
  explanation: >-
    Regulation 178(א): first person, divided into paragraphs, with facts the declarant can testify
    to from personal knowledge.
- id: m02-077
  module: 2
  lesson: '02.6'
  subject: affidavit-form
  difficulty: 2
  question: What personal details does the Evidence Ordinance's Second Schedule require in an affidavit?
  options:
    - Full name, occupation and address.
    - Full name, bank account and phone number.
    - Full name and political affiliation.
    - Only an ID number.
  correct: 0
  explanation: 'Item 2 of the Second Schedule: the declarant''s full name, occupation and address.'
- id: m02-078
  module: 2
  lesson: '02.6'
  subject: affidavit-form
  difficulty: 2
  question: >-
    In an affidavit supporting a civil pleading you want to state something you believe but did not
    see. What does reg. 178(א) require?
  options:
    - Nothing extra; any belief may be stated.
    - You must state the source of your belief.
    - You must get a second declarant to confirm it.
    - You must write it in a separate document.
  correct: 1
  explanation: >-
    Beliefs are allowed in an affidavit attached to a pleading only if you state the source of the
    belief or knowledge.
- id: m02-079
  module: 2
  lesson: '02.6'
  subject: corrections
  difficulty: 2
  question: You spot a typo while sitting with the lawyer, before signing. What is the correct procedure?
  options:
    - Sign first and fix it later at home.
    - Ignore it; typos never matter.
    - Correct it before signing; the certifier initials it.
    - Start a new affidavit at a different lawyer's office.
  correct: 2
  explanation: >-
    The Second Schedule (item 4) requires corrections made before swearing to be initialled by the
    certifier in the margin.
- id: m02-080
  module: 2
  lesson: '02.6'
  subject: false-affidavit
  difficulty: 1
  question: What is the maximum penalty for knowingly making a false affidavit under the Penal Law?
  options:
    - A warning letter only.
    - A fine of ₪500.
    - One month's community service.
    - Three years' imprisonment.
  correct: 3
  explanation: Penal Law s. 239 provides three years' imprisonment for knowingly giving a false affidavit.
- id: m02-081
  module: 2
  lesson: '02.6'
  subject: cross-examination
  difficulty: 2
  question: >-
    The other side asks to cross-examine you on your affidavit, and you do not come to court. What
    may happen?
  options:
    - The court may refuse to treat it as evidence.
    - Nothing; affidavits stand on their own.
    - The court must postpone the hearing indefinitely.
    - Your affidavit automatically becomes stronger.
  correct: 0
  explanation: >-
    Evidence Ordinance s. 17(א): the court may disqualify the affidavit if the declarant does not
    appear for examination.
- id: m02-082
  module: 2
  lesson: '02.6'
  subject: spot-the-mistake
  difficulty: 3
  question: >-
    Spot the main problem in this affidavit paragraph: '5. The council acted with obvious malice and
    broke every rule of fair procedure.'
  options:
    - It should be written in the third person.
    - It states opinions and conclusions, not facts.
    - It is too short for an affidavit paragraph.
    - It names the council instead of an official.
  correct: 1
  explanation: >-
    An affidavit proves facts. Opinions and legal conclusions belong in the petition; here they
    weaken credibility and invite cross-examination.
- id: m02-083
  module: 2
  lesson: '02.6'
  subject: group-evidence
  difficulty: 3
  question: >-
    Five members of your group witnessed the same event. What is the best way to present their
    evidence?
  options:
    - One affidavit signed by all five, written by one member.
    - One affidavit by the chair summarising what others said.
    - Each witness gives a separate affidavit in their own words.
    - A joint letter from the group, without any affidavits.
  correct: 2
  explanation: >-
    Each witness's personal knowledge goes in their own affidavit; a summary of others' accounts is
    hearsay.
- id: m02-084
  module: 2
  lesson: '02.6'
  subject: acting-for-others
  difficulty: 3
  question: >-
    An elderly neighbour asks you to write her affidavit for a court case, and offers to pay. What
    do you do?
  options:
    - Write it and accept the payment, since she will be the one signing it.
    - Write it in your own name as her representative.
    - Write it for free but sign it as her witness.
    - Decline payment; explain the structure or refer her to a clinic.
  correct: 3
  explanation: >-
    Drafting legal documents for another person for payment is reserved to lawyers (Bar Association
    Law s. 20). Explaining general structure is fine.
- id: m03-001
  module: 3
  lesson: '03.1'
  subject: constitutional-structure
  difficulty: 1
  question: What did the Harari decision of 1950 decide about Israel's constitution?
  options:
    - That the constitution would be adopted in one document by a referendum.
    - That Israel would have no constitution and rely on British common law.
    - That it would be written chapter by chapter, each chapter a Basic Law.
    - That the Supreme Court would write the constitution through its rulings.
  correct: 2
  explanation: >-
    The First Knesset tasked its Constitution Committee with drafting a constitution in chapters,
    each a Basic Law, which together would form the constitution.
- id: m03-002
  module: 3
  lesson: '03.1'
  subject: basic-laws-list
  difficulty: 1
  question: Which of these is NOT a Basic Law in force in 2026?
  options:
    - 'Basic Law: Legislation.'
    - 'Basic Law: The State Comptroller.'
    - 'Basic Law: Referendum.'
    - 'Basic Law: The Military.'
  correct: 0
  explanation: >-
    A Basic Law on how laws and Basic Laws are made has been proposed many times but never enacted.
    The other three are among the thirteen Basic Laws.
- id: m03-003
  module: 3
  lesson: '03.1'
  subject: basic-laws-list
  difficulty: 1
  question: >-
    Which two Basic Laws, both first passed in 1992, were the first to protect individual rights
    against the Knesset itself?
  options:
    - The Knesset, and The Judiciary, both rewritten that year.
    - The Government, and The State Economy, both amended that year.
    - Referendum, and the Nation-State Law, both passed that year.
    - Human Dignity and Liberty, and Freedom of Occupation.
  correct: 3
  explanation: >-
    The earlier Basic Laws set up state organs. The 1992 laws protect rights and include a
    limitation clause.
- id: m03-004
  module: 3
  lesson: '03.1'
  subject: entrenchment
  difficulty: 1
  question: What does "רוב של חברי הכנסת" mean in an entrenchment clause?
  options:
    - A majority of the MKs present and voting at the session.
    - At least 61 MKs, a majority of all 120 members.
    - At least 80 MKs, two thirds of the Knesset.
    - A majority of the coalition factions only.
  correct: 1
  explanation: >-
    "A majority of the members of the Knesset" means a majority of all 120, that is 61, not just a
    majority of those who happen to vote.
- id: m03-005
  module: 3
  lesson: '03.1'
  subject: entrenchment
  difficulty: 2
  question: >-
    Basic Law: The Knesset s. 46 applies the special majority "בין מפורש ובין משתמע". Why does this
    matter for an activist reading a new election bill?
  options:
    - Because only bills that expressly mention s. 4 need 61 votes.
    - Because it means the special majority applies only in the third reading.
    - Because a bill that changes s. 4 in effect, without saying so, also needs 61 votes.
    - Because implied changes are reviewed by the Central Elections Committee instead.
  correct: 2
  explanation: >-
    An implied change to an entrenched section needs the special majority too, in every reading.
    That is how the unequal funding law in Bergman fell foul of s. 4.
- id: m03-006
  module: 3
  lesson: '03.1'
  subject: entrenchment
  difficulty: 2
  question: >-
    You want to know whether Basic Law: The Judiciary can be amended by an ordinary majority. Where
    do you look first?
  options:
    - In the Basic Law's own text, for a clause requiring a special majority.
    - In the Harari decision, which sets majorities for each chapter.
    - In the Interpretation Law, which lists the entrenched Basic Laws.
    - In the Knesset Rules of Procedure, which entrench all Basic Laws.
  correct: 0
  explanation: >-
    Entrenchment is written in each Basic Law itself, usually near the end (נוקשות). If there is no
    such clause, an ordinary majority can amend it.
- id: m03-007
  module: 3
  lesson: '03.1'
  subject: bergman
  difficulty: 2
  question: In Bergman (1969), what could the Knesset have done to make the funding law valid?
  options:
    - Nothing; the Court held that public funding of parties is always unlawful.
    - Ask the Court for an advisory opinion before passing the law again.
    - Pass it as a Basic Law, which needs no special majority.
    - Re-enact it by a majority of all MKs, or remove the inequality.
  correct: 3
  explanation: >-
    The Court ordered the minister not to act unless the law was re-enacted with the required
    majority or amended to remove the inequality. The Knesset amended the law.
- id: m03-008
  module: 3
  lesson: '03.1'
  subject: mizrahi-bank
  difficulty: 1
  question: What did the Supreme Court hold in United Mizrahi Bank (1995) that changed Israeli law?
  options:
    - That banks may not be regulated by Knesset laws without a referendum.
    - That Basic Laws outrank ordinary laws, and courts may void a law that breaks them.
    - That the Declaration of Independence is a binding constitution.
    - That only the Knesset may decide whether a law breaks a Basic Law.
  correct: 1
  explanation: >-
    Mizrahi Bank recognised the constitutional status of the Basic Laws and judicial review of laws
    under the limitation clause, although the judges' reasons differed.
- id: m03-009
  module: 3
  lesson: '03.1'
  subject: mizrahi-bank
  difficulty: 2
  question: Which judge in Mizrahi Bank rejected the theory that the Knesset holds constituent power?
  options:
    - President Barak.
    - President Shamgar.
    - Justice Cheshin.
    - Justice Tal.
  correct: 2
  explanation: >-
    Cheshin J. held that the Knesset cannot adopt a constitution this way, though it can bind itself
    by express entrenchment. Barak developed the constituent-authority theory.
- id: m03-010
  module: 3
  lesson: '03.1'
  subject: constitutional-debate
  difficulty: 2
  question: >-
    A critic of the "constitutional revolution" points to the 1992 vote on Human Dignity and
    Liberty. What fact is usually cited?
  options:
    - It passed 32 to 21, with a small attendance.
    - It passed unanimously but without a third reading.
    - It was approved by referendum with a low turnout.
    - It was passed by the Supreme Court, not the Knesset.
  correct: 0
  explanation: >-
    The law passed 32 to 21. Critics such as former MK Michael Eitan say few members were present
    and the public was not told a constitution was being adopted.
- id: m03-011
  module: 3
  lesson: '03.1'
  subject: constitutional-debate
  difficulty: 2
  question: >-
    Which statement fairly presents the supporters' answer to the critics of the constitutional
    revolution?
  options:
    - The Knesset had no role in 1992; the Court adopted the Basic Laws itself.
    - The number of MKs voting does not matter, because Basic Laws need no vote.
    - Judicial review was invented by the Knesset Constitution Committee in 2023.
    - The limitation clause makes sense only if courts can enforce it.
  correct: 3
  explanation: >-
    Supporters such as Barak and Professor Roznai read the limitation clause as authorising review;
    MK Rubinstein said the Knesset debates show members knew review was possible.
- id: m03-012
  module: 3
  lesson: '03.1'
  subject: basic-laws-list
  difficulty: 2
  question: >-
    A friend says the 2018 Nation-State Law "is just an ordinary law with a fancy name". What is the
    accurate legal position?
  options:
    - It is an ordinary law, because it passed with fewer than 61 votes.
    - It was passed as a Basic Law; views on its content are a separate question.
    - It is a regulation, because it was made by the Constitution Committee.
    - It is a Basic Law only after the Supreme Court approved it in 2021.
  correct: 1
  explanation: >-
    It was enacted as Basic Law: Israel – the Nation-State of the Jewish People. In Hasson (2021)
    the Court rejected petitions against it; its status did not depend on that ruling.
- id: m03-013
  module: 3
  lesson: '03.1'
  subject: entrenchment
  difficulty: 3
  question: >-
    A bill would amend Basic Law: Freedom of Occupation by an ordinary law passed 55 to 30. What is
    wrong with this?
  options:
    - Nothing; any law may amend a Basic Law if the change is minor.
    - 'It needs 80 MKs, like the emergency-regulation sections of Basic Law: The Knesset.'
    - Section 7 allows change only by a Basic Law passed by a majority of all MKs.
    - Freedom of Occupation can be amended only by referendum.
  correct: 2
  explanation: >-
    Freedom of Occupation s. 7 requires a Basic Law adopted by 61 MKs. An ordinary law with 55 votes
    meets neither condition.
- id: m03-014
  module: 3
  lesson: '03.1'
  subject: constitutional-structure
  difficulty: 3
  question: >-
    A petition argues a law is "unconstitutional" but names only "the principles of democracy",
    without a Basic Law or a ruling. What is the main weakness?
  options:
    - Petitions may not mention democracy, which is a political concept.
    - Unconstitutionality can be argued only by the Attorney General.
    - Only laws passed before 1992 can be challenged as unconstitutional.
    - 'The court needs a specific source: a Basic Law section or a ruling with its test.'
  correct: 3
  explanation: >-
    Israel's constitution is a set of Basic Laws read through case law. An argument without a
    section or a ruling gives the court nothing to apply.
- id: m03-015
  module: 3
  lesson: '03.1'
  subject: bergman
  difficulty: 3
  question: Why is Bergman described as a "procedural" kind of review, compared with Mizrahi Bank?
  options:
    - Because the Knesset could cure the defect with 61 votes, whatever the content.
    - Because the Court only reviewed whether the bill had a first reading.
    - Because the Court refused to look at the law's text at all.
    - Because Bergman was decided by the Knesset's legal adviser, not a court.
  correct: 0
  explanation: >-
    In Bergman the law fell for lack of the entrenched majority. With 61 votes the Knesset could
    pass the same content; Mizrahi Bank allowed review of content itself.
- id: m03-016
  module: 3
  lesson: '03.1'
  subject: constitutional-debate
  difficulty: 1
  question: Who first called the 1992 Basic Laws "the quiet constitutional revolution"?
  options:
    - President Aharon Barak, in his Mizrahi Bank opinion.
    - Professor Claude Klein, in an article soon after.
    - MK Yizhar Harari, during the 1950 Knesset debate.
    - The Knesset's legal adviser, in the bill's explanatory notes.
  correct: 1
  explanation: >-
    Professor Claude Klein coined the phrase about two weeks after the laws passed. Barak later
    adopted and developed the idea.
- id: m03-017
  module: 3
  lesson: '03.1'
  subject: constitutional-structure
  difficulty: 2
  question: Which Basic Law sets the structure of the courts and the Judicial Selection Committee?
  options:
    - 'Basic Law: The Government.'
    - 'Basic Law: The Knesset.'
    - 'Basic Law: Human Dignity and Liberty.'
    - 'Basic Law: The Judiciary.'
  correct: 3
  explanation: >-
    Basic Law: The Judiciary (1984) covers the courts, judges' appointment and tenure, and the High
    Court of Justice's powers. Lesson 03.5 reads its 2025 amendment.
- id: m03-018
  module: 3
  lesson: '03.2'
  subject: hdl-rights
  difficulty: 1
  question: 'Which right is written in Basic Law: Human Dignity and Liberty?'
  options:
    - Privacy and private life.
    - Freedom of the press and media.
    - The right to strike and organise.
    - Freedom of religion and worship.
  correct: 0
  explanation: >-
    Section 7 protects privacy. Press freedom, strikes and religion are not written there; some of
    them are protected through dignity in case law (lesson 03.4).
- id: m03-019
  module: 3
  lesson: '03.2'
  subject: hdl-rights
  difficulty: 1
  question: Under s. 6 of Human Dignity and Liberty, who has the right to enter Israel?
  options:
    - Every person, whatever their citizenship.
    - Every resident who has lived in Israel for five years.
    - Every Israeli citizen who is abroad.
    - Only citizens who have completed military or national service.
  correct: 2
  explanation: >-
    Section 6(a) lets every person leave Israel; s. 6(b) gives every Israeli citizen abroad the
    right to enter.
- id: m03-020
  module: 3
  lesson: '03.2'
  subject: two-stage-analysis
  difficulty: 1
  question: What is the correct order of a constitutional analysis under the 1992 Basic Laws?
  options:
    - Proportionality first, then whether any right is involved.
    - First a protected right and its infringement, then the limitation clause.
    - First the court's jurisdiction, then the reasonableness of the law.
    - First the vote count, then the explanatory notes, then the right.
  correct: 1
  explanation: >-
    Stage one asks whether a protected right is infringed, with facts. Only then does stage two ask
    whether the limitation clause justifies it.
- id: m03-021
  module: 3
  lesson: '03.2'
  subject: two-stage-analysis
  difficulty: 2
  question: At which stage does the challenger carry the main burden of bringing facts?
  options:
    - Proper purpose, where the challenger must prove the Knesset's motives.
    - Narrow sense, where the challenger must calculate the total benefit.
    - None; the state must prove both the infringement and the justification.
    - Stage one, showing that a protected right is actually infringed.
  correct: 3
  explanation: >-
    The challenger must lay a factual basis for the infringement (as Commitment to Peace and Social
    Justice shows). Justifying it under the limitation clause falls in practice on the state.
- id: m03-022
  module: 3
  lesson: '03.2'
  subject: express-authorisation
  difficulty: 2
  question: >-
    A ministry procedure (נוהל) limits visits to people in hospital detention wards. No law mentions
    such limits. What is the first constitutional point?
  options:
    - A procedure cannot limit a protected right without express authorisation in a law.
    - The procedure is valid because ministries may make internal rules freely.
    - Detention wards are security matters, so no Basic Law applies.
    - Visits are a privilege, so the only question is whether the procedure is reasonable.
  correct: 0
  explanation: >-
    Section 8 allows a limit only "בחוק" or under a law "מכוח הסמכה מפורשת בו". A procedure with no
    express statutory basis fails condition 1.
- id: m03-023
  module: 3
  lesson: '03.2'
  subject: express-authorisation
  difficulty: 3
  question: >-
    A by-law limits street performers' hours, citing a section that lets the council regulate "use
    of public spaces, including permitted activities and their times". How strong is an
    express-authorisation argument?
  options:
    - Strong, because no by-law may ever limit a basic right.
    - Strong, because the by-law limits expression, which needs a Basic Law.
    - Weak, because the section expressly covers activities and their times.
    - Weak, because municipal by-laws are not subject to the Basic Laws.
  correct: 2
  explanation: >-
    The enabling words are specific about activities and times, so the stronger arguments are
    proportionality ones. By-laws are subject to the Basic Laws (s. 11).
- id: m03-024
  module: 3
  lesson: '03.2'
  subject: security-forces
  difficulty: 1
  question: >-
    Which section of Human Dignity and Liberty deals with limits on the rights of soldiers and
    police officers?
  options:
    - Section 9.
    - Section 10.
    - Section 12.
    - Section 1A.
  correct: 0
  explanation: >-
    Section 9 allows limits only by law and only as the nature and character of the service require.
    Section 10 preserves old law; s. 12 covers emergency regulations.
- id: m03-025
  module: 3
  lesson: '03.2'
  subject: emergency-regulations
  difficulty: 2
  question: >-
    During a declared state of emergency, the government issues emergency regulations limiting
    gatherings. What does s. 12 of Human Dignity and Liberty require?
  options:
    - Nothing; emergency regulations override the Basic Law entirely.
    - Approval by 80 MKs before the regulations take effect.
    - That the regulations be passed as a Basic Law within 48 hours.
    - A proper purpose, and a period and extent no greater than necessary.
  correct: 3
  explanation: >-
    Section 12 lets emergency regulations limit rights only during a declared emergency, for a
    proper purpose and for a period and extent no greater than required.
- id: m03-026
  module: 3
  lesson: '03.2'
  subject: override-clause
  difficulty: 2
  question: Which Basic Law contains an override clause letting a law stand "notwithstanding" it?
  options:
    - Human Dignity and Liberty, in s. 8.
    - Freedom of Occupation, in s. 8.
    - The Judiciary, in s. 15.
    - The Knesset, in s. 46.
  correct: 1
  explanation: >-
    Only Freedom of Occupation s. 8 has such a clause, limited to four years and requiring 61 MKs.
    Proposals to add one for Human Dignity and Liberty are part of the 2023–2026 debate.
- id: m03-027
  module: 3
  lesson: '03.2'
  subject: override-clause
  difficulty: 3
  question: >-
    A law passed by 63 MKs says it is valid "notwithstanding Basic Law: Human Dignity and Liberty".
    It fails the limitation clause. What is the likely legal position under the existing texts?
  options:
    - It is valid for four years, as under Freedom of Occupation s. 8.
    - It is valid permanently, because a majority of all MKs passed it.
    - It is still subject to s. 8, because that Basic Law has no override clause.
    - It is valid until the next election, when it must be re-enacted.
  correct: 2
  explanation: >-
    Human Dignity and Liberty contains no override mechanism, so a declaration in an ordinary law
    does not exempt it from s. 8. Adding such a clause would need a Basic Law.
- id: m03-028
  module: 3
  lesson: '03.2'
  subject: remedies
  difficulty: 2
  question: >-
    In Ressler v. Knesset (2012), the Court found the Tal Law unconstitutional. What did it do with
    the law?
  options:
    - Let it run to its expiry and held it could not be extended in its form.
    - Declared it void immediately and ordered all deferrals cancelled.
    - Rewrote it to require service from every yeshiva student at 18.
    - 'Referred it to a referendum under Basic Law: Referendum.'
  correct: 0
  explanation: >-
    The law was due to expire months later; the Court let it run out and ruled that the Knesset
    could not extend it in its existing form.
- id: m03-029
  module: 3
  lesson: '03.2'
  subject: remedies
  difficulty: 1
  question: What is a suspended declaration of invalidity?
  options:
    - A ruling that a law is valid until a further hearing is held.
    - A ruling that a law is void, which takes effect only after a set period.
    - A ruling that suspends the judges who decided a case.
    - A Knesset decision to suspend a Basic Law during an emergency.
  correct: 1
  explanation: >-
    The court declares the law void but delays the effect, to let the Knesset legislate, as in
    Tzemach (six months).
- id: m03-030
  module: 3
  lesson: '03.2'
  subject: freedom-of-occupation
  difficulty: 1
  question: 'Who is protected by s. 3 of Basic Law: Freedom of Occupation?'
  options:
    - Every person present in Israel, including tourists.
    - Only employees, not self-employed people.
    - Only members of licensed professions.
    - Every citizen or resident of the state.
  correct: 3
  explanation: Section 3 says "כל אזרח או תושב של המדינה" may engage in any occupation, profession or trade.
- id: m03-031
  module: 3
  lesson: '03.2'
  subject: two-stage-analysis
  difficulty: 3
  question: >-
    A letter against a new fee for dog parks argues the fee is "disproportionate under the
    limitation clause". Spot the mistake.
  options:
    - The letter should have cited Freedom of Occupation instead.
    - The letter should have asked for an override clause.
    - Fees can never be challenged once they are published in the gazette.
    - 'It skips stage one: which protected right does the fee infringe?'
  correct: 3
  explanation: >-
    Without showing an infringement of a protected right, the limitation clause does not apply. The
    fee may still be challenged on administrative grounds, such as lack of authority (Module 4).
- id: m03-032
  module: 3
  lesson: '03.2'
  subject: hdl-rights
  difficulty: 2
  question: >-
    Section 1A says the purpose of Human Dignity and Liberty is to anchor the values of Israel as
    what kind of state?
  options:
    - A secular and liberal state.
    - A Jewish and democratic state.
    - A parliamentary and federal state.
    - A welfare state.
  correct: 1
  explanation: >-
    Section 1A refers to "ערכיה של מדינת ישראל כמדינה יהודית ודמוקרטית". The limitation clause asks
    whether a law befits those values.
- id: m03-033
  module: 3
  lesson: '03.2'
  subject: hdl-rights
  difficulty: 3
  question: >-
    A home-owners' group wants to challenge a law that expropriates land for a road. Which right do
    they rely on, and what must they show first?
  options:
    - Freedom of occupation; that the new road will harm their local businesses.
    - Privacy; that the new road will pass close to the windows of their homes.
    - Property (s. 3); that the law takes or limits their property.
    - Dignity; that the road was planned without first holding a local referendum.
  correct: 2
  explanation: >-
    Section 3 says "אין פוגעים בקנינו של אדם". Stage one is showing the infringement; then the law
    is tested under s. 8. A law from before 1992 is protected by s. 10.
- id: m03-034
  module: 3
  lesson: '03.2'
  subject: security-forces
  difficulty: 3
  question: >-
    A prison officer's union objects to a regulation banning officers from posting on social media.
    Which framework applies?
  options:
    - 'Section 9: limits only by law and as the nature of the service requires.'
    - None; officers waive constitutional rights on appointment.
    - Section 12, because prisons are run under emergency regulations.
    - Freedom of Occupation s. 8, because officers are employees.
  correct: 0
  explanation: >-
    The Prison Service is listed in s. 9. A limit must be "לפי חוק" and no more than the service's
    nature requires, so both the source and the scope of the ban are open to question.
- id: m03-035
  module: 3
  lesson: '03.3'
  subject: proper-purpose
  difficulty: 1
  question: Where is the best place to find the stated purpose of a new law?
  options:
    - In the explanatory notes (דברי הסבר) and committee minutes.
    - In newspaper columns written by MKs who voted against the law.
    - In the Supreme Court's annual report on legislation and rulings.
    - In the definitions section of the Interpretation Law, 1981.
  correct: 0
  explanation: >-
    The explanatory notes to the bill and the committee minutes state what the law is for. Every
    later proportionality test is measured against that purpose.
- id: m03-036
  module: 3
  lesson: '03.3'
  subject: proper-purpose
  difficulty: 2
  question: >-
    A law limiting street fundraising states the purpose "protecting the public from fraud". You
    think it is unwise. What is usually the best approach to the purpose test?
  options:
    - Argue the purpose is improper, since fundraising is a protected activity.
    - Ignore the purpose and argue only that the law is unpopular.
    - Concede the purpose is proper and focus on the later tests.
    - Ask the court to choose a better purpose for the law.
  correct: 2
  explanation: >-
    Courts rarely fail a law on purpose. Conceding a legitimate purpose builds credibility for the
    tests where cases are usually decided.
- id: m03-037
  module: 3
  lesson: '03.3'
  subject: rational-connection
  difficulty: 1
  question: What does the rational connection test ask?
  options:
    - Whether the measure is the best possible option.
    - Whether the measure actually advances its purpose.
    - Whether the measure was passed by a rational majority.
    - Whether the measure's benefit outweighs its harm.
  correct: 1
  explanation: >-
    The measure need not be the best or only way, but there must be a real link between the means
    and the purpose.
- id: m03-038
  module: 3
  lesson: '03.3'
  subject: rational-connection
  difficulty: 2
  question: >-
    A law against littering bans all food trucks in a city, though data show most litter comes from
    building sites. What does this show?
  options:
    - The law is under-inclusive and its link to the purpose is weak.
    - The law is proportionate, because it covers a large group.
    - The law fails the express-authorisation condition.
    - The law is protected by s. 10 as an old law.
  correct: 0
  explanation: >-
    It misses the main source of the problem and targets a minor one. That weakens the rational
    connection and suggests less harmful, better-aimed measures.
- id: m03-039
  module: 3
  lesson: '03.3'
  subject: rational-connection
  difficulty: 3
  question: Under Ressler v. Knesset (2012), why did the Tal Law fail?
  options:
    - Its purpose of integrating yeshiva students was improper.
    - It was passed without a majority of all MKs.
    - It had no real potential to achieve its own purposes.
    - It was older than Human Dignity and Liberty.
  correct: 2
  explanation: >-
    The majority held the law violated equality as part of dignity and that its means lacked a real
    potential to realise its purposes. The purpose itself was not the problem.
- id: m03-040
  module: 3
  lesson: '03.3'
  subject: least-harmful-means
  difficulty: 1
  question: What counts as a valid alternative at the least-harmful-means stage?
  options:
    - Any measure that harms the right less, however little it achieves.
    - A measure that achieves the purpose about as well, with less harm.
    - Repealing the law and doing nothing at all.
    - A measure that the challenger would personally prefer.
  correct: 1
  explanation: >-
    The alternative must achieve the purpose to a similar degree. A gentler option that achieves
    much less does not show the measure is unnecessary.
- id: m03-041
  module: 3
  lesson: '03.3'
  subject: least-harmful-means
  difficulty: 2
  question: >-
    A law allows indefinite closure of businesses that break health rules. Which alternative is best
    framed for the necessity test?
  options:
    - Closure only until the violation is fixed, with a quick hearing.
    - No closures at all, relying instead on the owners' goodwill and honesty.
    - A public information campaign about health rules, with no enforcement.
    - A permanent licence for every business, whatever its past health record.
  correct: 0
  explanation: >-
    A time-limited closure with a hearing protects health almost as well and harms occupation far
    less. The other options do not achieve the purpose.
- id: m03-042
  module: 3
  lesson: '03.3'
  subject: least-harmful-means
  difficulty: 3
  question: >-
    The state argues that individual review of each case would be too costly, so a blanket rule is
    necessary. How do courts usually treat this argument?
  options:
    - Cost always justifies a blanket rule, so the challenge must fail.
    - Cost is irrelevant; the state must always choose individual review.
    - Cost counts, but rarely justifies a sweeping limit on a core right.
    - Cost can be argued only at the proper-purpose stage, never later.
  correct: 2
  explanation: >-
    Saving money is a legitimate consideration, but as Miller and Academic Center show, budget
    arguments alone rarely justify a sweeping limit on a core right.
- id: m03-043
  module: 3
  lesson: '03.3'
  subject: narrow-sense
  difficulty: 1
  question: What does proportionality in the narrow sense compare?
  options:
    - The measure's total cost with the state's annual budget for that ministry.
    - The number of MKs who supported the law with the number who opposed it.
    - The measure's text with what its explanatory notes promised it would do.
    - The measure's marginal benefit with its marginal harm to the right.
  correct: 3
  explanation: >-
    The test asks whether the extra benefit of this measure, over the next-best option, is worth its
    extra harm to the right.
- id: m03-044
  module: 3
  lesson: '03.3'
  subject: narrow-sense
  difficulty: 2
  question: >-
    In Academic Center of Law and Business (2009), what was the main public benefit the state
    claimed for a privately run prison?
  options:
    - Better rehabilitation programmes for prisoners.
    - Saving state money and easing overcrowding.
    - Faster trials for detainees.
    - Improved security at the borders.
  correct: 1
  explanation: >-
    The state presented the law as a pilot to save money and relieve overcrowding. The majority held
    the added harm to liberty and dignity was disproportionately greater.
- id: m03-045
  module: 3
  lesson: '03.3'
  subject: margin-of-proportionality
  difficulty: 2
  question: What is the "margin of proportionality" (מתחם המידתיות)?
  options:
    - The room the legislature has to choose among proportionate measures.
    - The number of votes by which a law exceeds the majority it needed to pass.
    - The time the Knesset is given to fix a law after a ruling against it.
    - The minimum distance a demonstration must keep from a private home.
  correct: 0
  explanation: >-
    Courts do not ask whether they would have chosen the same measure. They intervene only when the
    measure falls outside the range of proportionate options.
- id: m03-046
  module: 3
  lesson: '03.3'
  subject: proportionality-cases
  difficulty: 2
  question: >-
    In Gaza Coast Regional Council v. Knesset (2005), how did the Court rule on the disengagement
    law?
  options:
    - It struck down the whole law as a disproportionate taking of property.
    - It declined to hear the petitions as non-justiciable.
    - It upheld the law 10–1 but struck down four compensation provisions.
    - It suspended the law for six months to allow a referendum.
  correct: 2
  explanation: >-
    The core of the law survived; parts of the compensation scheme did not and went back to the
    Knesset. A common pattern in proportionality cases.
- id: m03-047
  module: 3
  lesson: '03.3'
  subject: proportionality-cases
  difficulty: 3
  question: >-
    In Tzemach, the petitioners did not contest the purpose or the narrow-sense test. Which test
    decided the case?
  options:
    - Rational connection, because arrest does not help discipline.
    - Least harmful means, because a shorter period could serve the army.
    - Proper purpose, because military discipline is not legitimate.
    - Express authorisation, because the arrest was set by regulation.
  correct: 1
  explanation: >-
    The dispute turned on whether 96 hours without a judge was needed. The Court held the provision
    went further than the service required and suspended the declaration for six months.
- id: m03-048
  module: 3
  lesson: '03.3'
  subject: least-harmful-means
  difficulty: 3
  question: >-
    Spot the mistake: a position paper says "the law is disproportionate because doing nothing would
    harm nobody's rights".
  options:
    - Position papers may not discuss proportionality at all.
    - Proportionality applies only to regulations, not laws.
    - The paper should have argued the purpose is improper instead.
    - '"Doing nothing" is not a less harmful means that achieves the purpose.'
  correct: 3
  explanation: >-
    The comparison must be with a realistic alternative that achieves the purpose about as well, and
    in the narrow sense, with the best such alternative.
- id: m03-049
  module: 3
  lesson: '03.3'
  subject: proportionality-cases
  difficulty: 1
  question: Which test do courts most rarely use to strike down a law?
  options:
    - Proper purpose.
    - Least harmful means.
    - Proportionality in the narrow sense.
    - Rational connection.
  correct: 0
  explanation: >-
    Most laws have a legitimate aim. Cases are usually decided at the later tests, where the
    question is whether the measure goes further than needed.
- id: m03-050
  module: 3
  lesson: '03.3'
  subject: rational-connection
  difficulty: 2
  question: >-
    A law bans anyone under 25 from driving at night to reduce accidents. Data show the risk is
    concentrated in the first year of driving, at any age. What does this suggest?
  options:
    - The law is under-inclusive only, so it still passes every test.
    - Age limits can never be rationally connected to road safety goals.
    - It is over-inclusive; a first-year rule may serve the purpose better.
    - Driving is not a protected right, so none of the tests apply at all.
  correct: 2
  explanation: >-
    It catches experienced young drivers and misses new older ones. That weakens the link and points
    to a less harmful alternative.
- id: m03-051
  module: 3
  lesson: '03.3'
  subject: narrow-sense
  difficulty: 3
  question: You must compare benefit and harm for a curfew on a protest site. What is the correct baseline?
  options:
    - The situation with no rules at all governing the site.
    - Your best realistic alternative, such as quiet hours.
    - The rules that applied to the site before the 1992 Basic Laws.
    - The rules in whichever country has the strictest protest laws.
  correct: 1
  explanation: >-
    The narrow-sense test weighs the marginal benefit and harm of the measure over the best
    alternative, not over doing nothing.
- id: m03-052
  module: 3
  lesson: '03.4'
  subject: derived-rights
  difficulty: 1
  question: Through which written right have Israeli courts protected equality since 1992?
  options:
    - Freedom of occupation.
    - Property.
    - Human dignity.
    - Personal liberty.
  correct: 2
  explanation: >-
    Equality is not written in a Basic Law. Courts protect the parts of it closely tied to dignity
    under s. 2 of Human Dignity and Liberty.
- id: m03-053
  module: 3
  lesson: '03.4'
  subject: derived-rights
  difficulty: 2
  question: Does the dignity route protect every possible aspect of equality and expression?
  options:
    - Yes; every distinction between people violates dignity.
    - No; courts protect the aspects closely tied to human dignity.
    - No; only aspects listed in the Declaration of Independence.
    - Yes, but only for citizens, not residents.
  correct: 1
  explanation: >-
    The courts read into dignity those parts of equality and speech closely tied to it, such as
    humiliation or exclusion, not every distinction or every limit on speech.
- id: m03-054
  module: 3
  lesson: '03.4'
  subject: derived-rights
  difficulty: 1
  question: What role does the Declaration of Independence play in rights cases?
  options:
    - It guides interpretation; s. 1 of the Basic Law refers to it.
    - It is itself a Basic Law that can void any later Knesset statute.
    - It has no legal role at all, only historical and symbolic value.
    - It binds the Knesset when legislating, but never the government.
  correct: 0
  explanation: >-
    The Declaration is not itself a law that voids statutes, but s. 1 of Human Dignity and Liberty
    says rights are honoured in the spirit of its principles, and courts use it to interpret.
- id: m03-055
  module: 3
  lesson: '03.4'
  subject: equality
  difficulty: 1
  question: What is the basic equality test courts apply?
  options:
    - Everyone must receive exactly the same benefits.
    - Majority groups may be treated differently from minorities.
    - Any distinction approved by a minister is lawful.
    - People alike in the relevant respect must be treated alike.
  correct: 3
  explanation: >-
    Discrimination is a distinction based on a difference that is irrelevant to the purpose.
    Treating relevantly different people differently can be lawful.
- id: m03-056
  module: 3
  lesson: '03.4'
  subject: equality
  difficulty: 2
  question: >-
    In Miller (1995), the air force argued that training women pilots was not cost-effective. How
    did the majority respond?
  options:
    - Budget and planning concerns did not justify excluding all women.
    - The army may decide freely, so the Court would not intervene.
    - Cost is a proper consideration that settled the case for the army.
    - Women may train only if they commit to serve until 54.
  correct: 0
  explanation: >-
    The 3–2 majority held that a blanket exclusion of women was not justified by cost and planning
    considerations; the minority would not have intervened.
- id: m03-057
  module: 3
  lesson: '03.4'
  subject: equality
  difficulty: 2
  question: >-
    In Ka'adan (2000), the state argued that the Jewish Agency, not the state, decided who could
    live in Katzir. What did the Court hold?
  options:
    - The Agency is a private body, so equality rules simply do not apply to it.
    - The state may not discriminate in land, directly or through others.
    - The couple must be given a plot immediately, whatever the cost to others.
    - The case was moot because the couple had meanwhile moved to another town.
  correct: 1
  explanation: >-
    Routing state land through the Agency did not make discrimination lawful. The Court told the
    state to reconsider the couple's request on the basis of equality.
- id: m03-058
  module: 3
  lesson: '03.4'
  subject: equality
  difficulty: 3
  question: >-
    A religious women's group wants to be represented on a municipal committee on mikveh management.
    The council says "women have never sat on it". Which argument is strongest?
  options:
    - Religious matters are outside the Basic Laws, so only the rabbinate decides.
    - The group should first petition the Chief Rabbinate Council.
    - Under Shakdiel, tradition alone does not justify excluding women from a public body.
    - The committee must be abolished because religion and state are separate.
  correct: 2
  explanation: >-
    Shakdiel held that excluding a woman from a religious council because of past practice was
    discrimination; the council is an administrative body bound by general law.
- id: m03-059
  module: 3
  lesson: '03.4'
  subject: nation-state-law
  difficulty: 2
  question: >-
    Which section of the Nation-State Basic Law did Justice Karra, in dissent, NOT propose to strike
    down?
  options:
    - Section 1(ג), on national self-determination.
    - Section 4, on language.
    - Section 7, on Jewish settlement.
    - Section 2, on the flag and anthem.
  correct: 3
  explanation: Karra J. would have annulled ss. 1(ג), 4 and 7. The majority of ten rejected all the petitions.
- id: m03-060
  module: 3
  lesson: '03.4'
  subject: nation-state-law
  difficulty: 3
  question: >-
    A municipality cites s. 7 of the Nation-State Law to refuse an Arab family a plot in a publicly
    marketed neighbourhood. What does Hasson suggest about this use?
  options:
    - Section 7 allows any public authority to prefer Jewish buyers in all land sales.
    - The majority kept equality as a case-law right; s. 7 is no licence for this.
    - Section 7 was struck down by the Court in 2021 and so no longer applies at all.
    - The family must first challenge the Basic Law itself, before the decision.
  correct: 1
  explanation: >-
    The majority read the law as consistent with the existing right to equality. Ka'adan remains
    good law for state land. Check any later rulings before relying on this.
- id: m03-061
  module: 3
  lesson: '03.4'
  subject: expression
  difficulty: 1
  question: Which early ruling set the near-certainty test for limiting speech?
  options:
    - Kol Ha'am (1953).
    - Bergman (1969).
    - Horev (1997).
    - Ragen (2011).
  correct: 0
  explanation: >-
    Kol Ha'am held the minister could suspend a newspaper only if publication made harm to public
    peace nearly certain, not merely possible.
- id: m03-062
  module: 3
  lesson: '03.4'
  subject: expression
  difficulty: 2
  question: >-
    A council removes a billboard criticising the mayor, saying "it might upset some residents".
    Which test should frame your letter?
  options:
    - Whether the message on the billboard can be proven true in court.
    - Whether serious harm is nearly certain; upset feelings are not enough.
    - Whether the billboard's content was first approved by the Knesset.
    - Whether the mayor gave written consent to being criticised publicly.
  correct: 1
  explanation: >-
    Limits on expression need a high probability of serious harm. Offence or discomfort is not the
    kind of harm that justifies removing political speech.
- id: m03-063
  module: 3
  lesson: '03.4'
  subject: religion
  difficulty: 1
  question: According to Horev, how should an authority treat religious feelings?
  options:
    - As an absolute right that overrides all other interests and rights.
    - As an irrelevant consideration that a secular state must ignore.
    - As relevant only on Sabbaths and Jewish holidays, never otherwise.
    - As a legitimate consideration, balanced against other rights.
  correct: 3
  explanation: >-
    Horev held religious feelings may be considered, but not to the point of coercion; they are
    weighed against rights such as freedom of movement.
- id: m03-064
  module: 3
  lesson: '03.4'
  subject: religion
  difficulty: 2
  question: In Horev, why did the Court find fault with the decision to close Bar-Ilan Street?
  options:
    - Religious feelings may never justify closing any road to traffic.
    - The minister had no power at all to close any road in Jerusalem.
    - It had not properly weighed the secular residents' interests.
    - The closure had not first been approved by the city council.
  correct: 2
  explanation: >-
    The majority accepted religious feelings as a legitimate consideration but held the decision did
    not give proper weight to the secular residents affected. Some dissenters doubted the power
    itself.
- id: m03-065
  module: 3
  lesson: '03.4'
  subject: religion
  difficulty: 2
  question: Under Ragen, which bus arrangement is lawful?
  options:
    - Passengers choosing to sit apart, with no pressure on others.
    - A sign at the front asking women to board by the rear door.
    - A driver asking women to move back when a man complains.
    - Separate buses for men and women, run by the operator itself.
  correct: 0
  explanation: >-
    Voluntary separation among passengers is allowed. Any instruction or pressure from the operator
    or others is coercion and unlawful.
- id: m03-066
  module: 3
  lesson: '03.4'
  subject: religion
  difficulty: 3
  question: >-
    A municipality funds a lecture series in a public library with a separate seating area for
    women, at the request of the audience. What is the deciding question under the case law?
  options:
    - Whether most of the city's residents are religiously observant.
    - Whether seating is voluntary, with an open area and no enforcement.
    - Whether the lecturer is an ordained rabbi or a university scholar.
    - Whether the library building was built before the 1992 Basic Laws.
  correct: 1
  explanation: >-
    Ragen turns on voluntary choice versus coercion. An open area, no enforcement and equal
    conditions point to lawfulness; directing women where to sit points the other way.
- id: m03-067
  module: 3
  lesson: '03.4'
  subject: protest
  difficulty: 1
  question: Under Levi (1984), what must police do before banning a lawful demonstration?
  options:
    - Consult the Attorney General's office and obtain written approval.
    - Ask the organisers to pay in advance for the police security needed.
    - Wait for a court order before refusing or changing the licence.
    - Try to protect it first; a ban is the last resort.
  correct: 3
  explanation: >-
    Levi held police must take reasonable steps to protect demonstrators and consider changes of
    place, time or scope before refusing a licence.
- id: m03-068
  module: 3
  lesson: '03.4'
  subject: protest
  difficulty: 2
  question: Under Majority Camp (2006), which condition may the police generally NOT impose on organisers?
  options:
    - Keeping an ambulance and a fire engine on standby nearby.
    - Paying for police security and public order.
    - Following a route agreed in advance with the district police.
    - Ending the march and dispersing by a fixed time that evening.
  correct: 1
  explanation: >-
    The Court held the police may not shift the cost of security onto demonstrators, which would put
    a price tag on a constitutional right. Emergency services can be a condition.
- id: m03-069
  module: 3
  lesson: '03.4'
  subject: protest
  difficulty: 3
  question: >-
    Two groups, one for and one against a government policy, ask to demonstrate at the same square
    on the same evening. Police want to ban both. What approach fits the case law?
  options:
    - Ban both, because any risk of confrontation justifies it.
    - Allow only the group that applied first and ban the other.
    - Separate them in place or time before considering any ban.
    - Allow both only if they pay for separating fences.
  correct: 2
  explanation: >-
    Levi requires less drastic means first: changing place, time or scope. Majority Camp bars
    charging for security. The same rules apply to both groups.
- id: m03-070
  module: 3
  lesson: '03.4'
  subject: derived-rights
  difficulty: 3
  question: >-
    Spot the mistake in this sentence from a petition: "Under Basic Law: Freedom of Expression, the
    ban is void."
  options:
    - No such Basic Law exists; cite dignity (s. 2) and the rulings.
    - 'Expression is protected only by Basic Law: Freedom of Occupation.'
    - A ban on speech can be reviewed only on grounds of reasonableness.
    - Petitions may cite only ordinary statutes, never the Basic Laws.
  correct: 0
  explanation: >-
    Expression is a derived right. Cite Human Dignity and Liberty s. 2 as interpreted by the courts,
    and the test from Kol Ha'am and later rulings.
- id: m03-071
  module: 3
  lesson: '03.4'
  subject: equality
  difficulty: 2
  question: >-
    Which ruling applied equality to the burden of military service between yeshiva students and
    others?
  options:
    - Horev v. Minister of Transportation.
    - Levi v. Southern District Police Commander.
    - Commitment to Peace and Social Justice.
    - Ressler v. Knesset.
  correct: 3
  explanation: >-
    Ressler v. Knesset (2012) held 6–3 that the Tal Law violated equality as part of dignity and
    failed proportionality.
- id: m03-072
  module: 3
  lesson: '03.5'
  subject: judicial-selection
  difficulty: 1
  question: Before Amendment No. 4 takes effect, who sits on the Judicial Selection Committee?
  options:
    - Three justices, two ministers, two MKs and two Bar members.
    - Five Supreme Court justices and four ministers chosen by the cabinet.
    - Three justices, three ministers and three MKs from the coalition.
    - Nine MKs elected by the Knesset plenum, by secret ballot each term.
  correct: 0
  explanation: >-
    Section 4(b) sets nine members: the Supreme Court President and two justices, the Justice
    Minister and another minister, two MKs and two Bar representatives.
- id: m03-073
  module: 3
  lesson: '03.5'
  subject: judicial-selection
  difficulty: 1
  question: 'When does Amendment No. 4 to Basic Law: The Judiciary take effect, according to its text?'
  options:
    - Immediately on publication in March 2025.
    - From the start of the 26th Knesset's term.
    - Only after approval in a referendum.
    - On 1 January 2027, with the Attorney General law.
  correct: 1
  explanation: >-
    Each new provision is marked "החל מיום תחילת כהונתה של הכנסת העשרים ושש" — from the start of the
    26th Knesset.
- id: m03-074
  module: 3
  lesson: '03.5'
  subject: judicial-selection
  difficulty: 2
  question: >-
    Under the amended s. 4(d), what majority does the committee need to appoint a district-court
    judge?
  options:
    - Seven of the nine members, including at least two of the justices.
    - A simple majority of whichever members are present at the meeting.
    - Five, including a judge and one member from each bloc.
    - All nine members, unanimously, after a public hearing on candidates.
  correct: 2
  explanation: >-
    Section 4(d) requires five members including one from each of three groups: a judge; a minister
    or coalition-side member; an opposition-side member.
- id: m03-075
  module: 3
  lesson: '03.5'
  subject: judicial-selection
  difficulty: 2
  question: What does the new s. 4A provide?
  options:
    - A deadlock procedure for two empty Supreme Court seats.
    - A ban on any serving judge sitting on the selection committee at all.
    - Direct election of Supreme Court justices by the public at large.
    - A right for the President of the State to veto any appointment made.
  correct: 0
  explanation: >-
    If two seats stay empty for a year and a vote fails, the Justice Minister may trigger a
    procedure where each side proposes three candidates and the rest of the committee picks one.
- id: m03-076
  module: 3
  lesson: '03.5'
  subject: judicial-selection
  difficulty: 3
  question: >-
    A columnist writes that "under the new law, judges can be appointed on the eve of elections".
    What does s. 4B say?
  options:
    - Appointments remain allowed right up until election day itself.
    - Appointments in an election year must be approved by referendum.
    - Appointments in the months before elections need 80 MKs to approve.
    - No selections from 90 days before elections until new members sit.
  correct: 3
  explanation: >-
    Section 4B freezes selection of judges from the 90th day before Knesset elections (or other
    triggers of elections) until new committee members are chosen.
- id: m03-077
  module: 3
  lesson: '03.5'
  subject: review-of-basic-laws
  difficulty: 2
  question: What is an "unconstitutional constitutional amendment" argument?
  options:
    - That a ministerial regulation conflicts with the statute it is made under.
    - That a Basic Law change so harms democracy that a court may intervene.
    - That a law passed without an explanatory note is void from the start.
    - That a Basic Law must be signed by the President of the State to be valid.
  correct: 1
  explanation: >-
    It is the doctrine behind the Judicial Selection petitions: a Basic Law change may itself be
    reviewed in extreme cases. The Knesset and government dispute that the Court has such power.
- id: m03-078
  module: 3
  lesson: '03.5'
  subject: review-of-basic-laws
  difficulty: 3
  question: >-
    You must state the case for the view that courts may not review Basic Laws, in its strongest
    form. Which sentence does that?
  options:
    - '"Judges are biased, and so their rulings should simply be ignored by all."'
    - '"The Court lost all its authority when it annulled the reasonableness amendment."'
    - '"No Basic Law grants that power or sets how Basic Laws are made."'
    - '"The Basic Laws were written by the Court, so they cannot bind the Knesset."'
  correct: 2
  explanation: >-
    This is the argument dissenting Justices Sohlberg and Mintz and critics of review make, stated
    without insult. The other options are slogans or factually wrong.
- id: m03-079
  module: 3
  lesson: '03.5'
  subject: attorney-general
  difficulty: 1
  question: What did the High Court decide on 14 December 2025 about the Attorney General?
  options:
    - It voided the new procedure and her dismissal, 7–0.
    - It upheld her dismissal by a majority of four votes to three.
    - It held that cabinet decisions are not subject to judicial review.
    - It ordered the cabinet to hold new elections for the post.
  correct: 0
  explanation: >-
    A seven-justice panel, opinion by President Amit, held the procedure was adopted without a sound
    basis and voided the dismissal; she remained in office.
- id: m03-080
  module: 3
  lesson: '03.5'
  subject: attorney-general
  difficulty: 2
  question: What is the legal status of the July 2026 law on the Attorney General's powers?
  options:
    - A Basic Law amendment that took effect immediately on publication.
    - A government resolution adopted by the cabinet, not a Knesset law.
    - A bill that failed to pass its third reading before the dissolution.
    - An ordinary law, in force from 2027, under challenge.
  correct: 3
  explanation: >-
    It passed 65–51 as an ordinary law, takes effect on 1.1.2027, and petitions were filed by MQG,
    ACRI and others. Check its status before relying on this.
- id: m03-081
  module: 3
  lesson: '03.5'
  subject: ripeness
  difficulty: 2
  question: >-
    Why did the state argue in June 2026 that the court should wait before deciding on Amendment No.
    4?
  options:
    - Because the petitioners had not paid the required court fee on time.
    - Because the law does not yet apply and a new Knesset could change it.
    - Because Basic Laws may be reviewed only ten years after they are passed.
    - Because the Bar Association had withdrawn its petition before the hearing.
  correct: 1
  explanation: >-
    That is a ripeness argument. President Amit asked what difference it makes which Knesset is in
    office if the law is problematic; the AG's representative also rejected it.
- id: m03-082
  module: 3
  lesson: '03.5'
  subject: status-check
  difficulty: 1
  question: >-
    Where can you check, for free, whether the Supreme Court has ruled on the Judicial Selection
    petitions?
  options:
    - Nevo's case-law pages, which list all new judgments first.
    - The Knesset's legislation database, which records court rulings.
    - The free Supreme Court judgment search, and the news.
    - The Bar Association's members-only site, after registering.
  correct: 2
  explanation: >-
    supremedecisions.court.gov.il is free; news reports give the date and vote. Nevo case-law pages
    are paid, and the Knesset database tracks bills, not rulings.
- id: m03-083
  module: 3
  lesson: '03.5'
  subject: neutral-writing
  difficulty: 2
  question: Which phrase keeps a briefing on the 2025 amendment neutral in your own voice?
  options:
    - '"Amendment No. 4 to Basic Law: The Judiciary".'
    - '"The regime-change law that ends the courts".'
    - '"The long-awaited judicial reform of the people".'
    - '"The dictatorship law of the current coalition".'
  correct: 0
  explanation: >-
    Name the law by its title. Each side's label may be quoted and attributed, but not used in your
    own voice.
- id: m03-084
  module: 3
  lesson: '03.5'
  subject: neutral-writing
  difficulty: 3
  question: >-
    A draft says: "The Court ruled in June 2026 that the law endangers judicial independence, as
    Justice Stein said." What is wrong?
  options:
    - Justice Stein is not a member of the Supreme Court.
    - The hearing was in 2025, not 2026.
    - Nothing; a justice's statement is a ruling of the Court.
    - It reports a justice's question at a hearing as a ruling.
  correct: 3
  explanation: >-
    On 21 June 2026 the justices heard the petitions and asked questions. No ruling had been found
    by 12 October 2026. Separate hearings from judgments.
- id: m03-085
  module: 3
  lesson: '03.5'
  subject: judicial-selection
  difficulty: 2
  question: >-
    What reason did the Knesset give in July 2026 for lowering the Supreme Court selection threshold
    from seven votes to five?
  options:
    - It speeds up appointments during wartime and other emergencies.
    - It ends the justices' effective veto over their colleagues.
    - It was required by an express Supreme Court ruling in 2024.
    - It brings Israel in line with a recommendation of the UN.
  correct: 1
  explanation: >-
    The Knesset's supplementary brief said the change ends the justices' effective veto. Petitioners
    reply that it gives each political bloc a veto and risks paralysis.
- id: m03-086
  module: 3
  lesson: '03.5'
  subject: review-of-basic-laws
  difficulty: 1
  question: >-
    In HCJ 5658/23 (1 January 2024), how many of the 15 justices held that Basic Laws can be
    reviewed in extreme cases, according to the official abstract?
  options:
    - '8.'
    - '15.'
    - '12.'
    - '3.'
  correct: 2
  explanation: >-
    Twelve of fifteen accepted review in extreme cases; eight voted to annul the reasonableness
    amendment. Some news reports count 13 (lesson 04.3).
- id: m03-087
  module: 3
  lesson: '03.5'
  subject: judicial-selection
  difficulty: 3
  question: >-
    A petition-watcher asks: if the Court has not ruled by the time the 26th Knesset begins its
    term, what happens to Amendment No. 4?
  options:
    - It lapses automatically and must be passed again.
    - It takes effect, subject to any later ruling.
    - It is frozen until a referendum is held.
    - It applies only to Supreme Court appointments.
  correct: 1
  explanation: >-
    The text says it applies from the start of the 26th Knesset's term. A later ruling could still
    change that; check the status at the time.
- id: m03-088
  module: 3
  lesson: '03.5'
  subject: neutral-writing
  difficulty: 2
  question: Which source should you use to describe who sits on the new Judicial Selection Committee?
  options:
    - An opposition party's campaign leaflet.
    - A coalition minister's social-media post.
    - A friend's summary in a WhatsApp group.
    - 'The Hebrew text of Basic Law: The Judiciary s. 4.'
  correct: 3
  explanation: >-
    Describe a law from its own text. Political statements are useful as attributed positions, not
    as descriptions of what the law says.
- id: m04-001
  module: 4
  lesson: '04.1'
  subject: legality
  difficulty: 1
  question: What does the principle of administrative legality (עקרון חוקיות המינהל) say?
  options:
    - An authority may do anything that no law forbids it to do.
    - An authority may act only under a power given to it by law.
    - An authority may act freely unless a court has ruled otherwise.
    - An authority may act only after a public consultation.
  correct: 1
  explanation: >-
    For private persons, what is not forbidden is allowed. For public authorities it is the reverse:
    they need a power from law for every act.
- id: m04-002
  module: 4
  lesson: '04.1'
  subject: legality
  difficulty: 1
  question: Which of these, on its own, can be the source of a public authority's power?
  options:
    - An internal procedure published on the ministry's website.
    - A long-standing practice that nobody has challenged.
    - A section in a statute, or in regulations made under one.
    - A minister's public statement announcing a new policy.
  correct: 2
  explanation: >-
    Procedures, practices and statements may guide how a power is used, but the power itself must
    come from a statute or from secondary legislation made under it.
- id: m04-003
  module: 4
  lesson: '04.1'
  subject: express-authority
  difficulty: 1
  question: 'Under Basic Law: Human Dignity and Liberty s. 8, how may an authority limit a basic right?'
  options:
    - Only under a statute, or by express authorisation in a statute, for a proper purpose.
    - Whenever the authority's legal adviser approves the limit in writing.
    - Whenever the public interest outweighs the right in the authority's view.
    - Only after the Knesset committee responsible for the area approves the limit.
  correct: 0
  explanation: >-
    Section 8 allows limits "בחוק" or "לפי חוק כאמור מכוח הסמכה מפורשת בו", for a proper purpose and
    no more than necessary.
- id: m04-004
  module: 4
  lesson: '04.1'
  subject: residual-power
  difficulty: 2
  question: 'Who holds the residual power in Basic Law: The Government s. 32?'
  options:
    - Every public authority, including local councils.
    - Each minister, separately, in the area of their ministry.
    - The Prime Minister personally, for urgent matters.
    - The government as a body, subject to any law.
  correct: 3
  explanation: >-
    Section 32 gives the government the power to act for the state where no law assigns the matter
    to another authority, "בכפוף לכל דין". Local councils have no residual power.
- id: m04-005
  module: 4
  lesson: '04.1'
  subject: residual-power
  difficulty: 2
  question: >-
    A municipality says it may run a new "neighbourhood patrol permit" scheme because it has
    "residual powers like the government". What is wrong with this claim?
  options:
    - Nothing, because every public body shares the government's residual power.
    - Residual powers apply only in wartime, under a declared state of emergency.
    - Local authorities act only under their ordinances, other laws and by-laws.
    - Residual powers exist, but only the Interior Minister may use them for councils.
  correct: 2
  explanation: >-
    Section 32 belongs to the government. A municipality must point to a specific power in the
    Municipalities Ordinance, another law or a by-law.
- id: m04-006
  module: 4
  lesson: '04.1'
  subject: ancillary-powers
  difficulty: 2
  question: >-
    A law empowers a regulator to license food stalls. The regulator sets a procedure for how
    inspections are scheduled. Which provision supports this?
  options:
    - Interpretation Law s. 17, which includes ancillary powers reasonably needed to use a power.
    - 'Basic Law: The State Economy s. 1, which allows fees and procedures together.'
    - 'Basic Law: The Government s. 33, which lets officials create new powers.'
    - 'Basic Law: Human Dignity and Liberty s. 11, which applies to all authorities.'
  correct: 0
  explanation: >-
    Section 17(א)–(ב) of the Interpretation Law lets a power-holder set working procedures and use
    ancillary powers reasonably needed — not create new, independent powers.
- id: m04-007
  module: 4
  lesson: '04.1'
  subject: ancillary-powers
  difficulty: 3
  question: >-
    The same food-stall regulator now announces that stall owners must pay a yearly "inspection
    contribution" and argues this is an ancillary power. Is it?
  options:
    - Yes, because inspections cost money and paying for them is reasonably needed.
    - Yes, as long as the amount is published on the regulator's website in advance.
    - No, unless the regulator first holds a hearing for every stall owner.
    - No, because a compulsory payment needs a basis in a statute or under one.
  correct: 3
  explanation: >-
    Ancillary powers fill small gaps. A compulsory payment is a separate matter that needs a basis
    "בחוק או על פיו" (Basic Law: The State Economy s. 1).
- id: m04-008
  module: 4
  lesson: '04.1'
  subject: delegation
  difficulty: 1
  question: >-
    Under Basic Law: The Government s. 33(ב), which power may a minister NOT delegate to a public
    servant?
  options:
    - The power to grant individual permits under a law.
    - The power to make regulations.
    - The power to decide on individual applications.
    - The power to approve a budget line already set by law.
  correct: 1
  explanation: >-
    Section 33(ב) lets a minister delegate statutory powers to a public servant, "למעט סמכות להתקין
    תקנות".
- id: m04-009
  module: 4
  lesson: '04.1'
  subject: delegation
  difficulty: 2
  question: >-
    A permit refusal is signed by a deputy director. The law gives the power to "המנהל". What is the
    most efficient way to test whether the deputy had authority?
  options:
    - Assume no authority and file a petition, since only the director may sign.
    - Ask the deputy director to confirm orally that he is allowed to sign.
    - Ask in writing for the delegation document and the section that permits delegation.
    - Search news reports for earlier decisions the deputy director signed.
  correct: 2
  explanation: >-
    Delegation must be lawful and is usually in a written document. Asking for it in writing tests
    the point cheaply and creates a record.
- id: m04-010
  module: 4
  lesson: '04.1'
  subject: legality
  difficulty: 2
  question: >-
    Spot the mistake in this sentence from a resident's letter: "Your decision is unlawful because
    it is unwise and I disagree with it; please cancel it."
  options:
    - It should be written in English, since letters to authorities are bilingual.
    - 'It names no legal flaw: no missing power, no improper consideration, no procedural defect.'
    - It asks the authority itself for cancellation, which only a court may order after a petition.
    - It should be addressed to the court rather than to the authority.
  correct: 1
  explanation: >-
    Disagreement is not a legal ground. A strong letter names a specific flaw, starting with the
    question of authority.
- id: m04-011
  module: 4
  lesson: '04.1'
  subject: primary-arrangements
  difficulty: 3
  question: >-
    A ministry sets, by an internal guideline, a sweeping national rule on who is exempt from a
    civic duty — a deeply contested social question. Which argument fits best?
  options:
    - The guideline is valid as long as the ministry consulted the public first.
    - The guideline is a primary arrangement that the Knesset itself should make by law.
    - The guideline is valid because ministry guidelines rank above regulations in the hierarchy.
    - The guideline can only be challenged if it imposes a fee.
  correct: 1
  explanation: >-
    Courts hold that basic policy choices on contested matters ("הסדרים ראשוניים") must be made by
    the Knesset, not left to officials — as in the yeshiva-deferral line of cases after Ressler.
- id: m04-012
  module: 4
  lesson: '04.1'
  subject: legality
  difficulty: 3
  question: >-
    A council's by-law allows it to "regulate street trading". The council bans all street trading
    citywide. A trader asks which point to raise first.
  options:
    - That the ban had no hearing, because hearings come before authority questions.
    - That the ban is unreasonable, because traders' livelihoods matter.
    - That the council must answer within 45 days of the trader's complaint.
    - That a power to regulate may not cover a total ban, which also limits a right.
  correct: 3
  explanation: >-
    Whether the power covers the act comes first. A power to regulate is not automatically a power
    to ban, and a total ban limits freedom of occupation, which needs clear authority.
- id: m04-013
  module: 4
  lesson: '04.1'
  subject: key-terms
  difficulty: 1
  question: What does "חריגה מסמכות" mean?
  options:
    - Acting beyond the power the law gives (ultra vires).
    - Refusing to use a power that one lawfully holds.
    - Delegating a power to another official without approval.
    - Using a power slowly, after a deadline.
  correct: 0
  explanation: Chariga mismchut is acting outside one's legal power — the core legality flaw.
- id: m04-014
  module: 4
  lesson: '04.1'
  subject: legality
  difficulty: 2
  question: What does a court usually do with a decision made without authority?
  options:
    - Leaves it in place but orders the authority to apologise and pay costs.
    - Declares it void or cancels it, often sending the matter back to the right body.
    - Approves it anyway if the result turned out to be good for the public as a whole.
    - Refers the decision-maker to the police for a criminal investigation.
  correct: 1
  explanation: >-
    An act without power is defective at the root. Courts cancel it and often let the competent body
    decide again lawfully; they may limit remedies such as refunds.
- id: m04-015
  module: 4
  lesson: '04.1'
  subject: express-authority
  difficulty: 3
  question: >-
    A ministry asks protest organisers to sign an undertaking not to criticise named officials as a
    condition of a permit. No law mentions such undertakings. What is the strongest objection?
  options:
    - The condition is too vague for the organisers to know what is required.
    - The ministry should have asked for the undertaking after the protest.
    - The condition limits expression, which needs express authority in a statute.
    - The organisers were not given 45 days to consider the condition.
  correct: 2
  explanation: >-
    A permit condition that limits a basic right needs express statutory authority (Basic Law s. 8).
    Without it, the condition is outside the power.
- id: m04-016
  module: 4
  lesson: '04.1'
  subject: legality
  difficulty: 2
  question: Which question should come FIRST when you audit an administrative decision?
  options:
    - Was the result the best one available?
    - Did the decision-maker give enough weight to all of my arguments?
    - Was I treated the same as my neighbours?
    - Which section of law gave this body the power to decide this?
  correct: 3
  explanation: >-
    Authority comes first: without a power, nothing else matters, and it is the ground courts are
    most comfortable applying.
- id: m04-017
  module: 4
  lesson: '04.2'
  subject: considerations-purpose
  difficulty: 1
  question: According to Ressler, what decides whether a consideration is relevant?
  options:
    - The personal views of the official who holds the power.
    - The purpose of the enabling law, judged objectively.
    - The number of residents who support the consideration.
    - Whether the consideration appears in the decision letter.
  correct: 1
  explanation: >-
    Barak J.: "The test of their relevance is objective", set by the law's purpose (Ressler, para.
    64).
- id: m04-018
  module: 4
  lesson: '04.2'
  subject: considerations-purpose
  difficulty: 1
  question: Which source is usually the BEST guide to a law's purpose when its text is unclear?
  options:
    - A news article describing the debate about the law's passage.
    - The explanatory notes to the bill (דברי הסבר) on the Knesset database.
    - The official's own explanation of the law in the decision letter.
    - A social media post by the minister responsible.
  correct: 1
  explanation: >-
    After the text, structure and any purpose clause, the explanatory notes to the bill are a
    primary guide to purpose; officials' later explanations are not.
- id: m04-019
  module: 4
  lesson: '04.2'
  subject: extraneous-considerations
  difficulty: 1
  question: What is a "שיקול זר"?
  options:
    - A consideration raised by a foreign government or an international body.
    - A consideration the authority used but forgot to write down in its decision.
    - A consideration outside the purpose of the law, such as personal or political interest.
    - A consideration raised late in the process, after the applicant had already been heard.
  correct: 2
  explanation: >-
    An extraneous consideration is one the law's purpose does not make relevant — personal,
    political or other improper motives.
- id: m04-020
  module: 4
  lesson: '04.2'
  subject: extraneous-considerations
  difficulty: 2
  question: >-
    A regional council delays a building permit for a settlement's synagogue after the community's
    rabbi criticised the council head. The engineer's file shows no technical problem. Which flaw
    should the community investigate?
  options:
    - 'An extraneous consideration: retaliation for criticism.'
    - 'Lack of authority: councils cannot approve religious buildings.'
    - 'Fettering: the council follows a strict policy on synagogues.'
    - 'Mootness: the community can build elsewhere.'
  correct: 0
  explanation: >-
    Delay after criticism, with no technical reason on file, suggests retaliation — an extraneous
    consideration. The community should request reasons and the file to prove it.
- id: m04-021
  module: 4
  lesson: '04.2'
  subject: evidence-of-motive
  difficulty: 2
  question: >-
    Which piece of evidence is usually the most persuasive that an extraneous consideration was
    used?
  options:
    - An anonymous post claiming the decision was political.
    - Your own belief, stated in an affidavit, that the official dislikes you.
    - A general news report that the authority is politicised.
    - The committee minutes recording the reason discussed before the vote.
  correct: 3
  explanation: >-
    Minutes are official records of what was actually considered. They are far stronger than
    suspicion, rumours or general reporting.
- id: m04-022
  module: 4
  lesson: '04.2'
  subject: discrimination
  difficulty: 2
  question: >-
    A municipality funds after-school programmes in Jewish neighbourhoods but refuses the same
    programme in an Arab neighbourhood with similar needs, giving no reason. Which ground fits?
  options:
    - Fettering, because the municipality follows its budget too closely.
    - Dictation, because the budget was set by the finance department.
    - 'Discrimination: unequal treatment of like cases for no relevant reason.'
    - Lack of standing, because funding decisions cannot be challenged.
  correct: 2
  explanation: >-
    Equality is a consideration every authority must respect. Treating similar cases differently for
    an irrelevant reason is discrimination, an extraneous-consideration flaw.
- id: m04-023
  module: 4
  lesson: '04.2'
  subject: fettering
  difficulty: 2
  question: >-
    A ministry's policy says applications for an accessibility grant are "never accepted after 30
    June". A disabled applicant was hospitalised all of June. What is the best argument?
  options:
    - The policy itself is void, because ministries may not set dates.
    - The ministry must consider an exception, since a rigid rule fetters discretion.
    - The applicant had no standing, so the policy cannot be challenged.
    - The ministry must hold a public hearing on every grant policy.
  correct: 1
  explanation: >-
    Deadlines and policies are lawful, but the authority must stay willing to consider exceptional
    cases. A rule applied with no exceptions at all is fettering.
- id: m04-024
  module: 4
  lesson: '04.2'
  subject: dictation
  difficulty: 2
  question: >-
    A licensing officer refuses a licence and writes: "The mayor instructed me to refuse." The law
    gives the power to the licensing officer. What flaw does this reveal?
  options:
    - 'Dictation: the officer did not use his own discretion.'
    - 'Lack of authority: the mayor holds all municipal powers.'
    - 'Delay: the officer waited for the mayor''s instruction.'
    - None, since following a superior's instruction is lawful.
  correct: 0
  explanation: >-
    The holder of the power must decide. Following another person's instruction without independent
    judgment is acting under dictation.
- id: m04-025
  module: 4
  lesson: '04.2'
  subject: considerations-purpose
  difficulty: 3
  question: >-
    A law on nature reserves lets the authority close trails "for the protection of nature". It
    closes a trail to stop a planned protest walk by an environmental group. Assess the closure.
  options:
    - Lawful, because the authority holds the power to close trails for any reason.
    - Lawful, because protests are not a protected use of nature reserves.
    - Unlawful only if the group applied for a permit at least 45 days ahead.
    - Likely unlawful, because stopping a protest is not the purpose of the power.
  correct: 3
  explanation: >-
    The power exists for protecting nature. Using it to stop a protest serves a purpose the law does
    not give — an extraneous consideration, unless a real nature-protection reason applies.
- id: m04-026
  module: 4
  lesson: '04.2'
  subject: mixed-motives
  difficulty: 3
  question: >-
    A refusal cites a real parking problem and, in the minutes, the council's dislike of the
    applicant's views. The parking problem was minor and had been ignored for other applicants. How
    should your audit present this?
  options:
    - Ignore the views point, since a relevant reason exists.
    - Show the extraneous consideration was decisive, using the minutes and the comparison.
    - Argue only that parking is never a relevant consideration.
    - >-
      Argue that any mention of the applicant's views in the minutes voids the decision
      automatically.
  correct: 1
  explanation: >-
    With mixed motives, courts ask whether the extraneous consideration was decisive. The comparison
    with other applicants shows the minor relevant reason would not have produced the refusal alone.
- id: m04-027
  module: 4
  lesson: '04.2'
  subject: key-terms
  difficulty: 1
  question: What does "חזקת התקינות" mean for an activist challenging a decision?
  options:
    - The decision is presumed lawful, so the challenger must show the flaw.
    - The decision is presumed unlawful until the authority proves otherwise.
    - The authority must re-examine any decision when asked.
    - The court must hold a hearing before deciding any petition.
  correct: 0
  explanation: >-
    The presumption of regularity places the initial burden on the challenger, which is why evidence
    matters so much.
- id: m04-028
  module: 4
  lesson: '04.2'
  subject: extraneous-considerations
  difficulty: 2
  question: >-
    A ministry conditions a cultural grant on the theatre staging "at least one play supporting
    government policy". The grant law aims to support artistic quality. Classify the condition.
  options:
    - A relevant consideration, because public funds may serve government policy.
    - A procedural flaw, because the theatre had no hearing on the condition.
    - An extraneous consideration, outside the law's purpose of artistic quality.
    - A lawful policy, since every grant may carry conditions.
  correct: 2
  explanation: >-
    Conditions must serve the law's purpose. Requiring political content in a law aimed at artistic
    quality is an extraneous consideration — whichever government is in power.
- id: m04-029
  module: 4
  lesson: '04.2'
  subject: considerations-missing
  difficulty: 2
  question: >-
    A ministry closes a rural clinic to save money and never considers the travel distance for
    elderly patients, which the health law makes central. Which flaw is this?
  options:
    - Lack of authority, because only the Knesset may close clinics.
    - Dictation, because the finance ministry asked for savings.
    - Conflict of interest, because the ministry benefits from the savings.
    - Failure to consider a relevant consideration the law requires.
  correct: 3
  explanation: >-
    Ignoring a consideration the law makes central is as much a flaw as weighing an extraneous one,
    and it leads naturally into reasonableness (weight).
- id: m04-030
  module: 4
  lesson: '04.2'
  subject: evidence-of-motive
  difficulty: 3
  question: >-
    You have strong suspicion but no documents that a decision was political. You will need the
    minutes and internal emails. Which tool fits best before any court step?
  options:
    - A Freedom of Information request for the minutes and correspondence.
    - A defamation warning letter sent to the decision-maker personally.
    - A complaint to the police for breach of trust.
    - An immediate High Court petition asking the court to order discovery.
  correct: 0
  explanation: >-
    FOI (lesson 05.2) is the standard way to obtain minutes and documents. Courts expect evidence,
    and accusations without it carry legal risk.
- id: m04-031
  module: 4
  lesson: '04.2'
  subject: extraneous-considerations
  difficulty: 1
  question: >-
    Which of these is an extraneous consideration for a municipal official deciding a building
    permit?
  options:
    - Compliance with the approved plan.
    - Fire-safety requirements.
    - The applicant's vote in the last local election.
    - The building's impact on neighbours' light and access.
  correct: 2
  explanation: >-
    How the applicant voted has nothing to do with the purposes of planning law. The other three are
    standard planning considerations.
- id: m04-032
  module: 4
  lesson: '04.2'
  subject: fettering
  difficulty: 3
  question: >-
    Spot the mistake in this protest group's letter: "Your policy of limiting demonstrations near
    hospitals is unlawful because authorities may not have policies."
  options:
    - The letter should cite the 45-day deadline for answering.
    - Policies are lawful; the argument should be that the policy left no room for this case.
    - >-
      The letter should be sent to the Knesset, which approves all police policies on
      demonstrations.
    - The letter should have asked for a hearing on the policy itself.
  correct: 1
  explanation: >-
    Authorities may adopt policies to guide discretion. The flaw is a policy applied rigidly, with
    no willingness to consider exceptions.
- id: m04-033
  module: 4
  lesson: '04.3'
  subject: reasonableness
  difficulty: 1
  question: In Israeli administrative law, what is the core of the reasonableness ground?
  options:
    - Whether the decision is the one the judge would have made.
    - Whether the decision followed a written procedure.
    - Whether proper weight was given to the relevant considerations.
    - Whether the decision was popular with the public.
  correct: 2
  explanation: >-
    Reasonableness is about balance: the weight given to relevant considerations. Ressler (para. 67)
    speaks of "allowing appropriate weight to the various factors".
- id: m04-034
  module: 4
  lesson: '04.3'
  subject: reasonableness
  difficulty: 1
  question: What is "מתחם הסבירות"?
  options:
    - The range of reasonable decisions within which the court does not intervene.
    - The geographic area in which a local authority may lawfully act.
    - The period during which a decision may still be challenged in an administrative court.
    - The list of considerations written into the enabling law itself.
  correct: 0
  explanation: >-
    Several decisions can be reasonable. The court intervenes only when a decision falls outside
    that range.
- id: m04-035
  module: 4
  lesson: '04.3'
  subject: reasonableness-status
  difficulty: 1
  question: On what date did the High Court annul the 2023 reasonableness amendment?
  options:
    - 24 July 2023.
    - 12 September 2023.
    - 27 March 2025.
    - 1 January 2024.
  correct: 3
  explanation: >-
    HCJ 5658/23 was decided on 1.1.2024. 24.7.2023 is when the amendment passed; 12.9.2023 the
    hearing; 27.3.2025 the judicial selection amendment.
- id: m04-036
  module: 4
  lesson: '04.3'
  subject: reasonableness-status
  difficulty: 1
  question: By what majority did the Court annul the reasonableness amendment in HCJ 5658/23?
  options:
    - 15 to 0.
    - 8 to 7.
    - 12 to 3.
    - 10 to 1.
  correct: 1
  explanation: >-
    Eight of the fifteen justices voided the amendment. A larger majority (12 per the official
    abstract) held that Basic Laws may be reviewed in extreme cases.
- id: m04-037
  module: 4
  lesson: '04.3'
  subject: reasonableness-status
  difficulty: 2
  question: Whose decisions did the 2023 amendment (s. 15(ד1)) try to exclude from reasonableness review?
  options:
    - All public authorities, including local councils.
    - Only the Knesset and its committees.
    - The government, the Prime Minister and ministers.
    - Only the Attorney General and ministry legal advisers.
  correct: 2
  explanation: >-
    The annulled s. 15(ד1) covered "הממשלה, ראש הממשלה או שר אחר", including appointments and
    decisions not to act. It never covered local authorities or officials below ministers.
- id: m04-038
  module: 4
  lesson: '04.3'
  subject: reasonableness-status
  difficulty: 2
  question: What did the three-justice minority that read the amendment narrowly propose?
  options:
    - To keep the amendment but read it as still allowing review of arbitrary decisions.
    - To void the amendment and extend reasonableness to the Knesset.
    - To refer the whole question to a national referendum before deciding.
    - To suspend the amendment until the next Knesset could reconsider it.
  correct: 0
  explanation: >-
    Justices Willner, Stein and Canfy-Steinitz would have upheld the amendment, read so that it
    removed balancing-type review but left review of capricious decisions.
- id: m04-039
  module: 4
  lesson: '04.3'
  subject: reasonableness-status
  difficulty: 2
  question: Which description of the reasonableness debate is balanced enough for a course or a leaflet?
  options:
    - >-
      Reasonableness lets unelected judges rule the country, as everyone across politics now
      accepts.
    - >-
      Only opponents of democracy criticise the reasonableness ground, so their view need not be
      presented.
    - >-
      Amendment supporters saw too broad a scope to intervene; defenders see a check on arbitrary
      acts.
    - The debate ended in 2024, so there is no need to present positions.
  correct: 2
  explanation: >-
    Each side's position is attributed and stated fairly. The debate continues, with critics and
    defenders among judges, scholars and politicians.
- id: m04-040
  module: 4
  lesson: '04.3'
  subject: reasonableness
  difficulty: 2
  question: Which threshold do courts apply before cancelling a decision for unreasonableness?
  options:
    - Any unreasonableness, however small.
    - Unreasonableness proven beyond reasonable doubt.
    - Unreasonableness that a majority of the public perceives.
    - Extreme unreasonableness (חוסר סבירות קיצוני).
  correct: 3
  explanation: >-
    Courts intervene only where the decision is extremely unreasonable — far outside the range of
    reasonable decisions.
- id: m04-041
  module: 4
  lesson: '04.3'
  subject: reasonableness
  difficulty: 2
  question: What is the significance of the Deri-Pinhasi rulings (1993) for reasonableness?
  options:
    - They held that a Prime Minister's failure to dismiss an indicted minister can be unreasonable.
    - >-
      They abolished reasonableness review of all ministers' appointments and dismissals by the
      government.
    - They held that indicted ministers are automatically disqualified by statute.
    - They created the proportionality test for administrative decisions.
  correct: 0
  explanation: >-
    No statute required dismissal, but the Court held that refraining from using the power to
    dismiss could, in the circumstances, be unreasonable.
- id: m04-042
  module: 4
  lesson: '04.3'
  subject: proportionality
  difficulty: 1
  question: What is the correct order of the proportionality tests?
  options:
    - Least harmful means, proper purpose, rational connection, benefit against harm.
    - Proper purpose, rational connection, least harmful means, benefit against harm.
    - Rational connection, benefit against harm, proper purpose, least harmful means.
    - Benefit against harm, least harmful means, rational connection, proper purpose.
  correct: 1
  explanation: >-
    First the purpose must be proper; then the measure must advance it; then it must be the least
    harmful effective option; finally its benefit must justify its harm.
- id: m04-043
  module: 4
  lesson: '04.3'
  subject: proportionality
  difficulty: 1
  question: When does the proportionality test apply to an administrative decision?
  options:
    - Whenever a citizen disagrees with the decision.
    - Only when a decision involves spending public money.
    - When the decision limits a basic right.
    - Only when the decision was taken by a minister.
  correct: 2
  explanation: >-
    Proportionality is the test for limits on rights (Basic Law s. 8: "במידה שאינה עולה על הנדרש"),
    and courts apply it to administrative acts too.
- id: m04-044
  module: 4
  lesson: '04.3'
  subject: proportionality
  difficulty: 2
  question: >-
    A council removes all benches from a square to stop rough sleeping. Homeless-rights activists
    argue the measure is disproportionate. Which point best fits the least harmful means test?
  options:
    - Social services outreach and night patrols would address the problem with less harm.
    - Preventing rough sleeping is never a proper purpose for a council.
    - Removing benches has no rational connection to where homeless people choose to sleep.
    - The council did not answer the activists within 45 days.
  correct: 0
  explanation: >-
    The least harmful means test asks whether another measure achieves the purpose about as well
    with less harm to all users, including the elderly and disabled who need benches.
- id: m04-045
  module: 4
  lesson: '04.3'
  subject: proportionality
  difficulty: 3
  question: >-
    A ministry bans a political group's rally citing a specific, credible threat of violence, after
    considering and rejecting a smaller venue and extra police. Which proportionality stage is now
    the realistic battleground?
  options:
    - Proper purpose, because public safety is never a proper purpose for a ban.
    - Rational connection, because bans never reduce violence.
    - Least harmful means, because the ministry did not consider alternatives at all.
    - 'Proportionality in the narrow sense: whether the safety benefit justifies a total ban.'
  correct: 3
  explanation: >-
    Safety is proper, a ban is connected to it, and alternatives were weighed. The remaining
    question is whether the benefit is worth the harm to expression.
- id: m04-046
  module: 4
  lesson: '04.3'
  subject: proportionality
  difficulty: 2
  question: What is the main point of Beit Sourik (HCJ 2056/04) for this module?
  options:
    - Courts may not review military commanders' decisions at all, even where rights are harmed.
    - >-
      Proportionality applies to administrative acts; a less harmful available route can decide the
      case.
    - >-
      The reasonableness ground was abolished for all security decisions taken by the army in the
      field.
    - Public petitioners have no standing in security matters.
  correct: 1
  explanation: >-
    The Court accepted the security purpose but annulled parts of the route because an alternative
    caused less harm — proportionality applied to a commander's decision.
- id: m04-047
  module: 4
  lesson: '04.3'
  subject: choosing-grounds
  difficulty: 3
  question: >-
    A minister refused to renew a grant to an NGO. You find no authority problem, but the minister
    gave no reasons, ignored the grant committee's recommendation and held no hearing. Which ground
    should lead your letter?
  options:
    - Extreme unreasonableness, because the decision feels unfair.
    - Proportionality, because every grant refusal limits a basic right.
    - Procedure and reasons, supported by the ignored recommendation.
    - Lack of standing of the minister to refuse grants.
  correct: 2
  explanation: >-
    Concrete procedural flaws are stronger than a general reasonableness claim. The ignored
    recommendation then supports a weight-based reasonableness argument.
- id: m04-048
  module: 4
  lesson: '04.3'
  subject: choosing-grounds
  difficulty: 3
  question: >-
    You disagree with a lawful government policy on fuel taxes that was adopted with full procedure
    and relevant considerations. What is the most realistic route?
  options:
    - 'Political action: Knesset committees, MKs, public campaigns.'
    - A petition for extreme unreasonableness, since you disagree.
    - A petition for disproportionality, since all taxes limit property.
    - A petition for lack of standing of the finance minister.
  correct: 0
  explanation: >-
    Courts do not replace lawful policy choices. Disagreement with a lawful policy belongs to the
    political process (Module 12).
- id: m04-049
  module: 4
  lesson: '04.3'
  subject: reasonableness
  difficulty: 2
  question: 'Spot the weakness in this sentence from a petition draft: "The decision is unreasonable."'
  options:
    - It should say "illegal" instead, since reasonableness no longer exists.
    - It does not say which consideration got no or wrong weight, and why.
    - It should be in English, since reasonableness is an English doctrine.
    - It should be at the end of the petition, not the start.
  correct: 1
  explanation: >-
    A label persuades nobody. A strong argument names the consideration, the weight it received and
    why the result falls outside the range.
- id: m04-050
  module: 4
  lesson: '04.3'
  subject: reasonableness-status
  difficulty: 3
  question: >-
    A group wants to cite reasonableness against a 2026 ministerial decision. A member says "check
    first whether the Knesset has re-legislated it." Where should they look, and why?
  options:
    - Nowhere; once the Court has ruled, the Knesset can never legislate on the topic again.
    - Only in the 2024 judgment, because later developments cannot change it.
    - Only on social media and in the news, where legislative changes usually appear first.
    - The current Basic Law text and legislative trackers, because a new Knesset could act again.
  correct: 3
  explanation: >-
    The status can change. Check the current text (Wikisource, the Knesset database) and up-to-date
    trackers, and attribute any advocacy source.
- id: m04-051
  module: 4
  lesson: '04.3'
  subject: key-terms
  difficulty: 1
  question: What does "מידתיות במובן הצר" ask?
  options:
    - Whether the measure is legal under the enabling law.
    - Whether the measure advances the purpose at all.
    - Whether the benefit of the measure justifies the harm it causes.
    - Whether the measure was adopted within the deadline set by law.
  correct: 2
  explanation: The last stage compares benefit and harm, even when no gentler measure exists.
- id: m04-052
  module: 4
  lesson: '04.3'
  subject: reasonableness
  difficulty: 3
  question: >-
    In Ressler, Barak J. upheld the yeshiva deferrals but warned "Quantity makes a qualitative
    difference". What does that mean for reasonableness?
  options:
    - A lawful policy can become unreasonable when its scale grows far beyond its original balance.
    - Larger numbers of petitioners make a petition more likely to succeed.
    - >-
      Decisions affecting very many people are not justiciable, because they are political by
      nature.
    - Policies must be re-legislated every year by the Knesset.
  correct: 0
  explanation: >-
    The weight of considerations changes with scale. A deferral policy reasonable for a few could
    cross the line as numbers grow (Ressler, para. 69).
- id: m04-053
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 1
  question: Where does the general right to be heard (זכות הטיעון) in Israeli administrative law come from?
  options:
    - From the rules of natural justice applied by the courts.
    - From a specific section of the Decisions and Reasons Law.
    - From the Freedom of Information Law.
    - 'From Basic Law: The Government s. 32.'
  correct: 0
  explanation: >-
    There is no general statute; the courts apply natural justice ("שמע את הצד השני") to every
    administrative body. Some specific laws add their own hearing rules.
- id: m04-054
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 1
  question: Which of these is NOT one of the elements of a proper hearing?
  options:
    - Notice that a decision is being considered.
    - Access to the material the authority relies on.
    - A real chance to respond, with an open mind.
    - The right to choose which official will decide.
  correct: 3
  explanation: >-
    A hearing includes notice, the material, time, a chance to respond and an open mind — not a
    choice of decision-maker.
- id: m04-055
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 2
  question: >-
    A municipality adopts a new city-wide rule on outdoor seating hours. A café owner says he was
    owed a personal hearing before the rule. Is he right?
  options:
    - Yes, every person affected by any decision has a right to a personal hearing.
    - No; general rules usually need no individual hearing, though some laws require consultation.
    - Yes, but only if he submitted a written request for a personal hearing within 45 days.
    - No, because municipalities are not bound by natural justice.
  correct: 1
  explanation: >-
    Individual hearings attach to decisions about specific persons. General rules may require public
    consultation where a law says so, not individual hearings.
- id: m04-056
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 2
  question: >-
    A building is about to collapse and the municipality evacuates it immediately, without a
    hearing. Is the lack of a prior hearing unlawful?
  options:
    - Yes, hearings are always required before any decision about specific people.
    - Yes, unless a court approved the evacuation in advance.
    - No, in a real emergency it may act first, but it must hear the residents afterwards.
    - No, emergencies remove the duty to hear entirely, even after the danger passes.
  correct: 2
  explanation: >-
    Real urgency can justify acting before a hearing, but the authority must then hear the affected
    people and remain willing to change its decision.
- id: m04-057
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 3
  question: >-
    A council invites you to a "hearing" on cancelling your group's permit, but refuses to show you
    the complaints, saying only that "there were many". What is your best response?
  options:
    - Ask in writing for the complaints, redacted if needed, so that you can respond to them.
    - Refuse to attend, because an incomplete hearing is no hearing.
    - Attend the hearing and argue only that your group is popular in the whole neighbourhood.
    - Ask the council to postpone the hearing for at least six months.
  correct: 0
  explanation: >-
    A hearing without the material is not a real chance to respond. Ask for it in writing (redaction
    can protect complainants) and attend, putting your objection on record.
- id: m04-058
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 3
  question: >-
    At a hearing, the committee chair reads a decision that was printed before you finished
    speaking. Which hearing element is most clearly missing?
  options:
    - Notice of the planned decision, given in writing a reasonable time in advance.
    - Access to the material that the committee relied on.
    - Reasonable time to prepare a response before the meeting.
    - 'An open mind: the decision was ready before you were heard.'
  correct: 3
  explanation: >-
    A decision prepared in advance suggests a closed mind (דעה נעולה). A hearing must be able to
    change the outcome.
- id: m04-059
  module: 4
  lesson: '04.4'
  subject: reasons
  difficulty: 1
  question: Under Decisions and Reasons Law s. 2א, when must an official give written reasons?
  options:
    - When refusing a written request to use a power.
    - Only when a court orders the official to explain.
    - Only when approving a request, so others can rely on it.
    - Only for decisions that cost the applicant money.
  correct: 0
  explanation: >-
    Section 2א: an official who refused a request under s. 2(א) must inform the applicant in writing
    of the reasons for refusal.
- id: m04-060
  module: 4
  lesson: '04.4'
  subject: reasons
  difficulty: 2
  question: Which of these is a lawful exception to the duty to give reasons under s. 3?
  options:
    - The official thinks the reasons would embarrass the minister.
    - The request was to appoint the applicant to a particular post.
    - The official is too busy to write reasons.
    - The applicant is a member of an opposition party.
  correct: 1
  explanation: >-
    Section 3 lists exceptions including requests to be appointed to a post, and security or foreign
    relations. Embarrassment, workload and politics are not among them.
- id: m04-061
  module: 4
  lesson: '04.4'
  subject: reasons
  difficulty: 2
  question: >-
    An official refuses your request and writes that reasons are withheld "under section 3", without
    saying which paragraph. What may you do?
  options:
    - Nothing, since s. 3 gives the official complete discretion.
    - Ask a court for damages for the missing reasons.
    - Insist on the specific ground (s. 4), and appeal (ערר) to the minister within the time set.
    - File a criminal complaint against the official for breach of the Decisions and Reasons Law.
  correct: 2
  explanation: >-
    Section 4 requires the official to state which s. 3 ground applies and gives a right of appeal
    to the minister within a set period (see current numbers).
- id: m04-062
  module: 4
  lesson: '04.4'
  subject: reasons
  difficulty: 2
  question: 'Spot the problem with this reply: "Your request is refused following a professional review."'
  options:
    - 'It is a label, not reasons: it does not say what the review found or why it led to refusal.'
    - It should have been signed by the minister personally, not by an official of the ministry.
    - It was sent too quickly, before the 45 days for answering had passed, so it is premature.
    - It should have been sent by registered mail only.
  correct: 0
  explanation: >-
    Reasons must let you understand the decision and respond to it. A reference to "a review"
    without its content does not meet the duty.
- id: m04-063
  module: 4
  lesson: '04.4'
  subject: reasons
  difficulty: 3
  question: >-
    Under s. 5 of the Decisions and Reasons Law, what must an official tell you if the decision is
    subject to appeal under some enactment?
  options:
    - Nothing, because applicants must find their own appeal routes.
    - Only the name and address of the appeals committee.
    - The right of appeal, how to file it and the deadlines set by law.
    - The likely result of the appeal, based on past cases.
  correct: 2
  explanation: >-
    Section 5 requires written notice of the right of appeal, how to file it and its deadlines. If
    it is missing, s. 6(א) shifts the burden of proving legality to the authority.
- id: m04-064
  module: 4
  lesson: '04.4'
  subject: conflict-of-interest
  difficulty: 1
  question: What is the test for a conflict of interest of a public servant, as stated by Barak J.?
  options:
    - Proof that the official was actually influenced by the interest.
    - A real possibility of a conflict of interest.
    - A criminal conviction for breach of trust.
    - A complaint by at least two members of the public.
  correct: 1
  explanation: >-
    "אסור לו לעובד הציבור להימצא במצב בו קיימת אפשרות ממשית של ניגוד עניינים". Actual influence need
    not be proved.
- id: m04-065
  module: 4
  lesson: '04.4'
  subject: conflict-of-interest
  difficulty: 1
  question: What is an institutional conflict of interest?
  options:
    - A conflict between an official's public role and a relative's business.
    - A dispute between two ministries over a budget.
    - A clash between two public roles the same person holds.
    - Any disagreement inside a committee.
  correct: 2
  explanation: >-
    An institutional conflict pits two public interests one person is entrusted with against each
    other, such as promoting and supervising the same project.
- id: m04-066
  module: 4
  lesson: '04.4'
  subject: conflict-of-interest
  difficulty: 2
  question: >-
    A district planning committee member is a paid consultant to the developer of a plan under
    discussion. He declares this and leaves the room before the vote. Was s. 47 complied with?
  options:
    - Yes, because he declared the interest and did not attend or vote on the matter.
    - No, because consultants may never sit on planning committees.
    - No, because he should have voted against the plan to show neutrality.
    - Yes, but only if the developer agreed to his recusal in writing.
  correct: 0
  explanation: >-
    Section 47(א) requires notifying the chair and not attending the discussion or the vote. Check
    that the minutes record both.
- id: m04-067
  module: 4
  lesson: '04.4'
  subject: conflict-of-interest
  difficulty: 2
  question: Which relative is NOT listed in the definition of "קרוב" in Municipalities Ordinance s. 122א?
  options:
    - A spouse.
    - A parent.
    - A brother or sister.
    - A cousin.
  correct: 3
  explanation: >-
    Section 122א defines a relative as a spouse, parent, son or daughter, brother or sister. Cousins
    are not listed, though a general conflict may still arise.
- id: m04-068
  module: 4
  lesson: '04.4'
  subject: conflict-of-interest
  difficulty: 3
  question: >-
    A minister is to decide on extending the term of an official whose agency is investigating the
    minister's close aides. Which flaw would a court most likely examine?
  options:
    - Lack of authority, because ministers never decide on agency heads.
    - A personal conflict of interest affecting the minister's discretion.
    - Mootness, because the official could resign at any time.
    - Lack of standing of the official to be heard.
  correct: 1
  explanation: >-
    An investigation touching the decision-maker's circle creates a real possibility of conflict.
    That was one ground in the May 2025 Shin Bet ruling.
- id: m04-069
  module: 4
  lesson: '04.4'
  subject: conflict-of-interest
  difficulty: 3
  question: >-
    You find that a council member's company won a municipal contract. Before going public, what
    should you check?
  options:
    - Whether the company has a website and offices, since that proves it is a real business.
    - >-
      Whether the member voted in the last council elections, which shows whether he is still active
      on the council.
    - >-
      Whether one of the s. 122א exceptions applied, such as an approved permit published in
      Reshumot.
    - Whether the contract was signed in Hebrew and stamped by the council's legal adviser.
  correct: 2
  explanation: >-
    Section 122א(ב) allows some contracts, for example with a two-thirds council majority and
    ministerial approval published in Reshumot. Check before alleging a breach.
- id: m04-070
  module: 4
  lesson: '04.4'
  subject: hearing
  difficulty: 2
  question: >-
    In the May 2025 ruling on the Shin Bet head's dismissal, which procedural point did the majority
    make about the hearing?
  options:
    - He was given less than a day and no concrete claims to answer.
    - He was given a full hearing but chose not to attend.
    - Hearings are not required for dismissing agency heads.
    - The hearing should have been held by the Knesset.
  correct: 0
  explanation: >-
    According to the Times of Israel report, the majority found he was not given concrete claims and
    had less than a day to prepare. The government disputed the ruling.
- id: m04-071
  module: 4
  lesson: '04.4'
  subject: key-terms
  difficulty: 1
  question: What is a "הסדר למניעת ניגוד עניינים"?
  options:
    - >-
      A court order cancelling a decision that was tainted by a conflict of interest of the
      decision-maker.
    - >-
      An arrangement, set by a legal adviser, limiting an official's role where a conflict may
      arise.
    - A contract between a municipality and a supplier.
    - A fine imposed on officials who fail to declare their personal interests on time.
  correct: 1
  explanation: >-
    Conflict-of-interest arrangements define which matters an official may not handle, under the
    Attorney General's guidelines.
- id: m04-072
  module: 4
  lesson: '04.5'
  subject: standing
  difficulty: 1
  question: What is a "public petitioner" (עותר ציבורי)?
  options:
    - A petitioner without a personal interest, acting on a matter of public importance.
    - Any petitioner who is a public servant, acting in an official capacity.
    - A petitioner who files without paying a fee because of a public-interest exemption.
    - A petitioner represented by the Attorney General.
  correct: 0
  explanation: >-
    Since Ressler, public petitioners may be heard on matters of public importance, serious flaws in
    administration or the rule of law.
- id: m04-073
  module: 4
  lesson: '04.5'
  subject: standing
  difficulty: 2
  question: >-
    A tenant's eviction notice from a public housing company seems unlawful, but she does not want
    to sue. A housing-rights NGO wants to petition alone. What is the best course?
  options:
    - The NGO petitions alone; public petitioners can always replace the affected person.
    - The NGO pays her to sign the petition so standing is secured.
    - The NGO files in her name without asking, as a public service.
    - Respect her choice; a public petition in her place will probably fail on standing.
  correct: 3
  explanation: >-
    Courts generally reject a public petitioner where the directly affected person chose not to act.
    Acting for her without consent, or paying her, raises further problems.
- id: m04-074
  module: 4
  lesson: '04.5'
  subject: justiciability
  difficulty: 1
  question: What is the difference between normative and institutional justiciability?
  options:
    - 'Normative: whether the petition was filed in time; institutional: whether fees were paid.'
    - >-
      Normative: whether legal standards exist to decide; institutional: whether a court should
      decide.
    - 'Normative: whether the petitioner is affected; institutional: whether a group is involved.'
    - There is no difference; the terms are used interchangeably.
  correct: 1
  explanation: >-
    Ressler distinguished the two: almost everything has a legal standard, but some matters may
    still be better left to other branches.
- id: m04-075
  module: 4
  lesson: '04.5'
  subject: justiciability
  difficulty: 2
  question: >-
    A petition asks the court to order the government to open peace negotiations with a neighbouring
    state. Which threshold problem is most likely?
  options:
    - Lack of standing, because peace concerns every citizen equally and no one specially.
    - Delay, because the conflict began decades ago and nobody petitioned earlier.
    - 'Institutional non-justiciability: a core foreign-policy choice for political bodies.'
    - Failure to pay the court fee in advance.
  correct: 2
  explanation: >-
    Courts decline matters at the heart of foreign and security policy where no legal duty is at
    stake. A petition framed around a legal duty fares better.
- id: m04-076
  module: 4
  lesson: '04.5'
  subject: exhaustion
  difficulty: 1
  question: What does "פנייה מוקדמת" mean in practice?
  options:
    - Writing to the authority asking for what you want before going to court.
    - Filing a petition early, before the authority has made its final decision.
    - Paying the court fee before filing.
    - Asking the court for an early hearing date because of urgency.
  correct: 0
  explanation: >-
    A prior written request gives the authority the chance to fix the problem; the petition must
    attach it or explain its absence (reg. 5(ב)(6)).
- id: m04-077
  module: 4
  lesson: '04.5'
  subject: alternative-remedy
  difficulty: 2
  question: Why does the High Court of Justice usually dismiss a petition where a statutory appeal exists?
  options:
    - Because statutory appeals are always cheaper.
    - >-
      Because Basic Law: The Judiciary s. 15(ג) limits it to matters no other court or tribunal can
      hear.
    - >-
      Because the Administrative Courts Law forbids petitions to the High Court on all planning and
      licensing matters.
    - Because the High Court hears only criminal appeals.
  correct: 1
  explanation: >-
    The High Court acts where relief is needed for justice and no other court or tribunal has
    jurisdiction. An available alternative remedy usually leads to dismissal.
- id: m04-078
  module: 4
  lesson: '04.5'
  subject: delay
  difficulty: 2
  question: >-
    Besides the deadline itself, which factor most affects whether a court dismisses a petition for
    delay (שיהוי)?
  options:
    - Whether the petitioner has filed petitions before.
    - Whether the petition is longer than twenty pages, which courts treat as an abuse of process.
    - Whether the petitioner is represented by a lawyer.
    - Whether the authority or third parties relied on the decision in the meantime.
  correct: 3
  explanation: >-
    Courts weigh the length of and reason for the delay, reliance by others, and the seriousness of
    the alleged illegality. Reg. 4 allows dismissal even within the deadline.
- id: m04-079
  module: 4
  lesson: '04.5'
  subject: forum
  difficulty: 2
  question: >-
    How do you decide whether an administrative petition goes to the Administrative Affairs Court or
    to the High Court of Justice?
  options:
    - Check whether the matter is listed in the First Schedule to the Administrative Courts Law.
    - Choose the High Court for important cases and the district court for minor or local ones.
    - Choose whichever court is closer to your home.
    - >-
      Ask the authority which court it prefers, since the respondent chooses the forum in
      administrative cases.
  correct: 0
  explanation: >-
    The Administrative Affairs Court hears petitions on matters in the First Schedule (s. 5); other
    administrative matters go to the High Court. Check the item before filing.
- id: m04-080
  module: 4
  lesson: '04.5'
  subject: forum
  difficulty: 1
  question: Which grounds does the Administrative Affairs Court apply to an administrative petition?
  options:
    - Only the grounds listed in the First Schedule item.
    - The grounds, powers and remedies the High Court uses as HCJ.
    - Only grounds of lack of authority, not reasonableness.
    - The grounds in the Civil Procedure Regulations.
  correct: 1
  explanation: >-
    Section 8 of the Administrative Courts Law applies the High Court's grounds, powers and
    remedies, with the necessary changes.
- id: m04-081
  module: 4
  lesson: '04.5'
  subject: exhaustion
  difficulty: 3
  question: >-
    Spot the mistake: a resident writes to a ministry on Monday asking it to cancel a decision and
    files a petition on Wednesday, saying "I exhausted remedies".
  options:
    - The letter should have been sent to the court instead of the ministry.
    - Exhaustion requires a meeting in person with the minister, not a letter to the ministry.
    - The ministry was not given reasonable time to answer, so remedies were not exhausted.
    - Exhaustion is only needed for High Court petitions.
  correct: 2
  explanation: >-
    Exhaustion means giving the authority a real chance to respond. Two days is rarely enough unless
    the matter is genuinely urgent, which the petition must explain.
- id: m04-082
  module: 4
  lesson: '04.5'
  subject: standing
  difficulty: 3
  question: >-
    A right-wing NGO petitions against a ministry's failure to enforce demolition orders on illegal
    buildings, and a left-wing NGO petitions against non-enforcement of environmental orders. How do
    courts approach their standing?
  options:
    - 'The same way: enforcement of the law is a rule-of-law matter for public petitioners.'
    - 'Differently: courts favour environmental petitioners over planning ones.'
    - Neither has standing, because only residents may petition on enforcement.
    - Only the NGO whose views match the government's has standing.
  correct: 0
  explanation: >-
    Standing doctrine is neutral. Both raise rule-of-law enforcement issues, the classic ground for
    public-petitioner standing.
- id: m04-083
  module: 4
  lesson: '04.5'
  subject: delay
  difficulty: 1
  question: From when does the petition clock in reg. 3(ב) run?
  options:
    - From the day the petitioner decides to sue.
    - From the earliest of publication, notice to the petitioner, or the petitioner's knowledge.
    - From the day the authority's legal adviser replies to the petitioner's prior written request.
    - From the first day of the following month.
  correct: 1
  explanation: >-
    The regulation counts from the earliest of the three dates. Check the deadline in current
    numbers.
- id: m04-084
  module: 4
  lesson: '04.5'
  subject: mootness
  difficulty: 2
  question: Why did the dissenting justice in the May 2025 Shin Bet ruling say the court should not rule?
  options:
    - Because the petitioners lacked standing as public petitioners.
    - Because the dismissal was not justiciable as a security matter.
    - Because the petition was filed late.
    - Because the head had resigned, making the petitions moot.
  correct: 3
  explanation: >-
    Deputy President Sohlberg argued the question had become theoretical; the majority ruled anyway
    because of its public importance.
- id: m04-085
  module: 4
  lesson: '04.5'
  subject: key-terms
  difficulty: 1
  question: What does "סילוק על הסף" mean?
  options:
    - Dismissal without examining the merits, for a threshold reason.
    - Removing a judge from the panel.
    - Ending a court hearing early because the time set for it ran out.
    - Sending a case back to the authority for a new decision.
  correct: 0
  explanation: Threshold flaws — standing, exhaustion, delay, alternative remedy — lead to dismissal in limine.
- id: m05-001
  module: 5
  lesson: '05.1'
  subject: tool-choice
  difficulty: 1
  question: Which tool is designed to get you documents and data that a public authority holds?
  options:
    - A complaint to the Public Complaints Commissioner.
    - A pre-petition letter to the legal adviser.
    - A Freedom of Information request.
    - A public inquiry to the State Comptroller.
  correct: 2
  explanation: >-
    The FOI Law gives every citizen or resident a right to information held by a public authority
    (s. 1). The other tools aim at decisions or investigations.
- id: m05-002
  module: 5
  lesson: '05.1'
  subject: tool-choice
  difficulty: 1
  question: What is usually the very first step before any complaint or petition against an authority?
  options:
    - A written request to the official who holds the power.
    - A post on social media tagging the authority.
    - A phone call to the authority's call centre.
    - A complaint to the State Comptroller's audit.
  correct: 0
  explanation: >-
    A written request starts the 45-day duty to decide (Decisions and Reasons Law s. 2) and is the
    first exhibit of every later step.
- id: m05-003
  module: 5
  lesson: '05.1'
  subject: forum
  difficulty: 1
  question: Which list decides whether a petition goes to the Administrative Court?
  options:
    - The schedule to the Court Fees Regulations.
    - The list of audited bodies in the State Comptroller Law.
    - The definitions section of the FOI Law.
    - The First Schedule of the Administrative Courts Law.
  correct: 3
  explanation: >-
    Section 5(1) of the Administrative Courts Law gives the court jurisdiction over matters listed
    in the First Schedule.
- id: m05-004
  module: 5
  lesson: '05.1'
  subject: forum
  difficulty: 2
  question: >-
    A local planning committee granted a permit you oppose. No minister was involved. Where would a
    petition go?
  options:
    - The High Court of Justice in Jerusalem, as for all permits.
    - The District Court as an Administrative Court.
    - The Magistrates' Court of the town where the land is.
    - The National Planning Council's appeals board only.
  correct: 1
  explanation: >-
    Planning and building matters are First Schedule item 10, with exclusions only for national and
    district outline plans and ministers' decisions.
- id: m05-005
  module: 5
  lesson: '05.1'
  subject: forum
  difficulty: 2
  question: >-
    Your petition concerns a decision of the Government as a whole about national education budgets.
    The education item of the First Schedule excludes government decisions. Where does it go?
  options:
    - To the Administrative Court of your district.
    - To the Administrative Court in Jerusalem.
    - To the High Court of Justice.
    - To the Knesset Education Committee.
  correct: 2
  explanation: >-
    Item 3 (education) excludes decisions of the Government and of a minister; matters outside the
    Schedule go to the HCJ (Basic Law: The Judiciary s. 15(ג)).
- id: m05-006
  module: 5
  lesson: '05.1'
  subject: tool-choice
  difficulty: 2
  question: >-
    A neighbourhood group wants a municipality to install speed bumps. It has not written to anyone
    yet. Which order of steps is sound?
  options:
    - A petition first, then a written request during the hearing.
    - Written request, pre-petition letter if refused, then a petition.
    - An ombudsman complaint first, then a written request later.
    - An FOI request first, then a petition with no letter at all.
  correct: 1
  explanation: >-
    Courts expect the authority to be asked first and given a chance to answer; the pre-petition
    letter then exhausts remedies before any petition.
- id: m05-007
  module: 5
  lesson: '05.1'
  subject: deadlines
  difficulty: 2
  question: Which statement about deadlines in a tool plan is correct?
  options:
    - The latest deadline governs, so you can wait for all answers.
    - Complaints pause court deadlines until they are decided.
    - Court deadlines start only after a complaint is closed.
    - The earliest court deadline governs; complaints run in parallel.
  correct: 3
  explanation: >-
    State Comptroller Law s. 45(א)(2) says a complaint does not extend any statutory deadline, so
    the earliest court deadline controls the plan.
- id: m05-008
  module: 5
  lesson: '05.1'
  subject: tool-choice
  difficulty: 2
  question: >-
    A parent's child was refused a statutory school service by the municipality. Time is short and
    the parent wants a binding order. Which tool gives a binding order?
  options:
    - A petition, after a short pre-petition letter.
    - A complaint to the Public Complaints Commissioner.
    - Information sent to the State Comptroller's audit.
    - A Freedom of Information request for the file.
  correct: 0
  explanation: >-
    Only a court gives binding orders. The Commissioner's findings give no new legal right and
    cannot be enforced in court (s. 45).
- id: m05-009
  module: 5
  lesson: '05.1'
  subject: forum
  difficulty: 3
  question: >-
    An activist group wants the court to order a minister to sign regulations on hospital waiting
    times. Health matters partly appear in the First Schedule. Where should it petition?
  options:
    - The HCJ, because the main remedy concerns making regulations.
    - The Administrative Court, because health is in the Schedule.
    - The Magistrates' Court, because it concerns individual patients.
    - The Labour Court, because hospitals employ the staff.
  correct: 0
  explanation: >-
    Section 5(1) excludes from the Administrative Court any petition whose main remedy concerns
    making, cancelling or declaring void regulations.
- id: m05-010
  module: 5
  lesson: '05.1'
  subject: tool-choice
  difficulty: 3
  question: >-
    An activist plans: FOI request now, wait for the answer, then a letter asking the authority to
    change its decision. The decision was published 20 days ago. What is wrong with the plan?
  options:
    - FOI requests may not be filed once a decision is published.
    - A letter must always be sent before any FOI request is made.
    - Nothing; the petition deadline starts only after the FOI answer.
    - Doing the steps in sequence risks the 45-day petition deadline.
  correct: 3
  explanation: >-
    The petition deadline runs from the decision (reg. 3(ב)). Send the pre-petition letter now and
    the FOI request in parallel.
- id: m05-011
  module: 5
  lesson: '05.1'
  subject: forum
  difficulty: 3
  question: >-
    A petition concerns a Civil Administration planning decision about a specific building permit in
    Judea and Samaria. Which court is likely competent?
  options:
    - The District Court nearest to the building.
    - The Administrative Court in Jerusalem, under the Fourth Schedule.
    - The High Court of Justice, which hears every matter there.
    - A military appeals committee only, with no court review.
  correct: 1
  explanation: >-
    Section 5א and the Fourth Schedule give the Jerusalem Administrative Court certain area matters,
    including some planning decisions; read the item's exclusions.
- id: m05-012
  module: 5
  lesson: '05.1'
  subject: tool-choice
  difficulty: 1
  question: Which tool investigates a wrong that an authority did to you personally, for free?
  options:
    - An administrative petition with a court-fee exemption.
    - An FOI request together with a fee-exemption claim.
    - A complaint to the Public Complaints Commissioner.
    - A request to appear before a Knesset committee.
  correct: 2
  explanation: >-
    The Commissioner investigates acts of audited bodies that directly harmed the complainant (State
    Comptroller Law ss. 36–37), at no cost.
- id: m05-013
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 1
  question: Must you give a reason for an FOI request?
  options:
    - Yes; requests without a reason are refused.
    - Only when you ask a government ministry.
    - Only when you claim a fee exemption.
    - No; the law says you need not state a reason.
  correct: 3
  explanation: 'FOI Law s. 7(א): the requester is not obliged to state the reason for the request.'
- id: m05-014
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 1
  question: To whom is an FOI request addressed?
  options:
    - The authority's FOI officer, or someone the officer authorised.
    - The minister or the mayor personally, by name and post.
    - The authority's spokesperson, who handles all public queries.
    - The Attorney General, who supervises every authority.
  correct: 0
  explanation: >-
    Section 7(א) sends the request to the officer (ממונה) appointed under s. 3, or to someone the
    officer authorised.
- id: m05-015
  module: 5
  lesson: '05.2'
  subject: foi-deadlines
  difficulty: 1
  question: How long does an authority have to decide on an FOI request, before any extension?
  options:
    - 45 days.
    - 30 days.
    - 14 days.
    - 60 days.
  correct: 1
  explanation: >-
    FOI Law s. 7(ב): without delay and no later than 30 days from receipt; a reasoned extension adds
    30 days.
- id: m05-016
  module: 5
  lesson: '05.2'
  subject: foi-fees
  difficulty: 1
  question: Which fee do you always pay when filing an FOI request, unless exempt?
  options:
    - The production fee for every page.
    - The handling fee for the first three hours.
    - The request fee.
    - A court fee for registering the request.
  correct: 2
  explanation: >-
    Reg. 1 sets the request fee; handling is charged only from the fourth hour (reg. 2) and
    production per page (reg. 3).
- id: m05-017
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 2
  question: >-
    A non-resident tourist asks the Ministry of Tourism for its marketing budget data. What is the
    legal position?
  options:
    - Non-residents may ask only about their own rights in Israel.
    - Anyone in the world may ask for any information at all.
    - Tourists may ask, but must pay double the usual fees.
    - Only Israeli citizens, not residents, may ever ask.
  correct: 0
  explanation: >-
    Section 1 gives the right to citizens and residents; s. 12 extends it to others only for
    information about their own rights in Israel.
- id: m05-018
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 2
  question: >-
    Spot the mistake in this request: 'Please send me all information you hold about the beach, in
    any form.'
  options:
    - It does not explain why the requester wants the information.
    - It should be addressed to the mayor, not to the FOI officer.
    - It must list the s. 9 exemptions the requester is willing to accept.
    - It names no record type, period or dates, so it invites refusal.
  correct: 3
  explanation: >-
    A vague request can be refused for needing unreasonable resources (s. 8(1)). Name record types,
    a date range and a format.
- id: m05-019
  module: 5
  lesson: '05.2'
  subject: foi-fees
  difficulty: 2
  question: >-
    The FOI officer expects handling and production fees above the cap you committed to. What must
    happen?
  options:
    - The officer simply charges the extra amount after release.
    - The request is refused automatically as too expensive.
    - The officer gives you the estimate and waits for your agreement.
    - You pay a fixed penalty set for unusually large requests.
  correct: 2
  explanation: >-
    Reg. 4(ב)–(ג): the officer informs you of the estimate, may ask for a deposit, and does not
    continue until you agree.
- id: m05-020
  module: 5
  lesson: '05.2'
  subject: foi-fees
  difficulty: 2
  question: A student needs data for a university thesis. Which fee exemption applies?
  options:
    - None; only amutot and benefit recipients are ever exempt.
    - 'Academic research: request fee and four more handling hours.'
    - A full exemption from every fee, with no limit on hours.
    - A 50% discount on the request fee, and nothing more.
  correct: 1
  explanation: >-
    Reg. 6(ב) exempts information needed for academic research from the request fee and handling for
    four hours beyond the free three.
- id: m05-021
  module: 5
  lesson: '05.2'
  subject: foi-fees
  difficulty: 1
  question: 'Information about yourself and your rights: what is the fee position?'
  options:
    - The full request fee, plus double the handling fee.
    - Only the production fee is waived, nothing else.
    - Exempt from the request fee and four more handling hours.
    - No exemption; personal requests are treated like any other.
  correct: 2
  explanation: >-
    Reg. 6(א) exempts information a person asks about themselves and their rights; FOI Law s. 18(ד)
    also bars a request fee for it.
- id: m05-022
  module: 5
  lesson: '05.2'
  subject: foi-exemptions
  difficulty: 2
  question: >-
    An authority may refuse information that is already published and available to the public. What
    must it tell you?
  options:
    - Where you can buy, receive or read the published information.
    - Nothing more; published information is simply refused.
    - The name of the official who originally published it.
    - The fee it charged the first person who asked for it.
  correct: 0
  explanation: >-
    Section 8(4) allows refusal of published information, but the authority must say where it can be
    obtained or read.
- id: m05-023
  module: 5
  lesson: '05.2'
  subject: foi-exemptions
  difficulty: 2
  question: What is the difference between s. 9(א) and s. 9(ב) of the FOI Law?
  options:
    - 9(א) applies to ministries; 9(ב) applies to local authorities.
    - 9(א) covers old information; 9(ב) covers recent information.
    - 9(א) is for individual requesters; 9(ב) is for amutot.
    - 9(א) is information it must not give; 9(ב), information it may withhold.
  correct: 3
  explanation: >-
    Section 9(א) says the authority 'will not' give certain information; s. 9(ב) says it is 'not
    obliged' to, which leaves discretion.
- id: m05-024
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 2
  question: >-
    Why add a sentence about your interest and the public interest, though you need not give
    reasons?
  options:
    - Without it, the request fee is automatically doubled.
    - The authority must weigh them before refusing (s. 10).
    - The officer cannot open a file for a request without it.
    - It turns the request into an ombudsman complaint as well.
  correct: 1
  explanation: >-
    Section 10 requires the authority to consider the requester's interest, if stated, and the
    public interest in health, safety and the environment.
- id: m05-025
  module: 5
  lesson: '05.2'
  subject: foi-deadlines
  difficulty: 3
  question: >-
    You emailed a request on 1 May; the officer confirms receipt on 3 May; you pay on 6 May. When is
    day 30?
  options:
    - 5 June, counting from 6 May.
    - 31 May, counting from 1 May.
    - 2 June, counting from 3 May.
    - 1 June, counting from the end of April.
  correct: 0
  explanation: >-
    Reg. 9(א): the periods run from receipt or payment, whichever is later — 6 May. Not counting
    that day, day 30 is 5 June.
- id: m05-026
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 3
  question: >-
    You want the spreadsheet a ministry uses to track grant applications. It offers a printed
    summary report instead. What can you insist on?
  options:
    - A new analysis of the data prepared especially for you.
    - A summary of the data signed by the director general.
    - Nothing; the authority chooses any format it likes freely.
    - The data produced with the ministry's usual tools, such as an export.
  correct: 3
  explanation: >-
    Section 7(ה): records are given as held, without processing for you, but computer data is
    produced by the means the authority normally uses.
- id: m05-027
  module: 5
  lesson: '05.2'
  subject: foi-fees
  difficulty: 3
  question: >-
    A ministry missed the FOI deadline without extending it and then billed production fees for 400
    pages. What is your answer?
  options:
    - Pay for the pages, but refuse to pay the request fee itself.
    - It may charge no handling or production fees after missing it.
    - Pay in full, because producing 400 pages is a real cost.
    - Ask the Administrative Court to reduce the fee by half.
  correct: 1
  explanation: >-
    Reg. 6א: an authority that did not handle the request within the statutory times may not collect
    handling and production fees.
- id: m05-028
  module: 5
  lesson: '05.2'
  subject: foi-request
  difficulty: 2
  question: Which bodies are completely outside the FOI Law?
  options:
    - All government companies, whatever their activity.
    - All local authorities and their municipal companies.
    - Bodies listed in s. 14, such as the security services.
    - Every university that receives state funding.
  correct: 2
  explanation: >-
    Section 14 excludes the bodies it lists (for example the ISA and Mossad); government companies,
    local authorities and funded universities are generally covered.
- id: m05-029
  module: 5
  lesson: '05.3'
  subject: foi-follow-up
  difficulty: 1
  question: On day 31 you have no answer and no extension notice. What do you send first?
  options:
    - A reminder citing s. 7(ב) with a short final date.
    - A petition to the High Court of Justice against the minister.
    - A new request for the same information, with a new fee.
    - A fee appeal to the Magistrates' Court of the district.
  correct: 0
  explanation: >-
    A firm reminder citing the missed deadline (and reg. 6א on fees) often resolves the matter,
    while you keep the petition deadline in view.
- id: m05-030
  module: 5
  lesson: '05.3'
  subject: foi-follow-up
  difficulty: 1
  question: Which bodies does the Government FOI Unit supervise?
  options:
    - All public authorities, including municipalities.
    - Government ministries and their auxiliary units.
    - Only the Knesset and the courts.
    - Private companies holding public data.
  correct: 1
  explanation: >-
    The Unit's procedure and the Movement for FOI guide describe complaints about ministries and
    auxiliary units; it has no supervisory role over local authorities.
- id: m05-031
  module: 5
  lesson: '05.3'
  subject: foi-petition
  difficulty: 1
  question: Which court hears a petition against an FOI refusal, when no privilege certificate was issued?
  options:
    - The High Court of Justice.
    - The Magistrates' Court.
    - The Supreme Court as a court of appeal.
    - The Administrative Court.
  correct: 3
  explanation: FOI Law s. 17(א) and First Schedule item 2 send FOI petitions to the Administrative Court.
- id: m05-032
  module: 5
  lesson: '05.3'
  subject: foi-follow-up
  difficulty: 2
  question: 'An extension notice says only: ''We need more time.'' Is it a lawful extension?'
  options:
    - Yes; any written notice extends by 30 days.
    - Yes, if it was sent by the director general.
    - No; an extension must be written and reasoned.
    - No; extensions are never allowed under the FOI Law.
  correct: 2
  explanation: >-
    Section 7(ב) allows a 30-day extension only if the requester is notified in writing with the
    reasons for the need.
- id: m05-033
  module: 5
  lesson: '05.3'
  subject: foi-follow-up
  difficulty: 2
  question: >-
    A ministry gives a reasoned 30-day extension, then on day 60 a further reasoned extension signed
    by the director general because of volume. What is the maximum further extension?
  options:
    - Up to 30 more days.
    - Up to 90 more days.
    - No further extension is allowed.
    - Up to 60 more days.
  correct: 3
  explanation: >-
    Section 7(ג) allows the head of the authority a further reasoned extension for volume or
    complexity, not exceeding 60 days.
- id: m05-034
  module: 5
  lesson: '05.3'
  subject: foi-petition
  difficulty: 2
  question: >-
    The authority wants to release information about a company, which objects. How long does the
    company have to object, and do those days count?
  options:
    - 7 days, which are counted in the 30-day period.
    - 45 days, which are counted in the petition deadline.
    - 21 days, which do not count toward the FOI deadlines.
    - 30 days, which also extend the request-fee period.
  correct: 2
  explanation: >-
    Section 13(א): a third party may object within 21 days; those days are not counted in the s. 7
    periods.
- id: m05-035
  module: 5
  lesson: '05.3'
  subject: foi-petition
  difficulty: 2
  question: Before ordering disclosure that may harm a third party, what must the court do?
  options:
    - Ask the FOI Unit for its opinion.
    - Give the third party a chance to be heard.
    - Wait for the ombudsman's findings.
    - Obtain the minister's written consent.
  correct: 1
  explanation: >-
    FOI Law s. 17(ג): the court will not order disclosure that may harm a third party before giving
    it an opportunity to argue.
- id: m05-036
  module: 5
  lesson: '05.3'
  subject: foi-petition
  difficulty: 3
  question: >-
    A refusal cites internal deliberations (s. 9(ב)(4)) for a report the decision relied on, and the
    decision was made a year ago. Which argument is strongest?
  options:
    - The decision is final, so the report is no longer deliberation; s. 17(ד).
    - The authority must release every internal document on request.
    - Internal documents are always secret, so the request should be dropped.
    - Ask the ombudsman to declare the report a public document.
  correct: 0
  explanation: >-
    Section 9(ב)(4) is discretionary. The court may order disclosure where the public interest
    prevails (s. 17(ד)), and finished decisions weaken the deliberation ground.
- id: m05-037
  module: 5
  lesson: '05.3'
  subject: foi-petition
  difficulty: 3
  question: >-
    An activist complains to the FOI Unit after a written refusal received on 1 March, and waits. On
    20 April the Unit says it cannot help. When was the petition deadline?
  options:
    - 15 April, 45 days from the refusal.
    - 4 June, 45 days from the Unit's answer.
    - 1 March next year, one year later.
    - There is none while a complaint is open.
  correct: 0
  explanation: >-
    The 45 days run from notice of the refusal (reg. 3(ב)); the complaint did not pause them. Now
    only an extension request (reg. 3(ג)) can help.
- id: m05-038
  module: 5
  lesson: '05.3'
  subject: foi-follow-up
  difficulty: 2
  question: >-
    Spot the mistake: a reminder to a municipality's FOI officer says, 'If you do not answer, I will
    complain to the Government FOI Unit.'
  options:
    - Reminders may not mention next steps.
    - A reminder must be sent by registered mail only.
    - The FOI Unit does not supervise municipalities.
    - The reminder should be addressed to the Prime Minister.
  correct: 2
  explanation: >-
    The Government FOI Unit handles ministries and their units. For a municipality the realistic
    next steps are the mayor, the Commissioner or a petition.
- id: m05-039
  module: 5
  lesson: '05.3'
  subject: foi-petition
  difficulty: 2
  question: >-
    A refusal partly withholds a document but does not say whether redacted release was considered.
    Which section supports your challenge?
  options:
    - Section 14, which lists the bodies excluded from the law.
    - Section 11, which requires partial release where possible.
    - Section 5, which deals with the authority's annual report.
    - Section 18, which deals with the fee regulations.
  correct: 1
  explanation: >-
    Section 11 requires the authority to release information with omissions, changes or conditions
    where that is possible without unreasonable resources.
- id: m05-040
  module: 5
  lesson: '05.3'
  subject: foi-follow-up
  difficulty: 3
  question: >-
    A ministry has been silent for 50 days with no extension. You want to protect a petition. Which
    approach is cautious?
  options:
    - Wait until the ministry answers, then count 45 days.
    - Wait three months, since silence then becomes a refusal.
    - File an ombudsman complaint and count from its result.
    - Treat day 30 as the refusal and petition within 45 days of it.
  correct: 3
  explanation: >-
    With silence there is no written decision. Counting from the end of the answer period avoids a
    delay argument (regs 3–4).
- id: m05-041
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 1
  question: Who may file a complaint with the Public Complaints Commissioner?
  options:
    - Only Israeli citizens over 18.
    - Any person.
    - Only people represented by a lawyer.
    - Only residents of the authority complained about.
  correct: 1
  explanation: 'State Comptroller Law s. 33: every person may submit a complaint.'
- id: m05-042
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 1
  question: How much does a complaint to the Commissioner cost?
  options:
    - Nothing; it is free.
    - The same as an FOI request fee.
    - A fee set by the Court Fees Regulations.
    - A deposit returned if the complaint is justified.
  correct: 0
  explanation: Filing with the Commissioner is free and needs no lawyer.
- id: m05-043
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 1
  question: Within how long should a complaint normally be filed?
  options:
    - Within 45 days of the act complained about.
    - Within 30 days of the authority's written answer.
    - Within seven years of the act, like most claims.
    - Within one year of the act or of learning of it.
  correct: 3
  explanation: >-
    Section 39(2): a complaint filed after a year from the act, or from when the complainant learned
    of it, is investigated only for a special reason.
- id: m05-044
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 2
  question: Your phone company overcharged you. Can the Commissioner investigate?
  options:
    - Yes; any company serving the public is covered.
    - Yes, if the overcharge exceeds the small-claims ceiling.
    - No; a private company is not a body under s. 36.
    - Only after the Communications Ministry refuses to act.
  correct: 2
  explanation: >-
    Section 36 covers audited bodies listed in s. 9(1)–(6) and certain others. Private companies go
    to their regulator or to court.
- id: m05-045
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 2
  question: Which complaint is excluded from investigation under s. 38?
  options:
    - A complaint about a municipal clerk's delay.
    - A complaint about a ministry's failure to answer.
    - A complaint about a government company's billing.
    - A complaint about a judicial decision in your case.
  correct: 3
  explanation: >-
    Section 38(4) excludes complaints about judicial or quasi-judicial acts; the others concern
    audited bodies.
- id: m05-046
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 2
  question: >-
    Your elderly neighbour was harmed by a National Insurance delay and asks you to complain for
    her. What do you need?
  options:
    - A power of attorney signed in front of a notary.
    - Her consent, to the Commissioner's satisfaction.
    - A court order appointing you as her guardian.
    - Nothing; anyone may complain about anyone's harm.
  correct: 1
  explanation: >-
    Section 37(1) allows a complaint about harm to another person if the complainant obtained that
    person's consent to the Commissioner's satisfaction.
- id: m05-047
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 2
  question: What can the Commissioner do when it finds a complaint justified?
  options:
    - Point to the defect and how and when to fix it; the body reports back.
    - Order the body to pay compensation that is enforceable in court.
    - Cancel the body's decision with immediate legal effect.
    - Refer the complainant to the HCJ with an automatic fee waiver.
  correct: 0
  explanation: >-
    Section 43(א)–(ב): the Commissioner may point to the need to correct the defect and the way and
    time; the body reports the steps taken.
- id: m05-048
  module: 5
  lesson: '05.4'
  subject: comptroller
  difficulty: 2
  question: >-
    What should you expect after sending general information about a systemic failure to the State
    Comptroller?
  options:
    - A full written ruling on your information within 45 days.
    - A hearing at which you present the evidence in person.
    - An acknowledgement, but no right to updates on its use.
    - A binding order to the audited body to fix the failure.
  correct: 2
  explanation: >-
    The Comptroller's public-inquiries procedure gives an acknowledgement within about two weeks;
    the sender has no standing or right to updates.
- id: m05-049
  module: 5
  lesson: '05.4'
  subject: comptroller
  difficulty: 2
  question: Will the body you report to the State Comptroller learn who you are?
  options:
    - Yes; the body receives the full inquiry with your name on it.
    - Only if you are yourself an employee of a public body.
    - As a rule no; the sender's details are kept confidential.
    - Only once the Comptroller publishes a report on the subject.
  correct: 2
  explanation: >-
    The procedure instructs audit staff not to reveal the sender's identifying details when
    approaching the audited body.
- id: m05-050
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 3
  question: >-
    A council refused your business licence. The law gives you an appeal (ערר) to an appeals board,
    which you did not use. You complain to the Commissioner. What is likely?
  options:
    - Automatic investigation, since the council is an audited body.
    - Investigation only if the Commissioner finds a special reason.
    - Automatic referral of the complaint to the appeals board.
    - Rejection, because licensing decisions are judicial acts.
  correct: 1
  explanation: >-
    Section 39(1): a complaint about a decision open to objection, appeal-board or appeal is
    investigated only for a special reason.
- id: m05-051
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 3
  question: >-
    A complaint is still under investigation when the petition deadline approaches. The
    Commissioner's office says 'wait for us'. What do you do?
  options:
    - File the petition on time and inform the Commissioner.
    - Wait, since the office asked you to.
    - Ask the Commissioner to extend the court deadline.
    - Withdraw the complaint and restart it after the case.
  correct: 0
  explanation: >-
    Section 45(א)(2): a complaint does not extend a statutory deadline. Note that once the matter is
    pending in court the Commissioner may stop (ss. 38(5), 42).
- id: m05-052
  module: 5
  lesson: '05.4'
  subject: ombudsman
  difficulty: 2
  question: Which of these is NOT required for a complaint under s. 34?
  options:
    - The complainant's name.
    - The complainant's address.
    - The complainant's signature.
    - A lawyer's signature.
  correct: 3
  explanation: >-
    Section 34 requires the complaint to be signed by the complainant and to state their name and
    address. No lawyer is needed.
- id: m05-053
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 1
  question: What is the main legal purpose of a pre-petition letter?
  options:
    - To start the 45-day deadline for filing a petition.
    - To exempt the petitioner from paying the court fee.
    - To show the court you exhausted remedies first.
    - To notify the court registry that a petition is coming.
  correct: 2
  explanation: >-
    Courts expect a prior written demand; the regulations require it to be attached to an
    administrative petition (reg. 5(ב)(6)).
- id: m05-054
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 1
  question: To whom should the pre-petition letter be sent?
  options:
    - The court registry, with a copy to the authority.
    - The decision-maker, copied to the legal adviser.
    - The Attorney General only, as head of the legal system.
    - The authority's spokesperson, who answers the public.
  correct: 1
  explanation: >-
    The decision-maker can change the decision; the legal adviser assesses the risk of a petition
    and often drives the answer.
- id: m05-055
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 2
  question: 'Spot the mistake in this remedy paragraph: ''I demand that you act fairly and lawfully.'''
  options:
    - It is too specific for the authority to be able to answer.
    - It should be written in English for the legal department.
    - It should cite the court fee schedule for the petition.
    - It names no decision and no specific act to be done.
  correct: 3
  explanation: >-
    A remedy should mirror the court order you would ask for: cancel decision X of date Y, or do act
    Z by a date.
- id: m05-056
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 2
  question: Does a request to reconsider a decision restart the 45-day petition deadline?
  options:
    - Assume not; count from the original decision.
    - Yes, always from the date of the new answer.
    - Yes, but only for HCJ petitions.
    - No deadline applies once you have written.
  correct: 0
  explanation: >-
    A repeated request does not reliably create a new decision. Plan the letter inside the 45 days
    from the original decision.
- id: m05-057
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 2
  question: Why should a pre-petition letter avoid insults and threats?
  options:
    - Insults make the letter legally void.
    - The judge will read it as an exhibit.
    - The authority may charge a fee for rude letters.
    - Threats automatically extend the deadline.
  correct: 1
  explanation: >-
    The letter is attached to the petition; a calm, factual letter supports you, while an abusive
    one undermines you before the court.
- id: m05-058
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 2
  question: What should the letter ask for besides the remedy, if you lack the authority's reasons?
  options:
    - A meeting with the minister.
    - A waiver of the court fee.
    - The documents the decision relied on.
    - A copy of the petition the authority expects.
  correct: 2
  explanation: >-
    Asking for the documents (and filing an FOI request in parallel) lets you see the real reasons
    before you draft the petition.
- id: m05-059
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 3
  question: >-
    A decision was given on 1 September. You send a letter on 5 September giving 10 days. The
    authority answers on 14 September with a new reason. What now?
  options:
    - Answer both reasons in a petition filed before 16 October.
    - Start a new 45-day period from the answer of 14 September.
    - Send a second letter giving the authority 30 more days.
    - Complain to the ombudsman and wait for its findings first.
  correct: 0
  explanation: >-
    The deadline from 1 September is 16 October. A new reason does not reset it; the petition
    answers both reasons.
- id: m05-060
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 3
  question: A demolition is scheduled for tomorrow morning. Can you petition without a pre-petition letter?
  options:
    - No; a letter giving at least 7 days is always required.
    - Yes, and the petition need not mention the missing letter.
    - No; urgent cases must go to the ombudsman instead.
    - Yes, explaining the urgency; still email the authority today.
  correct: 3
  explanation: >-
    Reg. 5(ב)(6) allows a petition without a prior approach if you give the reasons; an email the
    same day shows good faith.
- id: m05-061
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 2
  question: Which defect statement belongs in a pre-petition letter?
  options:
    - The official who decided is often rude to the public.
    - The decision is unpopular with residents on social media.
    - The decision relied on a consideration foreign to the law.
    - The municipality's budget is generally wasteful and opaque.
  correct: 2
  explanation: >-
    Each defect should be a legal one — authority, extraneous considerations, reasonableness,
    hearing, reasons, discrimination — with its rule.
- id: m05-062
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 1
  question: What does 'בלי לפגוע בזכויות' at the top of the letter signal?
  options:
    - You waive your right to petition.
    - You keep all your other claims and rights.
    - The letter is confidential and cannot be used.
    - The authority need not answer in writing.
  correct: 1
  explanation: >-
    'Without prejudice to rights' tells the reader that the letter does not give up any claim you
    may have.
- id: m05-063
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 3
  question: >-
    A group wants to petition the HCJ against a national decision taken 6 months ago, about which
    they learned the same week. They never wrote. What is the biggest risk?
  options:
    - Dismissal for delay and for not exhausting remedies.
    - Dismissal because only lawyers write to ministers.
    - Transfer to the Magistrates' Court.
    - An automatic fee doubling for late petitions.
  correct: 0
  explanation: >-
    The HCJ applies the delay doctrine and requires a prior demand. Six silent months answer
    neither.
- id: m05-064
  module: 5
  lesson: '05.5'
  subject: pre-petition
  difficulty: 2
  question: Which response date is most defensible when the decision was 5 days ago and nothing is urgent?
  options:
    - About 45 days.
    - Within 24 hours.
    - Three months, as in the Decisions and Reasons Law.
    - About 10–14 days.
  correct: 3
  explanation: >-
    Ten to fourteen days is fair to the authority and still leaves time to file inside the 45-day
    petition deadline.
- id: m05-065
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 1
  question: Within how many days of the decision must an administrative petition normally be filed?
  options:
    - 30 days.
    - 45 days.
    - 60 days.
    - 90 days.
  correct: 1
  explanation: >-
    Administrative Courts (Procedure) Regulations, reg. 3(ב): without delay and no later than 45
    days, unless another law sets a deadline.
- id: m05-066
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 1
  question: Which court district hears an administrative petition?
  options:
    - Where the decision was made, or where the land lies.
    - The district where the petitioner lives or works.
    - Always the Jerusalem District Court, for every authority.
    - The district where the authority's lawyer has an office.
  correct: 0
  explanation: 'Reg. 2(א): the court in whose area the decision was given; for land, where the land lies.'
- id: m05-067
  module: 5
  lesson: '05.6'
  subject: petition-affidavit
  difficulty: 1
  question: What must support the facts in an administrative petition?
  options:
    - A letter from a lawyer.
    - A police report.
    - A signed statement from the authority.
    - An affidavit in Form 2.
  correct: 3
  explanation: 'Reg. 5(ג): the facts are verified by an attached affidavit in Form 2.'
- id: m05-068
  module: 5
  lesson: '05.6'
  subject: service
  difficulty: 1
  question: Who serves the petition on the respondents?
  options:
    - The court registry, after the judge reads it.
    - The police, at the court's request.
    - The petitioner, within three days of filing.
    - The respondents collect it from Net HaMishpat.
  correct: 2
  explanation: >-
    Reg. 35(א): a pleading filed in court is served directly on the other parties no later than
    three days after filing.
- id: m05-069
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 2
  question: >-
    Spot the mistake: an administrative petition's jurisdiction paragraph says only 'This court has
    jurisdiction.'
  options:
    - It must cite the empowering law and the First Schedule item.
    - It must also cite the petitioner's identity number there.
    - It should be placed at the end, after the remedies.
    - Jurisdiction is never stated in a self-represented petition.
  correct: 0
  explanation: >-
    Reg. 5(ב)(3א) requires the source of subject-matter and local jurisdiction, including the
    empowering enactment and the First Schedule item.
- id: m05-070
  module: 5
  lesson: '05.6'
  subject: petition-affidavit
  difficulty: 2
  question: >-
    In your petition affidavit you state that the mayor met the developer, which you heard from a
    council member. How should it appear?
  options:
    - As personal knowledge, since you trust the source.
    - Not at all; hearsay can never appear in affidavits.
    - In the petition text only, not in the affidavit.
    - As a belief, naming the council member as the source.
  correct: 3
  explanation: >-
    Reg. 5(ג) requires separating personal knowledge from belief and stating the source of each
    belief.
- id: m05-071
  module: 5
  lesson: '05.6'
  subject: court-fees
  difficulty: 2
  question: Which document proves inability to pay at first sight in a fee-exemption request?
  options:
    - A letter from your employer praising your work.
    - A bank statement showing one month's balance.
    - A court fee exemption granted in the last two years.
    - A pre-petition letter sent to the authority.
  correct: 2
  explanation: >-
    Reg. 14(ד) lists prima facie proof: a court exemption within two years, a limited-means debtor
    order, bankruptcy or insolvency proceedings.
- id: m05-072
  module: 5
  lesson: '05.6'
  subject: court-fees
  difficulty: 2
  question: Does filing a fee-exemption request cost a fee?
  options:
    - Yes, half of the petition fee.
    - No; such requests are fee-free.
    - Yes, the full petition fee, refunded later.
    - Only if the request is rejected.
  correct: 1
  explanation: Reg. 20(4) of the Court Fees Regulations exempts requests for a fee exemption from fees.
- id: m05-073
  module: 5
  lesson: '05.6'
  subject: court-fees
  difficulty: 3
  question: Besides inability to pay, what else does the court consider in a fee-exemption request?
  options:
    - Whether the petitioner has a lawyer.
    - Whether the authority agrees to the exemption.
    - Whether the petition is shorter than ten pages.
    - Whether the proceeding shows a cause of action.
  correct: 3
  explanation: >-
    Reg. 14(ג): the court may exempt if the applicant cannot pay and the proceeding appears to
    disclose a cause of action.
- id: m05-074
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 2
  question: >-
    After a preliminary look, what may the judge do with a petition that shows no cause for
    intervention on its face?
  options:
    - Dismiss it at the threshold, possibly with costs.
    - Send it to the ombudsman for an investigation.
    - Order the authority to pay the petitioner's fee.
    - Convert it into a small claim in the same court.
  correct: 0
  explanation: >-
    Reg. 7(א)(2) allows dismissal on the face of the petition, and reg. 41(ב) allows costs in favour
    of the State Treasury.
- id: m05-075
  module: 5
  lesson: '05.6'
  subject: interim-orders
  difficulty: 2
  question: How do you ask the Administrative Court to stop a decision until judgment?
  options:
    - A sentence asking for it in the petition's introduction.
    - A separate request with an affidavit, served the same day.
    - An email to the authority's legal adviser asking it to wait.
    - A phone call to the court registry asking for a freeze.
  correct: 1
  explanation: >-
    Reg. 9(א) requires a separate request supported by an affidavit; reg. 35(ב) requires same-day
    service.
- id: m05-076
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 2
  question: >-
    If the court orders a full answer, how long does the respondent have unless the court sets
    another time?
  options:
    - 30 days.
    - 15 days.
    - 60 days.
    - 7 days.
  correct: 2
  explanation: >-
    Reg. 10(א): a response (כתב תשובה) is filed within 60 days unless the court sets a different
    time.
- id: m05-077
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 3
  question: Your petition wins a partial remedy and you want to appeal. What is the deadline and the court?
  options:
    - 30 days, to the District Court president.
    - 45 days, to the High Court of Justice.
    - 60 days, to the Supreme Court.
    - 90 days, to a panel of the same court.
  correct: 2
  explanation: >-
    Reg. 33(א): an appeal as of right against a judgment of the Administrative Court is filed within
    60 days, to the Supreme Court.
- id: m05-078
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 3
  question: >-
    A month after you filed, the authority gives you everything you asked for and you withdraw. What
    can you ask about the fee?
  options:
    - Nothing; court fees are never refunded once paid.
    - A full refund plus interest at double the usual rate.
    - A transfer of the fee to any future petition you file.
    - A refund of most of it, minus a fixed deduction.
  correct: 3
  explanation: >-
    Regs 15 and 6(ב) provide a refund on early termination, minus the sum in item 33 of the
    schedule; check the conditions with the registry.
- id: m05-079
  module: 5
  lesson: '05.6'
  subject: service
  difficulty: 3
  question: >-
    You uploaded the petition on Sunday but serve the respondents only on Thursday of the next week.
    What is the problem?
  options:
    - Service was late; the rule is three days after filing.
    - None, since service of a petition has no deadline.
    - The petition is granted because the respondents delayed.
    - Service is the court's job, so your service is invalid.
  correct: 0
  explanation: >-
    Reg. 35(א) sets three days; reg. 7(ב) keeps the petition from the judge until proof of service
    is filed.
- id: m05-080
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 2
  question: Which matter must a petition disclose under reg. 5(ב)(9)?
  options:
    - The petitioner's income during the last six months.
    - Any other proceeding on the same facts, even if finished.
    - The names of the judges the petitioner would prefer.
    - The petitioner's political or organisational affiliation.
  correct: 1
  explanation: >-
    Reg. 5(ב)(9) requires disclosure of any other court or tribunal proceeding on the same facts or
    decision, including one that ended.
- id: m05-081
  module: 5
  lesson: '05.6'
  subject: admin-petition
  difficulty: 1
  question: How does an unrepresented petitioner file an administrative petition online?
  options:
    - By email straight to the office of the duty judge.
    - Through the FOI Unit's online complaint form.
    - Through Net HaMishpat, with National Digital Identity.
    - Through the State Comptroller's online complaint form.
  correct: 2
  explanation: >-
    The judiciary's guide for unrepresented parties describes filing in Net HaMishpat with National
    Digital Identity.
- id: m05-082
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 1
  question: What does an HCJ petition ask for first?
  options:
    - An order nisi (צו על תנאי).
    - A final order without a hearing.
    - A declaration of the petitioner's rights.
    - Damages from the respondent.
  correct: 0
  explanation: >-
    Reg. 1: a request for an order nisi is filed as a petition; if granted, the respondent must show
    cause why it should not become absolute.
- id: m05-083
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 1
  question: What address must an HCJ petitioner give?
  options:
    - Any email address, anywhere.
    - An address for service inside Israel.
    - The address of a lawyer.
    - The address of the Supreme Court registry.
  correct: 1
  explanation: >-
    Reg. 3: the petitioner states an address for service within the State; delivery there is valid
    service.
- id: m05-084
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 1
  question: How must an HCJ petition be laid out under reg. 2?
  options:
    - Double-sided, with margins of at least 2 cm.
    - In a bound booklet with only a table of contents.
    - Handwritten in full, to show it is the petitioner's own.
    - On one side of the page, with 5 cm margins or more.
  correct: 3
  explanation: >-
    Reg. 2: the petition follows Form 1 and is written on one side of the page with margins of at
    least five centimetres.
- id: m05-085
  module: 5
  lesson: '05.7'
  subject: hcj-threshold
  difficulty: 2
  question: Which petitioner is most likely to be called a public petitioner?
  options:
    - One whose own building permit was refused by the council.
    - A company suing the State for profits it says it lost.
    - A lawyer acting for a paying client in a public matter.
    - One raising an important public matter without personal harm.
  correct: 3
  explanation: >-
    Public-petitioner standing covers people who raise important public matters without a personal
    interest; lesson 04.5 covers its limits.
- id: m05-086
  module: 5
  lesson: '05.7'
  subject: hcj-threshold
  difficulty: 2
  question: Why does an HCJ petition need a section explaining why the HCJ is the right forum?
  options:
    - The HCJ hears only cases involving ministers.
    - The HCJ hears only what no other court or tribunal can hear.
    - The Knesset must approve each HCJ petition.
    - Every petition must first be refused by a District Court.
  correct: 1
  explanation: >-
    Basic Law: The Judiciary s. 15(ג) limits the HCJ to matters not within another court's or
    tribunal's jurisdiction.
- id: m05-087
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 2
  question: After filing an HCJ petition, when must you serve later filings on the other parties?
  options:
    - The same day you file them.
    - Within 45 days.
    - Only when the court orders it.
    - After the first hearing.
  correct: 0
  explanation: >-
    Reg. 8א: after the petition is filed, a party filing a pleading serves a copy with its
    attachments on every other party the same day.
- id: m05-088
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 2
  question: The HCJ issues an order nisi. What must the respondent file to oppose it?
  options:
    - Nothing; the order becomes absolute automatically.
    - A new petition of its own against the petitioner.
    - An answering affidavit in Form 3, within the time set.
    - A fee-exemption request to the Supreme Court registry.
  correct: 2
  explanation: >-
    Reg. 9(א): a respondent who opposes making the order absolute files an answering affidavit (Form
    3), within eight days or as the court directs.
- id: m05-089
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 2
  question: >-
    The State files an update notice that it changed the decision you challenged. What usually
    happens?
  options:
    - The petition continues to a full judgment regardless of the change.
    - The petition may be deleted as redundant, often with costs for you.
    - You must pay the State's costs because it changed its decision.
    - The case moves to the Administrative Court for a fresh hearing.
  correct: 1
  explanation: >-
    When the remedy is given, petitions are typically deleted as redundant (התייתרות); the court may
    award costs to the petitioner.
- id: m05-090
  module: 5
  lesson: '05.7'
  subject: hcj-threshold
  difficulty: 3
  question: >-
    A petitioner challenges a 2-year-old government decision on which many people already relied,
    explaining nothing about the gap. Which threshold ground is most likely to defeat it?
  options:
    - Delay (שיהוי).
    - Lack of a fee exemption.
    - The petition being in Hebrew.
    - The State Comptroller's prior report.
  correct: 0
  explanation: >-
    The delay doctrine looks at how long the petitioner waited, harm to reliance, and the rule of
    law; an unexplained two-year gap is a classic case.
- id: m05-091
  module: 5
  lesson: '05.7'
  subject: hcj-threshold
  difficulty: 3
  question: >-
    A petitioner asks the HCJ to cancel an FOI refusal by a ministry, without any privilege
    certificate. What will the court likely say?
  options:
    - 'Correct forum: ministries are always HCJ matters.'
    - 'Wrong forum: FOI goes to the Magistrates'' Court.'
    - Correct forum, if the petitioner is a public petitioner.
    - 'Wrong forum: FOI petitions go to the Administrative Court.'
  correct: 3
  explanation: >-
    FOI Law s. 17(א) and First Schedule item 2 send FOI petitions to the Administrative Court; only
    a privilege certificate moves them to the Supreme Court.
- id: m05-092
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 3
  question: You plan to file an HCJ petition yourself next Thursday. What should you have done by Monday?
  options:
    - Asked the Attorney General to accept the petition first.
    - Booked a hearing date for the petition with the registry.
    - Confirmed the filing route and fee payment by phone.
    - Sent the draft petition to the ombudsman for a review.
  correct: 2
  explanation: >-
    The online route for unrepresented HCJ petitioners was not confirmed officially; calling ahead
    avoids losing the filing day.
- id: m05-093
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 2
  question: Which document must be attached to, or written at the end of, every HCJ petition?
  options:
    - A letter of support from an NGO.
    - The State's answer to the petition.
    - The petitioner's affidavit in Form 2.
    - A lawyer's opinion on the merits.
  correct: 2
  explanation: 'Reg. 4: every petition is supported by an affidavit in Form 2, attached or recorded at its end.'
- id: m05-094
  module: 5
  lesson: '05.7'
  subject: hcj-procedure
  difficulty: 2
  question: When must skeleton arguments be filed in the HCJ, unless the court says otherwise?
  options:
    - At least three days before the hearing.
    - On the morning of the hearing itself.
    - Together with the original petition.
    - Within 60 days after the hearing ends.
  correct: 0
  explanation: >-
    Reg. 16(א): each party files skeleton arguments and serves them at least three days before the
    hearing date.
- id: m05-095
  module: 5
  lesson: '05.7'
  subject: hcj-threshold
  difficulty: 1
  question: Which of these is a threshold ground, decided before the merits of an HCJ petition?
  options:
    - The reasonableness of the decision.
    - The proportionality of the measure.
    - The weight of the evidence.
    - Failure to exhaust remedies.
  correct: 3
  explanation: >-
    Threshold grounds include exhaustion, delay, standing, alternative remedy and justiciability;
    reasonableness and proportionality are merits questions.
- id: m06-001
  module: 6
  lesson: '06.1'
  subject: right-sources
  difficulty: 1
  question: Where does the constitutional status of the right to protest in Israel come from?
  options:
    - 'An explicit article on freedom of assembly in Basic Law: The Knesset, adopted in 1958.'
    - 'Case law deriving it from human dignity in Basic Law: Human Dignity and Liberty.'
    - The Police Ordinance, which grants a right to march.
    - The Declaration of Independence, which courts apply as a binding statute.
  correct: 1
  explanation: >-
    No Basic Law names freedom of expression or assembly. The High Court derived both, first from
    the democratic character of the state (Kol Ha'am) and later from human dignity (s. 2).
- id: m06-002
  module: 6
  lesson: '06.1'
  subject: right-sources
  difficulty: 1
  question: >-
    Which document sets out, for the police, the considerations for licensing and conditioning
    protests?
  options:
    - Attorney General guideline 3.1200, "Freedom of Demonstration".
    - The Public Places Safety Regulations on assemblies, issued under the 1962 law.
    - The Knesset Building and Precincts Law.
    - The Counter-Terrorism Law, 2016.
  correct: 0
  explanation: >-
    AG guideline 3.1200, last updated 5.1.2022, summarises the case law and binds the police when
    they decide on licences, conditions and dispersal.
- id: m06-003
  module: 6
  lesson: '06.1'
  subject: near-certainty
  difficulty: 1
  question: What probability of harm must the police show before restricting a protest?
  options:
    - A reasonable suspicion that someone may be offended.
    - Any risk at all, since public order comes first.
    - A near certainty of serious harm to public order or safety.
    - Proof beyond reasonable doubt that violence will happen.
  correct: 2
  explanation: >-
    The test from Kol Ha'am and the AG guideline is a near certainty of serious, real harm, based on
    concrete facts — not offence and not a mere risk.
- id: m06-004
  module: 6
  lesson: '06.1'
  subject: hecklers-veto
  difficulty: 2
  question: >-
    A left-wing group's licensed vigil is threatened by a right-wing group that announces it will
    "break it up". What must the police do first?
  options:
    - Cancel the vigil's licence to remove the cause of the threat.
    - Ask the vigil's organisers to pay for extra officers.
    - Move the vigil to an indoor hall where opponents cannot see or reach it.
    - Protect the lawful vigil with reasonable means against those threatening it.
  correct: 3
  explanation: >-
    Levi and AG guideline paras. 16–17 require the police to protect a lawful protest from hostile
    groups. Banning the target of the threat rewards the threat.
- id: m06-005
  module: 6
  lesson: '06.1'
  subject: content-neutrality
  difficulty: 2
  question: >-
    A commander attaches a condition to a pro-government rally: "No signs praising the government's
    judicial plan." Why is this condition defective?
  options:
    - It restricts the message rather than time, place or manner.
    - Pro-government rallies need no licence at all.
    - Only a magistrate may restrict signs at a rally.
    - Conditions must be given orally on the day, not in writing.
  correct: 0
  explanation: >-
    The subject and ideology of a protest are not the police's business (AG para. 13(ב)). Signs may
    be restricted only if they amount to an offence such as incitement.
- id: m06-006
  module: 6
  lesson: '06.1'
  subject: time-place-manner
  difficulty: 2
  question: >-
    Residents complain that a nightly protest outside a minister's office keeps them awake. What
    kind of response fits the law?
  options:
    - A ban on the protest until the residents and the organisers reach an agreement.
    - A limit on amplification and hours after a set time, keeping the protest in place.
    - Moving the protest to another city where the minister has no office.
    - Requiring protesters to register their names with the police.
  correct: 1
  explanation: >-
    Conflicts with other people's rights are solved with time, place and manner conditions — the
    horizontal balance — not with a ban or a move that defeats the protest.
- id: m06-007
  module: 6
  lesson: '06.1'
  subject: near-certainty
  difficulty: 2
  question: >-
    The police refuse a march, writing only: "intelligence assessment indicates risk". The
    organisers ask what the risk is and get no answer. What is their best next step?
  options:
    - Hold the march anyway, since a refusal without stated reasons is automatically void.
    - Accept the refusal, because intelligence cannot be reviewed by courts.
    - Ask in writing for the factual basis and propose conditions, then petition if refused.
    - Complain to מח״ש that the commander abused his authority.
  correct: 2
  explanation: >-
    A restriction needs a concrete factual basis. Asking for it and offering less restrictive
    conditions builds the record for an urgent petition; marching without a required licence makes
    it unlawful.
- id: m06-008
  module: 6
  lesson: '06.1'
  subject: minister-role
  difficulty: 1
  question: >-
    Since Amendment 37 (2022), what may the National Security Minister do regarding the police under
    s. 8ג of the Police Ordinance?
  options:
    - Decide the route of each licensed protest.
    - Order the arrest of protest organisers.
    - Appoint district commanders who then approve or refuse protests in their district.
    - Set police policy and general principles of its activity.
  correct: 3
  explanation: >-
    Section 8ג lets the Minister set policy and general principles. The courts have held that this
    does not extend to operational instructions about specific protests.
- id: m06-009
  module: 6
  lesson: '06.1'
  subject: minister-role
  difficulty: 2
  question: The High Court struck down which part of Amendment 37 in HCJ 8987/22 (2.1.2025)?
  options:
    - Section 8ד, on the Minister's policy in investigations.
    - Section 8ג, on the Minister's general policy and principles powers.
    - Section 84, on licensing assemblies.
    - Section 5א, on officers' identification.
  correct: 0
  explanation: >-
    Wikisource marks s. 8ד as struck down by HCJ 8987/22. Section 8ג remains, read so that it does
    not cover operational decisions on specific protests.
- id: m06-010
  module: 6
  lesson: '06.1'
  subject: right-sources
  difficulty: 2
  question: Why do Mandate-era licensing rules survive the 1992 Basic Law?
  options:
    - The Basic Law expressly lists the Police Ordinance as an exception.
    - The preservation-of-laws clause (s. 10) keeps earlier laws in force.
    - Courts have no power to review police legislation.
    - The Ordinance was re-enacted by the Knesset in 2022.
  correct: 1
  explanation: >-
    Section 10 preserves laws that existed before 1992. Courts still read them in the light of the
    right, for example the narrow "political matter" test.
- id: m06-011
  module: 6
  lesson: '06.1'
  subject: time-place-manner
  difficulty: 3
  question: >-
    A Haredi group wants to protest on a Shabbat afternoon in a secular neighbourhood against
    cinemas opening on Shabbat. The police propose the same protest two streets away, near the
    cinemas, at the same hour. Is that likely lawful?
  options:
    - No, any change of place is a ban in disguise.
    - No, because protests with a religious message may not be conditioned at all.
    - Yes, because religious content can be restricted more freely.
    - Yes, if it meets a concrete risk and still reaches its audience.
  correct: 3
  explanation: >-
    A place condition is lawful when it addresses a concrete risk and leaves an effective protest.
    The content is irrelevant; the test is the least restrictive effective condition.
- id: m06-012
  module: 6
  lesson: '06.1'
  subject: hecklers-veto
  difficulty: 3
  question: >-
    Police have concrete intelligence that a small group plans to attack a Pride march with knives.
    What response best fits the case law?
  options:
    - Cancel the march, since the risk to participants' lives is concrete and serious.
    - Allow the march only if participants sign a waiver.
    - Act against the attackers and secure the march; restrict only if that fails.
    - Move the march to a closed stadium where the participants can be kept safe.
  correct: 2
  explanation: >-
    The duty is to protect the lawful march and deal with those who threaten it; a ban is a last
    resort only if reasonable police measures cannot prevent the harm (Levi).
- id: m06-013
  module: 6
  lesson: '06.1'
  subject: content-neutrality
  difficulty: 3
  question: >-
    A municipality lets a pro-government group protest in the courtyard of city hall but refuses an
    opposition group the same courtyard on the same terms. What is the main legal defect?
  options:
    - Municipalities may never allow protests on their property.
    - Discrimination by viewpoint in access to public property open for protests.
    - The opposition group did not apply to the municipality 30 days ahead of time.
    - Only the police may decide where protests take place.
  correct: 1
  explanation: >-
    The AG guideline says distinguishing between protests that criticise and those that support the
    government is an improper distinction when deciding on access to public property.
- id: m06-014
  module: 6
  lesson: '06.1'
  subject: near-certainty
  difficulty: 1
  question: Which of these is NOT, by itself, a lawful reason to refuse a licence?
  options:
    - The protest will need police officers who are busy elsewhere.
    - Credible intelligence that organisers plan to set fires.
    - The route blocks the only access to a hospital at peak hour.
    - The planned site is private land and the owner refused consent.
  correct: 0
  explanation: >-
    The cost of policing alone does not justify a refusal (AG section ח; Majority Camp). Only in
    special circumstances may the police ask to change the date or set conditions.
- id: m06-015
  module: 6
  lesson: '06.1'
  subject: minister-role
  difficulty: 3
  question: >-
    An organiser wants to challenge a police decision to block her protest's route. A friend says
    she should write to the Minister, who "sets protest policy". What is the better route?
  options:
    - Write to the Minister and wait for him to instruct the district commander.
    - Write to the Knesset Interior Committee, which licenses protests.
    - Write to the State Comptroller, who supervises police operations.
    - Write to the district commander and police legal adviser, then petition if needed.
  correct: 3
  explanation: >-
    Decisions on specific protests are the commander's under ss. 84–85 and the AG guideline. The
    courts have barred the Minister from operational instructions on specific protests.
- id: m06-016
  module: 6
  lesson: '06.1'
  subject: right-sources
  difficulty: 1
  question: Which 1953 ruling first held that speech may be limited only on a near certainty of real harm?
  options:
    - Levi v. Commander of the Southern District.
    - Kol Ha'am v. Minister of the Interior.
    - Dayan v. Wilk.
    - Majority Camp v. Israel Police.
  correct: 1
  explanation: >-
    Kol Ha'am (HCJ 73/53) set the near-certainty test for closing a newspaper; later protest cases
    applied it to demonstrations.
- id: m06-017
  module: 6
  lesson: '06.1'
  subject: content-neutrality
  difficulty: 2
  question: >-
    A licence for an anti-war vigil comes with the condition "only Israeli flags allowed". Which
    question decides whether the condition is lawful?
  options:
    - Whether a specific flag here creates a high probability of serious disorder.
    - Whether most citizens would find the vigil's message offensive.
    - Whether the organisers are registered as an amuta.
    - Whether the vigil's subject is a political matter in the narrow sense.
  correct: 0
  explanation: >-
    A blanket flag rule restricts expression; it is lawful only where a specific display creates a
    high probability of serious disorder (Police Ordinance s. 82; HCJ 1386/22 Diab as summarised by
    the IDI).
- id: m06-018
  module: 6
  lesson: '06.2'
  subject: licence-test
  difficulty: 1
  question: How many people make an "assembly" or a "procession" under s. 83 of the Police Ordinance?
  options:
    - 10 or more.
    - 3 or more.
    - 50 or more.
    - 500 or more.
  correct: 2
  explanation: >-
    Both definitions start at 50 people. Three is the threshold for the Penal Law's unlawful
    assembly; 500 is the Safety Law's public rally; 10 is the Knesset plaza rule.
- id: m06-019
  module: 6
  lesson: '06.2'
  subject: licence-test
  difficulty: 1
  question: After HCJ 6536/17 and the AG guideline, which assemblies need a police licence?
  options:
    - Any outdoor gathering of 50 or more people about any issue of public interest.
    - Any gathering with a stage and amplification.
    - Outdoor gatherings of 50+ to hear speeches on foreign relations or security.
    - Gatherings within 100 metres of a government building.
  correct: 2
  explanation: >-
    "Political matter" is read narrowly as foreign relations and security. Rallies on corruption,
    the rule of law, prices or religion need no licence.
- id: m06-020
  module: 6
  lesson: '06.2'
  subject: procession
  difficulty: 1
  question: >-
    A farmers' convoy of 80 tractors and cars plans to drive slowly from Gedera to Jerusalem. Does
    it need a licence?
  options:
    - No, vehicles are covered by traffic law, not protest law.
    - Yes, a vehicle convoy of 50+ is a procession.
    - No, because farmers' income is not a political matter.
    - Only if it enters the Knesset plaza.
  correct: 1
  explanation: >-
    The police procedure defines a procession to include a vehicle convoy; processions of 50+ need a
    licence whatever their subject.
- id: m06-021
  module: 6
  lesson: '06.2'
  subject: filing
  difficulty: 1
  question: To whom is a licence request filed under the police procedure?
  options:
    - The operations officer of the police station where the event takes place.
    - The National Security Minister's office, which sets the police's protest policy.
    - The municipality's events department.
    - The Inspector General of the police.
  correct: 0
  explanation: >-
    Procedure 221.110.19 directs requests to the station operations officer; the district commander
    decides.
- id: m06-022
  module: 6
  lesson: '06.2'
  subject: filing
  difficulty: 1
  question: How much does a police protest licence cost?
  options:
    - The same as an FOI request fee.
    - 1% of the expected policing cost.
    - A fixed fee updated every January.
    - Nothing; no fee is charged.
  correct: 3
  explanation: 'Police Ordinance s. 86: no fee is due for a licence under s. 85.'
- id: m06-023
  module: 6
  lesson: '06.2'
  subject: safety-notice
  difficulty: 2
  question: >-
    A rally of 1,200 people on the cost of living needs no police licence. The organisers send
    nothing. What is the consequence under the Public Places Safety Law?
  options:
    - None, since the Safety Law applies only to licensed events.
    - The rally needs a permit from the Interior Ministry's appointee instead.
    - The organisers must pay a fine before the rally can start.
    - The police must convert the rally into a licensed procession.
  correct: 1
  explanation: Without the 5-day notice under s. 5, a public rally of 500+ needs a prior permit (s. 7).
- id: m06-024
  module: 6
  lesson: '06.2'
  subject: safety-notice
  difficulty: 2
  question: Who must be named in the safety notice for a public rally?
  options:
    - 'A safety officer: an adult resident who accepts responsibility in writing.'
    - A licensed lawyer who represents the organisers and signs the notice for them.
    - The local police station commander.
    - A municipal engineer who approves the site.
  correct: 0
  explanation: >-
    Safety Law s. 6: the notice names the person responsible for safety, with written consent; that
    person must be an adult resident of Israel.
- id: m06-025
  module: 6
  lesson: '06.2'
  subject: knesset-holy
  difficulty: 2
  question: Fifteen students want to hold a silent vigil with signs on the Knesset plaza. What do they need?
  options:
    - Nothing, since they are fewer than 50.
    - A police licence filed 5 days ahead.
    - A permit from the Knesset Speaker.
    - A safety notice to the Interior Ministry.
  correct: 2
  explanation: >-
    The Knesset Building and Precincts Law s. 7 restricts assemblies and signs on the plaza; the
    police procedure notes a Speaker's permit for 10+ people.
- id: m06-026
  module: 6
  lesson: '06.2'
  subject: conditions
  difficulty: 2
  question: >-
    A licence requires the organisers to deposit ₪50,000 as security. The group has never broken a
    condition. What does the procedure say about deposits?
  options:
    - Deposits are mandatory for every licensed procession, whatever the organiser's record.
    - Deposits are forbidden in all cases.
    - Deposits are set at a fixed rate per participant.
    - Deposits are exceptional, need a concrete reason, and must fit the organiser's means.
  correct: 3
  explanation: >-
    Under procedure 221.110.19 a deposit is for licensable events only, in exceptional cases such as
    a history of breaches, and must reflect the organiser's means.
- id: m06-027
  module: 6
  lesson: '06.2'
  subject: conditions
  difficulty: 2
  question: By when should the police send their decision and conditions if you filed 5 days ahead?
  options:
    - Within 24 hours of filing.
    - Up to 48 hours before the event.
    - On the morning of the event.
    - There is no time limit at all.
  correct: 1
  explanation: >-
    The police procedure says the district commander's decision is sent up to 48 hours before the
    event where the request was filed at least 5 days ahead, and published on the police website.
- id: m06-028
  module: 6
  lesson: '06.2'
  subject: public-figure-homes
  difficulty: 2
  question: >-
    Activists want to protest outside a cabinet minister's private home. There is no effective
    alternative site. What will the police lawfully do?
  options:
    - Set conditions of distance from the home, hours and noise.
    - Ban the protest, since homes are always off-limits.
    - Allow it with no conditions, as for any public street.
    - Require the minister's written consent.
  correct: 0
  explanation: >-
    AG guideline section ה: where there is no effective alternative, the police set place, time and
    manner conditions balancing privacy against effective protest.
- id: m06-029
  module: 6
  lesson: '06.2'
  subject: public-figure-homes
  difficulty: 3
  question: >-
    Protesters gather opposite the Prime Minister's official residence in Jerusalem. The police cite
    the rule on public figures' private homes to push them 300 metres away. What is wrong with that
    reasoning?
  options:
    - The rule for homes applies only to judges.
    - Official residences are not private homes; the ordinary protest rules apply there.
    - The police may never set any distance condition near official sites or residences.
    - Only the Knesset Speaker may set conditions near official residences.
  correct: 1
  explanation: >-
    The AG guideline excludes official residences, such as the Prime Minister's and the President's,
    from the private-home rule; ordinary balances apply.
- id: m06-030
  module: 6
  lesson: '06.2'
  subject: procession
  difficulty: 3
  question: >-
    A licensed stationary rally of 400 people ends, and the organisers spontaneously lead the crowd
    on a march to the mayor's office. What is the legal risk?
  options:
    - None, because the rally already had a licence.
    - The mayor may fine the organisers for trespass on municipal property near the office.
    - The march needed its own licence; unlicensed, it is an unlawful assembly.
    - The rally's safety notice becomes invalid retroactively.
  correct: 2
  explanation: >-
    A procession of 50+ needs a licence, and conduct outside a licence's conditions makes the event
    an unlawful assembly (s. 89) — the basis for dispersal and arrests.
- id: m06-031
  module: 6
  lesson: '06.2'
  subject: filing
  difficulty: 3
  question: >-
    A government decision is announced at 10:00 on Monday. Organisers want a protest march at 19:00
    the same day. What is the best course?
  options:
    - March without filing, since the 5-day rule cannot apply to same-day events.
    - Wait 5 days, since an urgent request is legally impossible.
    - Hold a stationary rally instead and avoid any contact with the police beforehand.
    - File at once explaining the urgency, or hold a stationary rally instead.
  correct: 3
  explanation: >-
    The commander has discretion to decide a late request; urgency must be explained. A stationary
    rally on a non-security topic needs no licence and may be the safer option; coordinating still
    helps.
- id: m06-032
  module: 6
  lesson: '06.2'
  subject: conditions
  difficulty: 3
  question: >-
    Spot the mistake. An organiser's reply to a police condition reads: "We reject all conditions.
    Our cause is just and the public supports us." What should the reply have contained?
  options:
    - The accepted conditions, the legal objection to one, and an alternative.
    - A copy of opinion polls supporting the cause.
    - A warning that the group will march without a licence if the conditions are not dropped.
    - A request that the Minister overrule the commander.
  correct: 0
  explanation: >-
    Commanders and courts weigh legal tests, not the justice of the cause. A precise objection with
    an alternative builds the record for review.
- id: m06-033
  module: 6
  lesson: '06.2'
  subject: licence-test
  difficulty: 2
  question: >-
    An indoor conference of 300 people on a peace agreement is planned in a hotel hall. Does it need
    a police licence?
  options:
    - Yes, because the subject is foreign relations.
    - No, because the definition covers outdoor assemblies only.
    - Yes, because it has more than 50 participants gathered together.
    - Only if a minister speaks.
  correct: 1
  explanation: >-
    The district notices and the police procedure apply to gatherings under the open sky; indoor
    events need the owner's consent, not a police licence (AG guideline para. 8(ג)).
- id: m06-034
  module: 6
  lesson: '06.2'
  subject: knesset-holy
  difficulty: 2
  question: >-
    A group plans to raise signs and give a speech at the Western Wall plaza. Besides the police,
    what must they consider?
  options:
    - Nothing more; holy sites follow the same rules as any other public place.
    - A permit from the Knesset Speaker.
    - A safety notice regardless of numbers.
    - The Holy Places Regulations, which restrict speeches and signs there.
  correct: 3
  explanation: >-
    The Regulations for the Protection of Holy Places to Jews restrict speeches, loud announcements
    and signs at holy sites; the police procedure requires coordination with the site's
    administrator.
- id: m06-035
  module: 6
  lesson: '06.3'
  subject: unlawful-assembly
  difficulty: 1
  question: How many people does the Penal Law's offence of unlawful assembly (s. 151) require?
  options:
    - Three or more.
    - Fifty or more.
    - Ten or more.
    - Any number, even one.
  correct: 0
  explanation: >-
    Section 151 starts at three people whose conduct gives reasonable grounds to fear a breach of
    the peace.
- id: m06-036
  module: 6
  lesson: '06.3'
  subject: unlawful-assembly
  difficulty: 2
  question: >-
    A quiet vigil of 20 people stands on the pavement. Passers-by shout at them, and the police say
    the vigil is now an unlawful assembly. Is that correct?
  options:
    - Yes, any gathering that attracts anger is unlawful.
    - Yes, because the vigil did not obtain a licence from the police in advance.
    - No, the fear must come from the vigil's conduct, not others' reaction.
    - No, unlawful assembly requires at least 50 participants.
  correct: 2
  explanation: >-
    The AG guideline (para. 20(ד)) says the reasonable fear must arise from the gatherers' conduct,
    not from others' opposition. A vigil of 20 needs no licence.
- id: m06-037
  module: 6
  lesson: '06.3'
  subject: dispersal
  difficulty: 1
  question: >-
    Under the AG guideline, what should police normally do before dispersing a protest where an
    offence is occurring?
  options:
    - Arrest the organisers first, to stop the offence at its source.
    - Demand that the protesters stop the specific conduct.
    - Use the water cannon as a warning.
    - Call the Minister for approval.
  correct: 1
  explanation: >-
    Para. 22(א) prefers a demand to stop the specific conduct (leave the road, remove a sign) so the
    protest can continue lawfully.
- id: m06-038
  module: 6
  lesson: '06.3'
  subject: dispersal
  difficulty: 2
  question: Who may give a formal dispersal order to rioters under Penal Law s. 153?
  options:
    - Any police officer or police volunteer present at the scene, after a single warning call.
    - Only the Inspector General of the police.
    - Only a judge sitting in court.
    - A senior district official, a magistrate, or failing them a senior officer on site.
  correct: 3
  explanation: >-
    Section 153 lists who may order dispersal after announcing their presence; continuing after a
    reasonable time is an offence (s. 155).
- id: m06-039
  module: 6
  lesson: '06.3'
  subject: detention-arrest
  difficulty: 1
  question: What is the basic maximum length of a detention (עיכוב)?
  options:
    - 3 hours.
    - 24 hours.
    - 1 hour.
    - 48 hours.
  correct: 0
  explanation: >-
    Arrests Law s. 73(ב): no more than 3 hours, extendable by up to 3 more with written reasons when
    many people are involved.
- id: m06-040
  module: 6
  lesson: '06.3'
  subject: detention-arrest
  difficulty: 2
  question: A protester is held and asks, "Am I detained or arrested?" Why does the answer matter?
  options:
    - It decides whether the protest's licence remains valid for the rest of the evening.
    - It determines the time limits and the rights and procedures that apply.
    - Only arrested people must give their names.
    - Detained people may leave whenever they wish.
  correct: 1
  explanation: >-
    Detention is short and limited (3 hours, s. 73); an arrest needs a statutory ground and leads to
    a judge within 24 hours, with the rights covered in Module 7.
- id: m06-041
  module: 6
  lesson: '06.3'
  subject: officer-id
  difficulty: 1
  question: What must a uniformed police officer wear under Police Ordinance s. 5א?
  options:
    - A body camera at all times.
    - A badge showing only the unit's name.
    - A visible name tag with first name and surname.
    - A personal number but no name, for the officer's own safety.
  correct: 2
  explanation: >-
    Section 5א(א) requires a visible name tag with first name and surname; s. 5א(ד) requires giving
    name and personal number on request.
- id: m06-042
  module: 6
  lesson: '06.3'
  subject: officer-id
  difficulty: 2
  question: A plain-clothes officer grabs a protester's arm. What must the officer do under s. 5א(ב)?
  options:
    - Nothing until the protester has been brought to the police station for questioning.
    - Show a written order from the commander.
    - Give only a first name.
    - Identify himself as a police officer and show his appointment card.
  correct: 3
  explanation: >-
    A plain-clothes officer using police powers must identify by name or official alias and as a
    police officer, and show the appointment card, unless that would defeat the action or endanger
    someone.
- id: m06-043
  module: 6
  lesson: '06.3'
  subject: filming
  difficulty: 1
  question: Is it lawful to film police officers carrying out their duties at a public protest?
  options:
    - Yes, in general; only physically obstructing them is an offence.
    - No, filming officers on duty requires their consent, as with any private person.
    - Only with a press card.
    - Only from at least 50 metres away.
  correct: 0
  explanation: >-
    No law forbids filming police in public, and an officer generally may not order you to stop. The
    limit is obstruction (Penal Law s. 275).
- id: m06-044
  module: 6
  lesson: '06.3'
  subject: filming
  difficulty: 2
  question: Which filming habit makes protest footage most useful as evidence?
  options:
    - Recording only the moment of force, to keep files short and easy to send to investigators.
    - Keeping time and date on, filming the before and after, and never editing the original.
    - Adding captions explaining what happened.
    - Posting an edited version immediately and deleting the raw file.
  correct: 1
  explanation: >-
    Context, metadata and an untouched original let investigators trust the footage; edits and
    deletions weaken it.
- id: m06-045
  module: 6
  lesson: '06.3'
  subject: phone-search
  difficulty: 2
  question: >-
    An officer says: "Give me the code; I just want to look at your video." What legal effect does
    unlocking the phone have?
  options:
    - None at all; the police need a judge's warrant whatever you do.
    - It only allows viewing the last video.
    - It may count as consent, replacing the judge's warrant.
    - It makes the footage inadmissible in court.
  correct: 2
  explanation: >-
    Searching computer material needs a judge's warrant (s. 23א) unless you consent. Unlocking on
    request can be treated as consent; decline politely.
- id: m06-046
  module: 6
  lesson: '06.3'
  subject: water-cannon
  difficulty: 2
  question: >-
    Under the 2026 amendment adding s. 89א to the Police Ordinance, what may a water cannon spray at
    a protest?
  options:
    - Water with a coloured dye, to identify participants later.
    - Water with a foul-smelling additive, if approved by a commander.
    - Any liquid approved by the Ministry of Health.
    - Clean water only, with no added colour, smell or substance.
  correct: 3
  explanation: >-
    Section 89א(א) limits water-cannon use to clean water; from 15.2.2027 its use must also be
    filmed and the footage kept for at least a year.
- id: m06-047
  module: 6
  lesson: '06.3'
  subject: safety-brief
  difficulty: 1
  question: What is the single most important rule to brief every participant before a tense protest?
  options:
    - Never resist physically, even an order you believe is unlawful.
    - Refuse to give your name to any officer until a lawyer has arrived.
    - Keep marching if the police block the route.
    - Hand your phone to officers to show you have nothing to hide.
  correct: 0
  explanation: >-
    Physical resistance creates offences like obstructing or assaulting an officer. Comply, document
    and challenge later in writing or in court.
- id: m06-048
  module: 6
  lesson: '06.3'
  subject: detention-arrest
  difficulty: 3
  question: >-
    Spot the mistake in this detention card: "1. Ask if I am detained or arrested. 2. Refuse to give
    my name until I see a lawyer. 3. Ask the officer's name and number. 4. Do not consent to a phone
    search."
  options:
    - Point 1, since officers need not say whether you are detained.
    - Point 3, since asking for an officer's details is obstruction.
    - 'Point 2: refusing identity details can itself justify detention or arrest.'
    - Point 4, since phones may always be searched at protests.
  correct: 2
  explanation: >-
    You must give identity details when lawfully asked; everything else can wait for a lawyer. The
    other points are correct.
- id: m06-049
  module: 6
  lesson: '06.3'
  subject: unlawful-assembly
  difficulty: 3
  question: >-
    Two hundred reservists sit on a junction for ten minutes, without a licence, to protest a
    government decision; they ignore a demand to leave. A week later, one is charged with unlawful
    assembly. What must the indictment set out?
  options:
    - The political content of the protest's slogans and the identity of its organisers.
    - The facts from which the reasonable fear of a breach of the peace arose.
    - Proof that the defendant organised the protest.
    - The number of officers needed to clear the road.
  correct: 1
  explanation: >-
    AG guideline para. 22(ד): an indictment under s. 151 must set out the facts that created the
    reasonable fear; blocking a road and ignoring a demand may supply them.
- id: m06-050
  module: 6
  lesson: '06.3'
  subject: filming
  difficulty: 3
  question: >-
    An activist films an arrest by standing one metre from the officers and shouting at them, and
    keeps stepping between them and the arrested man. He is charged with obstruction. What is the
    likely outcome?
  options:
    - Acquittal, because filming police is always protected.
    - Acquittal, because obstruction requires violence against the officers.
    - Conviction is impossible because the arrest was at a protest.
    - 'The charge may stand: physical interference is not protected filming.'
  correct: 3
  explanation: >-
    Filming is lawful; stepping between officers and the person arrested can be obstruction under s.
    275. Film from a reasonable distance.
- id: m06-051
  module: 6
  lesson: '06.3'
  subject: safety-brief
  difficulty: 2
  question: Which item does NOT belong in a protester's personal kit?
  options:
    - A pocket knife "for emergencies".
    - An identity card.
    - A charged phone with cloud backup.
    - A legal hotline number written on the arm.
  correct: 0
  explanation: >-
    Knives and anything that looks like a weapon can be seized and lead to arrest (Police Ordinance
    s. 79 orders, Penal Law). Leave them at home.
- id: m06-052
  module: 6
  lesson: '06.4'
  subject: complaint-channel
  difficulty: 1
  question: Which body investigates suspected criminal offences by police officers?
  options:
    - The police's own investigations division, in the district where it happened.
    - The Police Investigations Department (מח״ש) in the Ministry of Justice.
    - The Public Complaints Commissioner.
    - The Knesset's National Security Committee.
  correct: 1
  explanation: >-
    Police Ordinance s. 49ט assigns investigations of offences by officers to the department in the
    Ministry of Justice.
- id: m06-053
  module: 6
  lesson: '06.4'
  subject: complaint-channel
  difficulty: 1
  question: Which offences by officers are outside מח״ש's usual remit?
  options:
    - Assault causing injury during an arrest.
    - Threats made to a protester by an officer who was off duty.
    - Offences punishable by up to a year, and traffic offences.
    - Accepting bribes from a protest's opponents.
  correct: 2
  explanation: >-
    The First Schedule excludes offences punishable by up to one year (unless the State Attorney and
    the Inspector General decide otherwise) and traffic offences.
- id: m06-054
  module: 6
  lesson: '06.4'
  subject: disciplinary
  difficulty: 1
  question: Where does a complaint about an officer's rude language go?
  options:
    - The police Public Complaints Unit.
    - The Police Investigations Department (מח״ש).
    - The Magistrates' Court of the area.
    - The Attorney General's office.
  correct: 0
  explanation: >-
    Rudeness and improper conduct are disciplinary matters handled by the police Public Complaints
    Unit, which may offer mediation.
- id: m06-055
  module: 6
  lesson: '06.4'
  subject: mahash-process
  difficulty: 1
  question: How is a complaint to מח״ש filed, according to the gov.il page?
  options:
    - By fax to the department.
    - In person at any police station.
    - By registered mail only.
    - Through the online form only.
  correct: 3
  explanation: >-
    The page says complaints are filed through the online form only; the fax number is for other
    inquiries, and *2906 is the information line.
- id: m06-056
  module: 6
  lesson: '06.4'
  subject: appeal
  difficulty: 1
  question: What is the deadline for appealing a decision to close a file about police violence?
  options:
    - 30 days from the date of the incident itself.
    - 45 days from the decision.
    - 60 days from receiving the closing notice.
    - One year from the complaint.
  correct: 2
  explanation: >-
    Criminal Procedure Law s. 65: 60 days after the notice was delivered; the deciding authority may
    extend.
- id: m06-057
  module: 6
  lesson: '06.4'
  subject: evidence
  difficulty: 2
  question: Which request in a complaint helps most to secure footage that may otherwise disappear?
  options:
    - A request to preserve body-camera and security footage of the incident.
    - A request to suspend the officer immediately until the investigation ends.
    - A request for the officer's home address.
    - A request that the protest's licence be published.
  correct: 0
  explanation: >-
    Body-camera and security systems may overwrite footage; asking for preservation early keeps the
    key evidence available.
- id: m06-058
  module: 6
  lesson: '06.4'
  subject: lawyer-first
  difficulty: 2
  question: Why might a protester consult a lawyer before giving a detailed statement to מח״ש?
  options:
    - Statements to מח״ש are invalid unless a lawyer is present when they are given.
    - Her statement could be used against her if she is charged over the same event.
    - מח״ש charges a fee that a lawyer can waive.
    - Only lawyers may file complaints about police.
  correct: 1
  explanation: >-
    Anyone may complain. But if the complainant may face charges from the same event, what she says
    can be used in her own case.
- id: m06-059
  module: 6
  lesson: '06.4'
  subject: mahash-process
  difficulty: 2
  question: >-
    According to the gov.il page, roughly how long is a מח״ש investigation phase usually meant to
    take?
  options:
    - About 3 working days, from the complaint to the decision.
    - About 2 years, because of the department's backlog.
    - About 24 hours, since protest cases are treated as urgent.
    - About 75 days, unless special circumstances justify more.
  correct: 3
  explanation: >-
    The page gives about 3 days for the initial review, about 75 days for the investigation and
    about 6 months for the prosecution decision.
- id: m06-060
  module: 6
  lesson: '06.4'
  subject: disciplinary
  difficulty: 2
  question: >-
    A district Public Complaints officer rejects your complaint about an officer who refused to give
    his number. What can you do?
  options:
    - Appeal to the head of the national Public Complaints Unit.
    - Nothing; disciplinary decisions are final.
    - Appeal to מח״ש within 60 days of the district officer's decision.
    - Petition the Magistrates' Court.
  correct: 0
  explanation: >-
    The police guide says area decisions are appealed to the district officer, and district
    decisions to the head of the national unit.
- id: m06-061
  module: 6
  lesson: '06.4'
  subject: complaint-channel
  difficulty: 2
  question: A private security guard at a mall roughly pushes a protester out. Can מח״ש investigate?
  options:
    - Yes, it covers anyone who enforces order at a protest, including guards.
    - Yes, if the protest was licensed.
    - No; a guard is not a police officer, so complain to the police.
    - No; private guards cannot commit offences while on duty.
  correct: 2
  explanation: >-
    מח״ש handles offences by police officers (and police volunteers on duty). Offences by guards,
    inspectors or prison staff go to the regular authorities.
- id: m06-062
  module: 6
  lesson: '06.4'
  subject: evidence
  difficulty: 3
  question: >-
    Spot the weakest part of this complaint: "On Saturday night at Kaplan, a big policeman beat me
    badly for no reason, like they always do. Everyone saw it."
  options:
    - It mentions Saturday night instead of the exact date.
    - It names the place only as Kaplan, not as a street address.
    - It says the force was used without any reason at all.
    - No time, officer identifiers, injury record or named witnesses.
  correct: 3
  explanation: >-
    Investigators need exact time, officer identifiers, a medical record and named witnesses; "like
    they always do" adds nothing and hurts credibility.
- id: m06-063
  module: 6
  lesson: '06.4'
  subject: appeal
  difficulty: 3
  question: >-
    Your מח״ש file was closed because "the circumstances as a whole do not justify prosecution". You
    think the decision is wrong. What is the correct route?
  options:
    - A petition to the Administrative Court within 45 days.
    - An appeal (ערר) under s. 64 within 60 days of the notice.
    - A new complaint to the Public Complaints Unit.
    - A complaint to the Public Complaints Commissioner within a year.
  correct: 1
  explanation: >-
    Section 64 allows a complainant's appeal against closures for lack of public interest,
    insufficient evidence or no guilt; s. 65 sets 60 days. A petition comes only after that route.
- id: m06-064
  module: 6
  lesson: '06.4'
  subject: lawyer-first
  difficulty: 3
  question: >-
    Talia was hit by an officer while she was blocking a road without a licence. Which complaint
    strategy is best?
  options:
    - >-
      Describe the whole protest in detail, including the road block, to show the officer's
      unfairness.
    - Do not complain, since blocking the road makes any force lawful.
    - With legal advice, complain about the blow itself, with full details and evidence.
    - Complain to the Public Complaints Unit only, to avoid investigators.
  correct: 2
  explanation: >-
    Unlawful conduct by a protester does not make unreasonable force lawful. A focused complaint,
    shaped with a lawyer, avoids admitting a separate offence.
- id: m06-065
  module: 6
  lesson: '06.4'
  subject: disciplinary
  difficulty: 2
  question: >-
    The Public Complaints Unit offers mediation for a complaint about an officer's insulting
    language. What happens if mediation succeeds?
  options:
    - The matter is closed and cannot be raised again.
    - The officer is automatically disciplined.
    - The complaint is passed to מח״ש.
    - You receive compensation set by the mediator.
  correct: 0
  explanation: >-
    Mediation is voluntary, without lawyers; the agreement includes finality, so a successful
    mediation closes the matter.
- id: m06-066
  module: 6
  lesson: '06.4'
  subject: evidence
  difficulty: 2
  question: >-
    From 15.2.2027, what new evidence will a person hurt by a water cannon at a protest be able to
    request?
  options:
    - The names of all officers on duty that day.
    - The minister's operational instructions.
    - The cannon's maintenance and safety-inspection records for the year.
    - The video and sound recording of the water-cannon use.
  correct: 3
  explanation: >-
    Police Ordinance s. 89א(ב)–(ד): use must be filmed, the footage kept at least a year, and a
    person hurt may request it.
- id: m06-067
  module: 6
  lesson: '06.4'
  subject: complaint-channel
  difficulty: 3
  question: >-
    Many protesters report that officers at weekly protests in one city routinely do not wear name
    tags. Which tool best addresses the pattern?
  options:
    - A single complaint to מח״ש on behalf of all the protesters who were affected.
    - An FOI request for complaint data, then a letter to oversight bodies.
    - A small claims suit against the city.
    - A petition to the Magistrates' Court for an injunction.
  correct: 1
  explanation: >-
    Individual complaints address individual acts; systemic patterns are better documented with FOI
    data and raised with oversight bodies (05.2, 05.4).
- id: m06-068
  module: 6
  lesson: '06.4'
  subject: mahash-process
  difficulty: 2
  question: Can a Border Police officer's conduct at a protest in Judea and Samaria be investigated by מח״ש?
  options:
    - No; only the Military Police investigates incidents there.
    - No; Border Police are soldiers.
    - Yes, Border Police officers are within מח״ש's remit.
    - Only if the protester is a resident of Israel proper.
  correct: 2
  explanation: >-
    The gov.il page lists police officers including Border Police (מג״ב) as within the department's
    remit, on duty or off duty.
- id: m06-069
  module: 6
  lesson: '06.5'
  subject: incitement-violence
  difficulty: 1
  question: >-
    What test decides whether praise of violence is the offence of incitement to violence (s.
    144ד2)?
  options:
    - Whether the speaker belongs to an extremist group.
    - Whether content and circumstances make violence a real possibility.
    - Whether the post received more than 1,000 views.
    - Whether violence actually followed within a week of the publication.
  correct: 1
  explanation: >-
    Section 144ד2(א) uses a "real possibility" test based on content and circumstances; actual
    violence is not required.
- id: m06-070
  module: 6
  lesson: '06.5'
  subject: racism-incitement
  difficulty: 1
  question: >-
    Under s. 144א, racism is hostility or humiliation against a public because of which
    characteristics?
  options:
    - Political views or party membership.
    - Religion or religious observance only.
    - Colour, race or national-ethnic origin.
    - Sexual orientation or gender.
  correct: 2
  explanation: >-
    The definition covers colour, race and national-ethnic origin. Other groups are protected by
    other offences, such as incitement to violence.
- id: m06-071
  module: 6
  lesson: '06.5'
  subject: racism-incitement
  difficulty: 1
  question: What is required before an indictment for incitement to racism may be filed?
  options:
    - The Attorney General's written consent.
    - A complaint from a member of the targeted group.
    - A prior warning letter from the police.
    - A court order removing the publication.
  correct: 0
  explanation: 'Penal Law s. 144ה: no indictment under the racism chapter without the AG''s written consent.'
- id: m06-072
  module: 6
  lesson: '06.5'
  subject: terror-support
  difficulty: 1
  question: >-
    Which of these is always an offence under Counter-Terrorism Law s. 24(ב)(1), without any
    probability test?
  options:
    - Criticising the army's conduct in a war in a signed newspaper column.
    - Calling for a ceasefire.
    - Mourning a relative killed in a military operation.
    - Publishing a direct call to commit an act of terror.
  correct: 3
  explanation: >-
    A direct call to terror is an offence in itself (five years); praise of terror needs a real
    possibility of leading to terror (s. 24(ב)(2)).
- id: m06-073
  module: 6
  lesson: '06.5'
  subject: terror-support
  difficulty: 2
  question: >-
    A student waves the flag of a designated terror organisation at a campus rally to show support
    for it. Which offence fits?
  options:
    - Public identification with a terror organisation (CT Law s. 24(א)).
    - Gross offence to religious feelings (s. 173) of other students.
    - Unlawful assembly (s. 151), since a rally was involved.
    - Defamation of the State and its institutions.
  correct: 0
  explanation: >-
    Section 24(א) makes public identification with a terror organisation — including waving its flag
    or displaying its symbol — punishable by three years.
- id: m06-074
  module: 6
  lesson: '06.5'
  subject: flags
  difficulty: 2
  question: >-
    Under Police Ordinance s. 82, who may ban the display of a flag likely to provoke a breach of
    the peace?
  options:
    - Any officer at the scene, permanently and without any general order.
    - The Inspector General, generally or for set times and places.
    - The municipality where the protest is held.
    - The Knesset National Security Committee.
  correct: 1
  explanation: >-
    Section 82(א)–(ב) gives the Inspector General the power; officers may remove a flag shown in
    breach of such a ban or in circumstances provoking a breach of the peace (s. 82(ג)).
- id: m06-075
  module: 6
  lesson: '06.5'
  subject: online-liability
  difficulty: 2
  question: Does reposting someone else's call to violence protect you because you did not write it?
  options:
    - Yes, only the original author is liable.
    - Yes, if you add the words "not my words" above the shared post.
    - No; sharing can be publication or holding for distribution.
    - No, but only if you have more followers than the author.
  correct: 2
  explanation: >-
    Publishing and holding for distribution are both offences (ss. 144ד2, 144ד3). A clearly framed,
    fair and accurate report is protected; a plain repost is not.
- id: m06-076
  module: 6
  lesson: '06.5'
  subject: online-liability
  difficulty: 2
  question: >-
    A journalist quotes a politician's call to "wipe out" a village, in an article criticising the
    call. Is the journalist liable for incitement?
  options:
    - Yes, repeating any incitement is an offence.
    - Yes, unless the politician has agreed in writing to be quoted.
    - No, journalists are exempt from the Penal Law.
    - No, a fair and accurate report is not an offence.
  correct: 3
  explanation: >-
    Sections 144ג(א) and 144ד2(ג) protect a fair and accurate report. The framing must make clear it
    is a report, not endorsement.
- id: m06-077
  module: 6
  lesson: '06.5'
  subject: threats
  difficulty: 2
  question: >-
    A protester messages a council member: "We know where your children study. Vote yes, or else."
    Which offence is the most direct fit?
  options:
    - Threats (Penal Law s. 192).
    - Incitement to racism (s. 144ב).
    - Unlawful assembly (s. 151).
    - Gross offence to religious feelings (s. 173).
  correct: 0
  explanation: >-
    Threatening harm to a person or another, to frighten or harass them, is the offence of threats;
    the message targets a specific person.
- id: m06-078
  module: 6
  lesson: '06.5'
  subject: sign-at-protest
  difficulty: 1
  question: An officer demands that you lower a sign you believe is lawful. What is the first thing to do?
  options:
    - Refuse and hold the sign tighter until a lawyer arrives.
    - Ask which offence the sign is said to commit.
    - Hand the sign to another protester.
    - Leave the protest immediately.
  correct: 1
  explanation: >-
    Asking which offence clarifies the order and creates a record. If the officer insists, comply,
    film and complain later.
- id: m06-079
  module: 6
  lesson: '06.5'
  subject: incitement-violence
  difficulty: 2
  question: Which sign at an anti-government rally is the clearest example of protected speech?
  options:
    - '"Hang the traitors in the square."'
    - A photo of the PM with his home address and "Visit him tonight."
    - '"This government is destroying the country — go home!"'
    - '"Whoever stops the minister with force is a hero."'
  correct: 2
  explanation: >-
    Harsh criticism is protected. The others call for, praise or invite violence or harassment
    against specific people.
- id: m06-080
  module: 6
  lesson: '06.5'
  subject: racism-incitement
  difficulty: 3
  question: >-
    At a march, a group chants a slogan wishing death to an entire national group. Which offences
    should the organisers have anticipated?
  options:
    - Only defamation, since no individual is named.
    - Nothing, because chants are not "publications".
    - Only a disciplinary matter for the stewards.
    - Incitement to racism and possibly incitement to violence.
  correct: 3
  explanation: >-
    A public chant is a publication; hostility to a national group is racism under s. 144א; a call
    for death may meet the violence test too. Organisers should ban such chants in the briefing.
- id: m06-081
  module: 6
  lesson: '06.5'
  subject: terror-support
  difficulty: 3
  question: >-
    Under the temporary provision in Counter-Terrorism Law s. 24(ג1), renewed from 27.11.2025, what
    is the offence?
  options:
    - Systematic, continuous consumption of listed terror groups' publications.
    - Any single viewing of a news report that quotes a statement by a terror organisation.
    - Following foreign news channels during wartime.
    - Criticising the government's counter-terror policy online.
  correct: 0
  explanation: >-
    Section 24(ג1) targets systematic and continuous consumption of listed organisations'
    publications, in circumstances showing identification with them — not news consumption or
    criticism.
- id: m06-082
  module: 6
  lesson: '06.5'
  subject: online-liability
  difficulty: 3
  question: >-
    A farmers' protest group plans to print 2,000 flyers. One member's draft says the ministry's
    inspectors "should be beaten when they come tomorrow". The group's treasurer, who will store the
    flyers, asks whether she is at risk too. What is the best answer?
  options:
    - No; only the author of a text can ever commit an incitement offence.
    - Yes; holding an inciting publication for distribution is an offence.
    - No; printed flyers are not "publications" under the Penal Law at all.
    - Only if the flyers are handed out inside a government building.
  correct: 1
  explanation: >-
    Penal Law s. 144ד3 makes holding an inciting publication for distribution an offence (one year).
    The group should rewrite the flyer before printing.
- id: m06-083
  module: 6
  lesson: '06.5'
  subject: incitement-violence
  difficulty: 3
  question: >-
    The same post — "They will pay for this" — is published by two people. When is it more likely to
    meet the real-possibility test?
  options:
    - When posted by a private person to 20 friends on a calm day.
    - When posted with a smiling emoji at the end of the message.
    - When posted in English rather than in Hebrew or Arabic.
    - When sent to 50,000 followers right after an attack, naming a target.
  correct: 3
  explanation: >-
    The test looks at content and circumstances: audience, timing, a named target and tension all
    increase the real possibility of violence.
- id: m06-084
  module: 6
  lesson: '06.5'
  subject: sign-at-protest
  difficulty: 2
  question: Which licence condition on signs is most likely lawful?
  options:
    - '"No signs criticising the police or their conduct at earlier protests."'
    - '"No signs in Arabic."'
    - '"No signs that amount to incitement or show terror symbols."'
    - '"Only signs approved in advance by the district commander may be raised."'
  correct: 2
  explanation: >-
    A condition that targets criminal speech is lawful; conditions based on criticism, language or
    prior approval of content restrict the message itself.
- id: m06-085
  module: 6
  lesson: '06.5'
  subject: racism-incitement
  difficulty: 2
  question: >-
    A religious group's sign quotes a verse from Scripture critical of another people. When can this
    be incitement to racism?
  options:
    - Only when quoted with the purpose of inciting racism.
    - Always, because religious texts are not protected.
    - Never, because religious quotes are fully exempt.
    - Only if more than 50 people see it.
  correct: 0
  explanation: >-
    Section 144ג(ב) exempts quotes from religious texts unless made with the purpose of inciting
    racism.
- id: m07-001
  module: 7
  lesson: '07.1'
  subject: offence-classes
  difficulty: 1
  question: Under Penal Law s. 24, an offence with a maximum of three years' imprisonment is which class?
  options:
    - A felony (פשע).
    - A contravention (חטא).
    - A misdemeanour (עוון).
    - A fine offence (עבירת קנס).
  correct: 2
  explanation: A felony needs a penalty above three years; above three months and up to three years is a עוון.
- id: m07-002
  module: 7
  lesson: '07.1'
  subject: offence-classes
  difficulty: 1
  question: What is an 'arrestable offence' (עבירה בת מעצר) under the Arrests Law?
  options:
    - Any offence punishable by five years or more.
    - Only offences committed in an officer's presence.
    - Only felonies listed in the Arrests Law schedule.
    - Any offence that is not a contravention (חטא).
  correct: 3
  explanation: 'Section 23(א)(7): ''עבירה בת מעצר'' is every offence except a חטא.'
- id: m07-003
  module: 7
  lesson: '07.1'
  subject: offence-classes
  difficulty: 2
  question: >-
    An officer wants to arrest a protester only for insulting a passer-by in a public place (s.
    194(ב), three months). What may he do instead?
  options:
    - Arrest him, since insults always justify arrest.
    - Arrest him after a written warning.
    - Hold him overnight until a judge decides.
    - Detain the protester briefly to identify him.
  correct: 3
  explanation: >-
    A three-month offence is a חטא and not arrestable without a warrant; detention to identify is
    still available (s. 67).
- id: m07-004
  module: 7
  lesson: '07.1'
  subject: offence-classes
  difficulty: 2
  question: Why does the class of the offence matter after a file is closed?
  options:
    - It decides whether the file can ever be reopened.
    - It decides whether the closure letter states the ground.
    - It changes the waiting period to cancel the police record.
    - It decides which court will hear an appeal.
  correct: 2
  explanation: >-
    Cancellation on request is after 5 years for a misdemeanour and 7 for a felony (adults) under
    the 2009 criteria.
- id: m07-005
  module: 7
  lesson: '07.1'
  subject: protest-offences
  difficulty: 1
  question: Which section defines unlawful assembly (התקהלות אסורה)?
  options:
    - Section 83 of the Police Ordinance.
    - Section 151 of the Penal Law.
    - Section 194 of the Penal Law.
    - Section 23 of the Arrests Law.
  correct: 1
  explanation: Penal Law s. 151 defines it; the Police Ordinance deals with licences (lesson 06.2).
- id: m07-006
  module: 7
  lesson: '07.1'
  subject: protest-offences
  difficulty: 2
  question: >-
    A group of three friends holds a quiet vigil with candles outside a ministry, without a licence.
    Nobody fears a breach of the peace. Is it an unlawful assembly under s. 151?
  options:
    - No; s. 151 needs conduct causing reasonable fear of a breach of peace.
    - Yes; three or more people without a licence are an unlawful assembly.
    - Yes; any gathering outside a government building is unlawful.
    - No; s. 151 applies only to gatherings of fifty people or more.
  correct: 0
  explanation: >-
    Section 151 is about behaviour that gives bystanders reasonable fear of a breach of the peace,
    not about licences.
- id: m07-007
  module: 7
  lesson: '07.1'
  subject: protest-offences
  difficulty: 2
  question: Which offence turns into a felony only after a dispersal order and a reasonable time to leave?
  options:
    - Staying after a dispersal order (s. 155).
    - Riot that frightens the public (s. 152).
    - Public nuisance on a public way (s. 215).
    - Improper conduct in a public place (s. 216).
  correct: 0
  explanation: Section 155 carries five years and depends on an order under s. 153 and a reasonable time.
- id: m07-008
  module: 7
  lesson: '07.1'
  subject: protest-offences
  difficulty: 3
  question: >-
    A dispersal announcement is made by a junior constable, with a senior officer present and
    silent. Protesters stay. Which question will matter most for a s. 155 charge?
  options:
    - Whether a person authorised under s. 153 gave the order.
    - Whether the protest had a licence from the district commander.
    - Whether the protesters were warned in writing.
    - Whether a judge approved the dispersal in advance.
  correct: 0
  explanation: >-
    Section 153 lists who may order dispersal; the absence of a valid order is a defence question
    for the lawyer.
- id: m07-009
  module: 7
  lesson: '07.1'
  subject: offence-elements
  difficulty: 1
  question: Which offence requires an intention to obstruct the officer?
  options:
    - Assaulting an officer (s. 273).
    - Unlawful assembly (s. 151).
    - Obstructing an officer (s. 275).
    - Breach of a lawful order (s. 287).
  correct: 2
  explanation: Section 275 opens 'העושה מעשה בכוונה להפריע לשוטר'.
- id: m07-010
  module: 7
  lesson: '07.1'
  subject: offence-elements
  difficulty: 2
  question: For s. 287, what must the order have been?
  options:
    - Given in writing and signed by a senior officer.
    - Given properly by a court or an authorised official.
    - Given at least one hour before the breach.
    - Approved in advance by the Attorney General.
  correct: 1
  explanation: 'Section 287(א): ''הוראה שניתנה כשורה מאת בית משפט או מאת פקיד … מוסמך''.'
- id: m07-011
  module: 7
  lesson: '07.1'
  subject: offence-elements
  difficulty: 3
  question: >-
    Activists place a large banner across a road at night to stop cars, and a driver swerves.
    Compared with a daytime sit-in, why may s. 332 be more relevant here?
  options:
    - Placing an object on the road may show intent to endanger.
    - Night-time protests are automatically treated as felonies.
    - Banners are always treated as weapons under the Penal Law.
    - Section 332 applies only once a driver is actually injured.
  correct: 0
  explanation: >-
    Section 332(1) covers placing an object on a traffic route with intent to harm or endanger
    travellers; the facts may support such intent.
- id: m07-012
  module: 7
  lesson: '07.1'
  subject: police-offences
  difficulty: 1
  question: Which offence carries a statutory minimum of one month?
  options:
    - Insulting a public servant on duty (s. 288).
    - Public nuisance on a public road (s. 215).
    - Unlawful assembly of three or more (s. 151).
    - Assaulting a police officer (s. 273).
  correct: 3
  explanation: 'Section 273: up to three years and not less than one month.'
- id: m07-013
  module: 7
  lesson: '07.1'
  subject: police-offences
  difficulty: 2
  question: >-
    An activist throws a plastic bottle at a police car to stop it leaving. Which section is most
    relevant?
  options:
    - Defacing property (s. 196).
    - Improper conduct in a public place (s. 216).
    - Noise in a public place (s. 194).
    - Aggravated obstruction (s. 275א).
  correct: 3
  explanation: >-
    Section 275א covers throwing a stone or object at an officer or police vehicle to obstruct; it
    is a felony.
- id: m07-014
  module: 7
  lesson: '07.1'
  subject: police-offences
  difficulty: 3
  question: >-
    During an arrest a protester goes limp and is carried away. He did not push or pull. Which is
    the most accurate statement?
  options:
    - Going limp is always an assault on an officer under s. 273.
    - Going limp makes the whole arrest unlawful from the start.
    - Going limp is a full defence to every protest offence.
    - It is not assault in itself, but obstruction may still be alleged.
  correct: 3
  explanation: >-
    Assault needs force; obstruction needs an act with intent to obstruct. Whether passive conduct
    fits s. 275 is for the lawyer and the court.
- id: m07-015
  module: 7
  lesson: '07.1'
  subject: charge-map
  difficulty: 2
  question: Which line belongs in a good personal charge map?
  options:
    - Sitting on the road — legal, because protest is a basic right.
    - Road sit-in — s. 215/216, עוון; I leave if clearance is announced.
    - Sitting on the road — s. 332, twenty years, so I will not protest.
    - Sitting on the road — no section, police only fine people.
  correct: 1
  explanation: A charge map names the likely section, its class and a concrete line of conduct.
- id: m07-016
  module: 7
  lesson: '07.1'
  subject: charge-map
  difficulty: 2
  question: Which is the best reason to write a charge map before an action rather than after an arrest?
  options:
    - It lets you negotiate the sections with the officer on the spot.
    - It must be shown to the police before a licensed protest.
    - Decisions are easier to keep under pressure when made in advance.
    - It is required by the Arrests Law for organisers.
  correct: 2
  explanation: The charge map turns legal knowledge into simple rules you can follow when stressed.
- id: m07-017
  module: 7
  lesson: '07.1'
  subject: protest-offences
  difficulty: 1
  question: Spraying a slogan on a company's wall without permission falls under which section?
  options:
    - Riot, s. 152.
    - Public nuisance, s. 215.
    - Insulting a public servant, s. 288.
    - Defacing property, s. 196.
  correct: 3
  explanation: >-
    Section 196 covers writing, drawing or sticking on another's real property unlawfully; it can
    also be a fine offence.
- id: m07-018
  module: 7
  lesson: '07.1'
  subject: offence-classes
  difficulty: 3
  question: >-
    A protester is told: 'You were only fined for graffiti, so nothing is recorded.' What is
    accurate under the Criminal Information Law?
  options:
    - Fine offences are not in the criminal register (s. 8(ג)).
    - Every fine is recorded in the criminal register for ten years.
    - A fine is recorded as a felony on the police register.
    - Fines are recorded only if they are paid late.
  correct: 0
  explanation: >-
    Section 8(ג) excludes fine offences and administrative offences from the criminal register,
    except cases set by the minister.
- id: m07-019
  module: 7
  lesson: '07.2'
  subject: detention-vs-arrest
  difficulty: 1
  question: What is the general maximum length of a short detention (עיכוב)?
  options:
    - Twenty-four hours, like an arrest.
    - Three hours, plus three in some cases.
    - Six hours in every single case.
    - Forty-eight hours before seeing a judge.
  correct: 1
  explanation: >-
    Section 73(ב): three hours, plus up to three more with recorded reasons when many people are
    involved.
- id: m07-020
  module: 7
  lesson: '07.2'
  subject: detention-vs-arrest
  difficulty: 2
  question: >-
    An officer says, 'Come with me to the station to clarify things.' You ask and he says you are
    not under arrest. What is your status?
  options:
    - Arrested without a warrant under s. 23.
    - Free to refuse with no consequence at all.
    - Held under a remand order from a judge.
    - Detained under s. 67(ב), within detention limits.
  correct: 3
  explanation: >-
    Section 67(ב) allows requiring a person to accompany the officer; refusing a lawful detention
    can lead to arrest (s. 23(ב)).
- id: m07-021
  module: 7
  lesson: '07.2'
  subject: arrest-procedure
  difficulty: 1
  question: What must the arresting officer do first under s. 24(א)?
  options:
    - Read you a written list of all your rights first.
    - Identify himself, say you are arrested and explain why.
    - Call your lawyer before taking you to the station.
    - Search your phone for evidence of the offence.
  correct: 1
  explanation: Section 24(א); these duties are a condition of a lawful arrest (s. 24(ג)).
- id: m07-022
  module: 7
  lesson: '07.2'
  subject: arrest-procedure
  difficulty: 2
  question: Why does it matter that the duties in s. 24 are 'תנאי לחוקיות המעצר'?
  options:
    - Breaking them makes the arrest unlawful, which a lawyer can raise.
    - Breaking them cancels the criminal file automatically.
    - Breaking them lets the suspect walk away at once.
    - Breaking them requires the officer to pay compensation on the spot.
  correct: 0
  explanation: >-
    Section 24(ג) makes the duties a legality condition; the consequences are argued by the lawyer,
    not resolved by resisting.
- id: m07-023
  module: 7
  lesson: '07.2'
  subject: arrest-procedure
  difficulty: 2
  question: Under s. 23(ג), when may an officer not arrest even for an arrestable offence?
  options:
    - When the suspect is a student.
    - When the offence happened more than an hour ago.
    - When a detention is enough.
    - When the suspect has a lawyer.
  correct: 2
  explanation: 'Section 23(ג): ''לא ייעצר אדם לפי סעיף זה אם ניתן להסתפק בעיכוב''.'
- id: m07-024
  module: 7
  lesson: '07.2'
  subject: rights-at-station
  difficulty: 1
  question: Who decides at the station whether an arrested person stays in custody or is released?
  options:
    - The officer who made the arrest.
    - The duty public defender.
    - The officer in charge (הקצין הממונה).
    - The station's legal adviser on call.
  correct: 2
  explanation: 'Sections 25–27: the officer in charge reviews the arrest and decides.'
- id: m07-025
  module: 7
  lesson: '07.2'
  subject: rights-at-station
  difficulty: 2
  question: Before the officer in charge decides to hold you, what must happen under s. 28?
  options:
    - Your lawyer must arrive and approve the decision.
    - A judge must review the file by phone first.
    - You must sign a statement about the facts.
    - You are warned and given a chance to state your case.
  correct: 3
  explanation: >-
    Section 28(א) requires a hearing after the warning; your lawyer, if present, may be heard (s.
    28(ב)).
- id: m07-026
  module: 7
  lesson: '07.2'
  subject: rights-at-station
  difficulty: 2
  question: An arrested person asks that nobody be told about the arrest. What does s. 33 say?
  options:
    - No notice is given if the detainee asked for none.
    - The police must notify the employer anyway.
    - The police must notify the family in every case.
    - The police may notify only after a judge's order.
  correct: 0
  explanation: Section 33(א) requires notice to a named close person, 'זולת אם ביקש העצור שלא למסור הודעה'.
- id: m07-027
  module: 7
  lesson: '07.2'
  subject: rights-at-station
  difficulty: 3
  question: >-
    A detainee who speaks Tigrinya is told his rights in Hebrew only and signs the form. What is the
    strongest point for his lawyer?
  options:
    - Rights must be explained in a language he understands (s. 32).
    - Rights forms are valid only if signed in front of a judge.
    - Foreign nationals cannot be arrested without consular approval.
    - Only English and Arabic translations are required by law.
  correct: 0
  explanation: >-
    Section 32 requires explanation 'בלשון המובנת לו, ככל האפשר'; interrogation must also be in a
    language he understands (Interrogation Law s. 2).
- id: m07-028
  module: 7
  lesson: '07.2'
  subject: time-to-judge
  difficulty: 1
  question: What is the general rule for bringing an arrested person before a judge?
  options:
    - Within 48 hours in every case.
    - Within 72 hours if the offence is a felony.
    - Within one working day of the arrest.
    - As soon as possible, and within 24 hours.
  correct: 3
  explanation: Section 29(א).
- id: m07-029
  module: 7
  lesson: '07.2'
  subject: time-to-judge
  difficulty: 2
  question: What happens if an arrested person is not brought before a judge in time?
  options:
    - The file is closed for lack of guilt.
    - He must be released (s. 31(ב)).
    - The police get 24 more hours automatically.
    - He may file a petition but stays in custody.
  correct: 1
  explanation: 'Section 31(ב): ''לא הובא העצור בפני שופט … ישוחרר העצור''.'
- id: m07-030
  module: 7
  lesson: '07.2'
  subject: time-to-judge
  difficulty: 3
  question: >-
    An activist is arrested on Saturday at 10:00. Shabbat ends at 19:00. When must she be brought
    before a judge at the latest?
  options:
    - By 23:00 on Saturday, four hours after Shabbat.
    - By Friday-style rules, before Shabbat began.
    - By Sunday 10:00, the later of the two limits.
    - By Monday morning, since Sunday hearings are rare.
  correct: 2
  explanation: >-
    Section 29(ד): arrested during Shabbat, the later of 4 hours after it ends and 24 hours from the
    arrest.
- id: m07-031
  module: 7
  lesson: '07.2'
  subject: time-to-judge
  difficulty: 2
  question: When may the police delay bringing a detainee before a judge up to 48 hours?
  options:
    - For an urgent act that cannot wait for the hearing.
    - Whenever the station is very busy that night.
    - Whenever the offence is only a misdemeanour.
    - Whenever the detainee refuses to answer questions.
  correct: 0
  explanation: >-
    Section 30 allows up to 48 hours from the arrest only for urgent acts that cannot be done after
    the hearing.
- id: m07-032
  module: 7
  lesson: '07.2'
  subject: phone-search
  difficulty: 1
  question: What does the police need to search the contents of your phone without consent?
  options:
    - The approval of the officer in charge.
    - A written request signed by two officers.
    - Only a reasonable suspicion of any offence.
    - A judge's warrant that expressly allows it.
  correct: 3
  explanation: Arrest and Search Ordinance s. 23א(ב).
- id: m07-033
  module: 7
  lesson: '07.2'
  subject: phone-search
  difficulty: 2
  question: The police seized your phone as evidence. Which statement is correct?
  options:
    - Seizure always includes the right to unlock and search.
    - Seized phones must be returned within 24 hours.
    - Seizure is allowed only with your written consent.
    - Seizing it does not by itself allow searching its contents.
  correct: 3
  explanation: >-
    Seizure and search are separate powers; searching computer material needs a warrant under s.
    23א.
- id: m07-034
  module: 7
  lesson: '07.2'
  subject: support-person
  difficulty: 2
  question: Who is the best choice for a support person on the day of an action?
  options:
    - The protest's main speaker.
    - Someone who will film the police at the action.
    - The lawyer who represents the whole group.
    - A trusted adult who is not at the action.
  correct: 3
  explanation: A support person must be reachable and free, and not at risk of arrest themselves.
- id: m07-035
  module: 7
  lesson: '07.2'
  subject: support-person
  difficulty: 3
  question: Your support person learns you were arrested at 21:00. Which first step is most useful?
  options:
    - Post your name and photo on social media to apply pressure.
    - Call your lawyer or the Public Defender, then the station.
    - Go to the station and demand your release from the duty officer.
    - Wait until the morning, when the courts open again.
  correct: 1
  explanation: >-
    The lawyer needs to know early to consult before interrogation and to prepare for a hearing;
    publicity needs your consent.
- id: m07-036
  module: 7
  lesson: '07.2'
  subject: detention-vs-arrest
  difficulty: 3
  question: >-
    An officer detains a protester for four hours with no extension and no explanation, then lets
    him go. Which statement is right?
  options:
    - Detention has no limit if the protest was unlicensed.
    - Four hours is allowed for any detention at a protest.
    - Beyond three hours it needs an extension with recorded reasons.
    - Detention time limits apply only to minors and the elderly.
  correct: 2
  explanation: >-
    Section 73(ב): three hours, plus three only by the officer in charge with recorded reasons when
    many are involved; a complaint route is lesson 06.4.
- id: m07-037
  module: 7
  lesson: '07.3'
  subject: warning-and-silence
  difficulty: 1
  question: Which three things does the s. 28 warning say?
  options:
    - No duty to answer anything; nothing will be recorded; a lawyer will come.
    - No duty to self-incriminate; words may be used; silence may strengthen evidence.
    - You must answer truthfully; lies are an offence; silence is an admission.
    - You may leave at any time; questions are optional; nothing is evidence.
  correct: 1
  explanation: Section 28(א) of the Arrests Law sets out the warning.
- id: m07-038
  module: 7
  lesson: '07.3'
  subject: warning-and-silence
  difficulty: 2
  question: >-
    Which law gives a witness questioned by police a duty to answer truthfully, except
    self-incriminating questions?
  options:
    - The Public Defender Law, section 18 on eligibility.
    - The Penal Law, section 24 on classes of offences.
    - The Testimony Ordinance, s. 2(2).
    - The Criminal Information Law, section 4 on viewing.
  correct: 2
  explanation: Testimony Ordinance s. 2(2).
- id: m07-039
  module: 7
  lesson: '07.3'
  subject: warning-and-silence
  difficulty: 3
  question: >-
    A suspect stays completely silent and at trial, two years later, says he was elsewhere. What
    risk does this illustrate?
  options:
    - Silence makes any later version of events inadmissible.
    - A late alibi is a separate offence of obstruction.
    - Silence at interrogation bars giving evidence at trial.
    - A version first given at trial may weigh less than an early one.
  correct: 3
  explanation: >-
    The warning says silence may strengthen the evidence; the timing of a version is a reason to
    decide on silence with a lawyer.
- id: m07-040
  module: 7
  lesson: '07.3'
  subject: warning-and-silence
  difficulty: 2
  question: >-
    Questioning starts as a 'witness statement'. Then the investigator asks what you did when the
    officer fell. What should you do?
  options:
    - Ask whether you are now a suspect, and ask to consult a lawyer.
    - Keep answering, since witnesses must answer every question.
    - Leave the room at once without saying anything more.
    - Answer briefly and sign quickly so that it ends.
  correct: 0
  explanation: >-
    A witness need not answer self-incriminating questions; once questions concern your acts, ask
    about your status and consult.
- id: m07-041
  module: 7
  lesson: '07.3'
  subject: lawyer-consultation
  difficulty: 1
  question: How must the meeting with a lawyer be held under s. 34(ג)?
  options:
    - In private and confidential, with only movements watched.
    - In the interrogation room with the investigator present.
    - By phone only, with the call recorded by the police.
    - Only after the suspect's statement has been signed.
  correct: 0
  explanation: Section 34(ג).
- id: m07-042
  module: 7
  lesson: '07.3'
  subject: lawyer-consultation
  difficulty: 2
  question: >-
    For an ordinary offence, what is the longest the police may prevent a meeting with a lawyer to
    save life or prevent a crime?
  options:
    - 48 hours from the arrest.
    - 10 days from the arrest.
    - 72 hours from the arrest.
    - Until the end of the investigation.
  correct: 0
  explanation: Section 34(ו); security offences have their own longer rules under s. 35.
- id: m07-043
  module: 7
  lesson: '07.3'
  subject: lawyer-consultation
  difficulty: 3
  question: >-
    An officer delays a lawyer meeting by an oral decision 'because of the investigation'. What is
    missing?
  options:
    - The detainee's own written consent to the delay.
    - A reasoned written decision by an authorised officer.
    - The Attorney General's prior approval of the delay.
    - A judge's warrant authorising each separate delay.
  correct: 1
  explanation: Delays under s. 34(ד)–(ו) need a reasoned written decision and are limited in time.
- id: m07-044
  module: 7
  lesson: '07.3'
  subject: lawyer-consultation
  difficulty: 2
  question: >-
    A person who is only summoned to an interrogation, not arrested, wants legal advice. What is the
    realistic route?
  options:
    - Ask the Public Defender's arrest department to send someone.
    - Arrange a private or an organisation's lawyer before the date.
    - Ask the investigator to appoint a defender for him.
    - Wait for the court to appoint a defender at trial.
  correct: 1
  explanation: >-
    The Public Defender represents detainees and certain accused persons; a summoned suspect usually
    arranges a lawyer.
- id: m07-045
  module: 7
  lesson: '07.3'
  subject: public-defender
  difficulty: 1
  question: Which detainee is entitled to a public defender without a means test?
  options:
    - An arrested minor.
    - A first-time adult offender.
    - A student under 25.
    - Any detainee arrested at a licensed protest.
  correct: 0
  explanation: The Public Defender lists arrested minors among those always eligible.
- id: m07-046
  module: 7
  lesson: '07.3'
  subject: public-defender
  difficulty: 2
  question: Roughly what income limit does the means test use for a household of up to three people?
  options:
    - Half of the national minimum wage.
    - Three times the average wage in the economy.
    - The same limit as civil Legal Aid uses.
    - About two-thirds of the average wage.
  correct: 3
  explanation: >-
    The 1996 order sets income up to 67% of the average wage, plus 6% per extra person; current
    figures are in the Public Defender's yearly table.
- id: m07-047
  module: 7
  lesson: '07.3'
  subject: public-defender
  difficulty: 2
  question: Which limit applies to indigent accused persons but not to indigent detainees?
  options:
    - The detainee must be under 21.
    - The case must be in the District Court.
    - The offence must carry five years or more.
    - The defendant must have no previous record.
  correct: 2
  explanation: The detainee regulations apply the indigence order 'למעט סעיף 3', the five-year condition.
- id: m07-048
  module: 7
  lesson: '07.3'
  subject: public-defender
  difficulty: 3
  question: >-
    A detainee says he probably earns too much for a public defender, so he will not ask. What is
    the best advice?
  options:
    - Do not ask; asking when ineligible is an offence.
    - Ask anyway; the first consultation is reportedly free.
    - Do not ask; the police will charge the cost to him.
    - Ask only after the remand hearing is over.
  correct: 1
  explanation: >-
    ACRI reports the first consultation is not charged even if the detainee is later found
    ineligible; the Public Defender decides eligibility.
- id: m07-049
  module: 7
  lesson: '07.3'
  subject: public-defender
  difficulty: 2
  question: >-
    No request for a public defender was passed on before the remand hearing. What can the detainee
    do at court?
  options:
    - Represent himself, since it is too late to ask.
    - Ask the Public Defender's representative at the court.
    - Ask the police prosecutor to act on his behalf.
    - Ask the judge to postpone the hearing by a week.
  correct: 1
  explanation: Public Defender Regulations reg. 1(ג).
- id: m07-050
  module: 7
  lesson: '07.3'
  subject: interrogation-conduct
  difficulty: 1
  question: What should you tell the investigator at the start if you are exhausted or unwell?
  options:
    - Nothing at all, so as not to look weak or guilty.
    - Only your lawyer, and never the investigator.
    - That you will answer quickly so you can go home.
    - That you are not fit to be questioned and need a doctor.
  correct: 3
  explanation: >-
    The Public Defender advises telling the investigator if you are tired, upset or unwell; medical
    care is free.
- id: m07-051
  module: 7
  lesson: '07.3'
  subject: interrogation-conduct
  difficulty: 2
  question: In which case must a suspect's interrogation at the station normally be video recorded?
  options:
    - When the offence carries ten years or more.
    - Whenever the suspect asks for it to be recorded.
    - Only when the suspect is a minor.
    - Only in interrogations about security offences.
  correct: 0
  explanation: Interrogation of Suspects Law s. 7 and the Schedule; security offences are excluded (s. 17).
- id: m07-052
  module: 7
  lesson: '07.3'
  subject: interrogation-conduct
  difficulty: 3
  question: >-
    A fellow detainee in the cell asks, 'So what did you actually do out there?' What is the safest
    response?
  options:
    - Tell him, since cellmates cannot testify.
    - Tell him only what you told the police.
    - Ask him first whether he is a police informer.
    - Say nothing about the event.
  correct: 3
  explanation: Anything said may reach the police; the lesson's rule is no conversations about the event.
- id: m07-053
  module: 7
  lesson: '07.3'
  subject: statement-signing
  difficulty: 1
  question: What may you do if the written statement contains a mistake?
  options:
    - Nothing; statements cannot be changed once typed.
    - Ask for a correction; refuse to sign if it is not made.
    - Correct it later, but only at the trial itself.
    - Sign and send a correcting email afterwards.
  correct: 1
  explanation: >-
    Testimony Ordinance s. 3: the statement is read to you; you may refuse to sign and the refusal
    is recorded.
- id: m07-054
  module: 7
  lesson: '07.3'
  subject: statement-signing
  difficulty: 2
  question: Which sentence is the best way to record silence on legal advice?
  options:
    - על פי ייעוץ משפטי, אני שומר/ת על זכות השתיקה.
    - אין לי מה להגיד לכם כי לא עשיתי שום דבר רע.
    - אני לא משתף/ת פעולה עם המשטרה בשום צורה.
    - אני אדבר רק אם תבטיחו שתשחררו אותי היום.
  correct: 0
  explanation: A fixed, neutral sentence records the choice without adding facts or hostility.
- id: m07-055
  module: 7
  lesson: '07.4'
  subject: remand-grounds
  difficulty: 1
  question: What must a judge find before remanding a suspect before indictment?
  options:
    - A prima facie case strong enough to convict.
    - A confession or at least one eyewitness account.
    - Reasonable suspicion plus a ground for remand.
    - The Attorney General's approval of the request.
  correct: 2
  explanation: Section 13(א).
- id: m07-056
  module: 7
  lesson: '07.4'
  subject: remand-grounds
  difficulty: 2
  question: Which is not a ground for remand under s. 13?
  options:
    - The suspect's political views.
    - Risk of obstructing the investigation.
    - Danger to a person or the public.
    - Investigative acts that need custody.
  correct: 0
  explanation: Section 13 lists obstruction, danger and investigative acts; views are irrelevant.
- id: m07-057
  module: 7
  lesson: '07.4'
  subject: remand-grounds
  difficulty: 2
  question: Under s. 13(ב), when must a judge not order custody?
  options:
    - When the suspect has a steady job and a family.
    - When the suspect has no previous criminal record.
    - When conditions would achieve the purpose with less harm.
    - When the protest itself had a police licence.
  correct: 2
  explanation: Section 13(ב) requires the less harmful alternative.
- id: m07-058
  module: 7
  lesson: '07.4'
  subject: remand-grounds
  difficulty: 3
  question: The police ask for remand 'because the suspect will join tomorrow's protest'. Is this a ground?
  options:
    - Yes; joining another protest is always a valid ground for remand.
    - No; a suspect's future conduct can never matter to the court.
    - Only if it shows a real risk of danger; protest itself is no ground.
    - Yes, if the suspect refused to answer questions in interrogation.
  correct: 2
  explanation: >-
    Remand grounds are about obstruction, danger or investigative needs; courts can usually address
    risks with narrow conditions.
- id: m07-059
  module: 7
  lesson: '07.4'
  subject: remand-hearing
  difficulty: 1
  question: Who may question the police officer at the remand hearing?
  options:
    - Only the judge hearing the request.
    - The suspect or his lawyer, and the judge.
    - Only the police prosecutor in court.
    - Nobody; the request is decided on paper.
  correct: 1
  explanation: Section 15(ד).
- id: m07-060
  module: 7
  lesson: '07.4'
  subject: remand-hearing
  difficulty: 2
  question: What may a judge see that the suspect and lawyer may not?
  options:
    - The suspect's full medical file from the prison.
    - The suspect's previous closed files only.
    - Nothing; everything must be disclosed to the defence.
    - Confidential material marked for the court only.
  correct: 3
  explanation: Section 15(ג)–(ה) allows material for the judge's eyes only.
- id: m07-061
  module: 7
  lesson: '07.4'
  subject: remand-hearing
  difficulty: 2
  question: >-
    What is the longest a single remand order before indictment may last, outside wartime emergency
    rules?
  options:
    - 5 days.
    - 15 days.
    - 30 days.
    - 75 days.
  correct: 1
  explanation: Section 17(א).
- id: m07-062
  module: 7
  lesson: '07.4'
  subject: remand-hearing
  difficulty: 3
  question: A suspect has been in custody 30 days for one event. The police ask for more. What is needed?
  options:
    - The Attorney General's approval of the request.
    - Only a fresh officer's declaration.
    - The suspect's consent.
    - A District Court judge instead of a magistrate.
  correct: 0
  explanation: Section 17(ב).
- id: m07-063
  module: 7
  lesson: '07.4'
  subject: officer-conditions
  difficulty: 1
  question: Can the officer in charge impose the s. 42 conditions without your consent?
  options:
    - Yes, any condition he thinks right.
    - No; the listed conditions need your consent.
    - Yes, unless you have a lawyer present.
    - Only the reporting condition needs consent.
  correct: 1
  explanation: 'Section 42(ב): ''בהסכמת החשוד''.'
- id: m07-064
  module: 7
  lesson: '07.4'
  subject: officer-conditions
  difficulty: 2
  question: What is the longest house arrest an officer may set?
  options:
    - 15 days.
    - 5 days.
    - 30 days.
    - 3 months.
  correct: 1
  explanation: Section 42(ב)(7).
- id: m07-065
  module: 7
  lesson: '07.4'
  subject: officer-conditions
  difficulty: 2
  question: What happens if you do not agree to the officer's bail conditions?
  options:
    - You stay arrested and go before a judge within 24 hours.
    - You are released at once without any conditions.
    - You commit an offence of breaching an order (s. 287).
    - The officer may hold you for up to 48 hours instead.
  correct: 0
  explanation: Section 42(ד).
- id: m07-066
  module: 7
  lesson: '07.4'
  subject: officer-conditions
  difficulty: 3
  question: An activist cannot pay a cash deposit the officer set. What may the officer do?
  options:
    - Keep her in custody until she pays, without any judge.
    - Cancel the release and close the criminal file instead.
    - Release on another kind of guarantee, or give time to deposit.
    - Transfer the debt to her support person or family.
  correct: 2
  explanation: Section 42(ה).
- id: m07-067
  module: 7
  lesson: '07.4'
  subject: court-conditions
  difficulty: 1
  question: What principle limits court conditions under s. 46(א)?
  options:
    - No more than needed to achieve the purpose.
    - They must last at least as long as the investigation.
    - They must match those set by the officer.
    - They must include a cash deposit.
  correct: 0
  explanation: Section 46(א).
- id: m07-068
  module: 7
  lesson: '07.4'
  subject: court-conditions
  difficulty: 2
  question: Which factor must a judge consider when setting a deposit?
  options:
    - The person's political views and affiliation.
    - The person's means and ability to provide it.
    - The size and length of the protest he joined.
    - The cost of the police operation that day.
  correct: 1
  explanation: Section 46(ב)(4).
- id: m07-069
  module: 7
  lesson: '07.4'
  subject: court-conditions
  difficulty: 3
  question: Which proposal is most likely to persuade a court to narrow an exclusion?
  options:
    - A general written promise never to protest again in the city.
    - A request to cancel all conditions as unconstitutional.
    - A narrow area, a short period, a work exception, a supervisor.
    - An offer to pay a large fine on the spot instead of conditions.
  correct: 2
  explanation: >-
    Concrete, narrow alternatives with support show the purpose is met with less harm (ss. 13(ב),
    46).
- id: m07-070
  module: 7
  lesson: '07.4'
  subject: challenge-routes
  difficulty: 1
  question: Within how long can a court's custody or bail decision be appealed?
  options:
    - 14 days.
    - 45 days.
    - 7 days.
    - 30 days.
  correct: 3
  explanation: Section 53(ג).
- id: m07-071
  module: 7
  lesson: '07.4'
  subject: challenge-routes
  difficulty: 2
  question: Which route fits a detainee who still cannot pay the deposit a week after the decision?
  options:
    - A ערר to the Magistrates' Court within 14 days.
    - A petition to the High Court.
    - A request for review (עיון חוזר) at any time.
    - A complaint to the Ombudsman.
  correct: 2
  explanation: 'Section 52(ב): a person held because he cannot provide bail may ask for review at any time.'
- id: m07-072
  module: 7
  lesson: '07.4'
  subject: challenge-routes
  difficulty: 2
  question: What may happen if a released suspect breaks a condition?
  options:
    - Only a written warning the first time it happens.
    - Re-arrest, a forfeited deposit and a s. 287 suspicion.
    - Nothing at all, as long as the breach was short.
    - Automatic conviction for the original offence.
  correct: 1
  explanation: Section 51 of the Arrests Law and Penal Law s. 287.
- id: m07-073
  module: 7
  lesson: '07.5'
  subject: closure-grounds
  difficulty: 1
  question: Which closure ground removes a closed file from the police register?
  options:
    - Lack of guilt (חוסר אשמה).
    - Insufficient evidence.
    - The circumstances do not suit prosecution.
    - Closure by a conditional arrangement.
  correct: 0
  explanation: Criminal Procedure Law s. 62(ב)(4) and Criminal Information Law s. 27(א)(2)(ב).
- id: m07-074
  module: 7
  lesson: '07.5'
  subject: closure-grounds
  difficulty: 2
  question: What replaced the old wording 'חוסר עניין לציבור' in the notice to suspects?
  options:
    - The Seventh Schedule's 'circumstances as a whole' wording.
    - '''Lack of guilt'' for all minor offences from now on.'
    - '''Closure by a conditional arrangement'' (s. 67א).'
    - '''Offender unknown'' for all closed protest files.'
  correct: 0
  explanation: The Seventh Schedule sets the wording for this ground.
- id: m07-075
  module: 7
  lesson: '07.5'
  subject: closure-grounds
  difficulty: 2
  question: Does the closure letter a suspect receives state the ground?
  options:
    - Yes, always, in the first line of the letter.
    - Only when the offence is a felony.
    - No; it says how to find the ground out.
    - Only if the suspect was represented by a lawyer.
  correct: 2
  explanation: Section 62(ב)(1); sex and violence offences are an exception (s. 62(ב)(2)).
- id: m07-076
  module: 7
  lesson: '07.5'
  subject: change-of-grounds
  difficulty: 1
  question: To whom is a request to change closure grounds sent?
  options:
    - The commander of the police station.
    - The prosecutor who closed the file.
    - The Public Complaints Commissioner.
    - The legal office of the President.
  correct: 1
  explanation: Section 62(ב)(4).
- id: m07-077
  module: 7
  lesson: '07.5'
  subject: change-of-grounds
  difficulty: 2
  question: Which argument fits a request to change the ground to lack of guilt?
  options:
    - The cause you protested for was just and important.
    - The police had too few officers at the scene that day.
    - Evidence you did not do it, such as a time-stamped video.
    - The investigation took far too long to complete.
  correct: 2
  explanation: Lack of guilt means you did not commit the offence; the request should show that.
- id: m07-078
  module: 7
  lesson: '07.5'
  subject: change-of-grounds
  difficulty: 3
  question: >-
    Spot the mistake: 'I ask to change the ground to lack of guilt because the prosecution itself
    found the evidence insufficient.'
  options:
    - It should have been addressed to the Magistrates' Court.
    - It restates the current ground instead of showing innocence.
    - It must be filed within 60 days of the closure letter.
    - It must be signed by a lawyer to be considered.
  correct: 1
  explanation: >-
    Insufficient evidence is the ground you already have; you need facts showing you did not commit
    the offence.
- id: m07-079
  module: 7
  lesson: '07.5'
  subject: change-of-grounds
  difficulty: 3
  question: Before writing the request, why might you ask to see the investigation material?
  options:
    - To know what evidence exists and avoid contradicting it.
    - Because the law requires viewing before any request.
    - Because the request is invalid without a copy.
    - Because the file must be reopened before any change.
  correct: 0
  explanation: >-
    Viewing is discretionary but strengthens the request; a lawyer should review if the file is
    sensitive.
- id: m07-080
  module: 7
  lesson: '07.5'
  subject: registers
  difficulty: 1
  question: Which register holds convictions?
  options:
    - The police register.
    - The Population Registry.
    - The court's public archive.
    - The criminal register.
  correct: 3
  explanation: Criminal Information Law s. 8.
- id: m07-081
  module: 7
  lesson: '07.5'
  subject: registers
  difficulty: 2
  question: Where is a file closed for insufficient evidence recorded?
  options:
    - On the criminal register for four years.
    - Nowhere, because there was no conviction.
    - Only in the investigating station's files.
    - On the police register, until cancelled.
  correct: 3
  explanation: Section 27(א)(2).
- id: m07-082
  module: 7
  lesson: '07.5'
  subject: registers
  difficulty: 2
  question: Which law governs criminal records today?
  options:
    - The Criminal Register and Rehabilitation of Offenders Law, 1981.
    - The Criminal Information and Rehabilitation of Offenders Law, 2019.
    - The Protection of Privacy Law, 1981, and its regulations.
    - The Police Ordinance [New Version], 1971, chapter on records.
  correct: 1
  explanation: The 2019 Law, in force since 12.7.2022, repealed the 1981 Law (ss. 56, 58).
- id: m07-083
  module: 7
  lesson: '07.5'
  subject: registers
  difficulty: 3
  question: A probation order was made without a conviction. Is it on the criminal register?
  options:
    - No; only convictions are ever recorded there.
    - Only on the police register, not the criminal one.
    - Yes; such orders are recorded (s. 8(א)(2)).
    - Only if the person later breaches the order.
  correct: 2
  explanation: >-
    Section 8(א)(2) includes probation, community-service and undertaking orders made without
    conviction.
- id: m07-084
  module: 7
  lesson: '07.5'
  subject: cancellation
  difficulty: 1
  question: How long must an adult wait to ask to cancel a closed felony file?
  options:
    - 5 years from the event.
    - 3 years from closure.
    - 7 years from the event.
    - 10 years from closure.
  correct: 2
  explanation: 2009 criteria regulations and the police's page.
- id: m07-085
  module: 7
  lesson: '07.5'
  subject: cancellation
  difficulty: 2
  question: From when are the cancellation periods counted?
  options:
    - From the date the file was closed.
    - From the date of the event investigated.
    - From the date the request is filed.
    - From the suspect's 18th birthday.
  correct: 1
  explanation: The 'determining date' is the event (reg. 1).
- id: m07-086
  module: 7
  lesson: '07.5'
  subject: cancellation
  difficulty: 2
  question: Which is a condition the police check before cancelling a record?
  options:
    - That you have paid a cancellation fee.
    - That the original complainant agrees.
    - That there are no open files against you.
    - That a lawyer signed the request.
  correct: 2
  explanation: >-
    The police page lists no open files and no unexpired criminal-register entries among the
    conditions.
- id: m07-087
  module: 7
  lesson: '07.5'
  subject: cancellation
  difficulty: 3
  question: >-
    A minor's misdemeanour file was closed. When is the earliest request, and when the automatic
    cancellation?
  options:
    - Request after 5 years; automatic after 7 years.
    - Request after 1 year; automatic after 3 years.
    - Request after 3 years; automatic after 5 years.
    - Request after 7 years; no automatic cancellation.
  correct: 2
  explanation: >-
    Regulations: minors 3 years for a misdemeanour on request; s. 33(ג): automatic after 5 years for
    non-felonies of minors.
- id: m07-088
  module: 7
  lesson: '07.5'
  subject: viewing-record
  difficulty: 1
  question: Where can you view your own criminal information?
  options:
    - Only at the station that investigated you.
    - Only online with your national login.
    - Only through a lawyer.
    - At any police station you choose.
  correct: 3
  explanation: Criminal Information Law s. 4 and viewing regulations reg. 2(א).
- id: m07-089
  module: 7
  lesson: '07.5'
  subject: viewing-record
  difficulty: 2
  question: Who may receive a printout of your criminal information?
  options:
    - Any family member you name in writing.
    - Your employer, with your written consent.
    - Anyone who pays the police printing fee.
    - A lawyer with a special power of attorney.
  correct: 3
  explanation: Section 4(ד).
- id: m07-090
  module: 7
  lesson: '07.5'
  subject: viewing-record
  difficulty: 3
  question: You find a closed file shown as 'open' on your record. Which tool fits?
  options:
    - A request to correct an error under s. 7.
    - A request to change closure grounds.
    - A petition to the Administrative Court.
    - A President's pardon request.
  correct: 0
  explanation: Section 7 obliges the police to correct a registration error and notify you.
- id: m07-091
  module: 7
  lesson: '07.5'
  subject: disclosure
  difficulty: 2
  question: Who can shorten the limitation and deletion periods of a conviction?
  options:
    - The police officer in charge.
    - The Minister of Justice.
    - The prosecutor who handled the case.
    - The President.
  correct: 3
  explanation: >-
    Criminal Information Law s. 25; the police page refers such requests to the President's legal
    office.
- id: m07-092
  module: 7
  lesson: '07.5'
  subject: disclosure
  difficulty: 3
  question: A landlord asks a tenant to bring a 'clean record certificate'. What is the legal point?
  options:
    - The tenant must bring a police printout within 30 days.
    - The landlord may ask the police directly for the record.
    - He is not entitled, and closed files need not be disclosed.
    - Only felonies must ever be disclosed to landlords.
  correct: 2
  explanation: Section 37 and the general confidentiality of criminal information (ss. 3, 35).
- id: m08-001
  module: 8
  lesson: '08.1'
  subject: defamation-definition
  difficulty: 1
  question: >-
    Under s. 1 of the Defamation Law, what must a plaintiff show about the harm a publication
    caused?
  options:
    - That the publication actually lowered them in the eyes of at least one reader.
    - That they lost money or work because of the publication.
    - That the publication may humiliate or harm them; actual harm is not required.
    - That the publisher knew the statement was false when it was made.
  correct: 2
  explanation: >-
    Section 1 defines defamation as a matter whose publication "may" (עלול) humiliate, degrade or
    harm a person. The test is the likely effect on a reasonable reader, not proven harm.
- id: m08-002
  module: 8
  lesson: '08.1'
  subject: defamation-definition
  difficulty: 1
  question: Which of these can sue for defamation under the Defamation Law?
  options:
    - A registered company whose products were falsely said to be poisonous.
    - '"The Haredi public", represented by a volunteer organisation.'
    - '"Right-wing voters", through a class action by one voter.'
    - A city's residents, through a petition signed by 500 of them.
  correct: 0
  explanation: >-
    "Person" in s. 1 includes a corporation. Groups that are not corporations have no civil claim
    (s. 4), so an unincorporated public cannot sue.
- id: m08-003
  module: 8
  lesson: '08.1'
  subject: publication
  difficulty: 1
  question: >-
    You send an email accusing a neighbour of theft only to the neighbour himself. Is it a
    publication for a civil defamation claim?
  options:
    - Yes, because any written statement is a publication by definition.
    - Yes, because email is stored on a server owned by a third party.
    - No, because publication requires at least two readers besides the target.
    - No, unless it was likely to reach someone other than him.
  correct: 3
  explanation: >-
    Under s. 2(ב)(2), writing is a publication if it was likely, in the circumstances, to reach
    someone other than the injured person. A private email to the target alone usually is not.
- id: m08-004
  module: 8
  lesson: '08.1'
  subject: publication
  difficulty: 2
  question: >-
    At a closed meeting of a residents' committee, you say aloud that the building contractor
    "steals materials". Two committee members hear it. Which statement is right?
  options:
    - It is a civil publication, and the criminal offence would also need intent to harm.
    - It is not a publication, because spoken words are never defamation.
    - It is not a publication, because the meeting was closed to the public.
    - It is only a criminal matter, because it was said to two or more people.
  correct: 0
  explanation: >-
    Spoken words that reach someone other than the target are a publication (s. 2). The civil wrong
    needs one listener (s. 7); the offence needs two and intent to harm (s. 6).
- id: m08-005
  module: 8
  lesson: '08.1'
  subject: fact-opinion
  difficulty: 2
  question: Which of these statements about a mayor is most clearly an opinion rather than a fact?
  options:
    - '"The mayor took money from the contractor who won the tender."'
    - '"In my opinion, the mayor lied to the council about the budget."'
    - '"The mayor''s decision to close the library was short-sighted and cruel."'
    - '"The mayor''s brother owns the company that won the tender, I believe."'
  correct: 2
  explanation: >-
    A value judgement on a known decision is opinion. "In my opinion he lied" and "I believe his
    brother owns" still state checkable facts.
- id: m08-006
  module: 8
  lesson: '08.1'
  subject: fact-opinion
  difficulty: 2
  question: >-
    A campaign leaflet says: "We think the CEO falsified the emissions data." The CEO's lawyer says
    it is defamation. What is the best analysis?
  options:
    - '"We think" makes it opinion, so it is protected without any further step.'
    - It is opinion if the leaflet goes only to the group's own members and supporters.
    - Falsifying data is a checkable fact; the framing does not remove the need for proof.
    - It is a fact, but only facts about public officials need proof in court.
  correct: 2
  explanation: >-
    Adding "we think" does not convert a factual accusation into opinion. Falsification is a
    checkable fact and needs evidence or another defence.
- id: m08-007
  module: 8
  lesson: '08.1'
  subject: groups-and-dead
  difficulty: 2
  question: >-
    A post says "the leaders of the settlers' council are thieves". The council has seven members,
    all publicly known. Can one member sue?
  options:
    - No, because s. 4 bars every claim about any group of people, however small.
    - Yes, if a reasonable reader would see the post as referring to him personally.
    - No, because public officials can never sue for defamation over their public role.
    - Yes, but only the council itself, as a corporation, can be awarded compensation.
  correct: 1
  explanation: >-
    Section 4 covers groups that are not corporations. But under s. 3 a small, defined group can
    make each member identifiable; a reader may see the post as referring to each of the seven.
- id: m08-008
  module: 8
  lesson: '08.1'
  subject: groups-and-dead
  difficulty: 1
  question: >-
    A blog post falsely accuses a man who died last year of having been a police informer. What does
    the Defamation Law allow his family to do?
  options:
    - Sue for compensation without proof of damage on his behalf, as his heirs.
    - Nothing at all, because the law says the dead cannot be defamed in any way.
    - File a private criminal complaint (קובלנה) in their own names as his family.
    - Ask for an indictment, which the law allows at close family's request.
  correct: 3
  explanation: >-
    Under s. 5, defamation of the dead gives no civil claim or private complaint, but an indictment
    may be filed if the spouse, a child, grandchild, parent or sibling asks for it.
- id: m08-009
  module: 8
  lesson: '08.1'
  subject: civil-criminal
  difficulty: 1
  question: What is a קובלנה in a defamation case?
  options:
    - A criminal prosecution brought by the injured person, not the state.
    - A civil claim heard in the small claims court without a lawyer.
    - A demand letter that must be sent before any defamation lawsuit.
    - A request to the police to remove a post that defames someone.
  correct: 0
  explanation: >-
    Section 8 allows the injured person to prosecute the defamation offence privately by filing a
    קובלנה. It is rarer and harder than a civil claim.
- id: m08-010
  module: 8
  lesson: '08.1'
  subject: civil-criminal
  difficulty: 2
  question: >-
    An activist is reported to the police for a post about a councillor. What must the prosecution
    prove for the criminal offence that a civil plaintiff would not need?
  options:
    - That the councillor lost income or votes because of the post.
    - That the post was read by at least 100 people in the town.
    - That the activist knew the councillor personally before posting.
    - Intent to harm, and publication to two or more people besides him.
  correct: 3
  explanation: >-
    Section 6 requires intent to harm and two recipients; the civil wrong in s. 7 needs one
    recipient and no intent.
- id: m08-011
  module: 8
  lesson: '08.1'
  subject: compensation
  difficulty: 1
  question: >-
    Why is the compensation ceiling for defamation without proof of damage today much higher than
    the ₪50,000 written in s. 7א?
  options:
    - Courts raised it in a 2014 Supreme Court ruling on media defamation.
    - It is linked to the consumer price index from September 1998.
    - The Knesset doubles it every ten years by a dedicated amendment.
    - Lawyers add VAT and their fees to the figure written in the statute.
  correct: 1
  explanation: >-
    Section 7א(ה) updates the amounts every month by the CPI, against the September 1998 index. The
    current figure is in current numbers.
- id: m08-012
  module: 8
  lesson: '08.1'
  subject: compensation
  difficulty: 2
  question: >-
    A plaintiff proves that a defendant published defamation deliberately, to hurt him. What changes
    about compensation without proof of damage?
  options:
    - Nothing; intent to harm matters only in the criminal case.
    - The court must then award the full ceiling, with no discretion.
    - The ceiling doubles, and the court may award up to that amount.
    - The plaintiff may claim it again for every reader who saw it.
  correct: 2
  explanation: >-
    Section 7א(ג) doubles the ceiling where intent to harm is proved. It remains a maximum; s. 7א(ד)
    bars receiving it more than once for the same defamation.
- id: m08-013
  module: 8
  lesson: '08.1'
  subject: online-publication
  difficulty: 2
  question: Under LCA 1239/19, which online action was held to be a publication of defamation?
  options:
    - Sharing another user's defamatory post on Facebook.
    - Liking another user's defamatory post on Facebook.
    - Following the page that published the defamatory post.
    - Viewing the post without reacting to it in any way.
  correct: 0
  explanation: >-
    The courts held that a share actively spreads the post to new readers and is a publication; a
    like is an expression of opinion whose spread depends on the algorithm, and was not held a
    publication.
- id: m08-014
  module: 8
  lesson: '08.1'
  subject: online-publication
  difficulty: 3
  question: >-
    You want to share a post that falsely accuses a rabbi of abuse, in order to criticise the post.
    How do you reduce risk?
  options:
    - Share it as it is; your readers will understand that you disagree with it.
    - Do not share it; write your own post criticising it without its details.
    - Share it with a "?" so that it is clearly a question and not a claim.
    - Share it only to a closed group, where it is not a publication at all.
  correct: 1
  explanation: >-
    Sharing without a clear rejecting frame repeats the defamation. Your own post can criticise the
    claim without spreading its content; a closed group is still a publication.
- id: m08-015
  module: 8
  lesson: '08.1'
  subject: civil-criminal
  difficulty: 1
  question: What is the limitation period for a civil defamation claim, as Kol Zchut summarises it?
  options:
    - One year from the publication.
    - Seven years from the publication.
    - Three years from when the plaintiff learned of it.
    - There is no limitation period for defamation.
  correct: 1
  explanation: >-
    The general Prescription Law applies: seven years from the publication, longer in some cases
    where the plaintiff could not have known of it.
- id: m08-016
  module: 8
  lesson: '08.1'
  subject: defamation-definition
  difficulty: 3
  question: >-
    A leaflet describes "a senior inspector in the Arava office who drives a red jeep" taking gifts
    from farmers, without naming him. Only one inspector fits. What follows?
  options:
    - No claim, because no name was published anywhere in the leaflet.
    - A claim only if the inspector proves that the farmers recognised him.
    - A claim only by the ministry, as his employer and a corporation.
    - 'A claim is possible: he is identifiable from the context.'
  correct: 3
  explanation: >-
    Section 3 says it makes no difference whether the defamation and its reference to the person are
    express or implied from the publication or outside circumstances.
- id: m08-017
  module: 8
  lesson: '08.1'
  subject: fact-opinion
  difficulty: 3
  question: >-
    Spot the riskiest sentence in this draft post about a hospital: (A) "Waiting times in the ER
    reached 9 hours last month, per the ministry's data." (B) "This is a disgrace." (C) "The
    director falsifies the waiting-time reports." (D) "Patients deserve better."
  options:
    - A, because it quotes government data about a named hospital.
    - B, because "disgrace" is an insult to the hospital.
    - C, because it is a factual accusation of dishonesty against a person.
    - D, because it implies the staff do not care about patients.
  correct: 2
  explanation: >-
    C accuses an identifiable person of falsification, a fact needing proof. A is sourced data, B
    and D are opinions on stated facts.
- id: m08-018
  module: 8
  lesson: '08.2'
  subject: permitted-publications
  difficulty: 1
  question: Which publication can never ground a defamation claim under s. 13?
  options:
    - An activist's speech at a public rally about a minister.
    - A witness's testimony in court proceedings.
    - A newspaper editorial about a judge.
    - A post by an MK on her private Facebook account.
  correct: 1
  explanation: >-
    Section 13(5) covers publications by judges, parties, lawyers and witnesses in the course of
    proceedings. An MK's Facebook post is not automatically within parliamentary immunity.
- id: m08-019
  module: 8
  lesson: '08.2'
  subject: permitted-publications
  difficulty: 2
  question: >-
    Your group posts an accurate summary of what a witness said in a public court hearing about a
    developer. The developer sues. Which provision protects you?
  options:
    - 's. 13(7): a fair and accurate report of a public court hearing.'
    - 's. 14: truth, because the witness said it under oath.'
    - 's. 15(8): a complaint to a competent authority.'
    - None, because only journalists may report on court hearings.
  correct: 0
  explanation: >-
    A fair and accurate report of a public hearing is a permitted publication, unless publication
    was barred. You do not need to prove the witness was right.
- id: m08-020
  module: 8
  lesson: '08.2'
  subject: truth-defence
  difficulty: 1
  question: What two conditions must the truth defence in s. 14 meet?
  options:
    - The statement was true and the publisher honestly believed it.
    - The statement was true and was published in a newspaper or broadcast.
    - The publisher checked the facts and gave the subject a right of reply.
    - The statement was true and publishing it was in the public interest.
  correct: 3
  explanation: >-
    Section 14 requires truth and public interest. Belief and checking belong to good faith (ss.
    15–16).
- id: m08-021
  module: 8
  lesson: '08.2'
  subject: truth-defence
  difficulty: 2
  question: >-
    A post accurately reports that a council member was convicted of fraud ten years ago, in a
    thread about his candidacy for mayor. Does the truth defence fit?
  options:
    - No, because old convictions are private and never in the public interest.
    - 'Yes, likely: it is true and relevant to a candidate for public office.'
    - No, because only the court may publish a conviction.
    - Yes, but only if the post also states his rehabilitation.
  correct: 1
  explanation: >-
    True facts about a candidate's integrity are usually of public interest. (Criminal-record rules
    limit what authorities disclose, not what is already public.)
- id: m08-022
  module: 8
  lesson: '08.2'
  subject: truth-defence
  difficulty: 3
  question: >-
    You proved that a factory dumped waste on 12 nights. Your post said "every night for a year".
    The factory sues. What is the risk?
  options:
    - None, because the year is an incidental detail under s. 14.
    - None, because environmental issues always meet the public-interest test.
    - The court may find the sting exaggerated, so truth may not cover the post.
    - Only the criminal route is open, since the core was true.
  correct: 2
  explanation: >-
    The incidental-detail rule protects only details that do no real harm. "Every night for a year"
    changes the sting, so the defence may fail for the exaggeration.
- id: m08-023
  module: 8
  lesson: '08.2'
  subject: good-faith
  difficulty: 1
  question: Under s. 16(א), when is a publisher presumed to have acted in good faith?
  options:
    - In a s. 15 circumstance, without exceeding what was reasonable.
    - Whenever the publisher honestly believes that the statement is true.
    - Whenever the target of the publication is a public figure or official.
    - When the publication was removed within 24 hours of a complaint.
  correct: 0
  explanation: The presumption needs both a s. 15 circumstance and staying within reasonable bounds.
- id: m08-024
  module: 8
  lesson: '08.2'
  subject: presumptions
  difficulty: 2
  question: Which situation creates a presumption of bad faith under s. 16(ב)?
  options:
    - The publisher was angry when writing the post and used harsh words.
    - The statement was false and was not reasonably checked first.
    - The publisher belongs to a political party opposing the target's party.
    - The publication reached more than 10,000 people on social media.
  correct: 1
  explanation: >-
    Section 16(ב)(2) presumes bad faith where the statement was false and no reasonable checking was
    done. Anger or politics alone do not.
- id: m08-025
  module: 8
  lesson: '08.2'
  subject: opinion-defence
  difficulty: 2
  question: >-
    A columnist writes that a minister's handling of a crisis "shows contempt for citizens". The
    facts behind the opinion are described in the column and are true. Which defence fits?
  options:
    - 's. 13(3): publications made by the government or a minister.'
    - 's. 15(10): a publication made only to deny earlier defamation.'
    - 's. 15(4): opinion on conduct in a public role.'
    - No defence is needed, since ministers cannot sue for defamation.
  correct: 2
  explanation: >-
    Section 15(4) protects opinions on conduct in an official or public role, based on facts that
    are true and known.
- id: m08-026
  module: 8
  lesson: '08.2'
  subject: opinion-defence
  difficulty: 3
  question: >-
    A post says: "Given that the rabbi hid a sex offender in his yeshiva, he is unfit to lead." The
    "hid a sex offender" claim is false. Why does the opinion defence fail?
  options:
    - Because opinions about religious leaders are never protected.
    - Because the word "unfit" is too harsh for a protected opinion.
    - Because the post was published after a court case began.
    - Because the opinion rests on a false factual claim stated in the post.
  correct: 3
  explanation: >-
    Opinion is protected when it is based on true facts. An opinion built on a false accusation does
    not cure the accusation.
- id: m08-027
  module: 8
  lesson: '08.2'
  subject: complaint-defence
  difficulty: 1
  question: Which complaint is protected by s. 15(8)?
  options:
    - A good-faith complaint to the Ombudsman about a clerk's conduct.
    - A complaint posted on the clerk's personal Facebook page for all to see.
    - A complaint sent by letter to all of the clerk's neighbours on the street.
    - A complaint published as a paid advertisement in the local newspaper.
  correct: 0
  explanation: >-
    Section 15(8) protects complaints to a person who supervises the target or to the authority
    competent to deal with the matter — not other publications of the complaint.
- id: m08-028
  module: 8
  lesson: '08.2'
  subject: complaint-defence
  difficulty: 2
  question: >-
    You suspect a school principal of hiding abuse reports. Which channel gives you the strongest
    protection for raising it?
  options:
    - A detailed post in the school's parents' WhatsApp group.
    - A letter to the readers' column of the local newspaper.
    - A complaint to the ministry's supervisor and the police.
    - A large sign outside the school gate during pick-up time.
  correct: 2
  explanation: >-
    A complaint to the supervising and investigating authorities is protected by s. 15(8) if made in
    good faith; public posts need a separate defence.
- id: m08-029
  module: 8
  lesson: '08.2'
  subject: good-faith
  difficulty: 2
  question: >-
    A tenant warns other tenants in the building, by a note in their letterboxes, that the cleaner
    they all employ took cash from her flat, based on a camera recording. Which head of s. 15 best
    fits?
  options:
    - 's. 15(6): criticism of a public work or an act done in public.'
    - 's. 15(3): protecting a legitimate interest of those addressed.'
    - 's. 15(12): a live radio or television broadcast not recorded in advance.'
    - 's. 15(11): passing information to an editor so that it may be checked.'
  correct: 1
  explanation: >-
    Warning people who share an interest in the matter can fall under s. 15(3) (or (2)), if done in
    good faith and within reasonable bounds.
- id: m08-030
  module: 8
  lesson: '08.2'
  subject: good-faith
  difficulty: 3
  question: >-
    In Anonymous v. Orbach (CFH 2121/12), what did the Supreme Court say a publisher on a matter of
    significant public interest needs, to be protected under good faith even if a fact turns out
    wrong?
  options:
    - A press licence from the Government Press Office for the publisher.
    - A prior court approval of the publication before it goes out.
    - Proof that the person written about is a public figure or official.
    - Strict responsible-journalism standards, including verification.
  correct: 3
  explanation: >-
    The Court recognised protection under the duty-to-inform head, s. 15(2), for publication meeting
    strict criteria of responsible journalism on matters of significant public interest.
- id: m08-031
  module: 8
  lesson: '08.2'
  subject: correction-apology
  difficulty: 1
  question: What does s. 19 allow a court to consider in the defendant's favour?
  options:
    - An unconditional apology or correction, in the same place and manner.
    - A private apology sent only to the plaintiff's lawyer by email.
    - Removal of the post after the claim was filed, with no comment at all.
    - The defendant's political motive or cause for publishing the post.
  correct: 0
  explanation: >-
    Section 19(4) covers an apology, correction or denial published in the same place, extent and
    manner, without reservations, or steps to stop distribution.
- id: m08-032
  module: 8
  lesson: '08.2'
  subject: correction-apology
  difficulty: 2
  question: >-
    Spot the mistake in this correction: "We apologise if anyone was hurt by our post, although
    everything in it was true. We stand by our words."
  options:
    - It does not name the platform on which the original post appeared.
    - It is conditional and reaffirms the claim, so it is no real correction.
    - It was published too soon after the original post to count legally.
    - It should have been sent privately, only to the plaintiff's lawyer.
  correct: 1
  explanation: >-
    Section 19 mitigation needs an unconditional apology or correction. A "sorry, but it was true"
    text helps neither side; decide whether to stand by it or correct it.
- id: m08-033
  module: 8
  lesson: '08.2'
  subject: truth-defence
  difficulty: 2
  question: >-
    Which evidence is most useful for proving the truth of "the municipality paid ₪1 million without
    a tender"?
  options:
    - Screenshots of residents' comments on Facebook saying so.
    - A news article quoting an anonymous source in the municipality.
    - A council member's public statement that "everyone knows it".
    - The municipality's FOI answer showing payment and method.
  correct: 3
  explanation: >-
    An official document is admissible and directly proves the sting. Rumours, anonymous sources and
    comments do not.
- id: m08-034
  module: 8
  lesson: '08.2'
  subject: permitted-publications
  difficulty: 3
  question: >-
    An activist copies, accurately, an entry from the public Companies Register showing that a
    minister's spouse is a director of a company receiving state grants. Which statement is right?
  options:
    - A fair copy of a public register is a permitted publication under s. 13(10).
    - It is protected only if the activist also proves wrongdoing by the minister.
    - It is a privacy invasion, so the Defamation Law defences do not apply.
    - Only journalists may republish register entries.
  correct: 0
  explanation: >-
    Section 13(10) protects a correct and fair copy or summary of a register open to the public by
    law. Any added accusation needs its own defence.
- id: m08-035
  module: 8
  lesson: '08.2'
  subject: presumptions
  difficulty: 3
  question: >-
    A group publishes a true report on a hospital's failures but adds the director's home address
    and the comment "let her feel what patients feel". Why may the good-faith defence fail for that
    part?
  options:
    - Because the report was true, so good faith is not relevant to any part.
    - Because hospitals are public bodies that cannot be criticised by name.
    - Because it aims to harm more than is reasonable to protect s. 15 values.
    - Because the good-faith defence applies only to professional journalists.
  correct: 2
  explanation: >-
    Section 16(ב)(3) presumes bad faith where the publisher intended to harm more than was
    reasonable. The address and comment add harm, not information, and raise privacy and threat
    issues too.
- id: m08-036
  module: 8
  lesson: '08.3'
  subject: demand-letter-triage
  difficulty: 1
  question: Is there a legal duty to answer a lawyer's demand letter about defamation?
  options:
    - Yes, within the deadline the letter sets, or you lose your defences.
    - Yes, within 30 days under the Civil Procedure Regulations.
    - No legal duty, though a short reply is usually wise.
    - No, and answering it is always an admission of liability.
  correct: 2
  explanation: >-
    A demand letter is not a court document; its deadline binds no one. A short, careful reply often
    helps resolve the matter and shows good faith.
- id: m08-037
  module: 8
  lesson: '08.3'
  subject: demand-letter-triage
  difficulty: 1
  question: What is the correct order of the first steps after receiving a demand letter?
  options:
    - Reply, then archive, then analyse.
    - Delete the post, then reply, then archive.
    - Analyse, then delete, then reply.
    - Archive, then analyse, then decide and reply.
  correct: 3
  explanation: >-
    Preserve the publication first, then run the defamation and defence analysis, then choose an
    option and reply in writing.
- id: m08-038
  module: 8
  lesson: '08.3'
  subject: reply-strategy
  difficulty: 2
  question: What does marking a reply "בלי לפגוע בזכויות" mean?
  options:
    - The reply reserves your rights and arguments and is not a waiver.
    - The reply cannot be shown to a court under any circumstances.
    - The reply is confidential and the other side may not quote it.
    - The reply admits the facts but not the legal claims.
  correct: 0
  explanation: >-
    The phrase signals that nothing in the letter waives your rights or arguments. It does not make
    the letter secret or inadmissible in every case.
- id: m08-039
  module: 8
  lesson: '08.3'
  subject: reply-strategy
  difficulty: 2
  question: >-
    Spot the mistake in this reply to a demand letter: "Without prejudice. Your client is a liar and
    a crook, as everyone in town knows. I copy this letter to the 3,000 members of our group."
  options:
    - It is not signed with the writer's ID number, as replies must be.
    - 'It repeats and widens the accusation: a new publication.'
    - It was sent by email instead of by registered mail with confirmation.
    - It does not demand that the other side pay the legal costs so far.
  correct: 1
  explanation: >-
    Copying the reply to 3,000 people and adding insults is a fresh publication of defamation. Reply
    only to the sender, briefly and politely.
- id: m08-040
  module: 8
  lesson: '08.3'
  subject: reply-strategy
  difficulty: 3
  question: >-
    Your post was accurate, but one sentence called the plaintiff "a criminal" without proof. Which
    option fits best?
  options:
    - Stand by the whole post, because most of it is true.
    - Apologise for the whole post and promise never to write about him.
    - Correct the one sentence without admission and stand by the rest.
    - Pay a small amount to end the matter before the deadline.
  correct: 2
  explanation: >-
    Choose per sentence: correct what you cannot prove, keep what you can. A promise of silence and
    early payment give up more than needed.
- id: m08-041
  module: 8
  lesson: '08.3'
  subject: court-deadlines
  difficulty: 1
  question: >-
    How long do you have to file a statement of defence in the Magistrates' Court after a statement
    of claim is served on you?
  options:
    - 7 days, matching the usual deadline in a demand letter.
    - 30 days, like an appeal against a decision of an authority.
    - 45 days, like an administrative petition against a decision.
    - 60 days, unless the court extends it.
  correct: 3
  explanation: >-
    Civil Procedure Regulations 2018, reg. 9(ב): 60 days from service, extendable by the court.
    Small claims have their own procedure.
- id: m08-042
  module: 8
  lesson: '08.3'
  subject: court-deadlines
  difficulty: 2
  question: >-
    You ignore a defamation claim that was served on you, thinking it is just another threat. What
    is the main risk?
  options:
    - The court may give judgment against you without a hearing.
    - The plaintiff must send you a second demand letter first.
    - Nothing happens until you are arrested.
    - The claim expires after 30 days if you do not answer.
  correct: 0
  explanation: >-
    Failing to file a defence on time can lead to judgment in default. If that happens, apply at
    once to set it aside with reasons.
- id: m08-043
  module: 8
  lesson: '08.3'
  subject: slapp-signs
  difficulty: 1
  question: What does SLAPP stand for?
  options:
    - Strategic Lawsuit Against Public Participation.
    - Statutory Limit on Awards for Public Posts.
    - Special Litigation Against Private Persons.
    - Summary Libel Action for Public Protection.
  correct: 0
  explanation: >-
    A SLAPP (תביעת השתקה) is a lawsuit whose main aim is to silence participation in public debate,
    not to win compensation.
- id: m08-044
  module: 8
  lesson: '08.3'
  subject: slapp-signs
  difficulty: 2
  question: Which feature is most typical of a SLAPP?
  options:
    - A modest claim by an individual neighbour over a personal insult.
    - A claim filed by a public authority against a large private company.
    - A maximum-sum claim by a powerful party against many critics.
    - A claim over a publication that the defendant has already corrected.
  correct: 2
  explanation: >-
    SLAPP signs include a powerful plaintiff, public-participation speech, high sums, many
    defendants and timing linked to a campaign milestone.
- id: m08-045
  module: 8
  lesson: '08.3'
  subject: slapp-tools
  difficulty: 2
  question: >-
    Under the Civil Procedure Regulations, on which ground can a court strike out a claim at the
    threshold?
  options:
    - The defendant is an activist acting in the public interest.
    - The claim is vexatious on its face or discloses no cause of action.
    - The plaintiff did not send a demand letter first.
    - The claim was filed in a district far from the defendant.
  correct: 1
  explanation: >-
    Reg. 41(א) allows striking out a claim that discloses no cause of action or is vexatious; reg.
    42 adds abuse of process.
- id: m08-046
  module: 8
  lesson: '08.3'
  subject: slapp-tools
  difficulty: 2
  question: What can a court do under reg. 151(ג) when a plaintiff abused the process?
  options:
    - Order the plaintiff to pay costs to the injured party or the state.
    - Award the defendant compensation equal to the full sum the plaintiff claimed.
    - Bar the plaintiff from ever filing another claim in any court.
    - Refer the plaintiff to the police for prosecution for abuse of process.
  correct: 0
  explanation: >-
    Reg. 151(ג) allows costs against a party that abused the process. Compensation up to the claim
    amount was only proposed in bill P/6532/25.
- id: m08-047
  module: 8
  lesson: '08.3'
  subject: anti-slapp-bills
  difficulty: 1
  question: What would bill P/6515/25 (2026) change in the Defamation Law?
  options:
    - Add a duty to send a demand letter before suing.
    - Create a special SLAPP court.
    - Make defamation a criminal offence only.
    - Replace ₪50,000 with ₪1,000 in s. 7א.
  correct: 3
  explanation: >-
    MK Tali Gottlieb's bill would cut compensation without proof of damage from ₪50,000 (CPI-linked)
    to ₪1,000. It was tabled on 26.1.2026 and had no preliminary reading.
- id: m08-048
  module: 8
  lesson: '08.3'
  subject: anti-slapp-bills
  difficulty: 2
  question: What is the status of the 2026 anti-SLAPP bills P/6515/25 and P/6532/25 on 13.10.2026?
  options:
    - Both passed into law in July 2026 and now apply to all new claims.
    - P/6532/25 passed a first reading and continues automatically.
    - Both were only tabled, and lapse unless tabled again.
    - Both were struck down by the High Court before reaching a vote.
  correct: 2
  explanation: >-
    The Knesset database shows both at the "tabled for preliminary discussion" stage. The Knesset
    dissolved on 17.7.2026, and a private bill without a first reading does not carry over.
- id: m08-049
  module: 8
  lesson: '08.3'
  subject: anti-slapp-bills
  difficulty: 2
  question: Which proposal is in bill P/6532/25 (MK Keti Shitrit)?
  options:
    - A ₪1,000 cap for online comments, and costs for abuse.
    - Abolishing the criminal defamation offence in s. 6 of the law.
    - A duty on platforms to remove defamatory comments within 48 hours.
    - Unmasking anonymous commenters by court order on a plaintiff's request.
  correct: 0
  explanation: >-
    The bill would add s. 7א(ד1), capping compensation for a comment at ₪1,000, and s. 7ב on abuse
    of process. It remained a tabled bill.
- id: m08-050
  module: 8
  lesson: '08.3'
  subject: slapp-signs
  difficulty: 3
  question: >-
    Twelve residents receive identical letters over comments in a planning dispute. What is the best
    way for them to respond?
  options:
    - Each replies alone, in their own words, to show independence.
    - They agree the facts together, consult one clinic, and reply consistently.
    - They post the letters online with comments about the company's owner.
    - They all delete their comments and do not reply.
  correct: 1
  explanation: >-
    Coordinated, consistent replies based on agreed facts avoid contradictions and share the cost of
    advice. Posting attacks on the owner creates new risk.
- id: m08-051
  module: 8
  lesson: '08.3'
  subject: reply-strategy
  difficulty: 3
  question: >-
    A demand letter asks you to promise "not to publish anything about our client in the future".
    What is the best response?
  options:
    - Agree, since it costs nothing and is the fastest way to end the dispute.
    - Agree to it, but only for one year from the date of the letter.
    - Refuse to answer the letter at all, so as not to engage with it.
    - Decline it; at most, agree not to repeat one specific sentence.
  correct: 3
  explanation: >-
    A general promise of silence gives up lawful criticism. Limiting any undertaking to a specific
    unprovable sentence protects your future speech.
- id: m08-052
  module: 8
  lesson: '08.3'
  subject: demand-letter-triage
  difficulty: 3
  question: >-
    The letter demands ₪169,000 within 7 days. Your evidence is strong, but the plaintiff is
    wealthy. Which is the most accurate statement?
  options:
    - Only a court can order you to pay; the letter's figure is not binding.
    - You must pay half within the 7 days to keep your defences open later.
    - The figure is fixed by law, and the court will award all of it if you lose.
    - Wealthy plaintiffs cannot claim compensation without proof of damage.
  correct: 0
  explanation: >-
    The figure is usually the doubled s. 7א ceiling, a maximum rather than a fixed award. Only a
    court judgment creates a duty to pay.
- id: m08-053
  module: 8
  lesson: '08.3'
  subject: court-deadlines
  difficulty: 2
  question: Which court hears a defamation claim of ₪30,000 against an individual?
  options:
    - The District Court, which is where all defamation cases are heard.
    - The Supreme Court, because freedom of speech is a constitutional matter.
    - Small claims if within its ceiling, otherwise the Magistrates' Court.
    - Only the Labour Court, which hears every claim between two individuals.
  correct: 2
  explanation: >-
    The court depends on the amount: small claims up to its ceiling (current numbers), the
    Magistrates' Court above it. The Labour Court hears it only if it arises from employment.
- id: m08-054
  module: 8
  lesson: '08.4'
  subject: privacy-acts
  difficulty: 1
  question: Which act is an invasion of privacy under s. 2?
  options:
    - Photographing a minister giving a speech at a public rally.
    - Filming people inside their home through a window.
    - Quoting an official's public statement in a newspaper.
    - Filming a crowd at a protest in a public square.
  correct: 1
  explanation: >-
    Section 2(3) covers photographing a person in a private place. Public speeches and crowds in
    public places are not covered.
- id: m08-055
  module: 8
  lesson: '08.4'
  subject: privacy-acts
  difficulty: 1
  question: >-
    What is the maximum penalty for deliberately invading privacy in most of the ways listed in s.
    2?
  options:
    - A fine only.
    - One year's imprisonment.
    - Five years' imprisonment.
    - Ten years' imprisonment.
  correct: 2
  explanation: >-
    Section 5 makes deliberate invasion under s. 2(1), (3)–(7) and (9)–(11) an offence punishable by
    five years.
- id: m08-056
  module: 8
  lesson: '08.4'
  subject: privacy-acts
  difficulty: 2
  question: >-
    A protest group publishes that a named opposing activist is undergoing psychiatric treatment.
    What is the main legal problem?
  options:
    - Defamation only, and only if the information turns out to be false.
    - None at all, as long as the information about her is true.
    - Incitement, because it encourages others to attack the activist.
    - Publishing health details is a privacy invasion even if true.
  correct: 3
  explanation: >-
    Section 2(11) covers publishing matters about a person's health or intimate life. Truth is not a
    defence to privacy invasion; public interest might be, but rarely for a private activist's
    health.
- id: m08-057
  module: 8
  lesson: '08.4'
  subject: privacy-defences
  difficulty: 1
  question: Which defence covers a passer-by who appears in your photo of a street protest?
  options:
    - Incidental appearance in a public-place photo (s. 18(2)(ה)).
    - The permitted publications in s. 13 of the Defamation Law.
    - The exemption for security authorities in s. 19 of the Privacy Law.
    - There is no defence; you must get the passer-by's written consent.
  correct: 0
  explanation: >-
    Section 18(2)(ה) protects photos taken in a public place in which the person appears
    incidentally.
- id: m08-058
  module: 8
  lesson: '08.4'
  subject: privacy-defences
  difficulty: 2
  question: >-
    What is the condition attached to the public-interest defence in s. 18(3) when the invasion was
    by publication?
  options:
    - The publication must be approved by the Privacy Protection Authority.
    - The publication must not be false.
    - The target must be a public official.
    - The publication must be in a newspaper.
  correct: 1
  explanation: >-
    Section 18(3) protects an invasion justified by public interest, provided that if it was a
    publication, it was not false.
- id: m08-059
  module: 8
  lesson: '08.4'
  subject: photos-protests
  difficulty: 3
  question: >-
    A volunteer films an injured woman lying on the ground after police dispersed a protest, her
    face visible, and wants to post it to show police violence. What is the best decision?
  options:
    - Post as is, because police violence is a public interest.
    - Do not post anything about the incident.
    - Post with her face blurred, or with her consent.
    - Post only to a closed group, which is not a publication.
  correct: 2
  explanation: >-
    Section 2(4א) covers identifiable photos of a victim at or just after an incident. Blurring
    keeps the evidence of police conduct while protecting her.
- id: m08-060
  module: 8
  lesson: '08.4'
  subject: photos-protests
  difficulty: 2
  question: Which caption on a close-up of a counter-protester creates the highest privacy risk?
  options:
    - '"Counter-protesters gathered at the corner."'
    - '"Hundreds marched on Saturday."'
    - '"The crowd at Habima Square."'
    - '"Meet the village idiot of the right."'
  correct: 3
  explanation: >-
    Publishing a photo in circumstances that may humiliate the person is an invasion under s. 2(4).
    Neutral captions on crowd shots are not.
- id: m08-061
  module: 8
  lesson: '08.4'
  subject: private-messages
  difficulty: 2
  question: >-
    A leaked email from a ministry official to a lobbyist shows the official promising a permit in
    return for a job for her son. A group wants to publish it. What is the best analysis?
  options:
    - Using a private letter is an invasion, but public interest can justify it.
    - It is forbidden in all cases, because emails are always private letters.
    - It is allowed in all cases, because public officials have no privacy.
    - It is allowed only after the official is convicted of an offence.
  correct: 0
  explanation: >-
    Using a private letter without permission is an invasion, but public interest can justify it if
    the publication is not false. Evidence of corruption is a strong case; still, take advice first.
- id: m08-062
  module: 8
  lesson: '08.4'
  subject: private-messages
  difficulty: 3
  question: >-
    Someone hacked an activist's phone and sends you her private chats. You want to publish them to
    show her group's internal disputes. What is the main problem?
  options:
    - None, since you did not hack the phone yourself and only received the chats.
    - Only a copyright problem, because the chats are her own written texts.
    - Passing on what was obtained by a privacy invasion is itself one.
    - Only a platform-rules problem, since WhatsApp forbids sharing chats.
  correct: 2
  explanation: >-
    Section 2(10) covers publishing or passing on anything obtained by an invasion under s. 2(1)–(7)
    or (9). Internal disputes are rarely a public interest that justifies it.
- id: m08-063
  module: 8
  lesson: '08.4'
  subject: amendment-13
  difficulty: 1
  question: When did Amendment 13 to the Protection of Privacy Law take effect?
  options:
    - 1 January 2024.
    - 14 August 2025.
    - 1 October 2026.
    - It has not yet taken effect.
  correct: 1
  explanation: >-
    Amendment 13 (ס"ח תשפ"ד 1430) took effect on 14.8.2025, giving the Authority wider powers and
    new definitions.
- id: m08-064
  module: 8
  lesson: '08.4'
  subject: amendment-13
  difficulty: 1
  question: Under the amended s. 3, which of these is "information of special sensitivity"?
  options:
    - A person's email address.
    - A person's city of residence.
    - A person's political opinions.
    - A person's first name.
  correct: 2
  explanation: >-
    The list includes political opinions, religious beliefs, health, sex life, origin, criminal
    past, biometrics, location data and more.
- id: m08-065
  module: 8
  lesson: '08.4'
  subject: amendment-13
  difficulty: 2
  question: Which collection is outside the definition of "database" after Amendment 13?
  options:
    - A campaign's Google Sheet of its volunteers and their phones.
    - An NGO's donor list kept in a CRM system in the cloud.
    - A party branch's WhatsApp community export of its members.
    - A purely personal contacts list on your phone.
  correct: 3
  explanation: >-
    The definition excludes a collection for personal use not for business purposes. Organisational
    lists are databases.
- id: m08-066
  module: 8
  lesson: '08.4'
  subject: own-lists
  difficulty: 2
  question: Which group must register its database with the Privacy Protection Authority after Amendment 13?
  options:
    - A company selling lists of 50,000 people to campaigns.
    - A local protest group with 2,000 supporters on a list.
    - A synagogue's list of 300 members and their families.
    - A sports club's list of the 800 parents of its players.
  correct: 0
  explanation: >-
    Registration is required for databases whose main purpose is passing data to others for payment
    with over 10,000 people, and for public bodies (s. 8א(א)). Other duties still apply to everyone.
- id: m08-067
  module: 8
  lesson: '08.4'
  subject: own-lists
  difficulty: 2
  question: >-
    What must a group tell people when it asks for their personal information for its database (s.
    11)?
  options:
    - Only the group's registration number with the Privacy Protection Authority.
    - Voluntariness, purpose, controller, recipients and access rights.
    - Only that the information will be kept secure and not sold to anyone.
    - Nothing at all, if the form is on the group's own website.
  correct: 1
  explanation: >-
    Section 11 requires notice of whether there is a duty to give the data, the purpose, the
    controller and contact, recipients, and the rights of access and correction.
- id: m08-068
  module: 8
  lesson: '08.4'
  subject: own-lists
  difficulty: 3
  question: >-
    Spot the mistake in this volunteer form: "Name, phone, ID number, party you voted for, email.
    Your details will be used for this campaign."
  options:
    - It asks for an email address, which counts as sensitive information.
    - It names the campaign, which reveals the group's political position.
    - It collects unneeded ID numbers and votes, and the notice is partial.
    - It does not ask for the volunteer's home address for deliveries.
  correct: 2
  explanation: >-
    Collect only what the purpose needs; voting choice is sensitive and ID numbers unnecessary. The
    notice also lacks voluntariness, controller, recipients and access rights (s. 11).
- id: m08-069
  module: 8
  lesson: '08.4'
  subject: access-rights
  difficulty: 1
  question: Which right does s. 13 give you?
  options:
    - To see the personal information about you held in a database.
    - To see all the internal documents of any public authority in Israel.
    - To demand that a newspaper publish your response to an article.
    - To receive compensation for any use of your data by any body.
  correct: 0
  explanation: >-
    Section 13 gives access to personal information about you in a database; s. 14 lets you ask to
    correct or delete it. Public documents in general fall under the FOI Law.
- id: m08-070
  module: 8
  lesson: '08.4'
  subject: access-rights
  difficulty: 2
  question: After a campaign texts you, you want to know how it got your number. Which first step fits best?
  options:
    - File an FOI request with the campaign under the Freedom of Information Law.
    - Sue the campaign in the small claims court immediately for compensation.
    - Ask the Magistrates' Court for a restraining order against the campaign.
    - Send the campaign a s. 13 request for the data and its source.
  correct: 3
  explanation: >-
    A s. 13 request creates a record and may reveal the source. FOI applies to public authorities,
    not campaigns; a lawsuit or order comes later if needed.
- id: m08-071
  module: 8
  lesson: '08.4'
  subject: ppa-complaint
  difficulty: 1
  question: Can you complain to the Privacy Protection Authority anonymously?
  options:
    - No, the Authority requires your full ID number on every complaint.
    - Yes, though it may then be harder to investigate.
    - Only through a lawyer who files the complaint in their own name.
    - Only for complaints about government bodies, not about private ones.
  correct: 1
  explanation: The Authority's public-complaints page says you may complain anonymously.
- id: m08-072
  module: 8
  lesson: '08.4'
  subject: ppa-complaint
  difficulty: 2
  question: In which case is the Privacy Protection Authority likely not to investigate your complaint?
  options:
    - The complaint is about a private company's database.
    - The complaint includes screenshots.
    - The same matter is already pending before a court.
    - You attached your earlier request to the company.
  correct: 2
  explanation: >-
    The Authority lists matters pending in or decided by a court among the cases it may not
    investigate, as well as requests for legal advice.
- id: m08-073
  module: 8
  lesson: '08.4'
  subject: ppa-complaint
  difficulty: 2
  question: What should you attach to a complaint to the Privacy Protection Authority about a company?
  options:
    - Your earlier request to the company and its answer.
    - A lawyer's written opinion that the company broke the law.
    - A court decision finding that the company breached privacy.
    - Nothing; the Authority collects all the evidence on its own.
  correct: 0
  explanation: The Authority asks complainants to attach their approach to the body and its response.
- id: m08-074
  module: 8
  lesson: '08.4'
  subject: privacy-compensation
  difficulty: 2
  question: How is the compensation ceiling for privacy invasion without proof of damage (s. 29א) updated?
  options:
    - It is fixed at ₪50,000 in the statute and never changes.
    - The Privacy Protection Authority sets a new figure each year.
    - It follows the Defamation Law's indexed figure exactly.
    - It is CPI-linked to May 2007 and updated monthly.
  correct: 3
  explanation: >-
    Section 29א(ד) links the amounts to the CPI against the May 2007 index, so the figure differs
    from the Defamation Law's (September 1998 base).
- id: m08-075
  module: 8
  lesson: '08.4'
  subject: privacy-compensation
  difficulty: 3
  question: >-
    A rival campaign's blog publishes your medical history and your employer's name. You want the
    post removed, the leak investigated and compensation. Which combination is right?
  options:
    - Authority complaint for the money; a police complaint for removal.
    - Platform for removal; court for money; Authority for database misuse.
    - A restraining order for the money; the Authority for the removal.
    - A single High Court petition against the group for all three.
  correct: 1
  explanation: >-
    Platforms remove content; courts award compensation (s. 29א, and defamation); the Authority
    enforces database rules and does not award money.
- id: m08-076
  module: 8
  lesson: '08.5'
  subject: evidence-preservation
  difficulty: 1
  question: Which item is most important to record with a screenshot of a harassing post?
  options:
    - The direct URL of the post, and the date and time.
    - The number of likes on your own posts on the same day.
    - The reply you wrote to the harasser under the post.
    - The harasser's other, unrelated posts from that week.
  correct: 0
  explanation: >-
    The URL, account and time let the platform, police or court find and verify the content even
    after it changes.
- id: m08-077
  module: 8
  lesson: '08.5'
  subject: evidence-preservation
  difficulty: 2
  question: Why should you preserve before you report a harassing post?
  options:
    - Platforms refuse to accept reports that have no screenshots attached.
    - The police require two printed copies of every post in a complaint.
    - Once removed, it may no longer be available as evidence.
    - Reporting a post before saving it counts as an admission in court.
  correct: 2
  explanation: >-
    Removal is the goal, but evidence disappears with it. Preserve first so a complaint or
    restraining order can still be supported.
- id: m08-078
  module: 8
  lesson: '08.5'
  subject: platform-routes
  difficulty: 1
  question: >-
    A false accusation does not break a platform's community rules. Which channel is designed for
    content illegal under local law?
  options:
    - The in-app "spam" report under the post.
    - Blocking the account so you no longer see it.
    - The platform's advertising and business help centre.
    - The platform's legal-removal (local-law) channel.
  correct: 3
  explanation: >-
    Google's "report content for legal reasons" form and Meta's local-law restrictions exist for
    content illegal in a specific country, such as defamation.
- id: m08-079
  module: 8
  lesson: '08.5'
  subject: restraining-order
  difficulty: 1
  question: Where do you apply for a צו מניעת הטרדה מאיימת against a stranger who harasses you online?
  options:
    - The District Court.
    - The Magistrates' Court.
    - The Privacy Protection Authority.
    - The police station.
  correct: 1
  explanation: >-
    The Magistrates' Court (or the family court for relatives, or the youth court for minors) hears
    applications under the Prevention of Stalking Law.
- id: m08-080
  module: 8
  lesson: '08.5'
  subject: restraining-order
  difficulty: 2
  question: How long can a restraining order under the Prevention of Stalking Law last?
  options:
    - Up to 6 months, extendable to 1 year, rarely 2.
    - Up to 30 days, renewable again and again without limit.
    - Indefinitely, until the harasser applies to cancel it.
    - Exactly one year from the hearing, with no extension.
  correct: 0
  explanation: >-
    Section 6: up to six months, extendable to a total of one year, and for special reasons up to
    two years.
- id: m08-081
  module: 8
  lesson: '08.5'
  subject: restraining-order
  difficulty: 3
  question: >-
    Spot the mistake in this plan: "File for a restraining order against the anonymous account
    @truthteller99; ask the court to delete all its posts."
  options:
    - It should be filed at the District Court, not the Magistrates' Court.
    - It needs a lawyer's signature before the court will accept it at all.
    - An order needs a known person, and deletes no posts.
    - It must first be approved by the police before being filed in court.
  correct: 2
  explanation: >-
    The order is addressed to a known person and forbids conduct. For an anonymous account, use the
    platform and the police; for existing posts, the platform route.
- id: m08-082
  module: 8
  lesson: '08.5'
  subject: restraining-order
  difficulty: 3
  question: An order was given ex parte against a man who sent threats. What happens next under s. 7?
  options:
    - Nothing; ex parte orders are final.
    - The order expires after 48 hours unless the police renew it.
    - The harasser has 60 days to file a defence.
    - A hearing with both sides is held within 7 days.
  correct: 3
  explanation: >-
    Section 7(ב) requires a hearing in the presence of both sides as soon as possible and no later
    than seven days after an ex parte order.
- id: m08-083
  module: 8
  lesson: '08.5'
  subject: unmasking
  difficulty: 2
  question: What did the Supreme Court decide in Mor v. Barak (LCA 4447/07, 2010)?
  options:
    - Platforms must reveal anonymous users on request by any plaintiff who sues.
    - The majority would not create an unmasking procedure without legislation.
    - Anonymous speech is never protected under Israeli law in any case.
    - The police may unmask users, but only in criminal defamation cases.
  correct: 1
  explanation: >-
    The majority left unmasking to the Knesset. A 2022 private bill on unmasking did not pass a
    first reading before the Knesset dissolved.
- id: m08-084
  module: 8
  lesson: '08.5'
  subject: removed-content
  difficulty: 2
  question: >-
    What did the High Court decide in Adalah v. State Attorney's Office (HCJ 7846/19, 2021) about
    the Cyber Unit?
  options:
    - It dismissed the petition; the unit's voluntary requests continue.
    - It ordered the unit to stop sending all requests to online platforms.
    - It required the unit to notify every affected user before any request.
    - It transferred the unit's powers to the Privacy Protection Authority.
  correct: 0
  explanation: >-
    The Court dismissed the petition. Petitioners argue the practice is censorship without due
    process; the State argues platforms decide independently.
- id: m08-085
  module: 8
  lesson: '08.5'
  subject: takedown-bills
  difficulty: 2
  question: >-
    Is there a general Israeli law, as of October 2026, letting a court order platforms to remove
    any content that is a criminal offence?
  options:
    - Yes, the "Facebook law" passed in 2018.
    - Yes, under Amendment 13 of the Privacy Law.
    - No; private bills in the 25th Knesset were only tabled.
    - Yes, under the Counter-Terrorism Law for all offences.
  correct: 2
  explanation: >-
    No general takedown law exists. P/707/25 and P/4173/25 were tabled only, and the Knesset
    dissolved in July 2026.
- id: m08-086
  module: 8
  lesson: '08.5'
  subject: intimate-images
  difficulty: 2
  question: >-
    An ex-partner posts sexual images of an activist to discredit her. Which law makes this an
    offence?
  options:
    - Only the Defamation Law, and only if the images are fake.
    - The Counter-Terrorism Law, as a form of intimidation.
    - None; publishing such images is a civil matter only.
    - The Prevention of Sexual Harassment Law, s. 3(א)(5א).
  correct: 3
  explanation: >-
    Publishing a sexual image that may humiliate, without consent, is sexual harassment, punished
    like a deliberate privacy invasion. Report to the police and the platform.
- id: m08-087
  module: 8
  lesson: '08.5'
  subject: removed-content
  difficulty: 3
  question: >-
    Your campaign page is suspended after mass reporting by opponents. Which step protects your work
    best in the long run?
  options:
    - Open new accounts under other names to evade the suspension.
    - Appeal, and keep regular backups of your content outside the platform.
    - Report the opponents' pages in return until they are suspended.
    - Sue the platform in the Magistrates' Court for reinstatement.
  correct: 1
  explanation: >-
    An appeal under the platform's own rules is the fastest route; backups make a suspension
    survivable. Evading suspensions breaks platform rules, and mass counter-reporting escalates.
- id: m08-088
  module: 8
  lesson: '08.5'
  subject: platform-routes
  difficulty: 3
  question: >-
    An anonymous account posts a photo of your car with its licence plate and the words "we know
    what you drive and where you park". Which combination of routes is best?
  options:
    - Preserve, report it to the platform, and complain to the police.
    - A restraining order against the anonymous account, plus a defamation claim.
    - A complaint to the Privacy Protection Authority, then wait for its decision.
    - Post the suspected owner's home address in response, as a warning.
  correct: 0
  explanation: >-
    A veiled threat tied to your car and movements is a police matter; the platform removes private
    information; a restraining order needs a known person. Retaliation creates new risk.
- id: m08-089
  module: 8
  lesson: '08.5'
  subject: restraining-order
  difficulty: 1
  question: >-
    What does it cost to file a request for a restraining order under the Prevention of Stalking
    Law?
  options:
    - 'The small-claims fee: 1% of a nominal amount, at least ₪50.'
    - The full Magistrates' Court civil fee for a claim.
    - 'Nothing: no court fee is charged for the request.'
    - A fixed police processing fee paid at the station.
  correct: 2
  explanation: >-
    Kol Zchut (checked 13.10.2026) states that filing the request carries no court fee. You need the
    harasser's details and your evidence.
- id: m08-090
  module: 8
  lesson: '08.5'
  subject: platform-routes
  difficulty: 3
  question: >-
    A fake profile in your name posts racist comments to discredit your campaign. Which first step
    fits best?
  options:
    - Reply from your real account to every comment the fake profile writes.
    - Open a second fake profile to post corrections in its name.
    - Complain to the Privacy Protection Authority and wait for a decision.
    - Preserve it, report it as impersonation, and post one factual denial.
  correct: 3
  explanation: >-
    Platforms remove impersonation quickly under their own rules. A short denial on your own page is
    protected (Defamation Law s. 15(10)); replying everywhere spreads the content.
- id: m08-091
  module: 8
  lesson: '08.5'
  subject: restraining-order
  difficulty: 3
  question: >-
    A company asks for a restraining order against a consumer activist who posts weekly, documented
    reviews of its service and tags its CEO. What should the court do?
  options:
    - 'Refuse: the posts are public-interest criticism, which s. 4(ג) excludes.'
    - Grant it, because weekly posts are repeated contact with the CEO.
    - Grant it for six months, after which the activist may post again.
    - Transfer the case to the Privacy Protection Authority for a decision.
  correct: 0
  explanation: >-
    Section 4(ג) excludes conduct covered by privacy-law defences such as justified public interest.
    Documented consumer criticism is not stalking; harassment orders are not a SLAPP tool.
- id: m08-092
  module: 8
  lesson: '08.5'
  subject: evidence-preservation
  difficulty: 3
  question: >-
    You find a threatening video about you on a channel that often deletes its posts. Which
    preservation method is strongest?
  options:
    - Write down what the video says from memory after watching it.
    - Screen-record it with the URL visible, note the time, and log it.
    - Ask a friend to watch it so that there is a witness who saw it.
    - Comment under it so that your comment proves the video existed.
  correct: 1
  explanation: >-
    A screen recording with the URL and time, plus a log entry, preserves the content itself. Memory
    and witnesses are weaker; commenting engages the harasser.
- id: m08-093
  module: 8
  lesson: '08.5'
  subject: takedown-bills
  difficulty: 2
  question: What happened to the private bill on unmasking anonymous users (P/301/25) in the 25th Knesset?
  options:
    - It passed all three readings and took effect in 2025 as a new law.
    - It reached committee stage but did not pass a first reading.
    - It was struck down by the High Court as unconstitutional.
    - It was merged into Amendment 13 of the Privacy Law.
  correct: 1
  explanation: >-
    The Knesset database lists it at "preparation for first reading". It did not pass a first
    reading before the Knesset dissolved on 17.7.2026, so it does not carry over automatically.
- id: m09-001
  module: 9
  lesson: '09.1'
  subject: statute-map
  difficulty: 1
  question: Which statute governs discrimination by a hotel against a guest because of religion?
  options:
    - The Equal Employment Opportunities Law 1988
    - The Women's Equal Rights Law 1951
    - The Pupils' Rights Law 2000
    - The Products and Services Law 2000
  correct: 3
  explanation: >-
    A hotel supplies a public service and runs a public place; s. 3 of the Products and Services Law
    covers religion.
- id: m09-002
  module: 9
  lesson: '09.1'
  subject: statute-map
  difficulty: 1
  question: >-
    Which court has exclusive jurisdiction over civil claims under the Equal Employment
    Opportunities Law?
  options:
    - The Magistrates' Court
    - The Small Claims Court
    - The District Court as an administrative court
    - The Regional Labour Court
  correct: 3
  explanation: >-
    Section 10(א) gives the Labour Court exclusive jurisdiction over civil proceedings under the
    law.
- id: m09-003
  module: 9
  lesson: '09.1'
  subject: statute-map
  difficulty: 1
  question: Under which law is disability discrimination in a shop claimed?
  options:
    - The Products and Services Law, s. 3(א), like any ground
    - The disability law, Chapter ה׳1
    - The Women's Equal Rights Law, s. 6, on social rights
    - The Equal Employment Opportunities Law, s. 2
  correct: 1
  explanation: >-
    Section 3(ה) of the services law sends disability discrimination in its subject areas to Chapter
    ה׳1 of the disability law.
- id: m09-004
  module: 9
  lesson: '09.1'
  subject: grounds
  difficulty: 1
  question: Which ground appears in the services law but not in the employment law?
  options:
    - Religion or a religious group
    - Wearing a security-forces uniform
    - Sexual orientation of the customer
    - Place of residence of the customer
  correct: 1
  explanation: >-
    Uniforms and insignia are listed only in s. 3(א) of the services law; religion, orientation and
    residence appear in both laws.
- id: m09-005
  module: 9
  lesson: '09.1'
  subject: grounds
  difficulty: 1
  question: Which ground appears in the employment law but not in the services law?
  options:
    - Age
    - Political view
    - Reserve duty
    - Parenthood
  correct: 2
  explanation: Section 2(א) of the employment law lists reserve duty; the services law does not.
- id: m09-006
  module: 9
  lesson: '09.1'
  subject: grounds
  difficulty: 2
  question: >-
    A pupil is placed in a separate class because of his parents' socio-economic background. Which
    statute speaks to this directly?
  options:
    - The Products and Services Law, s. 3
    - The Equal Employment Opportunities Law, s. 2
    - The Women's Equal Rights Law, s. 1א
    - The Pupils' Rights Law, s. 5
  correct: 3
  explanation: >-
    Section 5 of the Pupils' Rights Law bars discrimination by socio-economic background, including
    separate classes in the same school.
- id: m09-007
  module: 9
  lesson: '09.1'
  subject: coverage
  difficulty: 2
  question: >-
    A free community library run by a non-profit refuses to lend books to a woman because of her
    nationality. The library says the law does not apply because it charges nothing. Is it right?
  options:
    - Yes; only businesses that charge money are covered
    - No; s. 3(ב) covers non-profit and free services too
    - Yes; non-profits are bound only by their articles
    - No, but only the Attorney General may sue it
  correct: 1
  explanation: >-
    Section 3(ב) says it does not matter whether the activity is for profit or whether a fee is
    charged.
- id: m09-008
  module: 9
  lesson: '09.1'
  subject: coverage
  difficulty: 2
  question: >-
    A non-profit women's empowerment club runs a members-only course for women. A man claims
    discrimination. What is the club's best answer?
  options:
    - The non-profit special-needs exception in s. 3(ד)(2)
    - The nature-of-the-job exception in employment s. 2(ג)
    - The one-year limit for complaints
    - The rule that clubs are not public places
  correct: 0
  explanation: >-
    Section 3(ד)(2) allows a non-profit organisation or club to serve its members' special needs if
    this does not contradict the law's purpose.
- id: m09-009
  module: 9
  lesson: '09.1'
  subject: coverage
  difficulty: 2
  question: >-
    A family company with four employees refuses to hire an applicant because of his religion. Under
    the employment law, what is the position?
  options:
    - The law applies to every employer, whatever the number of workers
    - Only the Commission may act against small employers
    - The law's s. 2 does not apply to employers of fewer than six
    - The services law applies to small employers instead
  correct: 2
  explanation: >-
    Section 21(ג) excludes employers of fewer than six from the law except s. 7; Kol Zchut notes
    courts may still use good faith and the Basic Law.
- id: m09-010
  module: 9
  lesson: '09.1'
  subject: forum
  difficulty: 2
  question: >-
    Which body handles complaints about discrimination in shops and restaurants, the way the
    employment and disability commissions do in their areas?
  options:
    - None; only a racism unit takes complaints
    - The Equal Employment Opportunities Commission
    - The Public Complaints Commissioner (ombudsman)
    - The Privacy Protection Authority
  correct: 0
  explanation: >-
    There is no statutory commission for the services law. The Government Unit for Coordinating the
    Fight against Racism takes complaints but awards no compensation.
- id: m09-011
  module: 9
  lesson: '09.1'
  subject: forum
  difficulty: 2
  question: Which statute lets a class action be filed for discrimination in services?
  options:
    - The Courts Law, s. 60, on small claims
    - The Limitation Law, s. 5, on time limits
    - The Wiretap Law, s. 13, on admissibility
    - The Class Actions Law, Second Schedule, item 7
  correct: 3
  explanation: >-
    Item 7 of the Second Schedule to the Class Actions Law covers claims under the Products and
    Services Law; items 8 and 9 cover employment and disability.
- id: m09-012
  module: 9
  lesson: '09.1'
  subject: forum
  difficulty: 3
  question: >-
    A municipality's sports centre refuses a Haredi women's group a pool slot, while a secular
    women's group gets one. They want both compensation and a change in the municipal policy. Which
    pair of tools fits best?
  options:
    - A Labour Court claim and an FOI request to the municipality
    - A disability Commission complaint and a s. 19מד query
    - A services-law claim (s. 11) and an administrative petition
    - Only a High Court petition against the Minister of Interior
  correct: 2
  explanation: >-
    Section 11 makes the services law apply to public bodies for compensation; a policy of a local
    authority can also be challenged in an administrative petition (05.6).
- id: m09-013
  module: 9
  lesson: '09.1'
  subject: exceptions
  difficulty: 2
  question: A men's mikveh refuses entry to a woman. Which provision most likely makes this lawful?
  options:
    - The exception for distinctions required by the nature of the place
    - The exception for employers of fewer than six workers
    - The rule that religious bodies are outside every anti-discrimination law
    - The undue-burden exemption in the disability law
  correct: 0
  explanation: >-
    Section 3(ד)(1) and (3) allow distinctions required by the nature of the place or justified
    separate frameworks for men and women.
- id: m09-014
  module: 9
  lesson: '09.1'
  subject: exceptions
  difficulty: 3
  question: >-
    An employer refuses to hire a man for a women's shelter counsellor role, citing the residents'
    needs. Which argument will the employer raise?
  options:
    - That sex is not a ground in the employment law
    - That the distinction is required by the nature of the job (s. 2(ג))
    - That the shelter is a non-profit club (services s. 3(ד)(2))
    - That the applicant should have complained within 30 days
  correct: 1
  explanation: >-
    Section 2(ג) of the employment law says a distinction required by the character or nature of the
    job is not discrimination; the court will test whether it really is.
- id: m09-015
  module: 9
  lesson: '09.1'
  subject: womens-equal-rights
  difficulty: 1
  question: What does s. 1א(ב) of the Women's Equal Rights Law say about intent?
  options:
    - Intent to discriminate does not matter if the result is discrimination
    - Only intentional discrimination is prohibited by the law
    - Intent must be proved by the woman who claims discrimination
    - Intent matters only in criminal cases, not in civil ones
  correct: 0
  explanation: >-
    Section 1א(ב) says it makes no difference whether there was an intention to discriminate behind
    an act whose result is discrimination.
- id: m09-016
  module: 9
  lesson: '09.1'
  subject: womens-equal-rights
  difficulty: 2
  question: >-
    A ministry programme reserves training places for women in a field where they are
    under-represented. A man objects. Which provision supports the ministry?
  options:
    - Services law s. 3(א1), on place of residence of customers
    - Women's Equal Rights Law s. 1ב, permitting affirmative action
    - Employment law s. 2א, on the IDF medical profile of applicants
    - Disability law s. 19נא, on compensation without proof of damage
  correct: 1
  explanation: >-
    Section 1ב(2) says a provision or act meant to correct past or existing discrimination of women,
    or to advance their equality, is not prohibited discrimination.
- id: m09-017
  module: 9
  lesson: '09.2'
  subject: presumptions
  difficulty: 1
  question: How many presumptions does s. 6 of the services law set out?
  options:
    - Two
    - Four
    - Three
    - Six
  correct: 1
  explanation: >-
    Section 6(1)–(4): asking about a ground and refusing; refusing the group but not others; an
    extra condition; a delay.
- id: m09-018
  module: 9
  lesson: '09.2'
  subject: presumptions
  difficulty: 1
  question: What is the effect of a s. 6 presumption?
  options:
    - The claim wins automatically at the full ceiling
    - The defendant must prove it did not discriminate
    - The case moves from the civil court to the Labour Court
    - The police must open a criminal file against the owner
  correct: 1
  explanation: Once a presumption applies, discrimination is presumed until the defendant proves otherwise.
- id: m09-019
  module: 9
  lesson: '09.2'
  subject: presumptions
  difficulty: 2
  question: >-
    A taxi company makes Arab passengers pay in advance but lets others pay at the end of the ride.
    Which presumption applies?
  options:
    - 's. 6(1): asking about a ground and then refusing'
    - 's. 6(3): a condition required only of the group'
    - 's. 6(4): delaying the group while others go in'
    - None, because the ride was given in the end
  correct: 1
  explanation: Setting a condition for members of a group that is not required of others triggers s. 6(3).
- id: m09-020
  module: 9
  lesson: '09.2'
  subject: presumptions
  difficulty: 2
  question: >-
    At a nightclub, young women of Mizrahi appearance are kept waiting 40 minutes while others go
    straight in. Which presumption fits?
  options:
    - 's. 6(4): delaying the group but not others'
    - 's. 6(3): an extra condition for the group'
    - 's. 6(1): asking about a ground first'
    - 's. 4: a discriminatory advertisement'
  correct: 0
  explanation: >-
    Section 6(4), added in 2011, covers delaying members of a group while not delaying others in the
    same circumstances.
- id: m09-021
  module: 9
  lesson: '09.2'
  subject: presumptions
  difficulty: 3
  question: >-
    A bank clerk asks an older customer his age, then refuses him a guarantor role 'by policy'. A
    younger friend was accepted the same week. Which statement is most accurate?
  options:
    - Only s. 6(2) applies, through the friend
    - No presumption applies to banks
    - s. 6(1) and s. 6(2) may both apply
    - Age is not a ground in the services law
  correct: 2
  explanation: >-
    Financial services are public services (s. 2); age is a ground; asking about it then refusing
    triggers s. 6(1), and the friend supplies s. 6(2).
- id: m09-022
  module: 9
  lesson: '09.2'
  subject: compensation
  difficulty: 1
  question: From which month's index is the s. 5(ב) ceiling of the services law linked?
  options:
    - January 2026
    - February 2005
    - October 2000
    - August 2013
  correct: 2
  explanation: >-
    Section 5(ב) defines the base index as October 2000 and updates the sum on the 16th of every
    month.
- id: m09-023
  module: 9
  lesson: '09.2'
  subject: compensation
  difficulty: 2
  question: A claimant says the ceiling in s. 5(ב) is 'the amount the court must award'. What is wrong?
  options:
    - It is a minimum the court must award in every case
    - It applies only to claims filed by organisations
    - It is a fine paid to the state, not to the victim
    - It is a maximum; the court decides the amount up to it
  correct: 3
  explanation: >-
    The court 'may award' compensation 'not exceeding' the indexed sum; reported awards are usually
    lower.
- id: m09-024
  module: 9
  lesson: '09.2'
  subject: compensation
  difficulty: 2
  question: Why does compensation without proof of damage matter so much in entry cases?
  options:
    - It lets the claimant avoid paying any court fees at all
    - It makes the bouncer criminally liable for the refusal
    - Humiliation at a door rarely produces a provable financial loss
    - It replaces the need to prove the ground of discrimination
  correct: 2
  explanation: >-
    The claimant still proves discrimination, but not money damage; s. 5(ב) lets the court
    compensate for the wrong itself.
- id: m09-025
  module: 9
  lesson: '09.2'
  subject: defendants
  difficulty: 1
  question: Under s. 3(ג), who counts as 'מי שעיסוקו' in a club?
  options:
    - Only the company registered as the owner
    - Only the bouncer who spoke to the customer
    - Owner, holder, manager, or whoever controls entry
    - Only the municipality that licensed the club
  correct: 2
  explanation: >-
    Section 3(ג) includes owners, holders and managers, and anyone actually responsible for the
    service or entry.
- id: m09-026
  module: 9
  lesson: '09.2'
  subject: defendants
  difficulty: 3
  question: >-
    A restaurant's active manager says she cannot be personally liable for her company's door
    policy. When is she right?
  options:
    - If she proves she did not know and took reasonable steps
    - Always, because only companies are liable for door policies
    - If the company employs more than six workers
    - If the claim is filed in the Small Claims Court
  correct: 0
  explanation: >-
    Section 8 makes active managers liable unless they prove both lack of knowledge and reasonable
    preventive steps.
- id: m09-027
  module: 9
  lesson: '09.2'
  subject: advertising
  difficulty: 2
  question: >-
    A holiday-flat website says 'not suitable for religious families'. No one has been refused yet.
    Is there a wrong?
  options:
    - No; only an actual refusal of a family is a wrong
    - Only if a religious family later complains
    - Yes; the advertisement itself is a wrong (ss. 4–5)
    - Only if the website's owner is Israeli
  correct: 2
  explanation: Section 4 bars discriminatory advertisements, and s. 5(א) makes a breach of s. 4 a civil wrong.
- id: m09-028
  module: 9
  lesson: '09.2'
  subject: routes
  difficulty: 1
  question: Who may file a claim in the Small Claims Court?
  options:
    - Any company or organisation
    - An individual only
    - Only a lawyer on behalf of a client
    - Only the Attorney General
  correct: 1
  explanation: 'Courts Law s. 60(א): the Small Claims Court hears a civil claim filed by an individual (יחיד).'
- id: m09-029
  module: 9
  lesson: '09.2'
  subject: routes
  difficulty: 3
  question: >-
    A same-sex couple's claim would be worth more than the small-claims ceiling. What is their
    choice?
  options:
    - File two small claims for the same event to double the ceiling
    - Ask the Small Claims Court to waive its ceiling for them
    - Up to the ceiling in small claims, or more in the Magistrates' Court
    - Go to the Labour Court, which has no ceiling at all
  correct: 2
  explanation: >-
    Each individual may claim up to the ceiling in small claims; a larger amount requires the
    Magistrates' Court and its fuller procedure.
- id: m09-030
  module: 9
  lesson: '09.2'
  subject: routes
  difficulty: 2
  question: In the Small Claims Court, may a claimant bring a lawyer as of right?
  options:
    - Yes, always, like in any other civil court
    - Yes, if the defendant is a company with lawyers
    - Only with the court's permission, for special reasons
    - No, and no one may ever help the claimant in court
  correct: 2
  explanation: >-
    Courts Law s. 63(א) allows representation by a lawyer only with the court's permission for
    special reasons.
- id: m09-031
  module: 9
  lesson: '09.2'
  subject: routes
  difficulty: 3
  question: >-
    An Arab family's claim was rejected in the Small Claims Court because the judge found no
    comparison evidence. What would most likely have changed the result?
  options:
    - Claiming a higher amount to show seriousness
    - Filing the claim through an organisation instead
    - Waiting longer before filing the claim
    - A friend admitted in the same circumstances (s. 6(2))
  correct: 3
  explanation: >-
    The presumptions depend on comparison facts; without them the claimant must prove intent
    directly, which is hard.
- id: m09-032
  module: 9
  lesson: '09.2'
  subject: demand-letter
  difficulty: 1
  question: What should a services-law demand letter ask for besides money?
  options:
    - An apology published in two national newspapers
    - A written change of policy and preservation of footage
    - The dismissal of the bouncer who refused them
    - A criminal conviction of the owner of the club
  correct: 1
  explanation: >-
    A specific, lawful demand — compensation, a policy change and preserving CCTV — makes a
    settlement more likely and protects evidence.
- id: m09-033
  module: 9
  lesson: '09.2'
  subject: demand-letter
  difficulty: 2
  question: >-
    Spot the mistake: a demand letter says 'Pay ₪50,000 by Sunday or I will post your name
    everywhere and call the police.'
  options:
    - It cites the wrong statute for discrimination at the door
    - It gives the business too long a deadline to answer
    - It threatens publicity for money instead of a legal step
    - It does not mention the Labour Court as the forum
  correct: 2
  explanation: >-
    A demand letter should state the legal step you will take; threatening publicity to get money is
    risky and weakens your position.
- id: m09-034
  module: 9
  lesson: '09.2'
  subject: limitation-legal-aid
  difficulty: 3
  question: >-
    A man refused by a hotel three years ago asks if the Legal Aid department will check his income
    before helping with a services-law claim.
  options:
    - Yes; the usual income and asset tests apply to everyone
    - No; Legal Aid never helps in civil claims of any kind
    - No; such claims skip the means test, but merits are checked
    - Yes, and only claims under three years old qualify
  correct: 2
  explanation: >-
    Kol Zchut (2025): a person bringing a civil claim under this law is exempt from the economic
    test; Legal Aid still checks the merits.
- id: m09-035
  module: 9
  lesson: '09.2'
  subject: criminal
  difficulty: 2
  question: Besides a civil claim, what other consequence does the services law provide?
  options:
    - Automatic loss of the business licence for a year
    - Imprisonment of the bouncer for up to five years
    - A criminal fine, and closure of a repeat offender's business
    - A ban on the owner leaving Israel until he pays
  correct: 2
  explanation: >-
    Section 9 sets a fine and lets a court order a business closed if the owner was previously
    convicted of the same offence.
- id: m09-036
  module: 9
  lesson: '09.3'
  subject: employment-grounds
  difficulty: 1
  question: Which stage of employment is NOT listed in s. 2(א) of the employment law?
  options:
    - Hiring, including the selection process
    - Promotion to a more senior position
    - Assigning customers to a worker
    - Dismissal and severance pay
  correct: 2
  explanation: >-
    Section 2(א)(1)–(6) covers hiring, conditions, promotion, training, dismissal and severance, and
    retirement benefits.
- id: m09-037
  module: 9
  lesson: '09.3'
  subject: employment-grounds
  difficulty: 1
  question: Does the employment law protect job applicants or only existing workers?
  options:
    - Only workers after three months
    - Only applicants from outside the company
    - Both workers and job applicants
    - Only workers with a written contract
  correct: 2
  explanation: Section 2(א) bars discrimination 'between workers or between job applicants'.
- id: m09-038
  module: 9
  lesson: '09.3'
  subject: employment-grounds
  difficulty: 2
  question: >-
    An employer refuses to promote a worker because her partner is often called for reserve duty. Is
    this covered?
  options:
    - Yes; the partner's reserve duty is a listed ground
    - No; only the worker's own service counts
    - Only if the partner works for the same employer
    - No; reserve duty is a matter for the IDF
  correct: 0
  explanation: >-
    Section 2(א) includes reserve duty of the worker, the worker's spouse or the other parent of the
    worker's child.
- id: m09-039
  module: 9
  lesson: '09.3'
  subject: employment-grounds
  difficulty: 3
  question: >-
    A manpower agency places a worker at a factory, and the factory asks the agency to send 'only
    Jews'. Who breaches the law?
  options:
    - Only the agency, as the formal employer of the worker
    - Only the factory, as the agency just follows orders
    - Neither, because the two firms have no employment contract
    - The factory as actual employer, and the agency if it complies
  correct: 3
  explanation: >-
    Section 2(א1) bars the actual employer from discriminating or asking a manpower contractor to do
    so; the contractor is bound as employer.
- id: m09-040
  module: 9
  lesson: '09.3'
  subject: burden
  difficulty: 1
  question: Under s. 9(א)(2), when does the burden move to the employer in a dismissal case?
  options:
    - Always, from the very start of any claim
    - Only if the employer has more than 100 workers
    - If he proves nothing in his conduct justified dismissal
    - Only if the worker was employed for five years or more
  correct: 2
  explanation: >-
    Section 9(א)(2): in dismissal, the burden moves if the worker proves there was no reason in his
    behaviour or acts.
- id: m09-041
  module: 9
  lesson: '09.3'
  subject: burden
  difficulty: 2
  question: An applicant meets every requirement in the ad but is not hired. What does s. 9(א)(1) do?
  options:
    - It entitles her to be given the job immediately
    - It lets her skip the Labour Court and go to small claims
    - It makes the candidate who was hired a defendant
    - It moves the burden to the employer to show no discrimination
  correct: 3
  explanation: >-
    If the applicant shows she met the conditions or qualifications the employer set, the employer
    must prove it did not discriminate.
- id: m09-042
  module: 9
  lesson: '09.3'
  subject: burden
  difficulty: 3
  question: >-
    An interviewer asks a woman whether she is married and has small children. She is rejected; the
    employer says a better candidate was chosen. Which is the strongest legal point?
  options:
    - She must prove the other candidate was weaker than her
    - Such questions are allowed if asked of every candidate
    - The questions moved the burden to the employer (s. 9(ג))
    - She can win only if the questions were asked in writing
  correct: 2
  explanation: >-
    Asking for information on a prohibited ground (personal status, parenthood) moves the burden
    under s. 9(ג); the employer must prove its reasons.
- id: m09-043
  module: 9
  lesson: '09.3'
  subject: commission
  difficulty: 1
  question: To whom is a complaint under s. 18יב of the employment law addressed?
  options:
    - The Public Complaints Commissioner at the Comptroller
    - The registrar of the Regional Labour Court
    - The Minister of Labour, through the ministry's website
    - The regional commissioner of the employment Commission
  correct: 3
  explanation: 'Section 18יב: anyone may file a written complaint to the regional commissioner (נציב אזורי).'
- id: m09-044
  module: 9
  lesson: '09.3'
  subject: commission
  difficulty: 1
  question: Does a complaint to the Equal Employment Opportunities Commission cost anything?
  options:
    - Yes, a fee similar to a small claim
    - Yes, unless you have a lawyer
    - Only for complaints by organisations
    - No, it is free
  correct: 3
  explanation: The Commission handles complaints and gives initial legal advice free of charge.
- id: m09-045
  module: 9
  lesson: '09.3'
  subject: commission
  difficulty: 2
  question: Which of these is NOT one of the Commission's options after a complaint?
  options:
    - Ordering the employer to pay compensation itself
    - Sending the matter to mediation with both sides' consent
    - Suing in the Labour Court in the worker's name
    - Asking a court for a general order
  correct: 0
  explanation: >-
    Under s. 18יג(ב) the Commission may dismiss, refer, mediate, investigate, sue or seek a general
    order; compensation is awarded by a court.
- id: m09-046
  module: 9
  lesson: '09.3'
  subject: commission
  difficulty: 2
  question: The Commission decided not to sue in a worker's case. What must it give her?
  options:
    - Nothing; its decisions are internal
    - Written notice with its reasons
    - An oral explanation only
    - A refund of her complaint fee
  correct: 1
  explanation: >-
    Section 18יד: the regional commissioner informs the complainant in writing, with reasons, unless
    it decided to sue.
- id: m09-047
  module: 9
  lesson: '09.3'
  subject: commission
  difficulty: 3
  question: >-
    A worker sued in the Labour Court and later asks the Commission to investigate the same
    dismissal. What will happen?
  options:
    - The Commission must open an investigation within 30 days
    - The court must stay the case until the Commission finishes
    - The worker must withdraw the claim to keep her rights
    - The Commission will not handle it while it is before the court
  correct: 3
  explanation: >-
    Section 18יג(א)(2): the Commission does not handle a complaint whose cause is being decided by a
    court; the court may let it be heard (s. 13).
- id: m09-048
  module: 9
  lesson: '09.3'
  subject: limitation
  difficulty: 2
  question: >-
    A worker was dismissed four years ago, she believes because of her religion. Can she still sue
    under the employment law?
  options:
    - Yes; a worker has five years from the cause
    - No; workers have three years
    - No; the Commission's one-year limit applies to the court
    - Yes, but only if the Commission agrees
  correct: 0
  explanation: 'Section 14: five years for a worker, three for a job applicant.'
- id: m09-049
  module: 9
  lesson: '09.3'
  subject: retaliation
  difficulty: 2
  question: >-
    A worker testified for a colleague at the Commission. Soon after, his bonus is cancelled. Which
    provision helps him?
  options:
    - 'Section 21: the exception for family employees'
    - 'Section 2א: the ban on asking for the medical profile'
    - 'Section 14: the limitation periods for claims'
    - 'Section 6: no harm for helping another worker complain'
  correct: 3
  explanation: >-
    Section 6(א) protects a worker harmed because he complained, sued or assisted another worker
    under the law or the Equal Pay Law.
- id: m09-050
  module: 9
  lesson: '09.3'
  subject: employment-disability
  difficulty: 2
  question: >-
    An applicant with a hearing impairment is rejected because the employer won't provide a phone
    amplifier. Which law and forum?
  options:
    - Services law s. 3, in small claims
    - Employment law s. 2, at the Commission only
    - Disability law s. 8, in the Labour Court
    - Women's Equal Rights Law, in an administrative court
  correct: 2
  explanation: >-
    Disability discrimination in employment is governed by ss. 8–14 of the disability law; s. 14
    gives the Labour Court exclusive jurisdiction.
- id: m09-051
  module: 9
  lesson: '09.3'
  subject: employment-grounds
  difficulty: 3
  question: >-
    A settler applies to a Tel Aviv company that writes back, 'We don't hire people who live beyond
    the Green Line.' Which statement is most accurate?
  options:
    - Residence is a ground only in the services law
    - Place of residence is a ground in employment s. 2(א)
    - He must use the disability Commission
    - Only an administrative petition is available
  correct: 1
  explanation: Section 2(א) of the employment law lists 'מקום מגוריהם'; the written answer is strong evidence.
- id: m09-052
  module: 9
  lesson: '09.4'
  subject: disability-duties
  difficulty: 1
  question: >-
    Which section states the basic prohibition on discriminating against a person with a disability
    and harming his right to accessibility?
  options:
    - Section 19ג of the disability law
    - Section 3 of the services law
    - Section 2 of the employment law
    - Section 1א of the Women's Equal Rights Law
  correct: 0
  explanation: >-
    Section 19ג: no discrimination against a person with a disability and no harm to the right of
    accessibility, under Chapter ה׳1.
- id: m09-053
  module: 9
  lesson: '09.4'
  subject: disability-duties
  difficulty: 1
  question: >-
    Who bears the accessibility duty for adjustments that need no building permit when a public
    place is run by a tenant?
  options:
    - The holder or operator of the place
    - Only the owner of the building, always
    - The municipality where the place is
    - The Commission, which supervises accessibility
  correct: 0
  explanation: >-
    Section 19ח(ג)(2): adjustments without a building permit fall on the owner, but if someone else
    holds or operates the place, on that holder or operator.
- id: m09-054
  module: 9
  lesson: '09.4'
  subject: disability-duties
  difficulty: 2
  question: Section 19ו(ד) says that the non-discrimination section does not itself require something. What?
  options:
    - Carrying out accessibility adjustments
    - Serving people with disabilities at all
    - Allowing guide dogs
    - Answering a Commission query
  correct: 0
  explanation: >-
    Accessibility adjustments come from ss. 19ח, 19יא and the regulations; s. 19ו is about refusals,
    conditions and worse service.
- id: m09-055
  module: 9
  lesson: '09.4'
  subject: disability-duties
  difficulty: 2
  question: >-
    A cinema lets a wheelchair user in but only to the front row, while others choose any seat at
    the same price. Which part of s. 19ו is relevant?
  options:
    - Refusing access to the place, s. 19ו(א)(1)(א)
    - Service on terms worse than usual, s. 19ו(א)(3)
    - A discriminatory advertisement under the services law
    - The undue-burden exemption for existing places
  correct: 1
  explanation: >-
    Giving a public service on worse terms than usual is barred by s. 19ו(א)(3), unless the nature
    of the place requires it.
- id: m09-056
  module: 9
  lesson: '09.4'
  subject: exemptions
  difficulty: 1
  question: >-
    Which of these is a ground for exempting an existing place from a specific accessibility
    adjustment?
  options:
    - Engineering impossibility confirmed by an accessibility expert
    - The owner's personal opposition to the accessibility law
    - A complaint filed more than a year after the visit
    - The fact that the place charges no entry fee at all
  correct: 0
  explanation: >-
    Section 19יג(א)(1) exempts an adjustment that cannot be done for engineering reasons, as
    confirmed by a licensed expert.
- id: m09-057
  module: 9
  lesson: '09.4'
  subject: exemptions
  difficulty: 3
  question: >-
    A historic stone building in Safed has a narrow entrance. The operator says a ramp would destroy
    its architectural character. Which exemption is that?
  options:
    - 's. 19יג(א)(3): historical or architectural value'
    - 'Section 19יג(א)(2): undue burden because of the cost'
    - 'Section 19נא(ג)(3): a query sent before the claim'
    - Section 3(ד)(2) of the services law, on clubs
  correct: 0
  explanation: >-
    Section 19יג(א)(3) exempts an adjustment that substantially harms the special character of a
    place because of history, archaeology, architecture or nature.
- id: m09-058
  module: 9
  lesson: '09.4'
  subject: compensation
  difficulty: 1
  question: How often is the s. 19נא(ב) ceiling of the disability law updated?
  options:
    - Every month, from the October 2000 index
    - Once a year, from the February 2005 index
    - Every January, from the August 2013 index
    - Never; it is fixed at ₪50,000
  correct: 1
  explanation: Section 19נא(ו) updates the sum once a year from the base index of February 2005.
- id: m09-059
  module: 9
  lesson: '09.4'
  subject: compensation
  difficulty: 2
  question: For which kind of breach does s. 19נא(ב) allow compensation without proof of damage?
  options:
    - Only s. 19ו discrimination by service providers
    - Only breaches of the planning-law accessibility rules
    - Only employment discrimination under s. 8
    - Both s. 19ו discrimination and accessibility breaches
  correct: 3
  explanation: >-
    Section 19נא(ב)(1) covers s. 19ו (and s. 19לה); (ב)(2) covers breaches of the accessibility
    provisions listed there.
- id: m09-060
  module: 9
  lesson: '09.4'
  subject: compensation
  difficulty: 3
  question: >-
    A hotel was sued two months ago by another guest for the same missing accessible room and is
    building one on a reasonable schedule. A second guest now sues. What may the hotel argue?
  options:
    - The s. 19נא(ג)(2)(ב) bar for a recent earlier claim
    - That only one claim per year may be filed per place
    - That the second guest must sue in the Labour Court
    - That accessibility claims require proof of intent
  correct: 0
  explanation: >-
    Section 19נא(ג)(2)(ב) bars compensation without proof of damage if the earlier claim was filed
    less than three months before and the defendant is acting on a reasonable timetable.
- id: m09-061
  module: 9
  lesson: '09.4'
  subject: commission-disability
  difficulty: 1
  question: What is the public phone number of the Commission for Equal Rights of Persons with Disabilities?
  options:
    - '*3103'
    - '*6763'
    - 074-7696565
    - '*6405'
  correct: 1
  explanation: >-
    The gov.il service page and Kol Zchut list *6763. *3103 is the Privacy Protection Authority;
    074-7696565 is the employment Commission.
- id: m09-062
  module: 9
  lesson: '09.4'
  subject: commission-disability
  difficulty: 2
  question: >-
    Which tool can the disability Commission use against a business that ignores its accessibility
    duties?
  options:
    - An arrest warrant against the owner of the business
    - An accessibility order (s. 19מג) and administrative fines
    - Closing the business on the spot by its inspectors
    - Awarding the complainant compensation itself
  correct: 1
  explanation: >-
    The Commissioner or an inspector may issue an accessibility order after a hearing; Chapter ט
    adds administrative fines and warnings.
- id: m09-063
  module: 9
  lesson: '09.4'
  subject: commission-disability
  difficulty: 2
  question: Before issuing an accessibility order, what must the Commissioner do?
  options:
    - Get a court's approval in advance
    - Wait for a second complaint about it
    - Obtain the complainant's written consent
    - Let the person concerned present arguments
  correct: 3
  explanation: 'Section 19מג(ג): no order without an opportunity for the person concerned to make their case.'
- id: m09-064
  module: 9
  lesson: '09.4'
  subject: query
  difficulty: 1
  question: What may NOT be asked in a query (שאילתה) under s. 19מד?
  options:
    - How much compensation a court would award
    - Whether a place is a 'public place'
    - Whether an exemption applies
    - Whether an accessibility order was issued
  correct: 0
  explanation: >-
    Section 19מד(ב) limits queries to coverage, exceptions and exemptions, existing orders, and
    subjects the Minister adds.
- id: m09-065
  module: 9
  lesson: '09.4'
  subject: service-animals
  difficulty: 3
  question: >-
    A Haredi man with epilepsy uses a certified assistance dog. A clinic refuses entry with the dog.
    Which provision deals with this?
  options:
    - Section 3(ד)(3) of the services law, on separate frameworks
    - Section 2א of the employment law
    - Section 19ו1 of the disability law, on service animals
    - Section 19יג, on undue burden
  correct: 2
  explanation: >-
    Section 19ו1 regulates access with a service animal, including assistance animals certified by a
    recognised training centre.
- id: m09-066
  module: 9
  lesson: '09.4'
  subject: complaint-quality
  difficulty: 2
  question: 'Spot the weakness: ''The municipal library is not accessible. Please fix it.'''
  options:
    - It should be addressed to the Labour Court instead
    - It must be signed and filed by a lawyer
    - It should cite the Women's Equal Rights Law first
    - It lacks the address, details, evidence and a request
  correct: 3
  explanation: >-
    A complaint works when an inspector can find and assess the barrier: exact place, measurements,
    photos, dates and the action requested.
- id: m09-067
  module: 9
  lesson: '09.4'
  subject: complaint-quality
  difficulty: 3
  question: >-
    An activist wants to file a Commission complaint about an inaccessible clinic on behalf of her
    elderly neighbour. What must she do?
  options:
    - File in her own name without telling the neighbour
    - Ask a lawyer to file, since only lawyers may
    - Get the neighbour's written consent and attach it
    - File only after the neighbour sues
  correct: 2
  explanation: >-
    Act in your own name or with the affected person's consent; a civil claim by the Commission in a
    person's matter also requires consent.
- id: m09-068
  module: 9
  lesson: '09.5'
  subject: recording
  difficulty: 1
  question: Under the Wiretap Law, what makes listening 'האזנת סתר'?
  options:
    - The recording was made on a phone
    - The conversation was in a public place
    - The recording was not reported to the police
    - No party to the conversation consented
  correct: 3
  explanation: >-
    Section 1 defines wiretapping as listening without the consent of any of the parties to the
    conversation.
- id: m09-069
  module: 9
  lesson: '09.5'
  subject: recording
  difficulty: 1
  question: What is the maximum penalty for unlawful wiretapping under s. 2(א)?
  options:
    - A fine only, with no prison
    - Five years' imprisonment
    - One year's imprisonment
    - Ten years' imprisonment
  correct: 1
  explanation: 'Section 2(א): five years'' imprisonment.'
- id: m09-070
  module: 9
  lesson: '09.5'
  subject: recording
  difficulty: 2
  question: >-
    A woman records her own job interview without telling the interviewers. Under the Wiretap Law,
    what is the position?
  options:
    - Wiretapping, because the interviewers did not know
    - Not wiretapping, because she is a party to the conversation
    - Lawful only if the claim is in the Labour Court
    - Wiretapping unless the employer has fewer than six workers
  correct: 1
  explanation: >-
    A party's own consent suffices under s. 1; whether to record may still affect the relationship,
    but it is not an offence.
- id: m09-071
  module: 9
  lesson: '09.5'
  subject: recording
  difficulty: 3
  question: >-
    A friend who was not part of the conversation sends you a recording he made of two managers
    discussing 'keeping Ethiopians out'. What should you do?
  options:
    - Post it online at once to warn the community
    - Not use or share it; using a wiretap's content is an offence
    - Give it to the court as your main piece of evidence
    - Edit out the friend's voice and then use it in court
  correct: 1
  explanation: >-
    Section 2(ב) makes knowingly using or disclosing the content of an unlawful wiretap an offence,
    and s. 13 makes it inadmissible.
- id: m09-072
  module: 9
  lesson: '09.5'
  subject: recording
  difficulty: 3
  question: >-
    During a phone call with a landlord, you put the call on speaker so your partner, sitting next
    to you, can hear and record. The landlord does not know. Which is most accurate?
  options:
    - 'Lawful: you are a party and you consented'
    - Wiretapping, because your partner was not a party
    - Lawful only if the landlord is told within 24 hours
    - Wiretapping, because the call was by telephone
  correct: 0
  explanation: Wiretapping requires the absence of consent of all parties; your consent as a party is enough.
- id: m09-073
  module: 9
  lesson: '09.5'
  subject: privacy
  difficulty: 1
  question: Which of these is listed as a privacy infringement in s. 2 of the Privacy Law?
  options:
    - Photographing a shop's entrance from the street
    - Writing notes of your own conversation
    - Saving a screenshot of a public advertisement
    - Photographing a person while in a private domain
  correct: 3
  explanation: >-
    Section 2(3) lists photographing a person in a private domain; scenes and notices in public
    places are different.
- id: m09-074
  module: 9
  lesson: '09.5'
  subject: privacy
  difficulty: 2
  question: What does s. 32 of the Privacy Law say about evidence obtained by infringing privacy?
  options:
    - It is always admissible in civil discrimination cases
    - Inadmissible without consent unless the court allows it
    - It is admissible only if it proves discrimination
    - It is inadmissible only in criminal proceedings
  correct: 1
  explanation: >-
    Section 32: such material may not be used as evidence without the injured person's consent,
    unless the court allows it for recorded reasons or a defence applies.
- id: m09-075
  module: 9
  lesson: '09.5'
  subject: testers
  difficulty: 1
  question: What is a tester in a discrimination case?
  options:
    - Someone who asks for the same service to check for bias
    - A court-appointed expert on discrimination cases
    - A police officer who investigates discrimination complaints
    - A Commission inspector who measures ramps and doors
  correct: 0
  explanation: >-
    Testers make the same request in the same circumstances, changing only the ground, to produce
    comparison evidence.
- id: m09-076
  module: 9
  lesson: '09.5'
  subject: testers
  difficulty: 2
  question: >-
    A tester check sends a secular man in a suit and a Haredi man in a coat to a bar on different
    nights at different times. What is the main flaw?
  options:
    - Testers may only be women, to avoid confrontations
    - Testers must be lawyers or law students
    - Night and time changed as well as the ground
    - Bars cannot be tested because they are private
  correct: 2
  explanation: A good test changes only the ground being tested; same time window, request and circumstances.
- id: m09-077
  module: 9
  lesson: '09.5'
  subject: testers
  difficulty: 2
  question: Why should each tester write a statement the same day?
  options:
    - To fix the times and words while memory is fresh, for court
    - Because statements written later are illegal
    - Because only same-day statements can be notarised
    - Because the Commission requires it within 24 hours
  correct: 0
  explanation: Same-day statements are more reliable and can later become affidavits (02.6).
- id: m09-078
  module: 9
  lesson: '09.5'
  subject: testers
  difficulty: 3
  question: >-
    A group plans to send testers carrying forged membership cards to see whether a club enforces
    'members only' only against Arabs. What is the problem?
  options:
    - Forgery is deception that taints evidence and exposes testers
    - Testers may not ask a club about its membership rules
    - Clubs are not covered by the services law at all
    - Members-only policies are always lawful in Israel
  correct: 0
  explanation: >-
    Testers should make a real request without invented documents or identities; forgery exposes
    them and weakens the comparison.
- id: m09-079
  module: 9
  lesson: '09.5'
  subject: evidence-log
  difficulty: 1
  question: In an evidence log, what should be recorded for each item besides the date?
  options:
    - Only the name of the file and its size
    - Who, how, where it is stored, and what it proves
    - Only whether it helps or hurts the case
    - Only the serial number of the recording device
  correct: 1
  explanation: A full log shows provenance, storage and relevance, which helps the court trust the evidence.
- id: m09-080
  module: 9
  lesson: '09.5'
  subject: evidence-log
  difficulty: 2
  question: Why keep the original recording untouched and work on copies?
  options:
    - To answer challenges to authenticity
    - Because copies are inadmissible
    - Because editing is a wiretap offence
    - Because courts accept only cloud files
  correct: 0
  explanation: An unedited original with its metadata answers claims that the recording was cut or altered.
- id: m09-081
  module: 9
  lesson: '09.5'
  subject: cctv
  difficulty: 2
  question: When should you ask a business to preserve its CCTV after an incident?
  options:
    - Only after a claim has been filed in court
    - Only through a formal police complaint
    - Only if the business is a public body
    - In writing, the same day or the next morning
  correct: 3
  explanation: >-
    Footage is often overwritten within days; a written request also shows the business knew of the
    claim.
- id: m09-082
  module: 9
  lesson: '09.5'
  subject: publication
  difficulty: 3
  question: >-
    After winning a small claim against a bar, an activist wants to post the bouncer's photo and the
    word 'racist'. What is the most careful approach?
  options:
    - Post the photo and the label, since the claim was won
    - Post nothing ever, because judgments are secret
    - Post only on a private account, which is never publication
    - Post the facts and judgment without his face, after 08.1–08.4
  correct: 3
  explanation: >-
    Defamation and privacy still apply after a win; publishing proven facts and the judgment,
    without unnecessary identification, is far safer.
- id: m09-083
  module: 9
  lesson: '09.5'
  subject: publication
  difficulty: 3
  question: Which piece of evidence is safest to publish before any legal step?
  options:
    - A video showing customers' faces inside the bar
    - Your recording of a staff member's private remarks
    - A list of the bouncers' names and home addresses
    - A screenshot of the business's own public advertisement
  correct: 3
  explanation: >-
    The business's own public advertisement is already public; faces, private remarks and addresses
    raise privacy and defamation risks.
- id: m10-001
  module: 10
  lesson: '10.1'
  subject: planning-institutions
  difficulty: 1
  question: >-
    Which body hears appeals against a local planning committee's decisions where the law gives a
    right of appeal?
  options:
    - The National Planning and Building Council.
    - The Magistrates' Court of the area.
    - The district appeals committee (ועדת ערר).
    - The Minister of the Interior personally.
  correct: 2
  explanation: >-
    Section 12ב(א)(1) gives each district appeals committee the power to hear appeals against local
    committees and local licensing authorities wherever the law grants a right of appeal.
- id: m10-002
  module: 10
  lesson: '10.1'
  subject: local-vs-district
  difficulty: 1
  question: What decides whether a plan is within the local committee's own powers?
  options:
    - Whether the plan covers fewer than ten plots in total.
    - Whether it deals only with topics listed in s. 62א.
    - Whether the mayor and the council majority support it.
    - Whether the land in the plan is privately owned.
  correct: 1
  explanation: >-
    A local outline or detailed plan is within the local committee's powers only if it includes
    nothing but topics from the s. 62א list; anything more goes to the district committee.
- id: m10-003
  module: 10
  lesson: '10.1'
  subject: local-vs-district
  difficulty: 2
  question: >-
    A plan changes the height of a building from 5 to 8 floors without changing its total permitted
    floor area. Which body may approve it?
  options:
    - Only the district committee, because height changes are always district matters.
    - The National Council, because heights are regulated nationally.
    - The appeals committee, after the neighbours have been notified.
    - The local committee, under the s. 62א topic on heights.
  correct: 3
  explanation: >-
    Section 62א(א)(4א) lets the local committee set or change heights and the number of floors as
    long as the total permitted floor area does not change.
- id: m10-004
  module: 10
  lesson: '10.1'
  subject: plan-timeline
  difficulty: 1
  question: What does "הפקדה" (deposit) mean in the life of a plan?
  options:
    - The plan is published and open for public objections.
    - The plan has received final approval and is in force.
    - The developer has paid the planning fees.
    - The plan was rejected and returned to its initiator.
  correct: 0
  explanation: >-
    Deposit is the stage when the plan is published (gazette, newspapers, internet, sign) and the
    objection period runs. Approval and publication of the approval come later.
- id: m10-005
  module: 10
  lesson: '10.1'
  subject: plan-timeline
  difficulty: 2
  question: >-
    A plan was approved and published eight years ago. Now a builder applies for permits under it.
    What public-participation step may still be open?
  options:
    - An objection to the plan, since objections reopen when permits are requested.
    - An appeal against the plan to the appeals committee within 15 days.
    - An objection to any הקלה or non-conforming use the builder requests.
    - Nothing at all, because permits under an approved plan are never published.
  correct: 2
  explanation: >-
    Once a plan is in force its objection period is over. But a request for a הקלה or non-conforming
    use must be published under s. 149, and neighbours may object within 15 days.
- id: m10-006
  module: 10
  lesson: '10.1'
  subject: special-tracks
  difficulty: 1
  question: What is the public's formal response to a national infrastructure (ות״ל) plan called?
  options:
    - ערר (appeal).
    - השגה (challenge).
    - הסתייגות (reservation).
    - קובלנה (private complaint).
  correct: 1
  explanation: >-
    Under s. 76ג(8), anyone entitled to object under s. 100 may file a השגה on a national
    infrastructure plan; an investigator hears it.
- id: m10-007
  module: 10
  lesson: '10.1'
  subject: special-tracks
  difficulty: 2
  question: Who gives final approval to a national infrastructure plan after the השגות are decided?
  options:
    - The district committee of each district the plan crosses.
    - The local committees, by a joint vote.
    - The district appeals committee.
    - The Government (or its ministerial committee).
  correct: 3
  explanation: >-
    Section 76ג sends the infrastructure plan to the Government after the השגות stage, which is why
    a court challenge to the approval is a challenge to a Government decision.
- id: m10-008
  module: 10
  lesson: '10.1'
  subject: special-tracks
  difficulty: 2
  question: Under the Preferred Housing Compounds Law (ותמ״ל), who may object to a deposited plan?
  options:
    - Any person.
    - Only owners of land inside the compound.
    - Only local authorities and ministries.
    - Only bodies approved under s. 100(3).
  correct: 0
  explanation: >-
    Section 18(א) of the 2014 Law says "כל אדם רשאי להגיש התנגדות" — anyone may object, a wider rule
    than s. 100 of the Planning and Building Law.
- id: m10-009
  module: 10
  lesson: '10.1'
  subject: special-tracks
  difficulty: 3
  question: >-
    You are writing a guide in 2026 and want to say the ותמ״ל track is permanent law. What does the
    law itself say?
  options:
    - It became permanent law with its 2021 amendment.
    - It expired in 2018 and no longer applies to any plan.
    - It is temporary, for plans submitted by a set date; check extensions.
    - It applies only to plans in Judea and Samaria, not inside Israel.
  correct: 2
  explanation: >-
    Section 34 makes it a temporary provision: as amended in 2021 it applies to plans submitted
    within six years of 8.8.2021. A guide should say so and tell readers to check for extensions.
- id: m10-010
  module: 10
  lesson: '10.1'
  subject: courts-forum
  difficulty: 2
  question: >-
    A municipality's local committee refuses a permit and the appeals committee upholds the refusal.
    Which court hears a petition against the appeals committee's decision?
  options:
    - The High Court of Justice, as for all planning bodies.
    - The District Court sitting as an Administrative Court.
    - The Magistrates' Court of the area where the plot lies.
    - The appeals committee again, on a request to reconsider.
  correct: 1
  explanation: >-
    Planning and building matters under the 1965 Law are in First Schedule item 10 of the
    Administrative Courts Law, except outline plans, ministers' decisions and enforcement.
- id: m10-011
  module: 10
  lesson: '10.1'
  subject: courts-forum
  difficulty: 3
  question: >-
    Which of these planning decisions is most likely to be challenged in the High Court rather than
    the Administrative Court?
  options:
    - An appeals committee's decision on a הקלה.
    - A district committee's approval of a detailed plan for a neighbourhood.
    - A local committee's refusal of a building permit.
    - The National Council's approval of a national outline plan.
  correct: 3
  explanation: >-
    Item 10 of the First Schedule excludes decisions on national and district outline plans and
    ministers' decisions; those go to the High Court. The others are ordinary planning matters.
- id: m10-012
  module: 10
  lesson: '10.1'
  subject: judea-samaria
  difficulty: 2
  question: Which law governs planning decisions of the Civil Administration in Area C?
  options:
    - Jordanian planning law and military orders, through the Higher Planning Council.
    - The Planning and Building Law 1965, through the Judea and Samaria district committee.
    - The Preferred Housing Compounds Law, through a special committee.
    - Only the Israeli Land Authority's internal procedures.
  correct: 0
  explanation: >-
    Planning there runs under the Jordanian Town, Village and Building Planning Law (No. 79 of 1966)
    and military orders; the Administrative Courts Law's Fourth Schedule refers to exactly these.
- id: m10-013
  module: 10
  lesson: '10.1'
  subject: planning-institutions
  difficulty: 1
  question: How many district planning committees are there?
  options:
    - 'Three: North, Centre and South, plus a national one.'
    - One for every regional council and every city.
    - Twelve, matching the government ministries' districts.
    - 'Six: Jerusalem, North, Haifa, Centre, Tel Aviv, South.'
  correct: 3
  explanation: >-
    Israel has six administrative districts, and each has a district planning committee and a
    district appeals committee.
- id: m10-014
  module: 10
  lesson: '10.1'
  subject: plan-timeline
  difficulty: 2
  question: Before a plan is deposited, which tool lets you see why the committee is moving it forward?
  options:
    - A formal objection, filed early before the deposit notice.
    - The published protocols and recordings of its sessions.
    - An appeal against the committee's decision to discuss it.
    - A request for leave to appeal to the district committee chair.
  correct: 1
  explanation: >-
    Section 48ד makes approved protocols public and requires them to be posted online; recordings
    may be heard free. Objections open only at deposit.
- id: m10-015
  module: 10
  lesson: '10.1'
  subject: special-tracks
  difficulty: 3
  question: >-
    A regional plan would leave an unrecognised village's homes without any residential designation.
    Which response uses the planning system rather than fighting outside it?
  options:
    - Ignoring the plan, since homes without permits cannot be affected by it.
    - Waiting for demolition orders and challenging only those.
    - Objecting to the plan and proposing an alternative residential designation.
    - Appealing to the appeals committee before the plan is deposited.
  correct: 2
  explanation: >-
    Residents have an interest in the land and may object at deposit, ideally with an alternative
    plan. Waiting for enforcement leaves only narrow challenges.
- id: m10-016
  module: 10
  lesson: '10.1'
  subject: planning-institutions
  difficulty: 2
  question: What is special about an independent local committee (ועדה מקומית עצמאית) for an objector?
  options:
    - Its decisions on plans cannot be challenged anywhere at all.
    - Objectors need the appeals committee chair's leave to appeal its plans.
    - It hears appeals against the other local committees in its district.
    - Its plans are approved without deposit or any objection period.
  correct: 1
  explanation: >-
    Section 112(א1) requires objectors (and initiators) to get leave from the appeals committee
    chair to appeal plan decisions of an independent local committee.
- id: m10-017
  module: 10
  lesson: '10.1'
  subject: plan-timeline
  difficulty: 2
  question: A deposited plan received no objections at all by the end of the period. What happens?
  options:
    - It must be deposited again for a further month of objections.
    - The district committee must still hold a public hearing on it.
    - It lapses automatically, and the initiator must start again.
    - It is treated as approved 30 days later unless the body decides otherwise.
  correct: 3
  explanation: >-
    Under s. 108(ג), a deposited plan with no objections is treated as approved by the competent
    body 30 days after the objection period ends, unless the body decides otherwise in that time.
- id: m10-018
  module: 10
  lesson: '10.2'
  subject: finding-plans
  difficulty: 1
  question: >-
    Where must a notice on the deposit of a local detailed plan be displayed in addition to
    newspapers and websites?
  options:
    - On a sign at a prominent place in the plan area for the objection period.
    - Only on the notice board inside the local committee's own office.
    - On the website of the Knesset's Interior Committee for one week.
    - On the developer's own website, for as long as the developer chooses.
  correct: 0
  explanation: >-
    Section 89א requires a sign in the plan area for the whole objection period, with the main
    differences between the existing and proposed plans; s. 89 adds gazette, newspapers and notice
    boards.
- id: m10-019
  module: 10
  lesson: '10.2'
  subject: finding-plans
  difficulty: 1
  question: On Mavat's advanced search, which detail lets you find every plan that affects your own plot?
  options:
    - The developer's company number.
    - The name of the committee chair.
    - The gush and chelka of the plot.
    - The date the building was completed.
  correct: 2
  explanation: >-
    Advanced search ("חיפוש מתקדם") accepts gush and chelka ranges, along with district, planning
    area, locality, street and status.
- id: m10-020
  module: 10
  lesson: '10.2'
  subject: reading-plans
  difficulty: 1
  question: In a plan's map, what is the difference between "מצב מאושר" and "מצב מוצע"?
  options:
    - The binding and the guiding layers of the same map.
    - The current approved situation and the proposed one.
    - The developer's version and the committee's version.
    - The uses above ground and the uses underground.
  correct: 1
  explanation: >-
    The approved situation shows what existing plans allow; the proposed situation shows the change.
    Compare both, or you may object to something already approved.
- id: m10-021
  module: 10
  lesson: '10.2'
  subject: reading-plans
  difficulty: 1
  question: >-
    Which part of a plan tells you the main floor area, service area, units, floors and building
    lines for each plot?
  options:
    - The legend (מקרא) printed on the map sheet.
    - The deposit notice published in the newspaper.
    - The traffic appendix (נספח תנועה) of the plan.
    - The rights table (טבלת זכויות והוראות בנייה).
  correct: 3
  explanation: >-
    The rights table, chapter 5 in most plans in the standard format, sets the numbers for each
    plot. Quote its rows in your objection.
- id: m10-022
  module: 10
  lesson: '10.2'
  subject: appendices
  difficulty: 2
  question: >-
    A traffic appendix promises a new junction before occupancy. It is marked "מנחה". What is the
    practical risk?
  options:
    - None, since guiding appendices bind the permit stage too.
    - The whole plan is void until the appendix is made binding.
    - The junction may never be required; ask for a binding condition.
    - The appeals committee must approve the appendix separately.
  correct: 2
  explanation: >-
    A guiding appendix illustrates; it does not oblige. If the junction matters, ask for a binding
    condition in the implementation chapter.
- id: m10-023
  module: 10
  lesson: '10.2'
  subject: protocols-foi
  difficulty: 2
  question: >-
    The committee's deposit protocol mentions a "traffic survey from June" that is not on Mavat. How
    do you get it?
  options:
    - File an FOI request with the committee early in the period.
    - Ask the court for discovery before you file the objection.
    - Wait for the hearing, where all documents are handed out.
    - Ask a committee member to forward it to you privately.
  correct: 0
  explanation: >-
    Documents that are not published are requested under the FOI Law (lesson 05.2). File early so
    the answer arrives in time to use.
- id: m10-024
  module: 10
  lesson: '10.2'
  subject: protocols-foi
  difficulty: 1
  question: >-
    Does it cost anything to read an approved protocol of a planning committee session or hear its
    recording?
  options:
    - Yes, the FOI request fee applies.
    - Yes, a per-page copying fee set by the committee.
    - Only for people who are not residents of the area.
    - No, inspection and listening are free.
  correct: 3
  explanation: >-
    Section 48ד(ה)(1) says inspecting approved protocols and listening to recordings is free of
    charge.
- id: m10-025
  module: 10
  lesson: '10.2'
  subject: reading-plans
  difficulty: 2
  question: You want to describe a plan's effect in your objection. Which sentence is best?
  options:
    - '"The plan will destroy our quiet and green neighbourhood."'
    - '"Plot 4: 6 to 14 floors, rear line 5 m to 3 m (rights table)."'
    - '"Everyone knows the developer really wants 30 floors."'
    - '"The towers are much too high for a street like ours."'
  correct: 1
  explanation: >-
    Committees act on specific provisions. Quoting the rights table row, with before and after
    numbers, makes the point checkable.
- id: m10-026
  module: 10
  lesson: '10.2'
  subject: finding-plans
  difficulty: 2
  question: >-
    You want to hear about every new plan in your town without checking Mavat every day. Which free
    tool does Kol Zchut point to?
  options:
    - The Knesset's legislation database alerts.
    - The Israel Land Authority's tender site.
    - Meirim (מעירים) e-mail alerts by area and topic.
    - The court's Net HaMishpat notifications.
  correct: 2
  explanation: >-
    Meirim sends e-mail alerts about new plans by location and subject (signup needed). Kol Zchut's
    objection page recommends it.
- id: m10-027
  module: 10
  lesson: '10.2'
  subject: reading-plans
  difficulty: 2
  question: >-
    Where in a plan's documents do you usually find conditions such as "no occupancy before the
    school is built"?
  options:
    - In the provisions on implementation and permit conditions.
    - In the legend printed in the corner of the map sheet.
    - In the newspaper notice announcing the plan's deposit.
    - In the list of gush and chelka numbers in chapter 1.
  correct: 0
  explanation: >-
    Stages and permit or occupancy conditions sit in the additional provisions and implementation
    chapters. If a needed condition is missing, ask to add it.
- id: m10-028
  module: 10
  lesson: '10.2'
  subject: reading-plans
  difficulty: 3
  question: >-
    Spot the mistake. A residents' leaflet says: "Plan 507-0999999 will turn the park into towers —
    see the map." The proposed map shows the park unchanged; a separate approved plan from 2015
    already allows towers on the next plot. What went wrong?
  options:
    - Nothing; any plan in the area may be blamed for the towers.
    - They read a guiding appendix as if it were a binding one.
    - They counted the deadline from the wrong newspaper notice.
    - They blamed the wrong plan by skipping the approved situation.
  correct: 3
  explanation: >-
    The towers come from an older approved plan. An objection to the new plan on that point would
    fail; the leaflet should describe what the new plan changes.
- id: m10-029
  module: 10
  lesson: '10.2'
  subject: environmental-review
  difficulty: 2
  question: Where would you look for the plan's assessment of air, noise and traffic effects?
  options:
    - In the deposit sign that stands on the site of the plan.
    - In the environmental impact statement or environmental opinion.
    - In the land registry extract for each plot in the plan.
    - In the planning committee's annual report to the ministry.
  correct: 1
  explanation: >-
    Plans with significant effects carry an environmental impact statement (s. 119ג) or an
    environmental opinion. Check what it covers and who it ignores.
- id: m10-030
  module: 10
  lesson: '10.2'
  subject: objection-deadline
  difficulty: 3
  question: >-
    The plan page shows one last date for objections, and your own count from the newspapers gives a
    date two days later. What do you do?
  options:
    - File by the earlier date and ask the secretariat about the gap.
    - Rely on your own count, since the law prevails over a website.
    - Rely on the sign on the site, which is the official record.
    - File on the later date and attach your own calculation.
  correct: 0
  explanation: >-
    Filing by the earlier date removes the risk. The law prevails, but a dispute over two days is
    not worth losing your objection.
- id: m10-031
  module: 10
  lesson: '10.2'
  subject: finding-plans
  difficulty: 3
  question: >-
    A plan for a road near a Druze village was published in Hebrew newspapers only. Arabic speakers
    are over ten per cent of the planning area. What may residents argue?
  options:
    - Nothing, since publication in Hebrew is always enough by law.
    - That the plan must be re-approved by the National Council.
    - 'That s. 1א also required an Arabic newspaper: a publication defect.'
    - That the plan is void because the sign had no English text.
  correct: 2
  explanation: >-
    Section 1א(א)(2) requires, in planning areas where Arabic speakers are at least ten per cent,
    one publication in an Arabic newspaper; s. 89א(ב) also requires Arabic on the sign. Raise it
    promptly in the objection.
- id: m10-032
  module: 10
  lesson: '10.2'
  subject: reading-plans
  difficulty: 1
  question: What is a building line (קו בניין)?
  options:
    - The maximum height a building may reach on the plot.
    - The minimum distance of a building from the plot edge.
    - The number of housing units allowed on each floor.
    - The route of a planned road through the plan area.
  correct: 1
  explanation: >-
    Building lines set how close to the plot boundary you may build; changing them is a s. 62א topic
    and a common הקלה request.
- id: m10-033
  module: 10
  lesson: '10.2'
  subject: existing-objections
  difficulty: 2
  question: Why read the objections already published under a plan's "התנגדויות" tab before writing yours?
  options:
    - Because only the first objection on each topic is heard.
    - Because copying another objection makes yours a group objection.
    - Because published objections replace the need for an affidavit.
    - To coordinate, avoid repetition, and prepare answers to opposing objections.
  correct: 3
  explanation: >-
    Others may raise your points better, or ask for the opposite. The body may hear only some of
    identical objections (s. 106(ג)), so coordination helps.
- id: m10-034
  module: 10
  lesson: '10.2'
  subject: plan-numbers
  difficulty: 1
  question: In a new-format plan number such as 507-0403931, what do the first three digits indicate?
  options:
    - The planning area.
    - The year of submission.
    - The number of housing units.
    - The district appeals committee.
  correct: 0
  explanation: >-
    The prefix identifies the planning area (507 is Tel Aviv-Jaffa); the rest is the plan's serial
    number.
- id: m10-035
  module: 10
  lesson: '10.3'
  subject: standing
  difficulty: 1
  question: Under s. 100, which of these people may object to a deposited plan?
  options:
    - Only registered owners of land inside the plan's area.
    - Only residents of the same municipality as the plan.
    - Anyone interested who sees themselves harmed by the plan.
    - Only people whom the committee invites to take part.
  correct: 2
  explanation: >-
    Section 100 opens objections to anyone "interested" who sees themselves harmed, plus listed
    public bodies; Kol Zchut notes CA 2962/97 held prima facie harm is enough.
- id: m10-036
  module: 10
  lesson: '10.3'
  subject: standing
  difficulty: 2
  question: >-
    A tenant (not an owner) uses a public garden that a plan turns into parking. May the tenant
    object?
  options:
    - Yes, as someone interested in a planning detail and harmed.
    - No, because only registered owners have an interest in land.
    - Only with the landlord's written consent to the objection.
    - Only through the local authority, which objects for tenants.
  correct: 0
  explanation: >-
    The interest may be in "any other planning detail"; a regular user harmed by losing public open
    space can object, explaining the interest and the harm (reg. 3(1)).
- id: m10-037
  module: 10
  lesson: '10.3'
  subject: objection-deadline
  difficulty: 1
  question: What is the basic objection period for a deposited plan under s. 102?
  options:
    - 15 days from the day the sign is put up on site.
    - 30 days from the publication in the official gazette.
    - 45 days from the committee's decision to deposit.
    - Two months from the later newspaper publication.
  correct: 3
  explanation: >-
    Section 102 sets two months from the deposit notice, counted from the later newspaper
    publication; the body may extend to three months.
- id: m10-038
  module: 10
  lesson: '10.3'
  subject: objection-deadline
  difficulty: 2
  question: Can the planning body give more time than two months to object?
  options:
    - No, the two-month period is fixed by law for every plan.
    - Yes, up to three months in total, for a case or type of plans.
    - Yes, without any limit, if many people ask to object.
    - Only a court can extend it, on a motion by an objector.
  correct: 1
  explanation: >-
    Section 102 allows the depositing body to set a longer period, not exceeding three months, for a
    particular case or class of plans.
- id: m10-039
  module: 10
  lesson: '10.3'
  subject: where-to-file
  difficulty: 1
  question: Where is an objection to a district outline plan filed?
  options:
    - With the local committee, copy to the district committee.
    - With the district appeals committee, copy to the Council.
    - With the National Council, copy to the district committee.
    - With the Interior Ministry's legal adviser, by registered mail.
  correct: 2
  explanation: >-
    Section 103(1) sends objections to district outline plans to the National Council, with a copy
    to the district committee concerned.
- id: m10-040
  module: 10
  lesson: '10.3'
  subject: objection-content
  difficulty: 1
  question: How many copies of a paper objection do the 1989 regulations require?
  options:
    - Four.
    - One original only.
    - Six, plus one for each respondent.
    - Two, plus an online copy.
  correct: 0
  explanation: >-
    Reg. 3 requires the objection in four copies. Six copies (or two plus online) is the rule for
    appeals to appeals committees.
- id: m10-041
  module: 10
  lesson: '10.3'
  subject: affidavit
  difficulty: 1
  question: What does the affidavit attached to an objection verify?
  options:
    - The planning arguments.
    - The objector's political views on the plan.
    - The legal conclusions.
    - The facts the objection relies on.
  correct: 3
  explanation: >-
    Section 103א(א) requires an affidavit verifying the facts on which the objection relies;
    arguments belong in the objection itself.
- id: m10-042
  module: 10
  lesson: '10.3'
  subject: affidavit
  difficulty: 2
  question: >-
    Spot the mistake in this affidavit paragraph: "4. The plan is unreasonable and contradicts the
    district outline plan, as any planner can see."
  options:
    - It should begin with "to the best of my knowledge and belief".
    - It states arguments and opinions, not facts the declarant knows.
    - It should be written in the third person, not the first.
    - It should cite the court ruling that defines unreasonableness.
  correct: 1
  explanation: >-
    An affidavit verifies facts: what you measured, saw or hold. Unreasonableness and contradiction
    with a higher plan are arguments for the objection text.
- id: m10-043
  module: 10
  lesson: '10.3'
  subject: group-objection
  difficulty: 3
  question: >-
    Neighbours want one representative affidavit for a group objection about the value of their
    apartments falling. Does s. 103א(ב) allow it?
  options:
    - Yes, for any objection that has more than five objectors.
    - Yes, as long as all the objectors live in the same building.
    - No; the rule covers public issues such as nature and quality of life.
    - No, because groups may never object together to one plan.
  correct: 2
  explanation: >-
    The representative-affidavit rule covers public issues of heritage sites, nature, landscape,
    quality of life and environment. Personal or property claims need each objector's affidavit, as
    the online service also says.
- id: m10-044
  module: 10
  lesson: '10.3'
  subject: online-filing
  difficulty: 1
  question: What login does the Planning Administration's online objection form require?
  options:
    - The National Digital Identity (הזדהות לאומית).
    - A lawyer's smart card issued by the Bar Association.
    - A Net HaMishpat account opened at the court registry.
    - None; the form can be sent anonymously by anyone.
  correct: 0
  explanation: >-
    The form is reached from the plan page on Mavat and requires the government identification
    login.
- id: m10-045
  module: 10
  lesson: '10.3'
  subject: online-filing
  difficulty: 2
  question: After you send an online objection, when does it appear on the plan page?
  options:
    - Immediately after sending, under your user name.
    - Only after the hearing of all objections is over.
    - Never, because online objections are kept confidential.
    - After the committee secretariat checks and approves it.
  correct: 3
  explanation: >-
    The Planning Administration's guide says the objection is shown under the "התנגדויות" tab only
    after the district secretariat has checked and approved it.
- id: m10-046
  module: 10
  lesson: '10.3'
  subject: online-filing
  difficulty: 2
  question: >-
    A group of 35 objectors files online through one representative. What extra file does the
    service ask for?
  options:
    - A separate affidavit from the committee chair.
    - An Excel file with the objectors' details.
    - A court approval of the group.
    - A copy of each objector's land registry extract.
  correct: 1
  explanation: >-
    For more than 20 objectors, the service asks for their details in an Excel file, together with
    the power of attorney or signatures page.
- id: m10-047
  module: 10
  lesson: '10.3'
  subject: objection-content
  difficulty: 2
  question: Which argument is weakest in a planning objection?
  options:
    - The plan removes the only public open space within 400 m.
    - The plan contradicts a binding provision of the district outline plan.
    - The developer is a bad person who cannot be trusted.
    - The plan adds 300 units with no new school or kindergarten.
  correct: 2
  explanation: >-
    Planning bodies decide on planning grounds. Personal attacks persuade no one and can expose you
    to defamation claims (Module 8).
- id: m10-048
  module: 10
  lesson: '10.3'
  subject: objection-content
  difficulty: 3
  question: >-
    Your objection lists ten arguments in random order and asks only to "reject the plan". How would
    you improve it most?
  options:
    - Add more arguments, since quantity impresses planning committees.
    - Remove the affidavit so that the file is shorter to read.
    - Move all the arguments into the affidavit so they are verified.
    - Put the requested changes on page one, strongest arguments first.
  correct: 3
  explanation: >-
    Committees accept changes far more often than they reject whole plans. A clear list of requested
    changes and a strength-ordered argument make the objection usable.
- id: m10-049
  module: 10
  lesson: '10.3'
  subject: hakala
  difficulty: 1
  question: What is a הקלה?
  options:
    - A permitted deviation from the plan, decided at the permit stage.
    - A tax reduction for building in a town in the periphery.
    - An exemption from the need to obtain any building permit.
    - A shorter objection period for plans that are urgent.
  correct: 0
  explanation: >-
    Section 1 defines הקלה as permission for work needing a permit in deviation from a plan. Section
    149 sets publication and a 15-day objection period.
- id: m10-050
  module: 10
  lesson: '10.3'
  subject: hakala
  difficulty: 2
  question: Who must receive personal notice of a request for a הקלה under s. 149?
  options:
    - Every resident of the municipality, by a letter to each home.
    - Only the members of the local council and the local committee.
    - Owners and occupiers of the plot, adjoining plots and others likely harmed.
    - Only the applicant's bank and the registered mortgage holders.
  correct: 2
  explanation: >-
    Section 149(א)(2א) requires notice to owners and occupiers of the property, of adjoining
    properties, and of others the committee thinks may be harmed. The 15 days run from delivery for
    them.
- id: m10-051
  module: 10
  lesson: '10.3'
  subject: costs
  difficulty: 2
  question: When may a planning body order an objector to pay the initiator's costs?
  options:
    - Whenever the objection is rejected by the committee.
    - When it was filed in bad faith and is vexatious.
    - Whenever the objector does not live in the town.
    - Never, because planning bodies have no power over costs.
  correct: 1
  explanation: >-
    Section 106(ד)(1) allows costs against an objector only for a bad-faith, vexatious objection; s.
    106(ד)(2) allows costs in the objector's favour when the objection was justified.
- id: m10-052
  module: 10
  lesson: '10.3'
  subject: affidavit
  difficulty: 3
  question: >-
    Two days before the deadline you discover your affidavit was never certified. Which step best
    protects the objection?
  options:
    - File the objection without it and say the affidavit will follow.
    - Sign the affidavit yourself and attach it uncertified.
    - Skip the objection and appeal after approval instead.
    - Get it certified the same day, file on time, and keep proof of filing.
  correct: 3
  explanation: >-
    An objection without an affidavit "shall not be accepted and shall not be heard" (s. 103א). The
    body may allow a correction instead of striking out (reg. 7(ב)), but do not rely on that.
- id: m10-053
  module: 10
  lesson: '10.3'
  subject: where-to-file
  difficulty: 2
  question: >-
    Spot the mistake: Noa files an objection to a district committee plan with the district
    committee and keeps a copy at home. What did she miss?
  options:
    - She should have filed it with the district appeals committee.
    - She had to send a copy to the local committee and keep proof.
    - She should have filed it with the National Council instead.
    - Nothing, because one filing with one committee is enough.
  correct: 1
  explanation: >-
    For a district plan, s. 103(2) and reg. 4(ב) require a copy to the local committee concerned,
    with evidence of service and its date.
- id: m10-054
  module: 10
  lesson: '10.3'
  subject: online-filing
  difficulty: 3
  question: >-
    An objector's reasons file includes the ages and school names of her children, to show harm from
    traffic. What is the better approach?
  options:
    - Keep them, because personal details make the harm credible.
    - Delete the whole traffic argument from the objection file.
    - Describe the harm generally; leave the children's details out.
    - Ask the committee to keep the entire objection file secret.
  correct: 2
  explanation: >-
    Online objection files are published. Describe the harm ("my children walk to the school on this
    street") without identifying details; the service itself warns against personal details.
- id: m10-055
  module: 10
  lesson: '10.3'
  subject: objection-content
  difficulty: 2
  question: >-
    A farmer's objection to a road plan includes a proposed alternative alignment. Why does that
    help?
  options:
    - It shows how to meet the plan's goal with less harm.
    - It obliges the committee to adopt the alternative route.
    - It replaces the need to show any harm to the objector.
    - It turns the objection into an appeal to the National Council.
  correct: 0
  explanation: >-
    Planning bodies weigh goals against harm. A realistic alternative makes it easier to accept the
    objection in part by changing the plan (s. 106(ב)).
- id: m10-056
  module: 10
  lesson: '10.3'
  subject: special-tracks
  difficulty: 3
  question: >-
    For a ותמ״ל plan, the sign went up on 1 June, the last newspaper notice was on 3 June and the
    Ministry's website notice on 5 June. From which date do the 60 days run?
  options:
    - 1 June, the sign.
    - 3 June, the newspaper.
    - The date of the decision to deposit.
    - 5 June, the latest of the three.
  correct: 3
  explanation: >-
    Section 18(ב) of the 2014 Law counts from the latest of the last sign, the last newspaper
    publication and the website publication.
- id: m10-057
  module: 10
  lesson: '10.3'
  subject: hakala
  difficulty: 3
  question: >-
    You never got a personal notice about your neighbour's הקלה, but a newspaper notice appeared 20
    days ago. You are an adjoining owner. What can you argue?
  options:
    - Nothing, because the newspaper notice binds everyone equally.
    - That the whole plan for the area must be deposited again.
    - That your 15 days run from personal notice, never delivered.
    - That the permit is void because the sign on site was too small.
  correct: 2
  explanation: >-
    Section 149(א)(1) counts the 15 days from delivery of the notice for those entitled to personal
    notice. Raise it at once with the committee and, if needed, on appeal.
- id: m10-058
  module: 10
  lesson: '10.3'
  subject: standing
  difficulty: 3
  question: >-
    A national religious-Zionist organisation with no land in the area wants to object to a plan
    affecting a historic synagogue. It is not on the s. 100(3) list. What is its best route?
  options:
    - Object in its own name, since any organisation may object.
    - Support members with a direct interest to object, with expert input.
    - Skip the objection and file an appeal directly after approval.
    - Ask the Minister to add it to the list before the deadline ends.
  correct: 1
  explanation: >-
    Only bodies approved by order have automatic standing. Members with an interest in the land or
    the planning detail can object, and the organisation can provide research and an expert opinion.
- id: m10-059
  module: 10
  lesson: '10.3'
  subject: affidavit
  difficulty: 2
  question: Who may question the declarant on an objection affidavit, and when?
  options:
    - The deciding body, once the hearing starts, or its chair before.
    - Only the developer's lawyer, and only in written questions.
    - Only a court, because planning bodies cannot question people.
    - Nobody, since affidavits in planning are never tested.
  correct: 0
  explanation: >-
    Reg. 9 lets the deciding body require the declarant to appear and answer questions; its chair
    may ask for this before the hearing to avoid delay.
- id: m10-060
  module: 10
  lesson: '10.4'
  subject: hearing
  difficulty: 1
  question: How much notice must objectors get of the objection hearing?
  options:
    - 3 days before the hearing.
    - 7 days before the hearing.
    - 30 days before the hearing.
    - 14 days at least.
  correct: 3
  explanation: Reg. 6(א) requires invitations at least 14 days before the hearing, and a public notice of it.
- id: m10-061
  module: 10
  lesson: '10.4'
  subject: hearing
  difficulty: 1
  question: Is the hearing of objections open to the public?
  options:
    - Yes, s. 107 says it is held in public.
    - No, only the parties may attend it.
    - Only if the chair allows the public in.
    - Only for district plans, not local ones.
  correct: 0
  explanation: >-
    Section 107 requires objections to be heard in public; the deliberation and vote may be
    separate.
- id: m10-062
  module: 10
  lesson: '10.4'
  subject: hearing
  difficulty: 2
  question: In what order do the parties speak at an objection hearing?
  options:
    - The initiator first, then the committee planner, then objectors.
    - Any order the chair chooses, since there are no rules on it.
    - Objector first, then the initiator and others; objector replies.
    - All objectors together first, then an immediate vote.
  correct: 2
  explanation: >-
    Reg. 12 sets the order: objector, then the initiator and others entitled under s. 107, with a
    right of reply for the objector.
- id: m10-063
  module: 10
  lesson: '10.4'
  subject: hearing
  difficulty: 2
  question: >-
    The committee appoints an investigator (חוקר) because there are 400 objections. What does the
    investigator do?
  options:
    - Decides the objections finally, instead of the committee.
    - Hears the objections and recommends to the committee.
    - Investigates the identities and motives of the objectors.
    - Approves the plan if no objector comes to the hearing.
  correct: 1
  explanation: >-
    Under s. 107א the investigator hears objections and recommends; the committee decides after
    reading the recommendations.
- id: m10-064
  module: 10
  lesson: '10.4'
  subject: hearing
  difficulty: 3
  question: You have five minutes at the hearing. Which opening is most effective?
  options:
    - Reading the first three pages of the objection word for word.
    - Criticising the committee for the towers it approved before.
    - Asking for an adjournment so that a lawyer can attend later.
    - Who you are, the harm, and your three requested changes, with a map.
  correct: 3
  explanation: >-
    Committees hear many objections in one session. A short statement of the requested changes,
    backed by a map, gives them something to decide.
- id: m10-065
  module: 10
  lesson: '10.4'
  subject: decision
  difficulty: 1
  question: What must the objector receive after the committee decides the objection?
  options:
    - A written notice of the decision and its reasons.
    - Only an oral announcement at the end of the hearing.
    - A refund of the fee paid when filing the objection.
    - A copy of the developer's contract with the landowners.
  correct: 0
  explanation: >-
    Section 108(ב) requires written notice of the decision on objections and its reasons to the
    objector and to anyone heard under s. 106.
- id: m10-066
  module: 10
  lesson: '10.4'
  subject: appeal-routes
  difficulty: 1
  question: >-
    Within how many days must an objector appeal a local committee's approval of a plan to the
    appeals committee?
  options:
    - 7 days from the decision.
    - 30 days from the decision.
    - 15 days from service.
    - 45 days from publication.
  correct: 2
  explanation: >-
    Section 112(ב) sets 15 days from the day the local committee's decision was served on the
    appellant.
- id: m10-067
  module: 10
  lesson: '10.4'
  subject: appeal-routes
  difficulty: 2
  question: You never objected to a local plan. After approval you want to appeal. Can you?
  options:
    - Yes, anyone may appeal within 15 days of the approval.
    - Generally no; only rejected objectors or those heard may appeal.
    - Yes, if you pay double the usual appeal fee to the committee.
    - Only with the National Council's permission, given in writing.
  correct: 1
  explanation: >-
    Section 112(א) lists who may appeal; for the public it is people whose objection was rejected or
    who were heard under s. 106(ב). That is why the objection matters.
- id: m10-068
  module: 10
  lesson: '10.4'
  subject: appeal-routes
  difficulty: 2
  question: >-
    After a district committee approves a plan, when must the appeal to the National Council be
    filed if the chair grants leave?
  options:
    - Within 7 days of the hearing before the district committee.
    - Within 15 days of the publication of the plan's approval.
    - Within 60 days of the decision, like a civil appeal.
    - Within 30 days of service of the decision or the leave.
  correct: 3
  explanation: >-
    Section 110(ד) requires the appeal within 30 days from the day the decision or the leave, as the
    case may be, was served on the appellant.
- id: m10-069
  module: 10
  lesson: '10.4'
  subject: appeal-routes
  difficulty: 3
  question: >-
    The appeals committee rejected your appeal on a local plan. You want to go further within the
    planning system. What is the deadline for the first step?
  options:
    - 7 days to ask the appeals chair for leave to go to the district.
    - 15 days to appeal to the National Council, as of right.
    - 30 days to ask the Minister of the Interior to review it.
    - None; nothing follows an appeals decision on a plan.
  correct: 0
  explanation: >-
    Section 111 allows an appeal to the district committee with the appeals committee chair's leave;
    the request is due within 7 days, and the appeal within 7 days of leave. The district decision
    is final.
- id: m10-070
  module: 10
  lesson: '10.4'
  subject: appeal-document
  difficulty: 1
  question: Which of these must an appeal to an appeals committee include under reg. 3?
  options:
    - The signature of a lawyer who represents the appellant.
    - A copy of the decision notice and the respondents' details.
    - An expert opinion signed by a licensed town planner.
    - A copy of the developer's registered title to the land.
  correct: 1
  explanation: >-
    Reg. 3 requires the appellant's details, the plan or request, the decision and a copy of its
    notice, the respondents and addresses, the reasons and the main evidence. A lawyer is optional.
- id: m10-071
  module: 10
  lesson: '10.4'
  subject: appeal-document
  difficulty: 2
  question: >-
    Spot the mistake: an appeal against a local plan lists only the local committee as respondent.
    Who else should normally be named?
  options:
    - The Minister of the Interior, who supervises committees.
    - The district appeals committee that will hear the case.
    - The plan's initiator, and anyone heard on the point.
    - Every resident of the street who did not file an objection.
  correct: 2
  explanation: >-
    Reg. 4(1) makes respondents the local committee, the initiator, objectors whose objection was
    accepted (if that is the subject) and those heard under s. 106(ב) on the point.
- id: m10-072
  module: 10
  lesson: '10.4'
  subject: appeal-document
  difficulty: 2
  question: Within how long must respondents answer an appeal about a plan, under reg. 6?
  options:
    - 7 days from service of the appeal.
    - 15 days from service of the appeal.
    - 60 days from service of the appeal.
    - 30 days from service of the appeal.
  correct: 3
  explanation: >-
    Respondents to plan appeals have 30 days; respondents to permit appeals have 15 days (reg.
    6(א)).
- id: m10-073
  module: 10
  lesson: '10.4'
  subject: appeal-routes
  difficulty: 3
  question: >-
    An appeal against a decision on a building permit is pending. Can the permit be issued
    meanwhile?
  options:
    - No, unless the appeals committee decides, with reasons, not to delay it.
    - Yes, permits are issued and cancelled only if the appeal succeeds.
    - Only if the applicant deposits a bank guarantee with the committee.
    - Only if the local committee chair signs a special approval for it.
  correct: 0
  explanation: >-
    Section 152(ב)(1) bars issuing the permit until the appeals committee decides, but s. 152(ב)(2)
    lets the committee allow it, with reasons, considering the effect and reversibility.
- id: m10-074
  module: 10
  lesson: '10.4'
  subject: court-review
  difficulty: 2
  question: Why should you file the planning appeal before petitioning a court?
  options:
    - Because courts never hear any case about planning at all.
    - Because a petition costs nothing if you appealed before it.
    - Courts expect the available planning remedies to be used first.
    - Because the appeals committee can award you compensation.
  correct: 2
  explanation: >-
    A petition that skips an available appeal is likely to be dismissed for failure to exhaust
    remedies (Module 4). The appeal is also faster and cheaper.
- id: m10-075
  module: 10
  lesson: '10.4'
  subject: enforcement-petitions
  difficulty: 3
  question: >-
    Two groups, one demanding demolition of an unpermitted structure and one demanding a plan that
    would legalise it, both petition. What does this show about the tools?
  options:
    - Only one political side may use enforcement petitions.
    - The same procedures serve opposite aims; courts test process.
    - Courts must decide for whichever side petitioned first.
    - Planning petitions are for NGOs only, never for residents.
  correct: 1
  explanation: >-
    Regavim, Peace Now, Bimkom and residents have all used planning objections and petitions for
    opposite goals. Courts examine legality and discretion, not which side is right politically.
- id: m10-076
  module: 10
  lesson: '10.4'
  subject: appeal-document
  difficulty: 3
  question: Your appeal mostly repeats your objection word for word. What should you change?
  options:
    - Nothing, since the appeal is a fresh hearing on the plan.
    - Add new arguments you did not raise, without saying so.
    - Remove the copy of the decision to keep the appeal short.
    - Focus on the decision's errors, gaps and missing reasons.
  correct: 3
  explanation: >-
    An appeal attacks the decision. Show what the committee failed to address or got wrong; attach
    the objection as background. New arguments need permission (reg. 11(ה)).
- id: m10-077
  module: 10
  lesson: '10.5'
  subject: env-reporting
  difficulty: 1
  question: What is the phone number of the Ministry of Environmental Protection's environment hotline?
  options:
    - '*6911, the environment hotline.'
    - '*3639, the nature hotline.'
    - 106, the municipal hotline.
    - 1299, the government call centre.
  correct: 0
  explanation: >-
    The Ministry's environment hotline (מוקד הסביבה) is *6911, open 24/7. *3639 is the Nature and
    Parks Authority; 106 is the municipal hotline.
- id: m10-078
  module: 10
  lesson: '10.5'
  subject: env-reporting
  difficulty: 1
  question: Loud music from a neighbour's party at 1 a.m. Who handles it according to the Ministry's table?
  options:
    - The Ministry's environment hotline.
    - The Nature and Parks Authority.
    - The district planning committee.
    - The police or the municipal hotline.
  correct: 3
  explanation: >-
    The Ministry's own table sends noise hazards to the police (100) and the municipal hotline
    (106).
- id: m10-079
  module: 10
  lesson: '10.5'
  subject: citizen-suit
  difficulty: 1
  question: >-
    Which court hears an injunction suit under the Prevention of Environmental Hazards (Civil
    Claims) Law?
  options:
    - The District Court.
    - The Magistrates' Court.
    - The High Court.
    - The appeals committee.
  correct: 1
  explanation: Section 1 of the 1992 Law defines "court" as the Magistrates' Court.
- id: m10-080
  module: 10
  lesson: '10.5'
  subject: citizen-suit
  difficulty: 2
  question: What must a resident prove to get an order under s. 2 of the 1992 Law?
  options:
    - That the polluter acted negligently, with an expert opinion.
    - That the polluter's managers have a criminal record.
    - A hazard harming or likely to harm them; negligence is irrelevant.
    - That the resident has suffered a measurable financial loss.
  correct: 2
  explanation: >-
    Section 2 allows orders for those harmed or likely to be harmed; s. 4 says it does not matter
    whether the polluter was negligent. The court weighs harms under s. 3.
- id: m10-081
  module: 10
  lesson: '10.5'
  subject: citizen-suit
  difficulty: 2
  question: What remedies can a court give under s. 2 of the 1992 Law?
  options:
    - Stop the act, restore the former state, and prevent a repeat.
    - Only damages for past harm, assessed by a court expert.
    - Criminal fines against the polluter and its managers.
    - Revocation of the polluter's business licence by the court.
  correct: 0
  explanation: >-
    The orders are to refrain or stop, to restore (תיקון המעוות), and to do what is needed to
    prevent a repeat. Damages are possible only for a repeat hazard within two years (s. 9).
- id: m10-082
  module: 10
  lesson: '10.5'
  subject: emission-permits
  difficulty: 2
  question: Where are draft emission permits and the public's comments published?
  options:
    - Only in the official gazette (Reshumot), in print.
    - On the polluting company's own website, by law.
    - In the local planning committee's session protocols.
    - On the Ministry of Environmental Protection's website.
  correct: 3
  explanation: >-
    Clean Air Law s. 21 requires the application, the draft permit and the public's comments to be
    published on the Ministry's website.
- id: m10-083
  module: 10
  lesson: '10.5'
  subject: env-complaint
  difficulty: 2
  question: >-
    Spot the mistake in a complaint: "Shmuel Cohen, the owner, is a criminal poisoning our
    children." What should it say instead?
  options:
    - '"Shmuel Cohen, the owner, is probably a criminal."'
    - Nothing; strong words get the Ministry to act faster.
    - 'Dated facts: "smoke on 4, 7 and 9 March; data attached".'
    - '"Everyone in the village knows exactly who did it."'
  correct: 2
  explanation: >-
    State observed facts and evidence; let the authority decide on fault. Accusing a named person of
    a crime risks a defamation claim (Module 8).
- id: m10-084
  module: 10
  lesson: '10.5'
  subject: group-claims
  difficulty: 3
  question: >-
    A whole neighbourhood is hit by the same sewage overflow. Which statement about collective
    routes is correct?
  options:
    - Only the Ministry may sue on behalf of a group of residents.
    - A group claim under s. 10 of the 1992 Law, or a 2006-Law class action.
    - Collective suits are not allowed for any environmental hazard.
    - Each resident must sue separately in the District Court.
  correct: 1
  explanation: >-
    Section 10 of the 1992 Law allows a group claim for an injunction; the Class Actions Law 2006
    lists environmental hazards in its Second Schedule. Get advice on which fits.
- id: m10-085
  module: 10
  lesson: '10.5'
  subject: documentation
  difficulty: 1
  question: Which item belongs in an environmental hazard log?
  options:
    - Date, time, what you observed, wind, evidence, report number.
    - The names and home addresses of the people you suspect.
    - Your opinion of the local council and its environmental unit.
    - Screenshots of angry posts about the hazard on social media.
  correct: 0
  explanation: >-
    A log records facts that can be checked: when, what, conditions, evidence and reports. It
    supports complaints, FOI requests and a s. 5 notice.
- id: m10-086
  module: 10
  lesson: '10.5'
  subject: citizen-suit
  difficulty: 3
  question: >-
    The court ordered a plant to stop a hazard. Eighteen months later the hazard returns. What does
    s. 9 allow?
  options:
    - Nothing new; only the Ministry may enforce the old order.
    - A new suit, but only after another 60-day notice to both.
    - Criminal charges filed by the resident against the plant.
    - A new suit within two years, without notice, with compensation.
  correct: 3
  explanation: >-
    Section 9 treats a hazard that returns within two years of the order as a repeat hazard: the
    plaintiff may sue without the s. 5 notice, and the court may award compensation.
- id: m10-087
  module: 10
  lesson: '10.5'
  subject: emission-permits
  difficulty: 3
  question: >-
    A plan for a plant needing an emission permit and the draft permit are dealt with in a joint
    procedure. The objection period ends on 1 May and the permit comment period on 10 May. Which
    date applies?
  options:
    - 1 May for both.
    - The later date, 10 May, for both.
    - Each keeps its own date with no link.
    - The decision date of the district committee.
  correct: 1
  explanation: >-
    In a joint procedure, Clean Air Law s. 23(ד)(5)(ב) sets the objection and comment deadlines at
    the later of the two, and the hearing is held on one date.
- id: m10-088
  module: 10
  lesson: '10.5'
  subject: env-complaint
  difficulty: 2
  question: You reported a hazard to *6911 three times by phone. Why also send a written complaint?
  options:
    - Phone reports are not valid without a written follow-up.
    - A written complaint is needed before calling the police.
    - It creates a record and a duty to decide and give reasons.
    - The Ministry deletes phone reports after one week.
  correct: 2
  explanation: >-
    A written request engages the Decisions and Reasons Law (lesson 02.5) and builds the record you
    need for an FOI request, a s. 5 notice or a petition.
- id: m10-089
  module: 10
  lesson: '10.5'
  subject: citizen-suit
  difficulty: 3
  question: >-
    For a hazard to a protected tree or forest, to whom does the s. 5 notice go besides the
    polluter?
  options:
    - The Minister of Agriculture or his delegate.
    - The Minister of Environmental Protection only.
    - The local planning committee.
    - The Israel Land Authority.
  correct: 0
  explanation: >-
    The 1992 Law defines "the authority" by hazard: for trees and forests the Minister of
    Agriculture; for protected areas and natural assets the Nature and Parks Authority director;
    otherwise the Environment Minister.
- id: m11-001
  module: 11
  lesson: '11.1'
  subject: small-claims-eligibility
  difficulty: 1
  question: Who may file a claim in the Small Claims Court?
  options:
    - Any person or company with a claim under the ceiling
    - An individual, for a claim up to the ceiling
    - Only consumers suing a business
    - Only Israeli citizens resident in Israel
  correct: 1
  explanation: >-
    Courts Law s. 60(א) limits the Small Claims Court to civil claims filed by an individual (יחיד),
    up to the index-linked ceiling. Kol Zchut notes that non-residents may also file.
- id: m11-002
  module: 11
  lesson: '11.1'
  subject: small-claims-eligibility
  difficulty: 1
  question: Which of these may be sued as a defendant in the Small Claims Court?
  options:
    - Only private individuals
    - Only businesses registered for VAT
    - A person, a company, an amuta or a public body
    - Only companies, since individuals settle disputes privately
  correct: 2
  explanation: >-
    The limit in s. 60(א) is on who files, not on who is sued. A claimant may sue a person, a
    company, an amuta or a public body.
- id: m11-003
  module: 11
  lesson: '11.1'
  subject: small-claims-eligibility
  difficulty: 2
  question: >-
    A self-employed graphic designer (עוסק מורשה) wants to sue a client for an unpaid ₪8,000
    invoice. Can she use the Small Claims Court?
  options:
    - Yes; a self-employed person is an individual, not a company
    - No; business claims must go to the Magistrates' Court
    - Only if the client is also self-employed
    - Only after registering a company for the business
  correct: 0
  explanation: >-
    A self-employed person sues as an individual; Kol Zchut lists עוסק מורשה and עוסק פטור among
    those who may file. Companies, partnerships and amutot may not.
- id: m11-004
  module: 11
  lesson: '11.1'
  subject: small-claims-eligibility
  difficulty: 3
  question: >-
    Over one year, a consumer activist filed seven small claims against different companies in the
    same court. What may the court do with the eighth?
  options:
    - Nothing; the law sets no limit on how many small claims one may file
    - Fine the claimant for abuse of process automatically, before any hearing
    - Refuse to register it at the registry counter until next year
    - Transfer it to the Magistrates' Court under s. 60(ב)
  correct: 3
  explanation: >-
    Courts Law s. 60(ב) lets the court transfer a claim filed by someone who already filed more than
    five claims that year in the same court. Since 2025 the claim must also state how many were
    filed (reg. 3(ג)(7)).
- id: m11-005
  module: 11
  lesson: '11.1'
  subject: choosing-forum
  difficulty: 1
  question: Your claim is ₪20,000, under the small-claims ceiling. Must you file in the Small Claims Court?
  options:
    - Yes, every claim under the ceiling must be filed there
    - Only if the defendant is a company or an amuta
    - No; s. 61 lets you choose another court
    - Only if you are not represented by a lawyer
  correct: 2
  explanation: >-
    Section 61(1) preserves the right to file in another court instead. Small claims is cheaper and
    simpler, which is why individuals usually choose it.
- id: m11-006
  module: 11
  lesson: '11.1'
  subject: choosing-forum
  difficulty: 3
  question: >-
    You were damaged ₪52,000 by a contractor. You are tempted to claim only ₪39,000 in small claims
    and the rest later. What is the problem?
  options:
    - None; you may split one claim between two courts
    - The part you waive may be lost for good
    - Small-claims judges cannot award more than ₪20,000
    - The contractor can force the whole case into arbitration
  correct: 1
  explanation: >-
    One cause must be claimed in full; in the regular courts reg. 25 bars suing later for the part
    not claimed. Decide the amount first, then the court.
- id: m11-007
  module: 11
  lesson: '11.1'
  subject: alternatives
  difficulty: 1
  question: What can a small-claims court order besides payment of money?
  options:
    - An apology published in a national newspaper
    - A change in a municipality's licensing policy
    - A criminal fine or other punishment of the defendant
    - Repairing or replacing a product, or cancelling a deal
  correct: 3
  explanation: >-
    Section 60(א)(2) allows orders to replace or repair a product or cancel a transaction within the
    ceiling. Policy changes by authorities belong to the Module 5 tools.
- id: m11-008
  module: 11
  lesson: '11.1'
  subject: alternatives
  difficulty: 2
  question: >-
    Your neighbour's dog keeps damaging the protest signs on your balcony. You will live next to
    each other for years. Which option should you consider early?
  options:
    - Mediation, because the relationship continues after the dispute
    - A Magistrates' Court claim, because neighbours' disputes are complex
    - A petition to the municipality's legal adviser
    - A complaint to the Public Complaints Commissioner
  correct: 0
  explanation: >-
    Mediation fits ongoing relationships: it can produce practical arrangements a court will not
    order. The Commissioner deals with public bodies, not neighbours.
- id: m11-009
  module: 11
  lesson: '11.1'
  subject: alternatives
  difficulty: 2
  question: >-
    Your bank charged a fee you think is unlawful (₪180). What is a sensible first rung on the
    ladder?
  options:
    - A small claim at once, since banks always settle before the hearing
    - A written complaint to the bank, then the regulator
    - An administrative petition against the bank in the District Court
    - A class action, because the amount is too small for a single claim
  correct: 1
  explanation: >-
    For banks, insurers and phone companies, a written complaint and then the regulator are free and
    often enough. A bank is not an administrative authority, and a class action needs a lawyer.
- id: m11-010
  module: 11
  lesson: '11.1'
  subject: costs-risk
  difficulty: 2
  question: Which factor makes the costs risk higher in the Magistrates' Court than in small claims?
  options:
    - Magistrates' Court judges must award the full amount claimed
    - In small claims the loser never pays anything
    - Costs normally include lawyers' fees at the Bar tariff or more
    - The Magistrates' Court fee is refunded only to the winner
  correct: 2
  explanation: >-
    Reg. 153(א) sets the Bar's recommended minimum as a floor for lawyers' fees awarded to a winner.
    In small claims lawyers rarely appear, so expenses awarded are usually modest.
- id: m11-011
  module: 11
  lesson: '11.1'
  subject: costs-risk
  difficulty: 1
  question: What is the general purpose of a costs order in civil proceedings under the 2018 regulations?
  options:
    - To punish the party who lost the case and deter others
    - To fund the courts' administration and registry staff
    - To pay the lawyer of the losing side for the extra work
    - To compensate the other side for its case expenses
  correct: 3
  explanation: >-
    Reg. 151(א): costs indemnify the other side for its expenses, considering the outcome, the
    resources needed and the parties' conduct.
- id: m11-012
  module: 11
  lesson: '11.1'
  subject: limitation
  difficulty: 1
  question: What is the general limitation period for a civil claim in Israel?
  options:
    - Seven years
    - Three years
    - One year
    - Twenty-five years
  correct: 0
  explanation: >-
    Limitation Law s. 5 sets seven years as the general rule; some laws set shorter periods.
    Evidence fades much sooner, so act early.
- id: m11-013
  module: 11
  lesson: '11.1'
  subject: collectability
  difficulty: 3
  question: >-
    You can prove a strong ₪6,000 claim against a small company that closed last month and has no
    assets. What is the main weakness of suing?
  options:
    - The court cannot hear claims against closed companies
    - You may win a judgment you cannot collect
    - The claim becomes time-barred when a company closes
    - Only the Official Receiver may sue a closed company
  correct: 1
  explanation: >-
    Collectability is one of the three go/no-go questions. A judgment against a company with nothing
    to enforce against may be worth little; check whether someone else is liable.
- id: m11-014
  module: 11
  lesson: '11.1'
  subject: choosing-forum
  difficulty: 3
  question: >-
    A tenants' committee, registered as an amuta, and six tenants each lost ₪3,000 when a contractor
    took deposits and vanished. Which plan fits the rules best?
  options:
    - The amuta files one small claim for ₪21,000 on behalf of all members
    - The committee chair files one small claim for all seven losses together
    - Each tenant files a small claim; the amuta uses the regular court
    - Nobody may sue until the police investigation of the contractor ends
  correct: 2
  explanation: >-
    Only individuals file small claims, each for their own claim; the amuta must use the
    Magistrates' Court. No one may file a small claim for someone else's loss.
- id: m11-015
  module: 11
  lesson: '11.2'
  subject: venue
  difficulty: 1
  question: Under small-claims reg. 2(א), which place does NOT by itself give a court venue?
  options:
    - Where the defendant lives
    - Where the defendant does business
    - Where the act or omission happened
    - Your home, after an in-store purchase
  correct: 3
  explanation: >-
    Reg. 2(א) lists the defendant's home or business and the place of the act. The claimant's home
    counts only for internet commerce or publication (reg. 2(ב)).
- id: m11-016
  module: 11
  lesson: '11.2'
  subject: venue
  difficulty: 3
  question: >-
    A contract you signed with a gym says "all disputes will be heard only in Tel Aviv". The gym is
    in Afula, where you live. Where may you file a small claim?
  options:
    - In Afula, whatever the contract says
    - Only in Tel Aviv, as the contract requires
    - Anywhere in the Northern District you like
    - Only in Jerusalem, for all consumer contracts
  correct: 0
  explanation: >-
    Reg. 2(א) applies "על אף האמור בכל הסכם שבין בעלי הדין" — despite any agreement. The gym does
    business in Afula, and the act happened there.
- id: m11-017
  module: 11
  lesson: '11.2'
  subject: venue
  difficulty: 2
  question: 'You sue two defendants: one lives in Eilat and one in Hadera. Where may you file?'
  options:
    - Only where both of them can attend easily
    - You must file two separate claims, one in each city
    - In a court competent for either one of them
    - Only in Tel Aviv, as a central court
  correct: 2
  explanation: >-
    Reg. 2(ג): a court competent to hear the claim against one of several defendants may hear it
    against all of them.
- id: m11-018
  module: 11
  lesson: '11.2'
  subject: claim-content
  difficulty: 1
  question: Since 11.4.2025, what is the maximum length of the body of a statement of claim in small claims?
  options:
    - Two pages
    - Five pages
    - Nine pages
    - There is no limit
  correct: 1
  explanation: >-
    Reg. 3(ה) caps the body at five pages for claims opened from 11.4.2025. Attachments are
    separate.
- id: m11-019
  module: 11
  lesson: '11.2'
  subject: claim-content
  difficulty: 2
  question: >-
    Spot the mistake. A claimant's heading lists her name, ID, address and the defendant's details,
    but no email or mobile number. What is wrong?
  options:
    - Nothing; contact details are given only at the hearing
    - Only the defendant's contact details are required
    - Her email and mobile number are required in the heading
    - The heading must include her bank account instead
  correct: 2
  explanation: >-
    Reg. 3(ב)(2) requires the claimant's contact details, including email and a mobile number. The
    court uses them to send notices.
- id: m11-020
  module: 11
  lesson: '11.2'
  subject: claim-content
  difficulty: 2
  question: What must accompany a small claim under reg. 3(ד)(2), as amended in 2025?
  options:
    - A lawyer's confirmation that the claim is well founded in law
    - An affidavit certified by a notary, with an official stamp
    - Proof that the defendant received your demand letter by post
    - A declaration that it is true, naming your source
  correct: 3
  explanation: >-
    Reg. 3(ד)(2) requires a declaration that everything in the claim is true or to the claimant's
    knowledge, naming the source of knowledge. No certification is required for it.
- id: m11-021
  module: 11
  lesson: '11.2'
  subject: claim-content
  difficulty: 3
  question: >-
    After filing, you find the email in which the seller admitted the defect. It was not attached to
    your claim. What is the position?
  options:
    - You may add it only with the court's permission, giving a reason
    - You may bring it to the hearing; no permission is needed in small claims
    - It can never be used, since it was not attached on filing
    - You must withdraw and refile the claim with the email
  correct: 0
  explanation: >-
    Reg. 3(ד) lets the court allow a document not attached if it is needed for judgment or for
    another important reason. Ask in writing through Net HaMishpat.
- id: m11-022
  module: 11
  lesson: '11.2'
  subject: fees
  difficulty: 1
  question: How is the small-claims fee calculated?
  options:
    - A fixed amount for every claim, set each January
    - 1% of the claim, with a minimum, rounded up
    - 2.5% of the claim, paid in two equal halves
    - Free for individuals; only companies pay a fee
  correct: 1
  explanation: >-
    Small-claims reg. 6(א): 1% of the claim, not less than the minimum, rounded up to a multiple of
    ₪5. The 2.5% fee in two halves is the Magistrates' Court.
- id: m11-023
  module: 11
  lesson: '11.2'
  subject: fees
  difficulty: 2
  question: You claim ₪12,340 in small claims. What is the fee, before checking the minimum?
  options:
    - ₪123
    - ₪120
    - ₪125
    - ₪308.50
  correct: 2
  explanation: >-
    1% of ₪12,340 is ₪123.40, rounded up to the next multiple of ₪5: ₪125 (reg. 6(א)(3)). It is
    above the minimum, so ₪125 is due.
- id: m11-024
  module: 11
  lesson: '11.2'
  subject: service
  difficulty: 1
  question: Who normally sends the claim and summons to the defendant in small claims?
  options:
    - The court, by registered mail
    - The claimant, by hand delivery
    - A bailiff paid by the claimant
    - The police
  correct: 0
  explanation: >-
    Reg. 7(ב): the court clerk arranges service. The claimant must check it happened and serve
    personally only if it did not (reg. 7(ב1)).
- id: m11-025
  module: 11
  lesson: '11.2'
  subject: defence-deadline
  difficulty: 1
  question: How long does a defendant in small claims have to file a defence?
  options:
    - 15 days from the service of the summons
    - 60 days from the service of the summons
    - 45 days from the filing of the claim
    - 30 days from service of the summons
  correct: 3
  explanation: >-
    Reg. 4(ב): the summons invites the defendant to file a defence within 30 days of service. The
    regular courts allow 60 days (45 in the fast track).
- id: m11-026
  module: 11
  lesson: '11.2'
  subject: counterclaim
  difficulty: 2
  question: >-
    You sued a moving company in small claims; it filed a defence and a counterclaim for unpaid
    fees. What must you do?
  options:
    - Nothing; a counterclaim is heard only if you agree
    - File a defence to the counterclaim within 30 days of its service
    - Withdraw your claim, since the cases cannot run together
    - Pay the counterclaim first, then continue your claim
  correct: 1
  explanation: >-
    Reg. 5 lets a defendant add a counterclaim; the claimant is invited to file a defence to it
    within 30 days of its service.
- id: m11-027
  module: 11
  lesson: '11.2'
  subject: hearing-absence
  difficulty: 1
  question: >-
    The claimant comes to the small-claims hearing; the properly summoned defendant does not. What
    happens?
  options:
    - The claim is dismissed for lack of a defendant
    - The hearing is postponed automatically to a new date
    - Judgment on the claim, once declared true
    - The case is transferred to the Magistrates' Court
  correct: 2
  explanation: >-
    Reg. 11: if the claimant appears and the defendant does not, the court gives judgment on the
    claim, provided the claimant declares before the court that its contents are true.
- id: m11-028
  module: 11
  lesson: '11.2'
  subject: hearing-absence
  difficulty: 2
  question: >-
    A defendant was sick on the hearing day and judgment was given against him in his absence. It
    was served on him five days ago. What is his main option?
  options:
    - Apply within 30 days of service to set it aside
    - Appeal to the Supreme Court within 60 days of service
    - Nothing; judgments given in absence are always final
    - File a new claim asking to cancel the judgment
  correct: 0
  explanation: >-
    Reg. 12 allows a request to set aside a decision given in a party's absence within 30 days of
    its service, on terms the court sets.
- id: m11-029
  module: 11
  lesson: '11.2'
  subject: appeal
  difficulty: 2
  question: Which court decides a request for leave to appeal a small-claims judgment, and how?
  options:
    - The Supreme Court, by three justices
    - The same small-claims judge, on reconsideration
    - The Magistrates' Court, by its president
    - The District Court, by a single judge
  correct: 3
  explanation: >-
    Courts Law s. 64: an appeal needs leave from a District Court judge, and the District Court
    hears it with one judge.
- id: m11-030
  module: 11
  lesson: '11.2'
  subject: appeal
  difficulty: 3
  question: >-
    You lost a small claim because the judge believed the defendant's witness rather than you. You
    want to appeal. What is realistic?
  options:
    - Leave is likely, because you disagree with the outcome of the case
    - Leave is rare for re-weighing evidence; errors of law are the usual ground
    - You have an appeal as of right on all findings of fact and credibility
    - You may simply refile the same claim in another small-claims court
  correct: 1
  explanation: >-
    Leave to appeal from small claims is granted sparingly; disagreement with how the judge weighed
    testimony is rarely enough. Refiling is barred because the matter was decided.
- id: m11-031
  module: 11
  lesson: '11.2'
  subject: representation
  difficulty: 2
  question: Your cousin, a lawyer, offers to represent you in small claims for free. What does the law say?
  options:
    - Only with the court's permission, for special reasons
    - Freely, as long as the lawyer charges no fee at all
    - Never; lawyers are banned from small claims entirely
    - Only for the defendant, never for the claimant
  correct: 0
  explanation: >-
    Courts Law s. 63(א): representation by a lawyer is only with the court's permission and for
    special reasons that are recorded.
- id: m11-032
  module: 11
  lesson: '11.2'
  subject: representation
  difficulty: 3
  question: >-
    A volunteer from a consumer group offers to represent claimants in small claims every week,
    unpaid. Can the court approve him under s. 63(ב)?
  options:
    - Yes, because he does it without any payment
    - Yes, if each claimant signs a power of attorney
    - No, because he represents people regularly
    - No, because only close relatives may represent
  correct: 2
  explanation: >-
    Section 63(ב) allows a non-lawyer with a power of attorney and court approval, but not someone
    who represents regularly, as part of his business, or for payment.
- id: m11-033
  module: 11
  lesson: '11.2'
  subject: demand-letter
  difficulty: 2
  question: >-
    Spot the mistake in this demand letter: "Refund ₪2,400 within 14 days, or I will post your name
    on every Facebook group and file a police complaint." What is wrong?
  options:
    - Fourteen days is too short a deadline for a demand letter
    - It must be sent only by registered mail, never by email
    - It should not name an amount before a court has decided one
    - It threatens exposure and police, not the lawful next step
  correct: 3
  explanation: >-
    State only the legal step you will take, such as a small claim. Threatening exposure or a
    criminal complaint to get money can backfire legally and with the judge.
- id: m11-034
  module: 11
  lesson: '11.2'
  subject: settlement
  difficulty: 2
  question: >-
    At the hearing, the judge suggests both sides agree that the judge decide as an arbitrator. What
    does the law allow?
  options:
    - With both sides' consent, the judge may act as arbitrator
    - Only a private arbitrator may be appointed, for a fee
    - Arbitration is forbidden once a claim was filed
    - The judge may impose arbitration without consent
  correct: 0
  explanation: >-
    Courts Law s. 65(א): with the parties' consent the judge may hear the claim as an arbitrator, or
    send it to another arbitrator who agrees to act without payment from the parties.
- id: m11-035
  module: 11
  lesson: '11.3'
  subject: net-hamishpat-login
  difficulty: 1
  question: How does a party without a lawyer log in to Net HaMishpat to file in a case?
  options:
    - With a username sent by the court registry
    - With National Digital Identity (הזדהות לאומית)
    - With the case number and the claimant's ID only
    - Only with a lawyer's smart card
  correct: 1
  explanation: >-
    The judiciary's guide requires login through National Digital Identity; without it the "הגשות"
    button does not appear.
- id: m11-036
  module: 11
  lesson: '11.3'
  subject: net-hamishpat-login
  difficulty: 1
  question: Which device can you use to file a small claim online?
  options:
    - A smartphone with the courts' app
    - Any device with a browser
    - A computer only
    - Only the kiosk in the court lobby
  correct: 2
  explanation: >-
    The judiciary's page says the online small-claims service is available from a computer only, not
    from a mobile phone.
- id: m11-037
  module: 11
  lesson: '11.3'
  subject: net-hamishpat-login
  difficulty: 2
  question: >-
    You log in to Net HaMishpat and open your case, but pressing "הגשות" shows "אינך מורשה לבצע
    פעולות בתיק". What is the likely cause and fix?
  options:
    - Your ID is not attached to the case; ask to add it
    - The case has been closed; you must file a new claim
    - Only a lawyer can file in this case; you must hire one
    - A fee is due before filing; you must pay it first
  correct: 0
  explanation: >-
    The judiciary's guide explains this error: your ID number is not set correctly in the case. Ask
    to add it via quick filing, fax or the registry counter.
- id: m11-038
  module: 11
  lesson: '11.3'
  subject: filing-paths
  difficulty: 1
  question: Under "הגשות", which option do you use to file your statement of defence?
  options:
    - בקשה חדשה
    - כתב טענות לבקשה קיימת
    - הגשה מהירה
    - הגשות אחרות
  correct: 3
  explanation: >-
    "הגשות אחרות" is for documents that are neither requests nor responses: a defence, affidavits,
    expert opinions, a counterclaim.
- id: m11-039
  module: 11
  lesson: '11.3'
  subject: filing-paths
  difficulty: 2
  question: >-
    You need an urgent temporary order the same day (for example, to stop an eviction). Can you file
    it by quick filing?
  options:
    - Yes, quick filing is designed for urgent matters
    - No; such orders are filed at the registry counter
    - Yes, but only after 17:00 on a working day
    - No; urgent orders can be filed only by lawyers
  correct: 1
  explanation: >-
    The judiciary's guide excludes urgent remedies and temporary orders from quick filing; they are
    filed at the registry counter (temporary orders in the court where the case is).
- id: m11-040
  module: 11
  lesson: '11.3'
  subject: filing-paths
  difficulty: 2
  question: You want to ask the court to move your hearing because of surgery. Which path do you choose?
  options:
    - '"הגשות אחרות", attached to your claim'
    - A response under the defendant's last request
    - '"בקשה חדשה", with the medical document attached'
    - An email to the judge's secretary
  correct: 2
  explanation: >-
    Asking the court for something new is a new request; it gets its own number, and responses and
    the decision are filed under it.
- id: m11-041
  module: 11
  lesson: '11.3'
  subject: filing-paths
  difficulty: 1
  question: In what file format do you upload documents to Net HaMishpat?
  options:
    - PDF
    - Word (DOCX)
    - Any image format
    - Plain text
  correct: 0
  explanation: >-
    The guide allows documents in PDF only, up to 70 MB per file; other digital files only as the
    courts' administration directs.
- id: m11-042
  module: 11
  lesson: '11.3'
  subject: filing-paths
  difficulty: 3
  question: >-
    You file a request that requires a fee but choose the wrong request type, so no fee is charged.
    What is the likely result?
  options:
    - The court bills you later at no extra cost
    - Nothing; fees are waived for parties without a lawyer
    - The judge decides it and the fee is deducted from any award
    - The registry rejects the request for the unpaid fee
  correct: 3
  explanation: >-
    The guide warns that choosing the right category and type matters for calculating the fee, and
    the registry rejects a request filed without the required fee.
- id: m11-043
  module: 11
  lesson: '11.3'
  subject: service-electronic
  difficulty: 3
  question: >-
    The court's SMS about a decision reached you on Sunday at 14:00, but you opened the document on
    Tuesday at 10:00. When was it served on you?
  options:
    - On Sunday at 14:00, when the SMS arrived
    - On Tuesday, when you opened the document
    - On Monday, the next working day after the SMS
    - Only when a paper copy arrives by post
  correct: 1
  explanation: >-
    Reg. 161(1)(ד): for a party without a lawyer notified by the court electronically, the time of
    opening the document is the time of service. Do not delay opening to gain time; it can be
    proven.
- id: m11-044
  module: 11
  lesson: '11.3'
  subject: service-electronic
  difficulty: 2
  question: You open a court decision on Wednesday at 21:00. From when does it count as served?
  options:
    - Wednesday at 21:00, when opened
    - The following Sunday, after Shabbat
    - Thursday, the next working day
    - Seven days after the court sent it
  correct: 2
  explanation: >-
    Reg. 161(1)(ד): a document opened after 17:00 on Sunday to Thursday counts as served on the next
    working day.
- id: m11-045
  module: 11
  lesson: '11.3'
  subject: service-electronic
  difficulty: 1
  question: >-
    You are not represented and file a request through Net HaMishpat. Who sends it to the other
    side?
  options:
    - The court registry
    - You, by registered mail
    - You, by email to the other side
    - Nobody; the other side must check the system
  correct: 0
  explanation: >-
    Reg. 160: a lawyer must serve copies on the other side, but a party without a lawyer files with
    the registry, which arranges service.
- id: m11-046
  module: 11
  lesson: '11.3'
  subject: registry-rejection
  difficulty: 2
  question: The registry refuses to accept your filing and you think the refusal is wrong. What can you do?
  options:
    - Appeal to the District Court within 60 days of the refusal
    - Complain to the Judiciary Ombudsman, who decides within 7 days
    - Refile the same document daily until the registry accepts it
    - Ask within seven days for a judge to review it
  correct: 3
  explanation: >-
    Reg. 33(ה): a person harmed by a refusal may ask, within seven days of the notice, that a judge
    appointed by the court's president review it, possibly without a hearing.
- id: m11-047
  module: 11
  lesson: '11.3'
  subject: registry-rejection
  difficulty: 3
  question: >-
    Your statement of claim is refused by the registry on the last day before limitation expires,
    for a form defect. What protects you?
  options:
    - Nothing; the limitation period has now expired
    - Fixing the defect within seven days saves it
    - Limitation stops automatically for every refused document
    - You must ask the Attorney General for an extension
  correct: 1
  explanation: >-
    Reg. 33(ד): when refusing a statement of claim could make it time-barred, it is treated as
    accepted if the claimant fixes the defect within seven days of the refusal.
- id: m11-048
  module: 11
  lesson: '11.3'
  subject: filing-paths
  difficulty: 2
  question: >-
    After filing a document you got a reference number (אסמכתא). When can you first check its
    status?
  options:
    - Immediately, within the same minute of filing
    - Only after the judge has decided the filing
    - From the end of the next working day
    - Only after 30 days from the filing date
  correct: 2
  explanation: >-
    The judiciary's guide says to search "הגשות" by reference number from the end of the working day
    after the filing.
- id: m11-049
  module: 11
  lesson: '11.4'
  subject: pleadings
  difficulty: 1
  question: Into which three parts must a statement of claim be divided under the 2018 regulations?
  options:
    - Heading, summary, details
    - Facts, law and remedy, in that order
    - Introduction, evidence and conclusion
    - Parties, claim and supporting affidavit
  correct: 0
  explanation: >-
    Reg. 9(ג): heading, summary and details, in that order; in the Magistrates' Court the summary is
    up to two pages and the details up to nine (reg. 9(ד)).
- id: m11-050
  module: 11
  lesson: '11.4'
  subject: pleadings
  difficulty: 2
  question: >-
    Your Magistrates' Court claim has a 4-page summary and a 7-page detailed part. What may happen
    at the registry?
  options:
    - Nothing; length limits are only recommendations
    - The judge will shorten it at the first pre-trial
    - The defendant gets extra time to file a defence
    - 'Refusal: the summary is over two pages'
  correct: 3
  explanation: >-
    Reg. 9(ד) limits the summary to two pages in the Magistrates' Court, and reg. 33(ב) lets the
    registry refuse documents that do not meet reg. 9(ג)–(ד).
- id: m11-051
  module: 11
  lesson: '11.4'
  subject: pleadings
  difficulty: 2
  question: Which item must appear in the heading of a statement of claim under reg. 10?
  options:
    - The claimant's bank details for paying the award
    - The fee item, or the exemption you rely on
    - A list of the claimant's witnesses and their phones
    - The name of the judge the claimant asks to hear it
  correct: 1
  explanation: >-
    Reg. 10(10) requires the court fee with a reference to the schedule item, or the regulation that
    exempts the claimant. Other heading items include the parties, the court and the remedies.
- id: m11-052
  module: 11
  lesson: '11.4'
  subject: pleadings
  difficulty: 3
  question: >-
    You sue a landlord for an unreturned deposit, and you also have a separate claim against him for
    a broken boiler from the same tenancy. What do the regulations require?
  options:
    - Two claims, one per cause
    - The boiler claim only after the deposit claim ends
    - All causes from the same facts in one claim
    - A request to split, filed before suing
  correct: 2
  explanation: >-
    Reg. 24: a claimant joins in one claim all causes against a defendant arising from the same set
    of facts, subject to the court's jurisdiction.
- id: m11-053
  module: 11
  lesson: '11.4'
  subject: deadlines
  difficulty: 1
  question: In the regular track, how long does a defendant have to file a defence?
  options:
    - 60 days from service of the claim
    - 30 days from service of the claim
    - 45 days from filing of the claim
    - 90 days from service of the claim
  correct: 0
  explanation: >-
    Reg. 9(ב): 60 days from service (120 in medical negligence); the court may extend for good
    reasons.
- id: m11-054
  module: 11
  lesson: '11.4'
  subject: deadlines
  difficulty: 2
  question: >-
    In a regular civil case, a deadline runs through the court's summer recess. How are recess days
    treated?
  options:
    - They count like any other calendar days
    - They count double, to make up for the delay
    - Only Fridays and Saturdays inside them are excluded
    - Not counted, unless the court orders otherwise
  correct: 3
  explanation: >-
    Reg. 179(ב) excludes recess days from deadlines in the regular courts. In small claims the
    opposite rule applies (small-claims reg. 16א(ב)).
- id: m11-055
  module: 11
  lesson: '11.4'
  subject: deadlines
  difficulty: 3
  question: >-
    A defendant is served on 20 June in a regular-track claim. The recess runs 1 July–31 August.
    Roughly when is the defence due if the court gives no other order?
  options:
    - Around 19 August, during the recess
    - About 20 October
    - On 20 July, inside the recess period
    - On 31 August, the last day of the recess
  correct: 1
  explanation: >-
    Sixty days, not counting the 62 recess days (reg. 179(ב)): 10 days before the recess and 50
    after it, so about 20 October. Confirm the recess dates with the registry and file early.
- id: m11-056
  module: 11
  lesson: '11.4'
  subject: fast-track
  difficulty: 1
  question: Which claims are heard in the fast track (דיון מהיר)?
  options:
    - All claims filed by self-represented parties, whatever the amount
    - All claims against public bodies, such as municipalities
    - Claims up to ₪75,000 (with exceptions) and evictions
    - Any claim that both parties agree to put on the fast track
  correct: 2
  explanation: >-
    Reg. 78(א): claims up to ₪75,000 except class actions, road-accident and bodily-injury claims,
    plus eviction claims; the court may move cases in or out (78(ב)–(ג)).
- id: m11-057
  module: 11
  lesson: '11.4'
  subject: fast-track
  difficulty: 2
  question: What must a party attach to a pleading in the fast track?
  options:
    - An affidavit verifying the facts and a documents list
    - A lawyer's certificate that the case is simple enough
    - Proof that a demand letter was sent 30 days earlier
    - A bank guarantee for the other side's future costs
  correct: 0
  explanation: >-
    Reg. 79(א): an affidavit verifying the facts (Form 5), expert opinions if needed, and a list of
    documents with copies of those in the party's possession.
- id: m11-058
  module: 11
  lesson: '11.4'
  subject: fast-track
  difficulty: 2
  question: By when must the court hold the trial in a fast-track case?
  options:
    - Within 30 days of the filing of the claim
    - There is no time frame in the regulations
    - Within one year of service of the claim
    - Within six months of the last defence
  correct: 3
  explanation: >-
    Reg. 80(ד): the trial is set no later than six months from the last defence; the pre-trial
    within 90 days (reg. 80(ג)).
- id: m11-059
  module: 11
  lesson: '11.4'
  subject: mehut
  difficulty: 1
  question: What does a מהו״ת meeting cost the parties?
  options:
    - Half the mediator's hourly fee each
    - Nothing
    - A fixed court fee
    - The claimant pays it in full
  correct: 1
  explanation: >-
    Reg. 37(ד): the מהו״ת meeting is held without cost, within 30 days of the notice of the
    mediator's appointment.
- id: m11-060
  module: 11
  lesson: '11.4'
  subject: mehut
  difficulty: 2
  question: A municipality is a defendant in a ₪90,000 claim. Who must attend the מהו״ת meeting for it?
  options:
    - Nobody; public bodies are exempt from מהו״ת
    - Any clerk of the municipality who is free that day
    - Its case lawyer, with authority on mediation
    - The mayor in person, with the city treasurer
  correct: 2
  explanation: >-
    Reg. 37(ט)(3): for the State, a local authority or an insurer, the lawyer handling the file
    attends with an authorised position on transferring the case to mediation.
- id: m11-061
  module: 11
  lesson: '11.4'
  subject: mehut
  difficulty: 3
  question: After the מהו״ת meeting you decide not to go to mediation. What follows?
  options:
    - The case continues; mediation is voluntary
    - You pay costs for refusing to go to mediation
    - The court must transfer the case to arbitration
    - Your claim is struck out for non-cooperation
  correct: 0
  explanation: >-
    The meeting is compulsory, the mediation is not. Within 14 days the mediator reports whether the
    parties agree to mediate (reg. 37(ו)); if not, the case goes on.
- id: m11-062
  module: 11
  lesson: '11.4'
  subject: default-judgment
  difficulty: 2
  question: >-
    A defendant misses the defence deadline and judgment is given against him. What is his first
    remedy?
  options:
    - An appeal within 60 days, arguing the merits
    - A new claim against the claimant to cancel it
    - A complaint to the Judiciary Ombudsman
    - Asking within 30 days to set it aside
  correct: 3
  explanation: >-
    Reg. 131: a decision given against a party in their absence may be set aside if they ask within
    30 days of service; attach the proposed defence and explain the delay.
- id: m11-063
  module: 11
  lesson: '11.4'
  subject: costs
  difficulty: 3
  question: >-
    You lost, but the other side spent months filing pointless requests. Can the court make it pay
    costs anyway?
  options:
    - No; costs always follow the final result of the case
    - Yes; needless delay can be charged whatever the result
    - Only if you were represented by a lawyer throughout
    - Only through a separate claim after the case has ended
  correct: 1
  explanation: >-
    Reg. 156 allows costs against a party who prolonged the proceedings needlessly, in that
    proceeding or in the judgment, without connection to the outcome.
- id: m11-064
  module: 11
  lesson: '11.4'
  subject: costs
  difficulty: 2
  question: What does reg. 157 allow the court to order a claimant to do?
  options:
    - Pay the defendant's lawyer's fees in advance
    - Hire a lawyer before the case can continue
    - Give security for the defendant's costs
    - Publish the claim in a national newspaper
  correct: 2
  explanation: >-
    Reg. 157: the court may order a claimant to give security for the defendant's costs; if it is
    not given in time, the claim is struck.
- id: m11-065
  module: 11
  lesson: '11.4'
  subject: costs
  difficulty: 3
  question: >-
    You won your claim and want the court to award your actual expenses (copies, an expert opinion,
    travel). What must you do?
  options:
    - List them in your closing arguments, with receipts
    - Nothing; the court calculates all expenses by itself
    - File a separate claim for the expenses after judgment
    - Ask the Execution Office to add them to the debt
  correct: 0
  explanation: >-
    Reg. 155(א): the court awards legal expenses if the party detailed them explicitly in its
    closing arguments and attached supporting documents.
- id: m11-066
  module: 11
  lesson: '11.4'
  subject: pre-action-letter
  difficulty: 3
  question: >-
    A claimant is told the 2018 regulations require a pre-action demand letter, or the claim will be
    struck. What is accurate?
  options:
    - Correct; reg. 2 requires a letter 30 days before suing
    - Correct, but only for claims in the Magistrates' Court
    - Correct; reg. 29 requires a demand letter before suing
    - No such general duty; conduct still affects costs
  correct: 3
  explanation: >-
    The current text contains no general pre-action letter duty (reg. 2 defines a fair process; reg.
    29 deals with jurisdiction objections). A letter is still wise, and regs 151 and 153(ג) weigh
    conduct.
- id: m11-067
  module: 11
  lesson: '11.4'
  subject: pre-trial
  difficulty: 2
  question: >-
    The court proposes a pre-trial hearing by video. You have no lawyer and prefer to come in
    person. What is the rule?
  options:
    - Video is compulsory for every pre-trial hearing
    - Video needs your consent when unrepresented
    - You may come in person only if the other side agrees
    - Video hearings are not allowed in civil cases at all
  correct: 1
  explanation: >-
    Reg. 61(ג): where a party is not represented, the court may hold a video pre-trial only with
    that party's consent (with special rules in the fast track, which also need consent).
- id: m11-068
  module: 11
  lesson: '11.5'
  subject: evidence-plan
  difficulty: 1
  question: What is the core of an evidence plan for a hearing?
  options:
    - A list of every file and photo stored on your phone
    - A timeline of how you felt at each stage of the dispute
    - A proof and exhibit number for each disputed fact
    - The judge's previous rulings in similar small claims
  correct: 2
  explanation: >-
    Match each fact the other side may dispute to a document, recording, object or witness, keep the
    original, and number the exhibit.
- id: m11-069
  module: 11
  lesson: '11.5'
  subject: evidence-plan
  difficulty: 2
  question: >-
    Your claim relies on WhatsApp messages. What should you bring to the hearing besides the printed
    copies?
  options:
    - The phone holding the original messages
    - A lawyer's certificate that the printouts are accurate
    - Nothing more; printouts are enough
    - A notarised translation into English
  correct: 0
  explanation: >-
    Bring the original. The small-claims judge may accept the printout (s. 62(א)), but the other
    side may dispute it, and the original settles that.
- id: m11-070
  module: 11
  lesson: '11.5'
  subject: evidence-plan
  difficulty: 3
  question: >-
    Your claim is about a defective washing machine. Which extra evidence most strengthens the
    claim?
  options:
    - Online reviews by other customers who bought the same model
    - A letter from a friend who agrees that the shop was unfair
    - Your own detailed description of the noise the machine makes
    - A technician's report or repair quote on the fault
  correct: 3
  explanation: >-
    A short professional opinion or repair quote proves the fault and the cost. Reviews and friends'
    opinions prove little about your machine.
- id: m11-071
  module: 11
  lesson: '11.5'
  subject: recordings
  difficulty: 2
  question: You want to use a recording as evidence. Which recording is lawful to make?
  options:
    - A recorder left in the shop's back office overnight
    - Your own phone conversation with the shop manager
    - A recording of two employees talking to each other
    - A recording of the defendant's call with his lawyer
  correct: 1
  explanation: >-
    Recording a conversation you take part in is lawful; secretly recording others' conversations is
    wiretapping (lesson 09.5). Privileged communications stay protected (s. 62(א)).
- id: m11-072
  module: 11
  lesson: '11.5'
  subject: witnesses
  difficulty: 1
  question: In small claims, who normally makes sure your witnesses come to the hearing?
  options:
    - The court, automatically
    - The defendant's side
    - You, by inviting them
    - The police, on request
  correct: 2
  explanation: >-
    The judiciary's page says the claimant invites their own witnesses; a court summons is requested
    only when a witness may not come.
- id: m11-073
  module: 11
  lesson: '11.5'
  subject: witnesses
  difficulty: 2
  question: You ask the court to summon a reluctant witness. What will you probably need to do?
  options:
    - Deposit a witness fee the court sets
    - Pay the witness's lawyer
    - Get the defendant's consent
    - Bring the witness to court yourself by force
  correct: 0
  explanation: >-
    The judiciary's page says compelling a witness requires depositing a witness fee set by the
    court, paid by whoever asked for the testimony; small-claims reg. 9 covers paying witnesses.
- id: m11-074
  module: 11
  lesson: '11.5'
  subject: witnesses
  difficulty: 3
  question: >-
    A friend offers to testify that he saw the defendant damage your car, though he only heard about
    it from you. What should you do?
  options:
    - Let him testify; small claims accept any evidence at all
    - Have him sign an affidavit instead of coming to testify
    - Ask him to say only that he 'thinks' he saw it happen
    - Do not use him; he did not see it himself
  correct: 3
  explanation: >-
    A witness speaks only to what they know. Coaching a false account destroys credibility and can
    be an offence. Find real proof or leave the fact to your own testimony.
- id: m11-075
  module: 11
  lesson: '11.5'
  subject: hearing-conduct
  difficulty: 1
  question: Who leads the questioning at a small-claims hearing?
  options:
    - The claimant, who opens
    - The judge, actively
    - The defendant's side
    - A court clerk or registrar
  correct: 1
  explanation: >-
    Small-claims reg. 13(א): the court sets the order of evidence and argument and actively
    clarifies the dispute.
- id: m11-076
  module: 11
  lesson: '11.5'
  subject: hearing-conduct
  difficulty: 2
  question: >-
    During the hearing the judge asks, "When did you first tell the shop about the defect?" How
    should you answer?
  options:
    - Explain the whole story from the beginning so nothing is missed
    - Say you will answer in your closing statement
    - Give the date in one sentence and point to the exhibit
    - Ask the defendant to answer first
  correct: 2
  explanation: >-
    Answer the question asked, briefly, and point to the exhibit number. The judge has read the file
    and has limited time.
- id: m11-077
  module: 11
  lesson: '11.5'
  subject: hearing-conduct
  difficulty: 2
  question: You want a photo of the courtroom to post about your case. What is the law?
  options:
    - Only with the court's permission
    - Allowed during breaks in the hearing
    - Allowed as long as no faces appear in it
    - Allowed, because hearings are generally public
  correct: 0
  explanation: >-
    Courts Law s. 70(ב)(1) bans photographing in a courtroom, and publishing such a photo, without
    the court's permission, even though hearings are generally public (s. 68(א)).
- id: m11-078
  module: 11
  lesson: '11.5'
  subject: hearing-conduct
  difficulty: 2
  question: >-
    You notice the judge's summary in the protocol omitted the defendant's admission that he
    received your letter. What should you do?
  options:
    - Say nothing now and raise it on appeal later
    - Record the rest of the hearing on your phone as proof
    - Keep arguing with the judge until it is changed
    - Ask politely, then and there, that it be recorded
  correct: 3
  explanation: >-
    The protocol records the gist of what was said (small-claims reg. 14). Ask politely at once; you
    may not record the hearing yourself without permission.
- id: m11-079
  module: 11
  lesson: '11.5'
  subject: hearing-conduct
  difficulty: 1
  question: By when must a small-claims judgment be given?
  options:
    - Within 30 days of the hearing
    - At the hearing or within 7 days
    - Within 90 days of the filing
    - There is no time limit at all
  correct: 1
  explanation: >-
    Small-claims reg. 15: judgment at the end of the hearing, or postponed up to 7 days, briefly
    reasoned, and stating how to challenge it.
- id: m11-080
  module: 11
  lesson: '11.5'
  subject: hearing-conduct
  difficulty: 2
  question: You need an Arabic interpreter for your small-claims hearing. When should you ask?
  options:
    - On the morning of the hearing
    - Only after the judge asks you
    - In writing at least 7 days before the hearing
    - Never; the parties must bring their own interpreters
  correct: 2
  explanation: >-
    The judiciary's page asks for a written request to the registry at least 7 days before the
    hearing, on its interpreter form.
- id: m11-081
  module: 11
  lesson: '11.5'
  subject: affidavits
  difficulty: 2
  question: In a regular civil case, what is the role of the affidavit you file before the evidence hearing?
  options:
    - It replaces your direct testimony, subject to cross-examination
    - It replaces the evidence hearing entirely, with no questions
    - It is only a summary for the judge and has no evidential value
    - It binds the other side unless they file a counter-affidavit
  correct: 0
  explanation: >-
    Reg. 178(ב): an affidavit stands in for direct testimony, but it is evidence only if the
    deponent appears for cross-examination.
- id: m11-082
  module: 11
  lesson: '11.5'
  subject: hearing-conduct
  difficulty: 3
  question: >-
    At the hearing the judge proposes a compromise: the defendant pays 60% of your claim. Your
    evidence is good but one key fact rests only on your word. What is the wise approach?
  options:
    - Refuse at once, since a compromise signals weakness to the judge
    - Accept at once, since judges punish parties who refuse proposals
    - Take a short break, weigh the weak fact and the risk, then decide
    - Ask the defendant's witness what he thinks you should do now
  correct: 2
  explanation: >-
    A judge's proposal often reflects how the case looks. Take a short break, weigh the unproven
    fact against the sure amount, and read any settlement wording before agreeing.
- id: m11-083
  module: 11
  lesson: '11.5'
  subject: hearing-conduct
  difficulty: 2
  question: You cannot attend your hearing date because of reserve duty. What should you do?
  options:
    - Simply not come; the court will understand reserve duty
    - Send a friend to argue the case in your place
    - Email the defendant to agree on a new date privately
    - Ask early, by new request, attaching the call-up order
  correct: 3
  explanation: >-
    File a request in Net HaMishpat as early as possible, with proof. A claimant who does not appear
    has the claim dismissed (small-claims reg. 11).
- id: m11-084
  module: 11
  lesson: '11.6'
  subject: fee-exemption
  difficulty: 1
  question: Which regulation governs a court-fee exemption for someone who cannot pay?
  options:
    - Court Fees Regulations, reg. 14
    - Civil Procedure Regulations, reg. 9
    - Small Claims Regulations, reg. 2
    - Legal Aid Regulations, reg. 5
  correct: 0
  explanation: >-
    Reg. 14 of the Court Fees Regulations 2007 sets the request, the affidavit and the tests;
    small-claims reg. 6(ב) applies such an exemption to small-claims fees.
- id: m11-085
  module: 11
  lesson: '11.6'
  subject: fee-exemption
  difficulty: 1
  question: How much does it cost to file a fee-exemption request?
  options:
    - Half the fee in question
    - Nothing
    - A fixed ₪50
    - 1% of the claim
  correct: 1
  explanation: >-
    Reg. 20(4) of the Court Fees Regulations: no fee is charged for a request for a fee exemption,
    or for an appeal on such a decision.
- id: m11-086
  module: 11
  lesson: '11.6'
  subject: fee-exemption
  difficulty: 2
  question: Whose assets must the fee-exemption affidavit describe?
  options:
    - Only the applicant's own assets and nobody else's
    - The applicant's and all household members', including adult siblings
    - Own, spouse's, and parents' if dependent on them
    - Only the spouse's assets, if the applicant owns nothing
  correct: 2
  explanation: >-
    Reg. 14(א): the affidavit covers the applicant's assets, the spouse's, and the parents' if the
    applicant depends on them, plus six months of income.
- id: m11-087
  module: 11
  lesson: '11.6'
  subject: fee-exemption
  difficulty: 2
  question: >-
    Which document, issued in the last two years, is prima facie proof that you cannot pay a court
    fee?
  options:
    - A letter from your employer confirming your salary level
    - A bank statement showing a negative balance this month
    - Your income tax return for the last calendar year
    - A limited-means declaration by the Execution Office
  correct: 3
  explanation: >-
    Reg. 14(ד) lists a previous fee exemption, a limited-means declaration, bankruptcy and an
    insolvency order within two years; reg. 14(ה) adds current income support.
- id: m11-088
  module: 11
  lesson: '11.6'
  subject: fee-exemption
  difficulty: 3
  question: The court grants you a partial fee exemption only. What may you do within 15 days?
  options:
    - Amend the claim so the balance is not due
    - Ask Legal Aid to pay the remaining balance
    - Appeal the decision to the Supreme Court
    - Nothing; the balance must be paid at once
  correct: 0
  explanation: >-
    Reg. 14(ח): after a partial exemption you pay the balance, or within 15 days amend the claim so
    that no balance (or less) is due.
- id: m11-089
  module: 11
  lesson: '11.6'
  subject: fee-exemption
  difficulty: 3
  question: You were exempt from the fee and you won your claim. What may the court do about the fee?
  options:
    - Nothing; the exemption ends the matter
    - Order you to pay the fee from the award
    - Charge the losing side the fee, with linkage
    - Split the fee equally between the parties
  correct: 2
  explanation: >-
    Reg. 14(י): if the exempt party wins, the court or registrar may order the other side to pay the
    fee with linkage differences.
- id: m11-090
  module: 11
  lesson: '11.6'
  subject: fee-exemption
  difficulty: 2
  question: >-
    Spot the mistake. An applicant's affidavit lists her income for the last two months only. What
    is missing?
  options:
    - Her parents' income, which is required in every case
    - Her income sources for the six months before
    - A credit rating report from a credit bureau
    - Her landlord's affidavit confirming her rent
  correct: 1
  explanation: >-
    Reg. 14(א) requires the sources of income in the six months before the request; the parents'
    assets are needed only if she depends on them.
- id: m11-091
  module: 11
  lesson: '11.6'
  subject: legal-aid
  difficulty: 1
  question: >-
    What are the three cumulative conditions for state Legal Aid, as the Ministry of Justice
    describes them?
  options:
    - A covered subject, means (unless exempt) and merits
    - Israeli citizenship, a lawyer's referral and a case number
    - Low income, no assets of any kind, and a recognised disability
    - A covered subject, a social worker's letter, and a paid fee
  correct: 0
  explanation: >-
    The gov.il service page lists subject, means (income and assets) and the legal chance of
    success; some subjects have no means test.
- id: m11-092
  module: 11
  lesson: '11.6'
  subject: legal-aid
  difficulty: 2
  question: How is the Legal Aid income threshold for a single person defined in the regulations?
  options:
    - The minimum wage
    - Twice the minimum wage
    - The poverty line published by National Insurance
    - 67% of the average wage in the economy
  correct: 3
  explanation: >-
    Legal Aid Regulations reg. 2(ב)(1): up to 67% of the average wage for one person or a family of
    up to three, plus 6% for each additional person.
- id: m11-093
  module: 11
  lesson: '11.6'
  subject: legal-aid
  difficulty: 2
  question: Does owning the apartment you live in disqualify you from Legal Aid?
  options:
    - Yes; any real estate at all disqualifies you
    - Only if the apartment is worth over ₪1 million
    - No; the home you live in is not counted
    - Only if you have no children living with you
  correct: 2
  explanation: >-
    Reg. 2(ג)(1): a dwelling you live in is not treated as property that can be realised. Rented-out
    property is treated differently.
- id: m11-094
  module: 11
  lesson: '11.6'
  subject: legal-aid
  difficulty: 2
  question: Which of these matters is NOT among the Legal Aid subjects in reg. 5?
  options:
    - Eviction from your rented home
    - A criminal defence for a detainee
    - A Labour Court claim for unpaid wages
    - A money claim in tort
  correct: 1
  explanation: >-
    Reg. 5 covers civil subjects such as housing, money and torts, and Labour Court matters "except
    criminal matters". Criminal defence is the Public Defender's role (lesson 07.3).
- id: m11-095
  module: 11
  lesson: '11.6'
  subject: legal-aid
  difficulty: 3
  question: >-
    Your Legal Aid application is pending and your defence is due in four days. What can the head of
    the Legal Aid office do?
  options:
    - Nothing, until the means test is complete and approved
    - Only refer you to a private lawyer at your own cost
    - Order the court to extend your deadline by 30 days
    - Give temporary service if urgent and you seem eligible
  correct: 3
  explanation: >-
    Legal Aid Regulations reg. 3(ב) allows temporary service pending the final decision in urgent
    cases where the applicant is prima facie eligible. Ask the court for an extension too.
- id: m11-096
  module: 11
  lesson: '11.6'
  subject: legal-aid
  difficulty: 2
  question: Legal Aid approves your case. How does it usually provide representation?
  options:
    - It appoints a private lawyer
    - It sends a supervised law student
    - It pays you to hire a lawyer of your choice
    - It files for you without any lawyer
  correct: 0
  explanation: >-
    The Ministry's page says that when representation is approved, a private lawyer is appointed;
    reg. 4(א) also allows written guidance for you to appear yourself.
- id: m11-097
  module: 11
  lesson: '11.6'
  subject: legal-aid
  difficulty: 3
  question: >-
    A bereaved mother wants to challenge a benefits decision but earns above the Legal Aid
    threshold. What is the position?
  options:
    - She cannot get Legal Aid because of her income level
    - She must first obtain a court fee exemption from a judge
    - No means test for bereaved families; merits still apply
    - Only the IDF's legal service may represent bereaved families
  correct: 2
  explanation: >-
    The Ministry lists bereaved families among the subjects in which economic eligibility is not
    examined. The legal chance of success is still checked.
- id: m11-098
  module: 11
  lesson: '11.6'
  subject: legal-aid
  difficulty: 1
  question: What is the main phone number to open a Legal Aid file?
  options:
    - '*3852'
    - '*6405'
    - '*6763'
    - '1299'
  correct: 1
  explanation: >-
    The Ministry of Justice's Legal Aid service centre is *6405 (Sun–Thu 8:00–16:00). *3852 is the
    judiciary's information centre.
- id: m12-001
  module: 12
  lesson: '12.1'
  subject: bill-types
  difficulty: 1
  question: Who may submit a private member's bill (הצעת חוק פרטית)?
  options:
    - Any minister, on behalf of his or her ministry.
    - Any citizen who collects 10,000 signatures.
    - The Knesset legal adviser, on an MK's request.
    - An MK who is not a minister or a deputy minister.
  correct: 3
  explanation: >-
    Rules of Procedure s. 75(א): an MK who is not a minister or deputy minister may submit a private
    bill. Government bills come from the government as a whole.
- id: m12-002
  module: 12
  lesson: '12.1'
  subject: bill-types
  difficulty: 1
  question: Which bills go through a preliminary reading (דיון מוקדם)?
  options:
    - Government bills only.
    - All bills, including Basic Laws from the government.
    - Only bills that cost the budget money.
    - Private members' bills only.
  correct: 3
  explanation: 'Section 74(א): every bill has three readings, and a private bill also has a preliminary reading.'
- id: m12-003
  module: 12
  lesson: '12.1'
  subject: bill-types
  difficulty: 2
  question: A committee of the Knesset wants to initiate a bill on party financing. Is that possible?
  options:
    - No; only the government may initiate bills that concern party financing.
    - Yes; any permanent committee may initiate a bill on any subject it covers.
    - No; committee bills were abolished in the 2011 reform of the Rules.
    - Yes; some committees may initiate bills on elections, parties and similar subjects.
  correct: 3
  explanation: >-
    Section 80 lets certain committees (House, Constitution, State Control) initiate bills on Basic
    Laws, the Knesset, elections, MKs, parties and party financing, and the State Comptroller.
- id: m12-004
  module: 12
  lesson: '12.1'
  subject: readings
  difficulty: 1
  question: In which reading is a law finally passed?
  options:
    - The first reading.
    - The third reading.
    - The preliminary reading.
    - The second reading.
  correct: 1
  explanation: 'Section 74(א): a law is passed in the third reading, a single vote on the whole text.'
- id: m12-005
  module: 12
  lesson: '12.1'
  subject: readings
  difficulty: 2
  question: >-
    A private bill was tabled on 1 March. The government has not taken a position and the House
    Committee did not shorten the period. When can the preliminary vote be held at the earliest?
  options:
    - The next Wednesday after tabling.
    - Only after the government publishes a תזכיר חוק.
    - Six months after tabling.
    - About 45 days after tabling, in mid-April.
  correct: 3
  explanation: >-
    Section 76(ג): the preliminary discussion is not held before 45 days have passed since tabling,
    counting the day of tabling and the day of the vote.
- id: m12-006
  module: 12
  lesson: '12.1'
  subject: readings
  difficulty: 2
  question: >-
    A private bill on Shabbat trading was removed from the agenda in its preliminary reading.
    Another MK wants to bring a nearly identical bill two months later. What rule applies?
  options:
    - A similar bill generally waits six months, unless the Speaker shortens the wait.
    - It can be voted on immediately, because a different MK is proposing it now.
    - It may never be brought again for the rest of the same Knesset's term.
    - It must first be approved by the Ministerial Committee for Legislation.
  correct: 0
  explanation: >-
    Section 76(ח): after a bill is removed from the agenda, a substantially similar bill waits six
    months unless the Speaker shortens the period because circumstances changed substantially.
- id: m12-007
  module: 12
  lesson: '12.1'
  subject: readings
  difficulty: 2
  question: Where does a private bill go after it passes its first reading?
  options:
    - Straight to the second reading in the plenum, without committee work.
    - To the Ministerial Committee for Legislation for a government position.
    - To the Knesset Presidium, which must approve it a second time.
    - Back to the committee that prepared it for the first reading.
  correct: 3
  explanation: >-
    Section 83(א): a private or committee bill approved in the first reading returns to the
    committee that prepared it, which prepares it for the second and third readings.
- id: m12-008
  module: 12
  lesson: '12.1'
  subject: tazkir
  difficulty: 1
  question: What is a תזכיר חוק?
  options:
    - A government draft bill published for comments before it reaches the Knesset.
    - A summary of a committee session that the Knesset staff prepares for members.
    - A reservation that an MK files on a bill before its second reading.
    - A notice in Reshumot that a law has been published in Sefer HaChukim.
  correct: 0
  explanation: >-
    A memorandum of law is the government's draft, published for public and ministry comments before
    the Ministerial Committee approves a government bill.
- id: m12-009
  module: 12
  lesson: '12.1'
  subject: tazkir
  difficulty: 2
  question: >-
    An environmental group missed the comment deadline on a ministry's תזכיר חוק. The bill has now
    been tabled. What is its best next step?
  options:
    - Ask the ministry to reopen the comment period, which the law requires.
    - Prepare a position paper for the Knesset committee that will handle it.
    - Petition the High Court to cancel the tabling because comments were missed.
    - Wait for the third reading and then ask the Knesset to hold a revote.
  correct: 1
  explanation: >-
    Once the bill is in the Knesset, the committee stage is the main point of influence; the group
    should prepare a paper and ask to take part.
- id: m12-010
  module: 12
  lesson: '12.1'
  subject: continuity
  difficulty: 1
  question: Which law allows the new Knesset to continue a bill from the outgoing Knesset?
  options:
    - חוק רציפות הדיון בהצעות חוק, התשנ״ג–1993.
    - 'חוק-יסוד: הממשלה, הסעיף על ממשלה יוצאת.'
    - חוק הכנסת, התשנ״ד–1994, פרק י״ב.
    - חוק הבחירות לכנסת [נוסח משולב], התשכ״ט–1969.
  correct: 0
  explanation: >-
    The Continuity of Debate on Bills Law 1993, with Rules of Procedure s. 97, sets the continuity
    procedure.
- id: m12-011
  module: 12
  lesson: '12.1'
  subject: continuity
  difficulty: 2
  question: >-
    A private bill passed its first reading in the 25th Knesset. None of its proposers is
    re-elected. Can it be continued?
  options:
    - Yes; the committee can continue it without any proposer.
    - Yes; the government can adopt it under s. 1 of the Continuity Law.
    - Yes; it continues automatically after a first reading.
    - No; continuity of a private bill needs a re-elected proposer's consent.
  correct: 3
  explanation: >-
    Section 3 of the Continuity Law: notice about a private bill is given only if a proposer serves
    in the new Knesset and consents. (Rules s. 97(א) treats joiners as proposers if no initiator
    returned.)
- id: m12-012
  module: 12
  lesson: '12.1'
  subject: continuity
  difficulty: 3
  question: >-
    The new government announces it wants continuity for a government bill. A faction objects within
    two weeks, and the plenum rejects continuity. What happens next?
  options:
    - The government can simply ask again for continuity at the next session.
    - The committee that handled it can apply continuity on its own authority.
    - The decision is final; the bill can only come back as a new bill.
    - The Speaker decides alone whether the faction's objection was valid.
  correct: 2
  explanation: >-
    Rules s. 97(ז): if the Knesset decides not to apply continuity, no further notice about the same
    bill is given; the Legal Department guide adds continuity can be applied only once.
- id: m12-013
  module: 12
  lesson: '12.1'
  subject: continuity
  difficulty: 3
  question: >-
    A labour rights group opposes a government bill that passed its first reading before the recess.
    After the elections the new government asks for continuity. Where is the group's best window?
  options:
    - Asking the President of the State not to sign the continuity decision.
    - Persuading a faction to object within two weeks, and briefing MKs for the vote.
    - Filing a High Court petition before the new Knesset is even sworn in.
    - Asking the old committee chair to use his personal veto over continuity.
  correct: 1
  explanation: >-
    Section 5 of the Continuity Law lets a faction propose within two weeks that continuity not
    apply; the Knesset then votes. That debate is the opponents' window.
- id: m12-014
  module: 12
  lesson: '12.1'
  subject: election-recess
  difficulty: 1
  question: When did the 25th Knesset's election recess begin?
  options:
    - 27 October 2026.
    - 1 January 2026.
    - 18 July 2026.
    - 1 September 2026.
  correct: 2
  explanation: >-
    The Israel Democracy Institute reports that the summer recess, which is also the election
    recess, began on 18 July 2026; elections are on 27 October 2026.
- id: m12-015
  module: 12
  lesson: '12.1'
  subject: election-recess
  difficulty: 2
  question: During the election recess, why can usually only government-backed bills move forward?
  options:
    - The Basic Laws forbid any legislation at all during an election year.
    - The plenum rarely meets and committee sessions need case-by-case approval.
    - Private bills automatically lapse on the day that the recess begins.
    - The Knesset legal adviser has a power to veto bills of opposition MKs.
  correct: 1
  explanation: >-
    In the recess the plenum meets only on the government's request or a demand of 25 MKs (which the
    High Court held does not cover bills), and committees need the agreements committee's approval
    (IDI, July 2026).
- id: m12-016
  module: 12
  lesson: '12.1'
  subject: election-recess
  difficulty: 2
  question: Until when do the 25th Knesset's MKs keep serving?
  options:
    - Until election day, 27 October 2026.
    - Until the start of the election recess.
    - Until the President assigns the task of forming a government.
    - Until the 26th Knesset convenes.
  correct: 3
  explanation: >-
    Basic Law: The Knesset, s. 37: the outgoing Knesset continues to serve until the incoming
    Knesset convenes.
- id: m12-017
  module: 12
  lesson: '12.1'
  subject: bill-tracking
  difficulty: 1
  question: Which free source gives machine-readable records of bills, questions and committee sessions?
  options:
    - The Knesset's open data (OData) service.
    - Nevo's case-law pages.
    - The Government Press Office archive.
    - The Central Elections Committee register.
  correct: 0
  explanation: >-
    The Knesset publishes its ParliamentInfo OData service with bills, questions and committee data;
    Open Knesset is built on it.
- id: m12-018
  module: 12
  lesson: '12.1'
  subject: bill-tracking
  difficulty: 3
  question: >-
    A bill page says: 'הוכנה לקריאה ראשונה' and the bill is a private bill. The Knesset ends next
    month. What is your continuity verdict?
  options:
    - It continues, because it was prepared for first reading.
    - It continues if the government supports it.
    - 'It lapses: it has not yet passed its first reading.'
    - It is automatically passed in the first reading of the next Knesset.
  correct: 2
  explanation: >-
    Prepared for first reading is not passed in first reading. Only bills that the outgoing Knesset
    passed in the first reading and sent to a committee can get continuity.
- id: m12-019
  module: 12
  lesson: '12.2'
  subject: committee-choice
  difficulty: 1
  question: Where are the permanent committees and their subject areas listed?
  options:
    - Rules of Procedure s. 100.
    - The Knesset Law, chapter 12.
    - 'Basic Law: The Government.'
    - The Municipalities Ordinance, Second Schedule.
  correct: 0
  explanation: Section 100 of the Rules of Procedure lists the permanent committees and their subjects.
- id: m12-020
  module: 12
  lesson: '12.2'
  subject: committee-choice
  difficulty: 2
  question: >-
    A bill on licensing of police informants' payments passed its first reading. Which body decided
    which committee would prepare it?
  options:
    - The plenum, on the chair's announcement, unless an MK asked the House Committee.
    - The Attorney General, by a written opinion sent to the Knesset Speaker.
    - The minister who proposed the bill, by a notice to the Knesset Secretary.
    - The Knesset Research and Information Center, after a short review.
  correct: 0
  explanation: >-
    Section 83(ב): after a government bill passes the first reading, the chair announces the
    committee; any MK may propose another, and then the House Committee decides.
- id: m12-021
  module: 12
  lesson: '12.2'
  subject: committee-choice
  difficulty: 2
  question: >-
    There is no bill, but a farmer group wants a committee to discuss water quotas. How does a topic
    usually reach a committee?
  options:
    - The farmers file a petition directly with the committee's secretariat.
    - The Ministry of Agriculture books a session through the Knesset Secretary.
    - The Knesset Speaker adds it to a committee agenda at the public's request.
    - An MK raises a motion for the agenda or a quick debate sent to a committee.
  correct: 3
  explanation: >-
    Motions for the agenda and quick debates (Rules ss. 52–61) are the MKs' tools for bringing a
    topic to a committee.
- id: m12-022
  module: 12
  lesson: '12.2'
  subject: participation-request
  difficulty: 1
  question: Which rule allows a committee chair to invite members of the public?
  options:
    - Rules of Procedure s. 125(א).
    - Knesset Law s. 66.
    - 'Basic Law: The Knesset s. 37.'
    - FOI Law s. 3.
  correct: 0
  explanation: 'Section 125(א): the chair may invite anyone with knowledge of or an interest in the subject.'
- id: m12-023
  module: 12
  lesson: '12.2'
  subject: participation-request
  difficulty: 2
  question: >-
    Spot the weakness in this request: 'Hello, I would like to come to the Knesset to talk about
    education. Thanks, Moshe.'
  options:
    - It should have been sent by registered mail rather than by e-mail.
    - It must be signed by a lawyer to be considered by the secretariat.
    - It should be addressed to the Prime Minister's office, not to a committee.
    - No session, no interest, no specific request and no entry details.
  correct: 3
  explanation: >-
    A secretariat needs the session and agenda item, why you have knowledge or interest, what you
    ask (attend, speak, submit), and your details for the entry list.
- id: m12-024
  module: 12
  lesson: '12.2'
  subject: participation-request
  difficulty: 2
  question: Why should a request to take part include your ID number?
  options:
    - The Knesset uses it to check your voting record before the session.
    - The secretariat needs it to put you on the Knesset entry list.
    - It is required by law for anyone who applies for a lobbyist permit.
    - It is published in the session protocol next to your name and role.
  correct: 1
  explanation: >-
    Entry to the Knesset building is by a list; give the ID number to the secretariat only, never in
    a published paper.
- id: m12-025
  module: 12
  lesson: '12.2'
  subject: participation-request
  difficulty: 3
  question: >-
    A student group's request to speak was approved, but on the day the chair gives the floor only
    to ministry officials and NGOs with long experience. What should the group do next?
  options:
    - Interrupt the session to insist on its legal right to speak at the session.
    - Petition the High Court for an order giving it a right to be heard in committee.
    - Complain to the State Comptroller about how the chair ran the committee session.
    - Send its paper to the secretariat and legal adviser, and ask to be invited next time.
  correct: 3
  explanation: >-
    There is no fixed right to speak; it is at the chair's discretion. A written submission keeps
    the points on record and builds the relationship for the next session.
- id: m12-026
  module: 12
  lesson: '12.2'
  subject: speaking
  difficulty: 1
  question: How long should a citizen usually prepare to speak in a committee session?
  options:
    - Two to three minutes, or less.
    - Fifteen minutes.
    - As long as the speaker needs.
    - Ten minutes, as in the plenum.
  correct: 0
  explanation: Sessions are tightly timed and the chair controls speaking time; plan for two to three minutes.
- id: m12-027
  module: 12
  lesson: '12.2'
  subject: speaking
  difficulty: 2
  question: What is the best ending for a two-minute statement on a bill?
  options:
    - A summary of the organisation's history.
    - A warning that the group will protest outside.
    - A list of the MKs who support the bill.
    - 'A specific request: which clause to change and how.'
  correct: 3
  explanation: >-
    Committees act on specific wordings; ending with the clause and the change gives them something
    to adopt.
- id: m12-028
  module: 12
  lesson: '12.2'
  subject: speaking
  difficulty: 3
  question: >-
    A whistleblower from a hospital is invited to the Health Committee and fears retaliation if she
    speaks in public. When must she ask to appear without the public?
  options:
    - After she has finished speaking.
    - Before the session starts.
    - Within seven days after the session.
    - Only through a lawyer, in writing, a month ahead.
  correct: 1
  explanation: >-
    Section 126: the chair may allow an invitee to appear without others present if asked before the
    session begins and justified.
- id: m12-029
  module: 12
  lesson: '12.2'
  subject: protocols
  difficulty: 1
  question: Where are the protocols of most committee sessions published?
  options:
    - Only in the Knesset library, on paper.
    - In Reshumot.
    - On the government FOI Unit website.
    - On the Knesset website.
  correct: 3
  explanation: >-
    Section 120(א): protocols are open to the public and published on the Knesset website, subject
    to the confidentiality rules.
- id: m12-030
  module: 12
  lesson: '12.2'
  subject: protocols
  difficulty: 2
  question: Which committee's protocols are generally confidential?
  options:
    - The Finance Committee's, because of budget secrets.
    - The Education, Culture and Sports Committee's.
    - The Interior and Environmental Protection Committee's.
    - The Foreign Affairs and Defense Committee's.
  correct: 3
  explanation: >-
    Section 120(ב): protocols of the Foreign Affairs and Defense Committee and the joint defense
    budget committee are confidential, with exceptions for broadcast sessions and legislation.
- id: m12-031
  module: 12
  lesson: '12.2'
  subject: protocols
  difficulty: 2
  question: >-
    You spoke at a session and the protocol omits your main point. How long do you have to ask for a
    correction, and to whom?
  options:
    - Within 48 hours, by phone to the committee chair, who edits the protocol.
    - Within 30 days, by a formal letter to the Knesset Speaker and Secretary.
    - Only orally at the next session of the same committee, when it opens.
    - Write to the protocol department, promptly; the Rules set no fixed deadline.
  correct: 3
  explanation: >-
    Section 119(ג): any speaker may ask in writing to the protocol department to fix errors and
    omissions; the recorder corrects or the committee decides.
- id: m12-032
  module: 12
  lesson: '12.2'
  subject: committee-recess
  difficulty: 2
  question: In the 2026 election recess, which body approves most committee sessions case by case?
  options:
    - The Supreme Court, sitting as the High Court of Justice.
    - The Central Elections Committee for the 26th Knesset.
    - An agreements committee of coalition and opposition representatives.
    - The Attorney General, after a request from the Knesset Speaker.
  correct: 2
  explanation: >-
    IDI (July 2026): the House Committee set up an agreements committee; most committees need its
    approval to meet in the recess.
- id: m12-033
  module: 12
  lesson: '12.2'
  subject: committee-recess
  difficulty: 3
  question: >-
    A residents' group wants to influence a bill that the 25th Knesset's Interior Committee was
    discussing. It is October 2026. What is the most useful work now?
  options:
    - Prepare the paper and contact list for the 26th Knesset's committee.
    - Demand an urgent session of the 25th Knesset's committee this week.
    - File the paper with the Central Elections Committee.
    - Wait until the new government is formed before doing anything.
  correct: 0
  explanation: >-
    Few sessions are held in the recess, and new committees form after the 26th Knesset convenes;
    preparing now lets the group act early, including on continuity.
- id: m12-034
  module: 12
  lesson: '12.3'
  subject: paper-structure
  difficulty: 1
  question: What goes on page one of a position paper?
  options:
    - The full text of the bill, so that members can follow it.
    - Who you are, a one-line position and numbered requests.
    - The organisation's financial report and list of donors.
    - A list of the committee members and their phone numbers.
  correct: 1
  explanation: Members often read only page one; it must show who you are, what you want and the requests.
- id: m12-035
  module: 12
  lesson: '12.3'
  subject: paper-structure
  difficulty: 1
  question: How long should a typical position paper be?
  options:
    - Two to four pages, with appendices for data.
    - At least twenty pages, to show seriousness.
    - One sentence, so that members read it all.
    - As long as the bill and its explanatory notes.
  correct: 0
  explanation: Short papers get read; long data goes in appendices.
- id: m12-036
  module: 12
  lesson: '12.3'
  subject: paper-structure
  difficulty: 2
  question: >-
    Spot the mistake: a paper's first page is a two-page history of the bill's background, and the
    requests appear on page five.
  options:
    - A paper must not include any background.
    - Requests must be sent in a separate letter to the Speaker.
    - Background must be written in English.
    - The requests are buried; they should be on page one.
  correct: 3
  explanation: Requests first; background after. A reader with five minutes must find them at once.
- id: m12-037
  module: 12
  lesson: '12.3'
  subject: wordings
  difficulty: 1
  question: Why should every argument end in a proposed wording?
  options:
    - The Rules forbid arguments without wordings.
    - Wordings are required for the paper to be published.
    - Committees adopt wordings; they rarely draft them for you.
    - Only wordings are read by the legal adviser.
  correct: 2
  explanation: A ready wording gives members and the legal adviser something to adopt or file as a reservation.
- id: m12-038
  module: 12
  lesson: '12.3'
  subject: wordings
  difficulty: 2
  question: Which request is drafted best?
  options:
    - Please make the deadlines in the bill fairer for residents.
    - We ask the committee to reconsider clause 4 and its effects.
    - In clause 4(ב), replace 'עד 30 ימים' with 'עד 60 ימים'.
    - Clause 4 is unacceptable to our members and must be changed.
  correct: 2
  explanation: A specific clause, current text and replacement text can be pasted into the bill.
- id: m12-039
  module: 12
  lesson: '12.3'
  subject: new-topic
  difficulty: 2
  question: Under s. 85, which change can a committee make to a bill on disabled parking permits?
  options:
    - Add a new chapter to the bill on public transport fares for everyone.
    - Add new rules on taxi licences in general, which the bill does not touch.
    - Amend a section of the disabled parking law that the bill did not mention.
    - Change the income tax brackets for disabled people through this bill.
  correct: 2
  explanation: >-
    Section 85(א): a committee may amend sections not mentioned in the bill, as long as it stays
    within the bill's subject.
- id: m12-040
  module: 12
  lesson: '12.3'
  subject: new-topic
  difficulty: 3
  question: >-
    During the committee's discussion a minister claims your group's proposal is a 'new topic'. What
    happens before the committee can finish discussing it?
  options:
    - The House Committee must decide the claim.
    - The minister's claim ends the discussion automatically.
    - The Attorney General must give an opinion.
    - The plenum votes on the claim at once.
  correct: 0
  explanation: >-
    Section 85(ב)–(ג): the chair brings a new-topic claim to the House Committee, and the committee
    does not finish the amendment until that decision.
- id: m12-041
  module: 12
  lesson: '12.3'
  subject: reservations
  difficulty: 1
  question: What is a הסתייגות?
  options:
    - A citizen's written objection to a bill, filed with the secretariat.
    - A rejected amendment attached to the bill for the second reading.
    - A ministry's formal comment on a תזכיר חוק during consultation.
    - A committee's decision to delay its vote on a bill to a later session.
  correct: 1
  explanation: >-
    Section 86(ב): an MK whose amendment was rejected may ask that it be attached as a reservation,
    voted on in the second reading.
- id: m12-042
  module: 12
  lesson: '12.3'
  subject: reservations
  difficulty: 2
  question: 'Can a reservation say simply: ''Delete the whole bill''?'
  options:
    - Yes; that is the main purpose of a reservation.
    - Yes, if ten MKs sign it.
    - No; a reservation cannot negate the bill itself.
    - No; reservations may only change the bill's title.
  correct: 2
  explanation: 'Section 86(ד)(1): a reservation shall not negate the bill itself.'
- id: m12-043
  module: 12
  lesson: '12.3'
  subject: reservations
  difficulty: 3
  question: >-
    Your amendment was rejected in committee and the committee is about to approve the bill for
    second and third readings. The MK who supports you was absent. What can still work?
  options:
    - You file the reservation yourself at the plenum on the day of the second reading.
    - The MK files it on his own after the bill has been tabled for the second reading.
    - You send it to the President of the State as a petition before he signs the law.
    - Another MK presented it in his name, or he filed it in writing with the chair's approval.
  correct: 3
  explanation: >-
    Section 86(ב): the reservation is attached if the MK presented it, another MK presented it in
    his name (and he signs before tabling), or it was filed in writing in advance with the chair's
    approval.
- id: m12-044
  module: 12
  lesson: '12.3'
  subject: evidence
  difficulty: 1
  question: Which source is strongest for a factual claim in a paper?
  options:
    - Official data or an FOI answer, with a reference.
    - A popular social media post with many shares.
    - An anonymous comment on a well-known news site.
    - The personal opinion of a friendly MK, quoted.
  correct: 0
  explanation: Committees and ministries test facts; official data, FOI answers and rulings are checkable.
- id: m12-045
  module: 12
  lesson: '12.3'
  subject: evidence
  difficulty: 2
  question: Your group ran its own survey of 150 members. How should the paper present it?
  options:
    - Present it as official statistics.
    - Mark it as your own data and describe how it was done.
    - Leave out the method so it looks more authoritative.
    - Do not use it at all; only government data counts.
  correct: 1
  explanation: >-
    Own data is legitimate if labelled and its method explained; hiding the method undermines
    credibility.
- id: m12-046
  module: 12
  lesson: '12.3'
  subject: evidence
  difficulty: 2
  question: Why should a paper name and answer the strongest argument for the other side?
  options:
    - The Rules of Procedure require every paper to present both sides.
    - Otherwise the committee's legal adviser must reject the paper.
    - Members trust a paper that deals with the obvious counter-argument.
    - So that the paper itself can later be filed as a formal reservation.
  correct: 2
  explanation: >-
    Answering the counter-argument shows the request is workable and makes the paper persuasive
    across the committee.
- id: m12-047
  module: 12
  lesson: '12.3'
  subject: sending
  difficulty: 1
  question: Who should receive a position paper for a committee session?
  options:
    - Only the MK who proposed the bill, who will pass it to the others.
    - Only journalists, who will make sure the committee reads it.
    - The secretariat, the legal adviser, the chair and members from both sides.
    - Only the minister responsible, who controls the committee's agenda.
  correct: 2
  explanation: >-
    The secretariat puts it on file; the legal adviser drafts; the chair runs the session; members
    from both sides can act on it.
- id: m12-048
  module: 12
  lesson: '12.3'
  subject: sending
  difficulty: 2
  question: When is it too late for an MK to propose your amendment in committee?
  options:
    - As soon as the bill is tabled in the Knesset for its first reading.
    - Once the committee has held its first session on the bill at all.
    - Never; amendments can be proposed in committee until the third reading.
    - After the committee approves the bill for second and third readings.
  correct: 3
  explanation: >-
    Section 86(א): amendments can be proposed as long as the committee has not approved the bill for
    the second and third readings (or an earlier announced time).
- id: m12-049
  module: 12
  lesson: '12.3'
  subject: sending
  difficulty: 3
  question: Your paper was submitted, but the next committee draft ignores it. What is a sensible follow-up?
  options:
    - Resend the same paper to every member each day until it is adopted.
    - Publish the legal adviser's private e-mail address and ask people to write.
    - Check the protocol, then ask a member to raise it or file a reservation.
    - Give up; a committee draft cannot change once it has been circulated.
  correct: 2
  explanation: >-
    Drafts change until the committee votes; follow the protocol and work with members who can
    propose the change.
- id: m12-050
  module: 12
  lesson: '12.3'
  subject: paper-structure
  difficulty: 3
  question: >-
    A paper on a religion-and-state bill calls the bill's sponsors 'enemies of the people'. What is
    the main risk?
  options:
    - It will be attached to the bill as a reservation for the second reading.
    - It must first be translated into English before the members can read it.
    - It will automatically be marked confidential and kept out of the protocol.
    - It loses credibility and may expose the writer to a defamation claim.
  correct: 3
  explanation: >-
    Criticise clauses, not people; personal attacks cost credibility and can raise defamation risk
    (Module 8).
- id: m12-051
  module: 12
  lesson: '12.4'
  subject: mk-choice
  difficulty: 1
  question: Which MKs matter most for a bill in committee?
  options:
    - Only the Prime Minister and the Knesset Speaker.
    - The MKs who live in or near your own city.
    - The members of the committee handling the bill.
    - Only ministers, since they control the bills.
  correct: 2
  explanation: Committee members vote on the text and propose amendments; they are the first to approach.
- id: m12-052
  module: 12
  lesson: '12.4'
  subject: mk-choice
  difficulty: 2
  question: Why write to both coalition and opposition MKs?
  options:
    - The Rules of Procedure require letters to be sent to both sides equally.
    - Otherwise the letter is treated as lobbying and needs a lobbyist permit.
    - 'Each side can act differently: quiet influence, or questions and reservations.'
    - Only opposition MKs may file questions, and only coalition MKs may vote.
  correct: 2
  explanation: >-
    A coalition MK can move a minister; an opposition MK can file questions and reservations; both
    widen support.
- id: m12-053
  module: 12
  lesson: '12.4'
  subject: mk-choice
  difficulty: 2
  question: What is a Knesset caucus (שדולה)?
  options:
    - A group of MKs from different parties around a cause.
    - A registered lobbying firm with a Knesset permit.
    - A committee's subcommittee with legal powers to subpoena.
    - A faction's internal disciplinary body for its MKs.
  correct: 0
  explanation: >-
    Caucuses (Rules s. 138) gather MKs across parties around a cause; their chairs are natural
    allies.
- id: m12-054
  module: 12
  lesson: '12.4'
  subject: question-types
  difficulty: 1
  question: What is the word limit of an ordinary question?
  options:
    - 40 words.
    - 100 words.
    - No limit.
    - 50 words.
  correct: 3
  explanation: >-
    Section 48(א): an ordinary question may not exceed 50 words; an urgent one 40 words; a direct
    one has no limit.
- id: m12-055
  module: 12
  lesson: '12.4'
  subject: question-types
  difficulty: 1
  question: How is a direct question (שאילתה ישירה) answered?
  options:
    - Orally in the plenum on Wednesday.
    - In writing to the MK.
    - In a committee session.
    - On the Knesset Channel.
  correct: 1
  explanation: 'Section 46(ב)(3) and s. 50: the minister answers a direct question in writing to the MK.'
- id: m12-056
  module: 12
  lesson: '12.4'
  subject: question-types
  difficulty: 2
  question: A minister did not answer a direct question within 21 days. What can the MK do?
  options:
    - Ask the Speaker to treat it as an ordinary question.
    - Petition the High Court immediately for an order.
    - Impose a fine on the minister through the Speaker.
    - Refer the question to the State Comptroller.
  correct: 0
  explanation: >-
    Section 50(ג): if the deadline passes unanswered, the MK may ask the Speaker to treat it as an
    ordinary question, unless it contains private details.
- id: m12-057
  module: 12
  lesson: '12.4'
  subject: question-types
  difficulty: 2
  question: How many urgent questions may the Speaker approve per week?
  options:
    - Up to four.
    - Up to forty.
    - Unlimited, in an emergency.
    - Only one per faction.
  correct: 0
  explanation: 'Section 49(ב): the Speaker may approve up to four urgent questions a week.'
- id: m12-058
  module: 12
  lesson: '12.4'
  subject: question-types
  difficulty: 3
  question: >-
    A sudden closure of a border crossing affects farmers this week. Which type of question gives an
    answer in the plenum soonest?
  options:
    - A direct question, which the minister answers in writing within 21 days.
    - An urgent question, filed by Monday 11:00 and approved by the Speaker.
    - An ordinary question, which the minister prepares within 21 days.
    - A quick debate in the committee, which can be scheduled next month.
  correct: 1
  explanation: >-
    Section 49(ד): an urgent question filed by 11:00 on Monday and approved is answered that week,
    unless the minister gives reasons why not.
- id: m12-059
  module: 12
  lesson: '12.4'
  subject: question-rules
  difficulty: 1
  question: A question must be about what kind of matter?
  options:
    - A factual matter within the minister's responsibilities.
    - Any matter of public opinion that interests voters.
    - Only matters of national security and foreign affairs.
    - Only matters involving the asking MK's own voters.
  correct: 0
  explanation: 'Section 46(א): a question addresses a factual matter within the minister''s area.'
- id: m12-060
  module: 12
  lesson: '12.4'
  subject: question-rules
  difficulty: 2
  question: >-
    An MK is unsure which minister handles an issue that spans two ministries. What do the Rules
    say?
  options:
    - Send it to both ministers at once, without saying so in the question.
    - Address it to the Prime Minister, who decides which minister answers.
    - It is disqualified, because it is outside any single minister's area.
    - Send it to the Knesset Speaker, who answers it on the government's behalf.
  correct: 1
  explanation: >-
    Section 46(ג): if unclear, the question goes to the Prime Minister, who assigns it; a question
    sent to more than one minister must say so.
- id: m12-061
  module: 12
  lesson: '12.4'
  subject: question-rules
  difficulty: 2
  question: Which question is likely to be disqualified as hypothetical?
  options:
    - What would the ministry do if a war closed all ports next year?
    - How many ships were delayed at Haifa port during the year 2025?
    - On what date was the port tender published, and by which body?
    - How many inspectors worked at Ashdod port in each month of 2025?
  correct: 0
  explanation: Section 47(א)(2) bars hypothetical questions; the others ask for facts.
- id: m12-062
  module: 12
  lesson: '12.4'
  subject: question-rules
  difficulty: 3
  question: >-
    A minister refuses to answer a question, citing state security. Who decides whether the refusal
    stands?
  options:
    - The High Court of Justice, on a petition filed by the asking MK.
    - The Speaker, after hearing the asking MK; the decision is final.
    - The Foreign Affairs and Defense Committee, in a closed session.
    - The Attorney General, by a binding opinion sent to the minister.
  correct: 1
  explanation: >-
    Section 47(ג): the minister informs the Speaker of the refusal and its reason; the Speaker
    decides after hearing the MK, and the decision is final.
- id: m12-063
  module: 12
  lesson: '12.4'
  subject: question-database
  difficulty: 1
  question: Why search earlier questions before drafting yours?
  options:
    - To ask a follow-up rather than repeat a question already answered.
    - Because repeating an earlier question is a criminal offence for MKs.
    - To find the answering minister's home address and private details.
    - Because the Rules forbid any question that was ever asked before.
  correct: 0
  explanation: Earlier answers give you facts and dates; your question can then ask what is still missing.
- id: m12-064
  module: 12
  lesson: '12.4'
  subject: question-database
  difficulty: 2
  question: Which source lets you list all questions to a given ministry, with submission and answer dates?
  options:
    - The Registrar of Amutot's public search of NGOs.
    - The Planning Administration's Mavat plans website.
    - The Knesset's open data questions table (KNS_Query).
    - The courts' Net HaMishpat case-management system.
  correct: 2
  explanation: >-
    The Knesset's OData service includes the questions table with type, MK, ministry, submission and
    answer dates.
- id: m12-065
  module: 12
  lesson: '12.4'
  subject: lobbyist-definition
  difficulty: 1
  question: What makes someone a lobbyist (שדלן) under the Knesset Law?
  options:
    - Meeting with any MK more than three times in one year.
    - Being a member or volunteer of a registered NGO.
    - Persuading MKs as an occupation or for payment, for a client.
    - Writing a position paper to a Knesset committee.
  correct: 2
  explanation: >-
    Knesset Law s. 65: a lobbyist acts as an occupation or for payment, for a client, to persuade
    MKs on legislation and Knesset decisions.
- id: m12-066
  module: 12
  lesson: '12.4'
  subject: lobbyist-definition
  difficulty: 2
  question: >-
    A municipality's legal adviser presents the city's position to a committee on a bill affecting
    local authorities. Does she need a lobbyist permit?
  options:
    - Yes; anyone who speaks for any public body needs a permit.
    - Yes, unless the mayor attends the committee session with her.
    - No; officials acting within the authority's powers are excluded.
    - No, but only if the committee session is closed to the public.
  correct: 2
  explanation: >-
    Section 65 excludes a person holding a statutory role in a local authority acting within that
    role and the authority's powers.
- id: m12-067
  module: 12
  lesson: '12.4'
  subject: lobbyist-definition
  difficulty: 3
  question: >-
    A retired teacher volunteers to coordinate meetings with MKs for a parents' NGO. The NGO later
    starts paying her a monthly fee as an external consultant for this work. What changes?
  options:
    - Nothing; volunteers keep their status for life.
    - The NGO must register as a lobbying firm instead.
    - She needs a permit only if she meets more than five MKs.
    - As a paid consultant for a client she now needs a permit.
  correct: 3
  explanation: >-
    Once she persuades MKs for payment for a client (and is not the NGO's employee), she falls
    within s. 65 and needs a permit under s. 66.
- id: m12-068
  module: 12
  lesson: '12.4'
  subject: lobbyist-duties
  difficulty: 1
  question: What must a lobbyist wear in the Knesset building?
  options:
    - Formal clothing approved in advance by the Speaker.
    - A sticker carrying the client's name and logo.
    - A visible badge with his or her name and firm.
    - Nothing special; lobbyists dress like any visitor.
  correct: 2
  explanation: >-
    Knesset Law s. 68(א): a lobbyist wears a unique visible badge with name and, if relevant, the
    firm's name.
- id: m12-069
  module: 12
  lesson: '12.4'
  subject: lobbyist-duties
  difficulty: 2
  question: Which of these is forbidden to a lobbyist?
  options:
    - Disclosing the client's name to an MK.
    - Asking to be recorded in a committee protocol.
    - Getting an MK to commit to vote a certain way.
    - Sending an MK a factual briefing.
  correct: 2
  explanation: >-
    Section 69(א)(4): a lobbyist may not get an MK to commit to vote or act in a particular way;
    disclosure and recording are duties.
- id: m12-070
  module: 12
  lesson: '12.4'
  subject: lobbyist-duties
  difficulty: 2
  question: Where can the public see who holds a lobbyist permit and for which clients?
  options:
    - In the Registrar of Companies only.
    - Nowhere; the list is secret.
    - On the Knesset website, under s. 70.
    - In the State Comptroller's annual report.
  correct: 2
  explanation: >-
    Knesset Law s. 70: the Knesset publishes the names of permit holders and their clients on its
    website.
- id: m12-071
  module: 12
  lesson: '12.4'
  subject: lobbyist-duties
  difficulty: 3
  question: >-
    A lobbyist contacts an employee of the Knesset Research and Information Center to suggest topics
    for a report on his client's industry. Is this allowed?
  options:
    - Yes; the Research Center welcomes outside input from anyone.
    - No; lobbyists may not approach Research Center staff about it.
    - Yes, as long as he discloses the client in his first message.
    - Only with the Knesset Speaker's prior written approval.
  correct: 1
  explanation: >-
    Section 69(א)(7) forbids a lobbyist from approaching, in writing or orally, an employee of the
    Research and Information Center in connection with lobbying.
- id: m12-072
  module: 12
  lesson: '12.5'
  subject: council-meetings
  difficulty: 1
  question: How often must a city council hold a regular meeting?
  options:
    - Once a year, before the annual budget is approved.
    - Once a week, on a fixed day set by the mayor.
    - Only when the mayor decides there is a need for it.
    - At least once a month, though it may skip two months a year.
  correct: 3
  explanation: >-
    Second Schedule s. 5: a regular meeting at least once a month; the council may decide not to
    hold one in two months of the year.
- id: m12-073
  module: 12
  lesson: '12.5'
  subject: council-meetings
  difficulty: 1
  question: Can a resident attend a council meeting?
  options:
    - Only with the mayor's written invitation.
    - Yes; meetings are public unless lawfully closed.
    - Only if the resident is a registered party member.
    - No; council meetings are for members only.
  correct: 1
  explanation: 'Second Schedule s. 18(א): council meetings are public.'
- id: m12-074
  module: 12
  lesson: '12.5'
  subject: council-meetings
  difficulty: 2
  question: How much notice must council members get of a meeting that discusses the budget?
  options:
    - At least 48 hours.
    - At least ten days.
    - At least 30 days.
    - No notice is required.
  correct: 1
  explanation: >-
    Second Schedule s. 14(ב): an invitation for a meeting on the budget, compulsory payments or
    by-laws is given at least ten days ahead; ordinary meetings 48 hours (s. 14(א)).
- id: m12-075
  module: 12
  lesson: '12.5'
  subject: council-meetings
  difficulty: 2
  question: >-
    One third of the council members demand a special meeting on a contested land deal. How soon
    must the mayor convene it?
  options:
    - Within seven days of the written demand.
    - Within 48 hours of receiving the demand.
    - Within 30 days, at the next regular meeting.
    - Whenever the mayor finds it convenient.
  correct: 0
  explanation: >-
    Second Schedule s. 9(א): a written demand signed by a third of members, with agenda and draft
    decision, obliges the mayor to convene within seven days.
- id: m12-076
  module: 12
  lesson: '12.5'
  subject: council-meetings
  difficulty: 3
  question: The mayor ignores a valid demand by a third of the members for a special meeting. What happens?
  options:
    - The demand lapses after seven days and must be renewed.
    - The Interior Ministry's supervisor convenes the council.
    - The members must petition the Supreme Court directly.
    - The deputy mayor becomes acting mayor for that meeting.
  correct: 1
  explanation: >-
    Second Schedule s. 10: if the mayor does not convene the meeting within seven days, the
    supervisor (הממונה) summons the council.
- id: m12-077
  module: 12
  lesson: '12.5'
  subject: council-records
  difficulty: 1
  question: Who keeps the protocol of council meetings?
  options:
    - The city's FOI officer, who also publishes it online.
    - The Interior Minister's district representative.
    - The council meetings coordinator (מרכז ישיבות המועצה).
    - A court reporter sent by the Magistrates' Court.
  correct: 2
  explanation: >-
    Second Schedule s. 50(א): every meeting is recorded and a protocol kept; the council meetings
    coordinator is responsible.
- id: m12-078
  module: 12
  lesson: '12.5'
  subject: council-records
  difficulty: 2
  question: >-
    A resident wants the recording of an open council meeting approved two weeks ago. The city's
    website has only the agenda. What should she cite?
  options:
    - Section 125 of the Knesset Rules of Procedure.
    - Section 248ב(2) of the Municipalities Ordinance.
    - Section 65 of the Knesset Law.
    - Section 7 of the Local Authorities Complaints Commissioner Law.
  correct: 1
  explanation: >-
    Section 248ב(2) requires posting protocols of open meetings within two working days of approval,
    with recordings or transcripts.
- id: m12-079
  module: 12
  lesson: '12.5'
  subject: council-records
  difficulty: 2
  question: What must the protocol of a council meeting record?
  options:
    - Only the names of the council members present at the opening of the meeting.
    - A full verbatim transcript of every word, in every meeting, without exception.
    - Questions and answers, proposals, decisions and voting results, among other things.
    - Only those decisions that the mayor approves and signs after the meeting ends.
  correct: 2
  explanation: >-
    Second Schedule s. 50(ב) lists the contents, including questions and answers, proposals, main
    points of debate, decisions and voting results; a full transcript only if the council decides
    (s. 50(ג)).
- id: m12-080
  module: 12
  lesson: '12.5'
  subject: council-agenda
  difficulty: 1
  question: Who sets the agenda of a council meeting?
  options:
    - The city's legal adviser.
    - The residents, by petition.
    - The Interior Ministry.
    - The mayor.
  correct: 3
  explanation: >-
    Second Schedule s. 24(א): the mayor sets the agenda, subject to council decisions and
    special-meeting demands.
- id: m12-081
  module: 12
  lesson: '12.5'
  subject: council-agenda
  difficulty: 2
  question: How many written questions may one council member submit before each regular meeting?
  options:
    - Ten.
    - Two.
    - One per subject.
    - Unlimited.
  correct: 1
  explanation: 'Second Schedule s. 36(ג): no more than two questions from a member before each regular meeting.'
- id: m12-082
  module: 12
  lesson: '12.5'
  subject: council-agenda
  difficulty: 2
  question: >-
    A council member's question was not answered at two regular meetings after it was submitted.
    What can the member demand?
  options:
    - That the mayor be removed from office by the Interior Minister.
    - That the subject be first on the next regular meeting's agenda, and discussed.
    - That the question be forwarded to the Knesset Interior Committee.
    - That the city pay a fixed fine to the member for each missed meeting.
  correct: 1
  explanation: >-
    Second Schedule s. 36(ב): if unanswered at two regular meetings, the subject goes first on the
    next agenda at the asker's demand, and is discussed.
- id: m12-083
  module: 12
  lesson: '12.5'
  subject: council-agenda
  difficulty: 3
  question: >-
    An opposition member's motion for the agenda faces objection. What can the council decide after
    hearing the proposer and one opponent?
  options:
    - Reject it, discuss it now, schedule it later, or send it to a committee.
    - Only accept it or reject it permanently, with no other option open.
    - Refer it to the District Court sitting as an Administrative Court.
    - Ask the residents of the city to vote on it in a local referendum.
  correct: 0
  explanation: >-
    Second Schedule s. 28: after up to ten minutes for each side, the council may decline, discuss
    now, schedule it later, or send it to a council committee.
- id: m12-084
  module: 12
  lesson: '12.5'
  subject: local-commissioner
  difficulty: 1
  question: Who usually serves as the local authority's Public Complaints Commissioner?
  options:
    - The authority's internal auditor.
    - The mayor.
    - The city's legal adviser.
    - A judge appointed by the Interior Minister.
  correct: 0
  explanation: >-
    Section 2(א)(1) of the 2008 Law: the council appoints the internal auditor, or for special
    reasons another senior employee.
- id: m12-085
  module: 12
  lesson: '12.5'
  subject: local-commissioner
  difficulty: 1
  question: Within what time must the local commissioner finish investigating a complaint?
  options:
    - Within one year of filing.
    - Within 30 days of filing.
    - Within 45 days of filing.
    - There is no time limit at all.
  correct: 0
  explanation: 'Section 8(ז): the investigation ends at the latest one year after the complaint was filed.'
- id: m12-086
  module: 12
  lesson: '12.5'
  subject: local-commissioner
  difficulty: 2
  question: >-
    Spot the mistake in this complaint: an unsigned e-mail, without an address, saying 'the city is
    badly managed'.
  options:
    - It should have been sent by fax or registered mail rather than e-mail.
    - It is unsigned, has no address and describes no specific act or harm.
    - It must be filed through a lawyer who is a member of the Bar.
    - It should be addressed to the Prime Minister rather than to the city.
  correct: 1
  explanation: >-
    Section 6: a complaint is signed, with name, address and a detailed description including dates;
    s. 5(ב) also needs direct harm.
- id: m12-087
  module: 12
  lesson: '12.5'
  subject: local-commissioner
  difficulty: 2
  question: >-
    A resident's complaint is about an act from 18 months ago that she learned of last month. Can
    the local commissioner investigate?
  options:
    - No; the one-year limit runs from the act only.
    - Only if the mayor consents.
    - Only if she first files with the state Commissioner.
    - Yes; the year runs from when she learned of it.
  correct: 3
  explanation: >-
    Section 7(ב)(2): the one-year period runs from the act or from when the complainant learned of
    it, whichever is later.
- id: m12-088
  module: 12
  lesson: '12.5'
  subject: local-commissioner
  difficulty: 3
  question: >-
    A municipal employee complains to the local commissioner that her promotion was decided in
    breach of the collective agreement. Will it be investigated?
  options:
    - No; complaints by municipal employees are always excluded, without exception.
    - Yes; service complaints are excluded except breaches of law or agreements.
    - Only if she first resigns from her post at the municipality.
    - Only by the state Commissioner, never by the local commissioner.
  correct: 1
  explanation: >-
    Section 7(א)(4): an employee's complaint about her service is not investigated, but acts that
    breach a law, regulations, a collective agreement or lawful general arrangements are.
- id: m12-089
  module: 12
  lesson: '12.5'
  subject: local-commissioner
  difficulty: 3
  question: The commissioner finds a complaint justified. Who must be told, and what can follow?
  options:
    - Only the complainant is told; the commissioner's findings are kept secret.
    - The police are told, and they open a criminal file against the employee.
    - The court is told, and it must enforce the findings as a judgment.
    - The complainant, the body, its supervisor and the mayor; a fix can be required.
  correct: 3
  explanation: >-
    Section 11: a reasoned notice goes to the complainant, the body, its supervisor and the mayor
    (and the council if the mayor is the subject); the commissioner may point to the needed fix and
    deadline.
- id: m12-090
  module: 12
  lesson: '12.5'
  subject: local-foi
  difficulty: 1
  question: Is a local authority subject to the Freedom of Information Law?
  options:
    - No; the law applies only to government ministries.
    - Yes; local authorities are public authorities under s. 2.
    - Only cities with more than 100,000 residents are covered.
    - Only for information about municipal elections.
  correct: 1
  explanation: 'FOI Law s. 2, paragraph (6): a local authority is a public authority.'
- id: m12-091
  module: 12
  lesson: '12.5'
  subject: local-foi
  difficulty: 2
  question: Who must appoint a local authority's FOI officer?
  options:
    - The Interior Minister, from a list of candidates.
    - The government FOI Unit at the Justice Ministry.
    - The head of the authority, from among its employees.
    - The city council, by a two-thirds majority vote.
  correct: 2
  explanation: >-
    FOI Law s. 3: the head of a public authority appoints an officer from its employees; for a local
    authority the head is the mayor (s. 2).
- id: m12-092
  module: 12
  lesson: '12.5'
  subject: local-foi
  difficulty: 3
  question: >-
    A regional council has not answered an FOI request for 60 days. The requester wants an outside
    body to press it. Which step fits?
  options:
    - A reminder to the head of the council, then a petition if needed.
    - A complaint to the government FOI Unit, which supervises councils.
    - A parliamentary question to the head of the council.
    - A complaint to the Knesset Interior Committee secretariat.
  correct: 0
  explanation: >-
    The FOI Unit has no supervisory power over local authorities (lesson 05.3); remind the head of
    the authority, consider the commissioner if directly harmed, and petition.
- id: m12-093
  module: 12
  lesson: '12.5'
  subject: local-forum-choice
  difficulty: 2
  question: >-
    A resident was directly harmed by a municipal decision and wants an investigation. Should she
    complain to both the local and the state Commissioner?
  options:
    - Yes; filing with both commissioners doubles the chances of a quick result.
    - No; if she filed with the state Commissioner, the local one will not investigate.
    - Yes; the two commissioners are required to investigate the complaint jointly.
    - No; local matters can only go to court, never to any complaints commissioner.
  correct: 1
  explanation: >-
    Section 7(א)(5) of the 2008 Law: the local commissioner does not investigate a matter already
    complained of to the state Commissioner.
- id: m12-094
  module: 12
  lesson: '12.5'
  subject: local-forum-choice
  difficulty: 2
  question: >-
    A tenants' group wants to know how many building-safety inspections the city carried out last
    year. Which tool fits first?
  options:
    - An FOI request to the city's FOI officer, or a council member's question.
    - A complaint to the local commissioner about the lack of information.
    - An application to the Knesset for a lobbyist permit for the group.
    - A participation request to a Knesset committee's secretariat.
  correct: 0
  explanation: >-
    Data held by the authority is obtained by FOI or brought into the open by a council member's
    question; a complaint needs a direct harm.
- id: m12-095
  module: 12
  lesson: '12.5'
  subject: local-forum-choice
  difficulty: 3
  question: >-
    A Druze village's local council decides in a meeting closed to the public to lease a public
    building to a private company. Residents suspect the closure was unlawful. What is the best
    first step?
  options:
    - File a criminal complaint against the council head with the police at once.
    - Ask the Knesset Speaker to cancel the lease through the Interior Committee.
    - Ask for the legal opinion on closing and the decision; check the council's rules.
    - Do nothing, because local councils may always meet in a closed session.
  correct: 2
  explanation: >-
    Closing a meeting requires lawful grounds and a legal opinion (in cities, Second Schedule s. 18;
    local councils have similar rules in their orders). Ask for the opinion and the decision, by
    letter and FOI.
- id: m12-096
  module: 12
  lesson: '12.5'
  subject: council-meetings
  difficulty: 3
  question: >-
    A city schedules all its regular meetings for Friday afternoons. A council member who observes
    Shabbat objects. What does the Second Schedule say?
  options:
    - The mayor may choose any day of the week he wants for meetings.
    - Regular meetings must be held on Fridays under the Second Schedule.
    - Not on a member's weekly rest day or its eve, unless all members agree.
    - The member's objection can only be decided by the Supreme Court.
  correct: 2
  explanation: >-
    Second Schedule s. 6(א): the fixed date may not be on the weekly rest day of a member or its
    eve, unless all members agree.
