      Public nuisance, s. 215.
    - >-
      Insulting a public servant, s. 288.
    - >-
      Defacing property, s. 196.
  correct: 3
  explanation: >-
    Section 196 covers writing, drawing or sticking on another's real property unlawfully; it can also be a fine offence.
- id: m07-018
  module: 7
  lesson: "07.1"
  subject: offence-classes
  difficulty: 3
  question: >-
    A protester is told: 'You were only fined for graffiti, so nothing is recorded.' What is accurate under the Criminal Information Law?
  options:
    - >-
      Fine offences are not in the criminal register (s. 8(ג)).
    - >-
      Every fine is recorded in the criminal register for ten years.
    - >-
      A fine is recorded as a felony on the police register.
    - >-
      Fines are recorded only if they are paid late.
  correct: 0
  explanation: >-
    Section 8(ג) excludes fine offences and administrative offences from the criminal register, except cases set by the minister.
- id: m07-019
  module: 7
  lesson: "07.2"
  subject: detention-vs-arrest
  difficulty: 1
  question: >-
    What is the general maximum length of a short detention (עיכוב)?
  options:
    - >-
      Twenty-four hours, like an arrest.
    - >-
      Three hours, plus three in some cases.
    - >-
      Six hours in every single case.
    - >-
      Forty-eight hours before seeing a judge.
  correct: 1
  explanation: >-
    Section 73(ב): three hours, plus up to three more with recorded reasons when many people are involved.
- id: m07-020
  module: 7
  lesson: "07.2"
  subject: detention-vs-arrest
  difficulty: 2
  question: >-
    An officer says, 'Come with me to the station to clarify things.' You ask and he says you are not under arrest. What is your status?
  options:
    - >-
      Arrested without a warrant under s. 23.
    - >-
      Free to refuse with no consequence at all.
    - >-
      Held under a remand order from a judge.
    - >-
      Detained under s. 67(ב), within detention limits.
  correct: 3
  explanation: >-
    Section 67(ב) allows requiring a person to accompany the officer; refusing a lawful detention can lead to arrest (s. 23(ב)).
- id: m07-021
  module: 7
  lesson: "07.2"
  subject: arrest-procedure
  difficulty: 1
  question: >-
    What must the arresting officer do first under s. 24(א)?
  options:
    - >-
      Read you a written list of all your rights first.
    - >-
      Identify himself, say you are arrested and explain why.
    - >-
      Call your lawyer before taking you to the station.
    - >-
      Search your phone for evidence of the offence.
  correct: 1
  explanation: >-
    Section 24(א); these duties are a condition of a lawful arrest (s. 24(ג)).
- id: m07-022
  module: 7
  lesson: "07.2"
  subject: arrest-procedure
  difficulty: 2
  question: >-
    Why does it matter that the duties in s. 24 are 'תנאי לחוקיות המעצר'?
  options:
    - >-
      Breaking them makes the arrest unlawful, which a lawyer can raise.
    - >-
      Breaking them cancels the criminal file automatically.
    - >-
      Breaking them lets the suspect walk away at once.
    - >-
      Breaking them requires the officer to pay compensation on the spot.
  correct: 0
  explanation: >-
    Section 24(ג) makes the duties a legality condition; the consequences are argued by the lawyer, not resolved by resisting.
- id: m07-023
  module: 7
  lesson: "07.2"
  subject: arrest-procedure
  difficulty: 2
  question: >-
    Under s. 23(ג), when may an officer not arrest even for an arrestable offence?
  options:
    - >-
      When the suspect is a student.
    - >-
      When the offence happened more than an hour ago.
    - >-
      When a detention is enough.
    - >-
      When the suspect has a lawyer.
  correct: 2
  explanation: >-
    Section 23(ג): 'לא ייעצר אדם לפי סעיף זה אם ניתן להסתפק בעיכוב'.
- id: m07-024
  module: 7
  lesson: "07.2"
  subject: rights-at-station
  difficulty: 1
  question: >-
    Who decides at the station whether an arrested person stays in custody or is released?
  options:
    - >-
      The officer who made the arrest.
    - >-
      The duty public defender.
    - >-
      The officer in charge (הקצין הממונה).
    - >-
      The station's legal adviser on call.
  correct: 2
  explanation: >-
    Sections 25–27: the officer in charge reviews the arrest and decides.
- id: m07-025
  module: 7
  lesson: "07.2"
  subject: rights-at-station
  difficulty: 2
  question: >-
    Before the officer in charge decides to hold you, what must happen under s. 28?
  options:
    - >-
      Your lawyer must arrive and approve the decision.
    - >-
      A judge must review the file by phone first.
    - >-
      You must sign a statement about the facts.
    - >-
      You are warned and given a chance to state your case.
  correct: 3
  explanation: >-
    Section 28(א) requires a hearing after the warning; your lawyer, if present, may be heard (s. 28(ב)).
- id: m07-026
  module: 7
  lesson: "07.2"
  subject: rights-at-station
  difficulty: 2
  question: >-
    An arrested person asks that nobody be told about the arrest. What does s. 33 say?
  options:
    - >-
      No notice is given if the detainee asked for none.
    - >-
      The police must notify the employer anyway.
    - >-
      The police must notify the family in every case.
    - >-
      The police may notify only after a judge's order.
  correct: 0
  explanation: >-
    Section 33(א) requires notice to a named close person, 'זולת אם ביקש העצור שלא למסור הודעה'.
- id: m07-027
  module: 7
  lesson: "07.2"
  subject: rights-at-station
  difficulty: 3
  question: >-
    A detainee who speaks Tigrinya is told his rights in Hebrew only and signs the form. What is the strongest point for his lawyer?
  options:
    - >-
      Rights must be explained in a language he understands (s. 32).
    - >-
      Rights forms are valid only if signed in front of a judge.
    - >-
      Foreign nationals cannot be arrested without consular approval.
    - >-
      Only English and Arabic translations are required by law.
  correct: 0
  explanation: >-
    Section 32 requires explanation 'בלשון המובנת לו, ככל האפשר'; interrogation must also be in a language he understands (Interrogation Law s. 2).
- id: m07-028
  module: 7
  lesson: "07.2"
  subject: time-to-judge
  difficulty: 1
  question: >-
    What is the general rule for bringing an arrested person before a judge?
  options:
    - >-
      Within 48 hours in every case.
    - >-
      Within 72 hours if the offence is a felony.
    - >-
      Within one working day of the arrest.
    - >-
      As soon as possible, and within 24 hours.
  correct: 3
  explanation: >-
    Section 29(א).
- id: m07-029
  module: 7
  lesson: "07.2"
  subject: time-to-judge
  difficulty: 2
  question: >-
    What happens if an arrested person is not brought before a judge in time?
  options:
    - >-
      The file is closed for lack of guilt.
    - >-
      He must be released (s. 31(ב)).
    - >-
      The police get 24 more hours automatically.
    - >-
      He may file a petition but stays in custody.
  correct: 1
  explanation: >-
    Section 31(ב): 'לא הובא העצור בפני שופט … ישוחרר העצור'.
- id: m07-030
  module: 7
  lesson: "07.2"
  subject: time-to-judge
  difficulty: 3
  question: >-
    An activist is arrested on Saturday at 10:00. Shabbat ends at 19:00. When must she be brought before a judge at the latest?
  options:
    - >-
      By 23:00 on Saturday, four hours after Shabbat.
    - >-
      By Friday-style rules, before Shabbat began.
    - >-
      By Sunday 10:00, the later of the two limits.
    - >-
      By Monday morning, since Sunday hearings are rare.
  correct: 2
  explanation: >-
    Section 29(ד): arrested during Shabbat, the later of 4 hours after it ends and 24 hours from the arrest.
- id: m07-031
  module: 7
  lesson: "07.2"
  subject: time-to-judge
  difficulty: 2
  question: >-
    When may the police delay bringing a detainee before a judge up to 48 hours?
  options:
    - >-
      For an urgent act that cannot wait for the hearing.
    - >-
      Whenever the station is very busy that night.
    - >-
      Whenever the offence is only a misdemeanour.
    - >-
      Whenever the detainee refuses to answer questions.
  correct: 0
  explanation: >-
    Section 30 allows up to 48 hours from the arrest only for urgent acts that cannot be done after the hearing.
- id: m07-032
  module: 7
  lesson: "07.2"
  subject: phone-search
  difficulty: 1
  question: >-
    What does the police need to search the contents of your phone without consent?
  options:
    - >-
      The approval of the officer in charge.
    - >-
      A written request signed by two officers.
    - >-
      Only a reasonable suspicion of any offence.
    - >-
      A judge's warrant that expressly allows it.
  correct: 3
  explanation: >-
    Arrest and Search Ordinance s. 23א(ב).
- id: m07-033
  module: 7
  lesson: "07.2"
  subject: phone-search
  difficulty: 2
  question: >-
    The police seized your phone as evidence. Which statement is correct?
  options:
    - >-
      Seizure always includes the right to unlock and search.
    - >-
      Seized phones must be returned within 24 hours.
    - >-
      Seizure is allowed only with your written consent.
    - >-
      Seizing it does not by itself allow searching its contents.
  correct: 3
  explanation: >-
    Seizure and search are separate powers; searching computer material needs a warrant under s. 23א.
- id: m07-034
  module: 7
  lesson: "07.2"
  subject: support-person
