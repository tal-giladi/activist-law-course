    The charge map turns legal knowledge into simple rules you can follow when stressed.
- id: m07-017
  module: 7
  lesson: "07.1"
  subject: protest-offences
  difficulty: 1
  question: >-
    Spraying a slogan on a company's wall without permission falls under which section?
  options:
    - >-
      Riot, s. 152.
