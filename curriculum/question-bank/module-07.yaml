- id: m07-035
  module: 7
  lesson: "07.2"
  subject: support-person
  difficulty: 3
  question: >-
    Your support person learns you were arrested at 21:00. Which first step is most useful?
  options:
    - >-
      Post your name and photo on social media to apply pressure.
