- id: m07-010
  module: 7
  lesson: "07.1"
  subject: offence-elements
  difficulty: 2
  question: >-
    For s. 287, what must the order have been?
  options:
    - >-
      Given in writing and signed by a senior officer.
    - >-
      Given properly by a court or an authorised official.
    - >-
      Given at least one hour before the breach.
    - >-
      Approved in advance by the Attorney General.
  correct: 1
  explanation: >-
    Section 287(א): 'הוראה שניתנה כשורה מאת בית משפט או מאת פקיד … מוסמך'.
- id: m07-011
  module: 7
  lesson: "07.1"
  subject: offence-elements
  difficulty: 3
  question: >-
    Activists place a large banner across a road at night to stop cars, and a driver swerves. Compared with a daytime sit-in, why may s. 332 be more relevant here?
  options:
    - >-
      Placing an object on the road may show intent to endanger.
    - >-
      Night-time protests are automatically treated as felonies.
    - >-
      Banners are always treated as weapons under the Penal Law.
    - >-
      Section 332 applies only once a driver is actually injured.
  correct: 0
  explanation: >-
    Section 332(1) covers placing an object on a traffic route with intent to harm or endanger travellers; the facts may support such intent.
- id: m07-012
  module: 7
  lesson: "07.1"
  subject: police-offences
