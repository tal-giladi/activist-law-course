- id: m07-036
  module: 7
  lesson: "07.2"
  subject: detention-vs-arrest
  difficulty: 3
  question: >-
    An officer detains a protester for four hours with no extension and no explanation, then lets him go. Which statement is right?
  options:
    - >-
      Detention has no limit if the protest was unlicensed.
    - >-
      Four hours is allowed for any detention at a protest.
    - >-
      Beyond three hours it needs an extension with recorded reasons.
    - >-
      Detention time limits apply only to minors and the elderly.
  correct: 2
  explanation: >-
    Section 73(ב): three hours, plus three only by the officer in charge with recorded reasons when many are involved; a complaint route is lesson 06.4.
- id: m07-037
  module: 7
  lesson: "07.3"
  subject: warning-and-silence
  difficulty: 1
