      No duty to answer anything; nothing will be recorded; a lawyer will come.
    - >-
      No duty to self-incriminate; words may be used; silence may strengthen evidence.
    - >-
      You must answer truthfully; lies are an offence; silence is an admission.
    - >-
      You may leave at any time; questions are optional; nothing is evidence.
  correct: 1
  explanation: >-
    Section 28(א) of the Arrests Law sets out the warning.
- id: m07-038
  module: 7
  lesson: "07.3"
  subject: warning-and-silence
  difficulty: 2
  question: >-
    Which law gives a witness questioned by police a duty to answer truthfully, except self-incriminating questions?
  options:
    - >-
      The Public Defender Law, section 18 on eligibility.
    - >-
      The Penal Law, section 24 on classes of offences.
    - >-
      The Testimony Ordinance, s. 2(2).
    - >-
      The Criminal Information Law, section 4 on viewing.
  correct: 2
  explanation: >-
    Testimony Ordinance s. 2(2).
- id: m07-039
  module: 7
  lesson: "07.3"
  subject: warning-and-silence
  difficulty: 3
  question: >-
    A suspect stays completely silent and at trial, two years later, says he was elsewhere. What risk does this illustrate?
  options:
    - >-
      Silence makes any later version of events inadmissible.
    - >-
      A late alibi is a separate offence of obstruction.
    - >-
      Silence at interrogation bars giving evidence at trial.
    - >-
      A version first given at trial may weigh less than an early one.
  correct: 3
  explanation: >-
    The warning says silence may strengthen the evidence; the timing of a version is a reason to decide on silence with a lawyer.
- id: m07-040
  module: 7
  lesson: "07.3"
  subject: warning-and-silence
  difficulty: 2
  question: >-
    Questioning starts as a 'witness statement'. Then the investigator asks what you did when the officer fell. What should you do?
  options:
    - >-
      Ask whether you are now a suspect, and ask to consult a lawyer.
    - >-
      Keep answering, since witnesses must answer every question.
    - >-
      Leave the room at once without saying anything more.
    - >-
      Answer briefly and sign quickly so that it ends.
  correct: 0
  explanation: >-
    A witness need not answer self-incriminating questions; once questions concern your acts, ask about your status and consult.
- id: m07-041
  module: 7
  lesson: "07.3"
  subject: lawyer-consultation
  difficulty: 1
  question: >-
    How must the meeting with a lawyer be held under s. 34(ג)?
  options:
    - >-
      In private and confidential, with only movements watched.
    - >-
      In the interrogation room with the investigator present.
    - >-
      By phone only, with the call recorded by the police.
    - >-
      Only after the suspect's statement has been signed.
  correct: 0
  explanation: >-
    Section 34(ג).
- id: m07-042
  module: 7
  lesson: "07.3"
  subject: lawyer-consultation
  difficulty: 2
  question: >-
    For an ordinary offence, what is the longest the police may prevent a meeting with a lawyer to save life or prevent a crime?
  options:
    - >-
      48 hours from the arrest.
    - >-
      10 days from the arrest.
    - >-
      72 hours from the arrest.
    - >-
      Until the end of the investigation.
  correct: 0
  explanation: >-
    Section 34(ו); security offences have their own longer rules under s. 35.
- id: m07-043
  module: 7
  lesson: "07.3"
  subject: lawyer-consultation
  difficulty: 3
  question: >-
    An officer delays a lawyer meeting by an oral decision 'because of the investigation'. What is missing?
  options:
    - >-
      The detainee's own written consent to the delay.
    - >-
      A reasoned written decision by an authorised officer.
    - >-
      The Attorney General's prior approval of the delay.
    - >-
      A judge's warrant authorising each separate delay.
  correct: 1
  explanation: >-
    Delays under s. 34(ד)–(ו) need a reasoned written decision and are limited in time.
- id: m07-044
  module: 7
  lesson: "07.3"
  subject: lawyer-consultation
  difficulty: 2
  question: >-
    A person who is only summoned to an interrogation, not arrested, wants legal advice. What is the realistic route?
  options:
    - >-
      Ask the Public Defender's arrest department to send someone.
    - >-
      Arrange a private or an organisation's lawyer before the date.
    - >-
      Ask the investigator to appoint a defender for him.
    - >-
      Wait for the court to appoint a defender at trial.
  correct: 1
  explanation: >-
    The Public Defender represents detainees and certain accused persons; a summoned suspect usually arranges a lawyer.
- id: m07-045
  module: 7
  lesson: "07.3"
  subject: public-defender
  difficulty: 1
  question: >-
    Which detainee is entitled to a public defender without a means test?
  options:
    - >-
      An arrested minor.
    - >-
      A first-time adult offender.
    - >-
      A student under 25.
    - >-
      Any detainee arrested at a licensed protest.
  correct: 0
  explanation: >-
    The Public Defender lists arrested minors among those always eligible.
- id: m07-046
  module: 7
  lesson: "07.3"
  subject: public-defender
  difficulty: 2
  question: >-
    Roughly what income limit does the means test use for a household of up to three people?
  options:
    - >-
      Half of the national minimum wage.
    - >-
      Three times the average wage in the economy.
    - >-
      The same limit as civil Legal Aid uses.
    - >-
      About two-thirds of the average wage.
  correct: 3
  explanation: >-
    The 1996 order sets income up to 67% of the average wage, plus 6% per extra person; current figures are in the Public Defender's yearly table.
- id: m07-047
  module: 7
  lesson: "07.3"
  subject: public-defender
  difficulty: 2
  question: >-
    Which limit applies to indigent accused persons but not to indigent detainees?
  options:
    - >-
      The detainee must be under 21.
    - >-
      The case must be in the District Court.
    - >-
      The offence must carry five years or more.
    - >-
      The defendant must have no previous record.
  correct: 2
  explanation: >-
    The detainee regulations apply the indigence order 'למעט סעיף 3', the five-year condition.
- id: m07-048
  module: 7
  lesson: "07.3"
  subject: public-defender
  difficulty: 3
  question: >-
    A detainee says he probably earns too much for a public defender, so he will not ask. What is the best advice?
  options:
    - >-
      Do not ask; asking when ineligible is an offence.
    - >-
      Ask anyway; the first consultation is reportedly free.
    - >-
      Do not ask; the police will charge the cost to him.
    - >-
      Ask only after the remand hearing is over.
  correct: 1
  explanation: >-
    ACRI reports the first consultation is not charged even if the detainee is later found ineligible; the Public Defender decides eligibility.
- id: m07-049
  module: 7
  lesson: "07.3"
  subject: public-defender
  difficulty: 2
  question: >-
    No request for a public defender was passed on before the remand hearing. What can the detainee do at court?
  options:
    - >-
      Represent himself, since it is too late to ask.
    - >-
      Ask the Public Defender's representative at the court.
    - >-
      Ask the police prosecutor to act on his behalf.
    - >-
      Ask the judge to postpone the hearing by a week.
  correct: 1
  explanation: >-
    Public Defender Regulations reg. 1(ג).
- id: m07-050
  module: 7
  lesson: "07.3"
  subject: interrogation-conduct
  difficulty: 1
  question: >-
    What should you tell the investigator at the start if you are exhausted or unwell?
  options:
    - >-
      Nothing at all, so as not to look weak or guilty.
    - >-
      Only your lawyer, and never the investigator.
    - >-
      That you will answer quickly so you can go home.
    - >-
      That you are not fit to be questioned and need a doctor.
  correct: 3
  explanation: >-
    The Public Defender advises telling the investigator if you are tired, upset or unwell; medical care is free.
- id: m07-051
  module: 7
  lesson: "07.3"
  subject: interrogation-conduct
  difficulty: 2
  question: >-
    In which case must a suspect's interrogation at the station normally be video recorded?
  options:
    - >-
      When the offence carries ten years or more.
    - >-
      Whenever the suspect asks for it to be recorded.
    - >-
      Only when the suspect is a minor.
    - >-
      Only in interrogations about security offences.
  correct: 0
  explanation: >-
    Interrogation of Suspects Law s. 7 and the Schedule; security offences are excluded (s. 17).
- id: m07-052
  module: 7
  lesson: "07.3"
  subject: interrogation-conduct
  difficulty: 3
  question: >-
    A fellow detainee in the cell asks, 'So what did you actually do out there?' What is the safest response?
  options:
    - >-
      Tell him, since cellmates cannot testify.
    - >-
      Tell him only what you told the police.
    - >-
      Ask him first whether he is a police informer.
    - >-
      Say nothing about the event.
  correct: 3
  explanation: >-
    Anything said may reach the police; the lesson's rule is no conversations about the event.
- id: m07-053
  module: 7
  lesson: "07.3"
  subject: statement-signing
  difficulty: 1
  question: >-
    What may you do if the written statement contains a mistake?
  options:
    - >-
      Nothing; statements cannot be changed once typed.
    - >-
      Ask for a correction; refuse to sign if it is not made.
    - >-
      Correct it later, but only at the trial itself.
    - >-
      Sign and send a correcting email afterwards.
  correct: 1
  explanation: >-
    Testimony Ordinance s. 3: the statement is read to you; you may refuse to sign and the refusal is recorded.
- id: m07-054
  module: 7
  lesson: "07.3"
  subject: statement-signing
  difficulty: 2
  question: >-
    Which sentence is the best way to record silence on legal advice?
  options:
    - >-
      על פי ייעוץ משפטי, אני שומר/ת על זכות השתיקה.
    - >-
      אין לי מה להגיד לכם כי לא עשיתי שום דבר רע.
    - >-
      אני לא משתף/ת פעולה עם המשטרה בשום צורה.
    - >-
      אני אדבר רק אם תבטיחו שתשחררו אותי היום.
  correct: 0
  explanation: >-
    A fixed, neutral sentence records the choice without adding facts or hostility.
- id: m07-055
  module: 7
  lesson: "07.4"
  subject: remand-grounds
  difficulty: 1
  question: >-
    What must a judge find before remanding a suspect before indictment?
  options:
    - >-
      A prima facie case strong enough to convict.
    - >-
      A confession or at least one eyewitness account.
    - >-
      Reasonable suspicion plus a ground for remand.
    - >-
      The Attorney General's approval of the request.
  correct: 2
  explanation: >-
    Section 13(א).
- id: m07-056
  module: 7
  lesson: "07.4"
  subject: remand-grounds
  difficulty: 2
  question: >-
    Which is not a ground for remand under s. 13?
  options:
    - >-
      The suspect's political views.
    - >-
      Risk of obstructing the investigation.
    - >-
      Danger to a person or the public.
    - >-
      Investigative acts that need custody.
  correct: 0
  explanation: >-
    Section 13 lists obstruction, danger and investigative acts; views are irrelevant.
- id: m07-057
  module: 7
  lesson: "07.4"
  subject: remand-grounds
  difficulty: 2
  question: >-
    Under s. 13(ב), when must a judge not order custody?
  options:
    - >-
      When the suspect has a steady job and a family.
    - >-
      When the suspect has no previous criminal record.
    - >-
      When conditions would achieve the purpose with less harm.
    - >-
      When the protest itself had a police licence.
  correct: 2
  explanation: >-
    Section 13(ב) requires the less harmful alternative.
- id: m07-058
  module: 7
  lesson: "07.4"
  subject: remand-grounds
  difficulty: 3
  question: >-
    The police ask for remand 'because the suspect will join tomorrow's protest'. Is this a ground?
  options:
    - >-
      Yes; joining another protest is always a valid ground for remand.
    - >-
      No; a suspect's future conduct can never matter to the court.
    - >-
      Only if it shows a real risk of danger; protest itself is no ground.
    - >-
      Yes, if the suspect refused to answer questions in interrogation.
  correct: 2
  explanation: >-
    Remand grounds are about obstruction, danger or investigative needs; courts can usually address risks with narrow conditions.
- id: m07-059
  module: 7
  lesson: "07.4"
  subject: remand-hearing
  difficulty: 1
  question: >-
    Who may question the police officer at the remand hearing?
  options:
    - >-
      Only the judge hearing the request.
    - >-
      The suspect or his lawyer, and the judge.
    - >-
      Only the police prosecutor in court.
    - >-
      Nobody; the request is decided on paper.
  correct: 1
  explanation: >-
    Section 15(ד).
- id: m07-060
  module: 7
  lesson: "07.4"
  subject: remand-hearing
  difficulty: 2
  question: >-
    What may a judge see that the suspect and lawyer may not?
  options:
    - >-
      The suspect's full medical file from the prison.
    - >-
      The suspect's previous closed files only.
    - >-
      Nothing; everything must be disclosed to the defence.
    - >-
      Confidential material marked for the court only.
  correct: 3
  explanation: >-
    Section 15(ג)–(ה) allows material for the judge's eyes only.
- id: m07-061
  module: 7
  lesson: "07.4"
  subject: remand-hearing
  difficulty: 2
  question: >-
    What is the longest a single remand order before indictment may last, outside wartime emergency rules?
  options:
    - >-
      5 days.
    - >-
      15 days.
    - >-
      30 days.
    - >-
      75 days.
  correct: 1
  explanation: >-
    Section 17(א).
- id: m07-062
  module: 7
  lesson: "07.4"
  subject: remand-hearing
  difficulty: 3
  question: >-
    A suspect has been in custody 30 days for one event. The police ask for more. What is needed?
  options:
    - >-
      The Attorney General's approval of the request.
    - >-
      Only a fresh officer's declaration.
    - >-
      The suspect's consent.
    - >-
      A District Court judge instead of a magistrate.
  correct: 0
  explanation: >-
    Section 17(ב).
- id: m07-063
  module: 7
  lesson: "07.4"
  subject: officer-conditions
  difficulty: 1
  question: >-
    Can the officer in charge impose the s. 42 conditions without your consent?
  options:
    - >-
      Yes, any condition he thinks right.
    - >-
      No; the listed conditions need your consent.
    - >-
      Yes, unless you have a lawyer present.
    - >-
      Only the reporting condition needs consent.
  correct: 1
  explanation: >-
    Section 42(ב): 'בהסכמת החשוד'.
- id: m07-064
  module: 7
  lesson: "07.4"
  subject: officer-conditions
  difficulty: 2
  question: >-
    What is the longest house arrest an officer may set?
  options:
    - >-
      15 days.
    - >-
      5 days.
    - >-
      30 days.
    - >-
      3 months.
  correct: 1
  explanation: >-
    Section 42(ב)(7).
- id: m07-065
  module: 7
  lesson: "07.4"
  subject: officer-conditions
  difficulty: 2
  question: >-
    What happens if you do not agree to the officer's bail conditions?
  options:
    - >-
      You stay arrested and go before a judge within 24 hours.
    - >-
      You are released at once without any conditions.
    - >-
      You commit an offence of breaching an order (s. 287).
    - >-
      The officer may hold you for up to 48 hours instead.
  correct: 0
  explanation: >-
    Section 42(ד).
- id: m07-066
  module: 7
  lesson: "07.4"
  subject: officer-conditions
  difficulty: 3
  question: >-
    An activist cannot pay a cash deposit the officer set. What may the officer do?
  options:
    - >-
      Keep her in custody until she pays, without any judge.
    - >-
      Cancel the release and close the criminal file instead.
    - >-
      Release on another kind of guarantee, or give time to deposit.
    - >-
      Transfer the debt to her support person or family.
  correct: 2
  explanation: >-
    Section 42(ה).
- id: m07-067
  module: 7
  lesson: "07.4"
  subject: court-conditions
  difficulty: 1
  question: >-
    What principle limits court conditions under s. 46(א)?
  options:
    - >-
      No more than needed to achieve the purpose.
    - >-
      They must last at least as long as the investigation.
    - >-
      They must match those set by the officer.
    - >-
      They must include a cash deposit.
  correct: 0
  explanation: >-
    Section 46(א).
- id: m07-068
  module: 7
  lesson: "07.4"
  subject: court-conditions
  difficulty: 2
  question: >-
    Which factor must a judge consider when setting a deposit?
  options:
    - >-
      The person's political views and affiliation.
    - >-
      The person's means and ability to provide it.
    - >-
      The size and length of the protest he joined.
    - >-
      The cost of the police operation that day.
  correct: 1
  explanation: >-
    Section 46(ב)(4).
- id: m07-069
  module: 7
  lesson: "07.4"
  subject: court-conditions
  difficulty: 3
  question: >-
    Which proposal is most likely to persuade a court to narrow an exclusion?
  options:
    - >-
      A general written promise never to protest again in the city.
    - >-
      A request to cancel all conditions as unconstitutional.
    - >-
      A narrow area, a short period, a work exception, a supervisor.
    - >-
      An offer to pay a large fine on the spot instead of conditions.
  correct: 2
  explanation: >-
    Concrete, narrow alternatives with support show the purpose is met with less harm (ss. 13(ב), 46).
- id: m07-070
  module: 7
  lesson: "07.4"
  subject: challenge-routes
  difficulty: 1
  question: >-
    Within how long can a court's custody or bail decision be appealed?
  options:
    - >-
      14 days.
    - >-
      45 days.
    - >-
      7 days.
    - >-
      30 days.
  correct: 3
  explanation: >-
    Section 53(ג).
- id: m07-071
  module: 7
  lesson: "07.4"
  subject: challenge-routes
  difficulty: 2
  question: >-
    Which route fits a detainee who still cannot pay the deposit a week after the decision?
  options:
    - >-
      A ערר to the Magistrates' Court within 14 days.
    - >-
      A petition to the High Court.
    - >-
      A request for review (עיון חוזר) at any time.
    - >-
      A complaint to the Ombudsman.
  correct: 2
  explanation: >-
    Section 52(ב): a person held because he cannot provide bail may ask for review at any time.
- id: m07-072
  module: 7
  lesson: "07.4"
  subject: challenge-routes
  difficulty: 2
  question: >-
    What may happen if a released suspect breaks a condition?
  options:
    - >-
      Only a written warning the first time it happens.
    - >-
      Re-arrest, a forfeited deposit and a s. 287 suspicion.
    - >-
      Nothing at all, as long as the breach was short.
    - >-
      Automatic conviction for the original offence.
  correct: 1
  explanation: >-
    Section 51 of the Arrests Law and Penal Law s. 287.
- id: m07-073
  module: 7
  lesson: "07.5"
  subject: closure-grounds
  difficulty: 1
  question: >-
    Which closure ground removes a closed file from the police register?
  options:
    - >-
      Lack of guilt (חוסר אשמה).
    - >-
      Insufficient evidence.
    - >-
      The circumstances do not suit prosecution.
    - >-
      Closure by a conditional arrangement.
  correct: 0
  explanation: >-
    Criminal Procedure Law s. 62(ב)(4) and Criminal Information Law s. 27(א)(2)(ב).
- id: m07-074
  module: 7
  lesson: "07.5"
  subject: closure-grounds
  difficulty: 2
  question: >-
    What replaced the old wording 'חוסר עניין לציבור' in the notice to suspects?
  options:
    - >-
      The Seventh Schedule's 'circumstances as a whole' wording.
    - >-
      'Lack of guilt' for all minor offences from now on.
    - >-
      'Closure by a conditional arrangement' (s. 67א).
    - >-
      'Offender unknown' for all closed protest files.
  correct: 0
  explanation: >-
    The Seventh Schedule sets the wording for this ground.
- id: m07-075
  module: 7
  lesson: "07.5"
  subject: closure-grounds
  difficulty: 2
  question: >-
    Does the closure letter a suspect receives state the ground?
  options:
    - >-
      Yes, always, in the first line of the letter.
    - >-
      Only when the offence is a felony.
    - >-
      No; it says how to find the ground out.
    - >-
      Only if the suspect was represented by a lawyer.
  correct: 2
  explanation: >-
    Section 62(ב)(1); sex and violence offences are an exception (s. 62(ב)(2)).
- id: m07-076
  module: 7
  lesson: "07.5"
  subject: change-of-grounds
  difficulty: 1
  question: >-
    To whom is a request to change closure grounds sent?
  options:
    - >-
      The commander of the police station.
    - >-
      The prosecutor who closed the file.
    - >-
      The Public Complaints Commissioner.
    - >-
      The legal office of the President.
  correct: 1
  explanation: >-
    Section 62(ב)(4).
- id: m07-077
  module: 7
  lesson: "07.5"
  subject: change-of-grounds
  difficulty: 2
  question: >-
    Which argument fits a request to change the ground to lack of guilt?
  options:
    - >-
      The cause you protested for was just and important.
    - >-
      The police had too few officers at the scene that day.
    - >-
      Evidence you did not do it, such as a time-stamped video.
    - >-
      The investigation took far too long to complete.
  correct: 2
  explanation: >-
    Lack of guilt means you did not commit the offence; the request should show that.
- id: m07-078
  module: 7
  lesson: "07.5"
  subject: change-of-grounds
  difficulty: 3
  question: >-
    Spot the mistake: 'I ask to change the ground to lack of guilt because the prosecution itself found the evidence insufficient.'
  options:
    - >-
      It should have been addressed to the Magistrates' Court.
    - >-
      It restates the current ground instead of showing innocence.
    - >-
      It must be filed within 60 days of the closure letter.
    - >-
      It must be signed by a lawyer to be considered.
  correct: 1
  explanation: >-
    Insufficient evidence is the ground you already have; you need facts showing you did not commit the offence.
- id: m07-079
  module: 7
  lesson: "07.5"
  subject: change-of-grounds
  difficulty: 3
  question: >-
    Before writing the request, why might you ask to see the investigation material?
  options:
    - >-
      To know what evidence exists and avoid contradicting it.
    - >-
      Because the law requires viewing before any request.
    - >-
      Because the request is invalid without a copy.
    - >-
      Because the file must be reopened before any change.
  correct: 0
  explanation: >-
    Viewing is discretionary but strengthens the request; a lawyer should review if the file is sensitive.
- id: m07-080
  module: 7
  lesson: "07.5"
  subject: registers
  difficulty: 1
  question: >-
    Which register holds convictions?
  options:
    - >-
      The police register.
    - >-
      The Population Registry.
    - >-
      The court's public archive.
    - >-
      The criminal register.
  correct: 3
  explanation: >-
    Criminal Information Law s. 8.
- id: m07-081
  module: 7
  lesson: "07.5"
  subject: registers
  difficulty: 2
  question: >-
    Where is a file closed for insufficient evidence recorded?
  options:
    - >-
      On the criminal register for four years.
    - >-
      Nowhere, because there was no conviction.
    - >-
      Only in the investigating station's files.
    - >-
      On the police register, until cancelled.
  correct: 3
  explanation: >-
    Section 27(א)(2).
- id: m07-082
  module: 7
  lesson: "07.5"
  subject: registers
  difficulty: 2
  question: >-
    Which law governs criminal records today?
  options:
    - >-
      The Criminal Register and Rehabilitation of Offenders Law, 1981.
    - >-
      The Criminal Information and Rehabilitation of Offenders Law, 2019.
    - >-
      The Protection of Privacy Law, 1981, and its regulations.
    - >-
      The Police Ordinance [New Version], 1971, chapter on records.
  correct: 1
  explanation: >-
    The 2019 Law, in force since 12.7.2022, repealed the 1981 Law (ss. 56, 58).
- id: m07-083
  module: 7
  lesson: "07.5"
  subject: registers
  difficulty: 3
  question: >-
    A probation order was made without a conviction. Is it on the criminal register?
  options:
    - >-
      No; only convictions are ever recorded there.
    - >-
      Only on the police register, not the criminal one.
    - >-
      Yes; such orders are recorded (s. 8(א)(2)).
    - >-
      Only if the person later breaches the order.
  correct: 2
  explanation: >-
    Section 8(א)(2) includes probation, community-service and undertaking orders made without conviction.
- id: m07-084
  module: 7
  lesson: "07.5"
  subject: cancellation
  difficulty: 1
  question: >-
    How long must an adult wait to ask to cancel a closed felony file?
  options:
    - >-
      5 years from the event.
    - >-
      3 years from closure.
    - >-
      7 years from the event.
    - >-
      10 years from closure.
  correct: 2
  explanation: >-
    2009 criteria regulations and the police's page.
- id: m07-085
  module: 7
  lesson: "07.5"
  subject: cancellation
  difficulty: 2
  question: >-
    From when are the cancellation periods counted?
  options:
    - >-
      From the date the file was closed.
    - >-
      From the date of the event investigated.
    - >-
      From the date the request is filed.
    - >-
      From the suspect's 18th birthday.
  correct: 1
  explanation: >-
    The 'determining date' is the event (reg. 1).
- id: m07-086
  module: 7
  lesson: "07.5"
  subject: cancellation
  difficulty: 2
  question: >-
    Which is a condition the police check before cancelling a record?
  options:
    - >-
      That you have paid a cancellation fee.
    - >-
      That the original complainant agrees.
    - >-
      That there are no open files against you.
    - >-
      That a lawyer signed the request.
  correct: 2
  explanation: >-
    The police page lists no open files and no unexpired criminal-register entries among the conditions.
- id: m07-087
  module: 7
  lesson: "07.5"
  subject: cancellation
  difficulty: 3
  question: >-
    A minor's misdemeanour file was closed. When is the earliest request, and when the automatic cancellation?
  options:
    - >-
      Request after 5 years; automatic after 7 years.
    - >-
      Request after 1 year; automatic after 3 years.
    - >-
      Request after 3 years; automatic after 5 years.
    - >-
      Request after 7 years; no automatic cancellation.
  correct: 2
  explanation: >-
    Regulations: minors 3 years for a misdemeanour on request; s. 33(ג): automatic after 5 years for non-felonies of minors.
