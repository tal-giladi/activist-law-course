# Module 7 question bank for daily practice (not imported). Format: build-spec.md, Question bank.
- id: m07-001
  module: 7
  lesson: "07.1"
  subject: offence-classes
  difficulty: 1
  question: >-
    Under Penal Law s. 24, an offence with a maximum of three years' imprisonment is which class?
  options:
    - >-
      A felony (פשע).
    - >-
      A contravention (חטא).
    - >-
      A misdemeanour (עוון).
    - >-
      A fine offence (עבירת קנס).
  correct: 2
  explanation: >-
    A felony needs a penalty above three years; above three months and up to three years is a עוון.
- id: m07-002
  module: 7
  lesson: "07.1"
  subject: offence-classes
  difficulty: 1
  question: >-
    What is an 'arrestable offence' (עבירה בת מעצר) under the Arrests Law?
  options:
    - >-
      Any offence punishable by five years or more.
    - >-
      Only offences committed in an officer's presence.
    - >-
      Only felonies listed in the Arrests Law schedule.
    - >-
      Any offence that is not a contravention (חטא).
  correct: 3
  explanation: >-
    Section 23(א)(7): 'עבירה בת מעצר' is every offence except a חטא.
- id: m07-003
  module: 7
  lesson: "07.1"
  subject: offence-classes
  difficulty: 2
  question: >-
    An officer wants to arrest a protester only for insulting a passer-by in a public place (s. 194(ב), three months). What may he do instead?
  options:
    - >-
      Arrest him, since insults always justify arrest.
    - >-
      Arrest him after a written warning.
    - >-
      Hold him overnight until a judge decides.
    - >-
      Detain the protester briefly to identify him.
  correct: 3
  explanation: >-
    A three-month offence is a חטא and not arrestable without a warrant; detention to identify is still available (s. 67).
- id: m07-004
  module: 7
  lesson: "07.1"
  subject: offence-classes
  difficulty: 2
  question: >-
    Why does the class of the offence matter after a file is closed?
  options:
    - >-
      It decides whether the file can ever be reopened.
    - >-
      It decides whether the closure letter states the ground.
    - >-
      It changes the waiting period to cancel the police record.
    - >-
      It decides which court will hear an appeal.
  correct: 2
  explanation: >-
    Cancellation on request is after 5 years for a misdemeanour and 7 for a felony (adults) under the 2009 criteria.
- id: m07-005
  module: 7
  lesson: "07.1"
  subject: protest-offences
  difficulty: 1
  question: >-
    Which section defines unlawful assembly (התקהלות אסורה)?
  options:
    - >-
      Section 83 of the Police Ordinance.
    - >-
      Section 151 of the Penal Law.
    - >-
      Section 194 of the Penal Law.
    - >-
      Section 23 of the Arrests Law.
  correct: 1
  explanation: >-
    Penal Law s. 151 defines it; the Police Ordinance deals with licences (lesson 06.2).
- id: m07-006
  module: 7
  lesson: "07.1"
  subject: protest-offences
  difficulty: 2
  question: >-
    A group of three friends holds a quiet vigil with candles outside a ministry, without a licence. Nobody fears a breach of the peace. Is it an unlawful assembly under s. 151?
  options:
    - >-
      No; s. 151 needs conduct causing reasonable fear of a breach of peace.
    - >-
      Yes; three or more people without a licence are an unlawful assembly.
    - >-
      Yes; any gathering outside a government building is unlawful.
    - >-
      No; s. 151 applies only to gatherings of fifty people or more.
  correct: 0
  explanation: >-
    Section 151 is about behaviour that gives bystanders reasonable fear of a breach of the peace, not about licences.
- id: m07-007
  module: 7
  lesson: "07.1"
  subject: protest-offences
  difficulty: 2
  question: >-
    Which offence turns into a felony only after a dispersal order and a reasonable time to leave?
  options:
    - >-
      Staying after a dispersal order (s. 155).
    - >-
      Riot that frightens the public (s. 152).
    - >-
      Public nuisance on a public way (s. 215).
    - >-
      Improper conduct in a public place (s. 216).
  correct: 0
  explanation: >-
    Section 155 carries five years and depends on an order under s. 153 and a reasonable time.
- id: m07-008
  module: 7
  lesson: "07.1"
  subject: protest-offences
  difficulty: 3
  question: >-
    A dispersal announcement is made by a junior constable, with a senior officer present and silent. Protesters stay. Which question will matter most for a s. 155 charge?
  options:
    - >-
      Whether a person authorised under s. 153 gave the order.
    - >-
      Whether the protest had a licence from the district commander.
    - >-
      Whether the protesters were warned in writing.
    - >-
      Whether a judge approved the dispersal in advance.
  correct: 0
  explanation: >-
    Section 153 lists who may order dispersal; the absence of a valid order is a defence question for the lawyer.
- id: m07-009
