- id: m07-013
  module: 7
  lesson: "07.1"
  subject: police-offences
  difficulty: 2
  question: >-
    An activist throws a plastic bottle at a police car to stop it leaving. Which section is most relevant?
  options:
    - >-
      Defacing property (s. 196).
    - >-
      Improper conduct in a public place (s. 216).
    - >-
      Noise in a public place (s. 194).
    - >-
      Aggravated obstruction (s. 275א).
  correct: 3
  explanation: >-
    Section 275א covers throwing a stone or object at an officer or police vehicle to obstruct; it is a felony.
- id: m07-014
  module: 7
  lesson: "07.1"
  subject: police-offences
  difficulty: 3
  question: >-
    During an arrest a protester goes limp and is carried away. He did not push or pull. Which is the most accurate statement?
  options:
    - >-
      Going limp is always an assault on an officer under s. 273.
    - >-
      Going limp makes the whole arrest unlawful from the start.
    - >-
      Going limp is a full defence to every protest offence.
    - >-
      It is not assault in itself, but obstruction may still be alleged.
  correct: 3
  explanation: >-
    Assault needs force; obstruction needs an act with intent to obstruct. Whether passive conduct fits s. 275 is for the lawyer and the court.
- id: m07-015
  module: 7
  lesson: "07.1"
  subject: charge-map
  difficulty: 2
  question: >-
    Which line belongs in a good personal charge map?
  options:
    - >-
      Sitting on the road — legal, because protest is a basic right.
    - >-
      Road sit-in — s. 215/216, עוון; I leave if clearance is announced.
