- id: m16-081
  module: 16
  lesson: "16.5"
  subject: evidence-handling
  difficulty: 2
  question: >-
    Which practice best preserves the authenticity of a video for a communication?
  options:
    - >-
      Trim the original to the key moments to save space.
    - >-
      Add captions and arrows directly onto the original.
    - >-
      Convert it to a smaller format and delete the original.
    - >-
