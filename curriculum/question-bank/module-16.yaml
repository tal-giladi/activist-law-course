  correct: 3
  explanation: >-
    Altering originals weakens authenticity. Keep the original and a chain-of-custody record; edit only copies.
- id: m16-082
  module: 16
  lesson: "16.5"
  subject: evidence-handling
  difficulty: 2
  question: >-
    Spot the mistake in a draft: 'Sources: various social-media posts (attached as screenshots).'
