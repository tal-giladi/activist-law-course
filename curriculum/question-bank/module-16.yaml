# Module 16 question bank for daily practice (not imported). Format: build-spec.md, Question bank.
- id: m16-001
  module: 16
  lesson: "16.1"
  subject: core-crimes
  difficulty: 1
  question: >-
    Which list matches the four crimes in art. 5(1) of the Rome Statute?
  options:
    - >-
      Genocide, terrorism, war crimes and torture.
    - >-
      War crimes, piracy, apartheid and aggression.
    - >-
      Genocide, crimes against humanity, war crimes and aggression.
    - >-
      Crimes against humanity, drug trafficking, genocide and terrorism.
  correct: 2
  explanation: >-
    Art. 5(1) lists exactly four core crimes. Terrorism, trafficking and piracy are dealt with by national law and specific treaties.
- id: m16-002
  module: 16
  lesson: "16.1"
  subject: contextual-elements
  difficulty: 1
  question: >-
    Which element turns murder into a crime against humanity?
  options:
    - >-
      Being part of a widespread or systematic attack on civilians, with knowledge.
    - >-
      Being committed by a soldier in uniform during any military operation abroad.
    - >-
      Being committed against a member of a religious or national minority.
    - >-
      Being reported by at least one UN body or NGO as a serious violation.
  correct: 0
  explanation: >-
    Art. 7(1) requires the act to be part of a widespread or systematic attack directed against a civilian population, with knowledge of the attack.
- id: m16-003
  module: 16
  lesson: "16.1"
  subject: contextual-elements
  difficulty: 1
  question: >-
    What must exist for an act to be a war crime?
  options:
    - >-
      A declaration of war by a parliament or government.
    - >-
      A Security Council resolution naming the conflict.
    - >-
      A treaty between the parties that defines the crime.
    - >-
      An armed conflict and a link between the act and that conflict.
  correct: 3
  explanation: >-
    War crimes are serious violations of the law of armed conflict. No formal declaration of war is required, but there must be an armed conflict and a nexus to it.
- id: m16-004
  module: 16
  lesson: "16.1"
  subject: genocide-intent
  difficulty: 2
  question: >-
    A report shows thousands of deaths in a city but says nothing about why the attackers acted. Which genocide element is missing?
  options:
    - >-
      A minimum number of deaths fixed in the Convention.
    - >-
      The special intent to destroy a protected group as such.
    - >-
      Proof that the victims all held the same citizenship.
    - >-
      A finding by a court that an armed conflict existed.
  correct: 1
  explanation: >-
    Genocide is defined by the special intent (dolus specialis). There is no numerical threshold, and genocide does not require an armed conflict.
- id: m16-005
  module: 16
  lesson: "16.1"
  subject: genocide-intent
  difficulty: 2
  question: >-
    Which of these acts can be an underlying act of genocide under art. 6?
  options:
    - >-
      Expelling foreign journalists from the conflict zone.
    - >-
      Forcibly transferring children of the group to another group.
    - >-
      Destroying a military base belonging to the group's state.
    - >-
      Confiscating land for a road used by everyone in the area.
  correct: 1
  explanation: >-
    Art. 6(e) lists the forcible transfer of children of the group. The other acts may breach other rules but are not among the five genocidal acts.
- id: m16-006
  module: 16
  lesson: "16.1"
  subject: israeli-statutes
  difficulty: 1
  question: >-
    Which Israeli law was Adolf Eichmann tried under?
  options:
    - >-
      The Rome Statute, applied directly by the Jerusalem District Court.
    - >-
      The Counter-Terrorism Law of 2016, retroactively.
    - >-
      The Military Justice Law of 1955, as a soldier.
    - >-
      The Nazis and Nazi Collaborators (Punishment) Law, 1950.
  correct: 3
  explanation: >-
    The Nazis and Nazi Collaborators Law defines crimes against the Jewish people, crimes against humanity and war crimes for the Nazi period and the Second World War.
- id: m16-007
  module: 16
  lesson: "16.1"
  subject: israeli-statutes
  difficulty: 2
  question: >-
    Why can a prosecutor not use the Nazis and Nazi Collaborators Law for crimes committed in 2023?
  options:
    - >-
      It applies only to acts in the Nazi period and the Second World War.
    - >-
      It was repealed when Israel ratified the Genocide Convention.
    - >-
      It applies only to Israeli citizens who live abroad.
    - >-
      It allows only civil claims for damages, not charges.
  correct: 0
  explanation: >-
    Section 1 covers acts done during the Nazi regime or the Second World War in an enemy country. Other statutes apply to later events.
- id: m16-008
  module: 16
  lesson: "16.1"
  subject: israeli-statutes
  difficulty: 2
  question: >-
    What maximum penalty does Israel's 1950 Genocide Law set for genocide?
  options:
    - >-
      Life imprisonment only, since the death penalty was abolished.
    - >-
      Twenty years, the same maximum as for murder in the Penal Law.
    - >-
      Death, with a minimum of ten years in limited mitigating circumstances.
    - >-
      A fine only, because the law is mainly a declaration.
  correct: 2
  explanation: >-
    Section 2 sets the death penalty, with imprisonment of at least ten years in narrow circumstances described there.
- id: m16-009
  module: 16
  lesson: "16.1"
  subject: not-international-crime
  difficulty: 2
  question: >-
    A state keeps detainees in overcrowded cells. A group calls it 'a war crime'. What is the most precise first classification?
  options:
    - >-
      Automatically a war crime, because detention during any conflict is one.
    - >-
      Automatically genocide, because all the detainees share one nationality.
    - >-
      Not a legal matter at all, because detention is a purely security decision.
    - >-
      A possible human-rights or IHL breach by the state; a crime needs more.
  correct: 3
  explanation: >-
    State breaches of detention standards are first assessed as human-rights or IHL violations. Individual criminal responsibility needs the elements of a specific crime, such as inhuman treatment.
- id: m16-010
  module: 16
  lesson: "16.1"
  subject: not-international-crime
  difficulty: 2
  question: >-
    A civilian is killed in a strike that was not expected to cause excessive harm and was aimed at a military target. Under IHL as taught in 15.1, what follows?
  options:
    - >-
      It is always a war crime because a civilian died.
    - >-
      It is a crime against humanity because the victim was a civilian.
    - >-
      This is not a war crime on these facts.
    - >-
      It is genocide if the victim belonged to the other side's nation.
  correct: 2
  explanation: >-
    IHL accepts incidental harm that is not excessive. A war crime needs a serious violation, such as intentionally attacking civilians or launching an attack known to be excessive.
- id: m16-011
  module: 16
  lesson: "16.1"
  subject: not-international-crime
  difficulty: 1
  question: >-
    Who is the defendant in an international criminal case?
  options:
    - >-
      A state.
    - >-
      An individual person.
    - >-
      An international organisation.
    - >-
      A political party.
  correct: 1
  explanation: >-
    International criminal law concerns individual criminal responsibility. Cases against states, such as at the ICJ, concern state responsibility.
- id: m16-012
  module: 16
  lesson: "16.1"
  subject: attribution-language
  difficulty: 2
  question: >-
    Which sentence correctly reports an ICC arrest-warrant decision?
  options:
    - >-
      The Chamber found reasonable grounds to believe X is responsible.
    - >-
      The Chamber convicted X of the crimes listed in the warrant.
    - >-
      The Chamber proved beyond reasonable doubt that X committed them.
    - >-
      The Chamber declared X guilty, subject to a later appeal.
  correct: 0
  explanation: >-
    A warrant rests on 'reasonable grounds to believe' (art. 58). It is not a conviction, and writing that it is can also be defamatory.
- id: m16-013
  module: 16
  lesson: "16.1"
  subject: attribution-language
  difficulty: 3
  question: >-
    Spot the mistake: 'Hamas committed genocide on 7 October, as the ICC confirmed in 2024.'
  options:
    - >-
      Nothing; the ICC confirmed genocide when it issued the Deif warrant.
    - >-
      Only the date is wrong; the ICC confirmed it in 2023.
    - >-
      The ICC issued a warrant on other charges; it confirmed no genocide.
    - >-
      The ICC cannot deal with non-state armed groups at all.
  correct: 2
  explanation: >-
    The Deif warrant listed crimes such as murder, extermination and hostage-taking, on a reasonable-grounds standard. The sentence also states an allegation as a fact.
- id: m16-014
  module: 16
  lesson: "16.1"
  subject: attribution-language
  difficulty: 3
  question: >-
    Spot the mistake: 'Israel committed the war crime of starvation, as the ICJ ruled.'
  options:
    - >-
      The ICJ tries no one; starvation is alleged in ICC warrants Israel rejects.
    - >-
      Nothing; the ICJ convicted Israeli leaders of starvation in its 2024 orders.
    - >-
      Only the court is wrong; the Security Council ruled on starvation in 2024.
    - >-
      The ICC cannot deal with starvation, since it is not listed in the Statute.
  correct: 0
  explanation: >-
    Starvation as a method of warfare is a war crime in art. 8(2)(b)(xxv); the ICC's warrants refer to it. The ICJ deals with states, and a warrant is not a ruling of guilt.
- id: m16-015
  module: 16
  lesson: "16.1"
  subject: aggression
  difficulty: 2
  question: >-
    When was the definition of the crime of aggression adopted for the Rome Statute?
  options:
    - >-
      At the Rome Conference in July 1998, with the other crimes.
    - >-
      At the Nuremberg trials in 1946.
    - >-
      By the ICJ in its 2004 advisory opinion.
    - >-
      At the Kampala Review Conference in June 2010.
  correct: 3
  explanation: >-
    Art. 5(2) of the original Statute left aggression for later; the amendments were adopted in Kampala on 11 June 2010.
- id: m16-016
  module: 16
  lesson: "16.1"
  subject: core-crimes
  difficulty: 2
  question: >-
    Hostage-taking during an armed conflict, as part of a large coordinated attack on civilians, can be classified as:
  options:
    - >-
      Only a domestic kidnapping offence, never an international crime.
    - >-
      Both a war crime and, if the context is shown, a crime against humanity.
    - >-
      Only genocide, because hostage-taking targets a group.
    - >-
      Only a human-rights violation by the state of the victims.
  correct: 1
  explanation: >-
    The same act can fit several crimes. Hostage-taking is a war crime in armed conflict; imprisonment or other acts can be crimes against humanity when part of a widespread or systematic attack.
- id: m16-017
  module: 16
  lesson: "16.1"
  subject: israeli-statutes
  difficulty: 3
  question: >-
    A petition says 'the soldier should be charged with a war crime under Israeli law'. What is the problem?
  options:
    - >-
      Nothing; the Penal Law has had a full war-crimes chapter since 1977.
    - >-
      Israel has no general war-crimes offence; charges use the Penal Law or military law.
    - >-
      Soldiers can be charged only before the ICC, never in Israeli courts.
    - >-
      Israeli law forbids charging soldiers for any act done during combat.
  correct: 1
  explanation: >-
    As the Turkel Commission noted, the only explicit 'war crimes' reference is the Nazis law; IHL violations are prosecuted through ordinary offences and military law.
- id: m16-018
  module: 16
  lesson: "16.2"
  subject: icc-jurisdiction
  difficulty: 1
  question: >-
    Under art. 12(2), the ICC may exercise jurisdiction if the State Party concerned is:
  options:
    - >-
      The state of nationality of the victims, wherever they were harmed.
    - >-
      Any state that has formally recognised the victims' state.
    - >-
      Any permanent member of the UN Security Council.
    - >-
      The territorial state, or the accused's state of nationality.
  correct: 3
  explanation: >-
    Art. 12(2) uses territory (a) or the nationality of the accused (b). Victims' nationality is not a basis at the ICC.
- id: m16-019
  module: 16
  lesson: "16.2"
  subject: icc-jurisdiction
  difficulty: 2
  question: >-
    Which three ways can a situation reach the ICC Prosecutor under art. 13?
  options:
    - >-
      Referral by a State Party or the Security Council, or proprio motu.
    - >-
      An ICJ referral, a General Assembly referral, or a victim's petition.
    - >-
      Any state's request, an NGO petition, or a UN rapporteur's report.
    - >-
      Only a Security Council resolution adopted under Chapter VII.
  correct: 0
  explanation: >-
    Art. 13: a State Party referral, a Security Council referral under Chapter VII, or a proprio motu investigation under art. 15.
- id: m16-020
  module: 16
  lesson: "16.2"
  subject: israel-position
  difficulty: 1
  question: >-
    What did Israel tell the UN Secretary-General on 28 August 2002 about the Rome Statute?
  options:
    - >-
      That it ratifies the Statute with a reservation excluding art. 8.
    - >-
      That it accepts the Court's jurisdiction for crimes inside Israel only.
    - >-
      That it does not intend to become a party and has no obligations from signing.
    - >-
      That it will join once a Palestinian state is recognised by the UN.
  correct: 2
  explanation: >-
    Israel signed on 31 December 2000 and on 28 August 2002 announced that it does not intend to become a party (UN Treaty Collection).
- id: m16-021
  module: 16
  lesson: "16.2"
  subject: palestine-timeline
  difficulty: 1
  question: >-
    When did the Prosecutor open the investigation in the Situation in the State of Palestine?
  options:
    - >-
      7 October 2023.
    - >-
      20 May 2024.
    - >-
      1 April 2015.
    - >-
      3 March 2021.
  correct: 3
  explanation: >-
    Prosecutor Bensouda opened the investigation on 3 March 2021, after the Pre-Trial Chamber's jurisdiction ruling of 5 February 2021.
- id: m16-022
  module: 16
  lesson: "16.2"
  subject: palestine-timeline
  difficulty: 2
  question: >-
    From what date does the Palestine investigation cover alleged crimes?
  options:
    - >-
      1 April 2015, when the Statute entered into force for Palestine.
    - >-
      7 October 2023, the date of the Hamas attack.
    - >-
      13 June 2014, the date in Palestine's art. 12(3) declaration.
    - >-
      5 June 1967, the start of the occupation.
  correct: 2
  explanation: >-
    Palestine's declaration of 1 January 2015 accepted jurisdiction from 13 June 2014, and the investigation covers alleged crimes since then.
- id: m16-023
  module: 16
  lesson: "16.2"
  subject: palestine-timeline
  difficulty: 2
  question: >-
    What did Pre-Trial Chamber I decide on 5 February 2021?
  options:
    - >-
      That Palestine is a sovereign state under general international law.
    - >-
      That jurisdiction covers Gaza and the West Bank, including East Jerusalem.
    - >-
      That Israel must join the Rome Statute within one year of the ruling.
    - >-
      That the borders between Israel and Palestine are the 1967 lines.
  correct: 1
  explanation: >-
    The majority ruled on the scope of territorial jurisdiction for the Statute's purposes and said it was not ruling on borders or statehood in general.
- id: m16-024
  module: 16
  lesson: "16.2"
  subject: warrants
  difficulty: 1
  question: >-
    On what date did the ICC issue warrants for Netanyahu, Gallant and Deif?
  options:
    - >-
      21 Nov 2024
    - >-
      20 May 2024
    - >-
      24 Apr 2025
    - >-
      3 Mar 2021
  correct: 0
  explanation: >-
    The Prosecutor applied on 20 May 2024; Pre-Trial Chamber I issued the three warrants on 21 November 2024.
- id: m16-025
  module: 16
  lesson: "16.2"
  subject: warrants
  difficulty: 2
  question: >-
    What happened to the warrant for Mohammed Deif?
  options:
    - >-
      It was transferred to Israel's 2026 military court in Jerusalem.
    - >-
      It was suspended pending Israel's jurisdiction challenge in 2025.
    - >-
      Proceedings ended in February 2025 after his reported death.
    - >-
      It is still pending execution by the States Parties.
  correct: 2
  explanation: >-
    Pre-Trial Chamber I terminated the proceedings on 26 February 2025, rendering the warrant without effect, without prejudice if he were found alive.
- id: m16-026
  module: 16
  lesson: "16.2"
  subject: warrants
  difficulty: 2
  question: >-
    Why can no ICC trial take place while the Netanyahu and Gallant warrants remain unexecuted?
  options:
    - >-
      Art. 63 requires the accused to be present during the trial.
    - >-
      Art. 27 grants heads of government full immunity at trial.
    - >-
      Art. 12 forbids trials of nationals of non-party states.
    - >-
      Art. 58 allows only confirmation of charges, never a trial.
  correct: 0
  explanation: >-
    There is no trial in absentia at the ICC; art. 27 in fact makes official capacity irrelevant to responsibility.
- id: m16-027
  module: 16
  lesson: "16.2"
  subject: warrants
  difficulty: 3
  question: >-
    Under art. 86, who is obliged to cooperate with the ICC in arresting a person named in a warrant?
  options:
    - >-
      Every UN member state, including non-parties.
    - >-
      Only the state of nationality of the accused.
    - >-
      Only the Netherlands, as host state.
    - >-
      The States Parties to the Rome Statute.
  correct: 3
  explanation: >-
    Art. 86 binds States Parties. Non-parties have no duty under the Statute, and states have disputed how immunities of non-party officials apply.
- id: m16-028
  module: 16
  lesson: "16.2"
  subject: israel-position
  difficulty: 2
  question: >-
    In the Attorney General's 2019 memorandum, why does the ICC lack jurisdiction?
  options:
    - >-
      Israel's courts already examined and closed every relevant case.
    - >-
      No sovereign Palestinian state exists that could delegate jurisdiction.
    - >-
      The Statute does not cover any conduct during armed conflicts.
    - >-
      The Security Council never authorised the investigation.
  correct: 1
  explanation: >-
    The memorandum argues that only sovereign states can delegate jurisdiction and that Palestine lacks statehood; it also relies on the Oslo Accords.
- id: m16-029
  module: 16
  lesson: "16.2"
  subject: israel-position
  difficulty: 3
  question: >-
    Which Israeli argument relies on the Oslo Accords?
  options:
    - >-
      The Accords made Israel a party to the Rome Statute in 1995.
    - >-
      Palestinians lack criminal jurisdiction over Area C, Jerusalem and Israelis.
    - >-
      The Accords give the ICC jurisdiction over Gaza only, not the West Bank.
    - >-
      The Accords require all disputes to go to the ICJ before the ICC.
  correct: 1
  explanation: >-
    Israel argues that even if non-sovereign entities could delegate jurisdiction, the Accords show the Palestinians have none over Area C, Jerusalem and Israeli nationals.
- id: m16-030
  module: 16
  lesson: "16.2"
  subject: palestine-timeline
  difficulty: 3
  question: >-
    What did the Appeals Chamber decide on 15 December 2025?
  options:
    - >-
      The warrants became void because the Prosecutor was later removed.
    - >-
      Israel's jurisdiction challenge succeeded and the case was closed.
    - >-
      The investigation must restart with a new notice served on Israel.
    - >-
      No new art. 18(1) notice was needed for post-7 October conduct.
  correct: 3
  explanation: >-
    By majority, the Appeals Chamber upheld the refusal to order a new notice, so no new deferral window under art. 18(2) opened.
- id: m16-031
  module: 16
  lesson: "16.2"
  subject: otp-leadership
  difficulty: 2
  question: >-
    Why was Prosecutor Karim Khan removed in July 2026?
  options:
    - >-
      The Assembly of States Parties found serious misconduct by him.
    - >-
      The Appeals Chamber annulled all his warrant applications.
    - >-
      The Security Council deferred the Palestine investigation.
    - >-
      He resigned after the US sanctions on him took effect.
  correct: 0
  explanation: >-
    On 24 July 2026 the Assembly voted 82-13 with 15 abstentions to remove him for serious misconduct; the removal was not a ruling on the Palestine case.
- id: m16-032
  module: 16
  lesson: "16.2"
  subject: sanctions
  difficulty: 2
  question: >-
    Which US measure authorises sanctions on persons assisting ICC actions against Israel?
  options:
    - >-
      The Rome Statute's art. 16 deferral mechanism.
    - >-
      A Security Council resolution of 2024.
    - >-
      Executive Order 14203 of 6 February 2025.
    - >-
      The ICJ's provisional measures order.
  correct: 2
  explanation: >-
    EO 14203 names the warrants against Netanyahu and Gallant among its reasons. Designations have included ICC officials and three Palestinian NGOs.
- id: m16-033
  module: 16
  lesson: "16.2"
  subject: sanctions
  difficulty: 3
  question: >-
    A news piece says US sanctions 'cancelled the ICC warrants'. What is the correct relationship?
  options:
    - >-
      The sanctions transferred the case to the US federal courts.
    - >-
      The sanctions suspended the Rome Statute for all its parties.
    - >-
      The sanctions require the ICC to obtain Israel's prior consent.
    - >-
      Sanctions bind US dealings; only the Court can withdraw its warrants.
  correct: 3
  explanation: >-
    Sanctions block property and dealings under US jurisdiction. They have no legal effect on the Court's decisions, though they affect its work.
- id: m16-034
  module: 16
  lesson: "16.2"
  subject: icc-jurisdiction
  difficulty: 3
  question: >-
    A Hamas commander from Gaza is suspected of crimes in southern Israel on 7 October. On what basis does the ICC claim jurisdiction?
  options:
    - >-
      Israel is the territorial state and has accepted jurisdiction.
    - >-
      Hamas signed the Rome Statute as a non-state party.
    - >-
      The suspect is a national of Palestine, a State Party.
    - >-
      The Security Council referred the attack to the Court.
  correct: 2
  explanation: >-
    Art. 12(2)(b) covers nationals of States Parties anywhere. Israel has not accepted jurisdiction and there was no Security Council referral.
- id: m16-035
  module: 16
  lesson: "16.3"
  subject: complementarity
  difficulty: 1
  question: >-
    What does 'complementary' in art. 1 of the Rome Statute mean?
  options:
    - >-
      The ICC reviews every national verdict as an appeal court.
    - >-
      The ICC acts only where national systems do not genuinely do so.
    - >-
      National courts must defer to the ICC in every case.
    - >-
      The ICC and national courts must sit together as one bench.
  correct: 1
  explanation: >-
    The Court supplements national jurisdictions. Art. 17 makes cases inadmissible when a state genuinely investigates or prosecutes them.
- id: m16-036
  module: 16
  lesson: "16.3"
  subject: complementarity
  difficulty: 2
  question: >-
    Which factor does art. 17(2) list as showing a state is 'unwilling'?
  options:
    - >-
      Proceedings conducted to shield the person from responsibility.
    - >-
      Proceedings conducted in a language other than English or French.
    - >-
      Proceedings in which the accused is eventually acquitted.
    - >-
      Proceedings that last more than one year from the charge.
  correct: 0
  explanation: >-
    Art. 17(2): shielding, unjustified delay, or lack of independence or impartiality. An acquittal or a long trial is not in itself unwillingness.
- id: m16-037
  module: 16
  lesson: "16.3"
  subject: complementarity
  difficulty: 2
  question: >-
    Under art. 18(2), how long does a state have, after the Prosecutor's notification, to ask for deferral to its own investigation?
  options:
    - >-
      Six months.
    - >-
      One year.
    - >-
      One month.
    - >-
      No time limit.
  correct: 2
  explanation: >-
    Art. 18(2) gives one month from receipt of the notification; the Pre-Trial Chamber can still authorise the investigation on the Prosecutor's application.
