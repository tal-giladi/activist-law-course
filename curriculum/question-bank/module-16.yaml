- id: m16-040
  module: 16
  lesson: "16.3"
  subject: ffa-mechanism
  difficulty: 1
  question: >-
    What is the FFA Mechanism?
  options:
    - >-
      A Knesset committee that reviews and reverses MAG decisions.
    - >-
      A General Staff body that checks facts of exceptional incidents.
    - >-
      An ICC unit that checks whether Israeli investigations are genuine.
    - >-
      A special police unit that investigates offences by settlers.
  correct: 1
  explanation: >-
    The Fact-Finding Assessment Mechanism, recommended by Turkel and set up in 2014, gathers facts so the MAG can decide whether to open a criminal investigation.
- id: m16-041
  module: 16
  lesson: "16.3"
  subject: ffa-mechanism
  difficulty: 2
  question: >-
