- id: m16-080
  module: 16
  lesson: "16.5"
  subject: evidence-handling
  difficulty: 1
  question: >-
    What does a hash value show about a file?
  options:
    - >-
      Who created the file, and at what place.
    - >-
      Whether the events shown really happened.
    - >-
      Whether it changed since the hash was taken.
    - >-
      The legal weight a court will give it.
  correct: 2
  explanation: >-
