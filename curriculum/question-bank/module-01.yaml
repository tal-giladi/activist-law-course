  subject: holdings-and-opinions
  difficulty: 3
  question: >-
    During your petition, the High Court issues a "צו על תנאי". What does it mean for you?
  options:
    - >-
      You have won the case, and the proceedings are now over.
    - >-
      The respondent must explain why your order should not be given.
    - >-
      Your petition was dismissed without any hearing at all.
    - >-
      You must pay a deposit before the hearing can take place.
  correct: 1
  explanation: >-
